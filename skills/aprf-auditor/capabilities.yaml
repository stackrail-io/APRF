# Machine-readable capability manifest for APRF Auditor
# Agents SHOULD read this first to know what they can collect vs must ask the user.

version: "0.2.0"
aprfVersion: "0.11.0"
skillId: aprf-auditor

summary: >
  Local, vendor-neutral APRF assessment. Repo + optional runtime collectors.
  No StackRail backend required.

languages:
  - TypeScript
  - JavaScript
  - Python
  - Go
  - Java
  - CSharp
  - Rust
  - note: "Language list is discovery support — Checks remain technology-agnostic unless applicability says otherwise."

ci:
  - GitHub Actions
  - GitLab CI
  - Jenkins
  - Azure Pipelines
  - CircleCI
  - Buildkite

cloud:
  - AWS
  - Azure
  - GCP
  - Kubernetes
  - note: "Cloud plugins are optional; ask user for credentials/exports — never invent runtime state."

agentFrameworks:
  - LangGraph
  - LangChain
  - CrewAI
  - OpenAI Agents SDK
  - AutoGen
  - Semantic Kernel
  - LlamaIndex
  - Haystack
  - Custom MCP / tool hosts

evidenceClasses:
  - id: runtime
    description: Live or exported telemetry / traces / eval runs
    collectorSupport: partial
  - id: ci
    description: Pipeline definitions and run artifacts in-repo or attached
    collectorSupport: yes
  - id: iac
    description: Terraform, Pulumi, CDK, Helm, K8s manifests
    collectorSupport: yes
  - id: runtime-config
    description: App/config that governs production behavior
    collectorSupport: yes
  - id: policy
    description: OPA/Rego, Cedar, org AI policy, allowlists
    collectorSupport: yes
  - id: code
    description: Application source implementing controls
    collectorSupport: yes
  - id: docs
    description: Markdown, ADRs, runbooks, wiki exports checked into repo
    collectorSupport: yes
  - id: user
    description: User-supplied path, paste, or attestation
    collectorSupport: yes

plugins:
  builtin:
    - repo-filesystem
    - github-actions
    - http-auth-probe
    - mcp-s2s-inventory
    - ai-admin-mfa
    - identity-propagation
    - short-lived-agent-tokens
    - workload-identity-runtimes
    - authz-entry-tests
    - cross-tenant-tests
    - agent-role-matrix
    - sensitive-doc-abac
    - policy-as-code
    - high-priv-agent-review
    - secrets-hygiene
    - secret-redaction
    - key-rotation-scope
    - precommit-ci-secret-scan
    - credential-egress-controls
    - dataset-secret-scan-gate
    - artifact-provenance-integrity
    - ai-external-tool-inventory
    - ai-vuln-scan-gate
    - ai-deploy-policy-enforcement
    - ai-verify-on-deploy
    - ai-model-mbom
    - tool-gateway-authz
    - tool-allowlist
    - high-impact-tool-gates
    - tool-argument-schema
    - signed-tool-catalog
    - destructive-tool-dry-run
    - tool-rate-limits
    - injection-policy-gate
    - custom
  optional:
    - langsmith
    - phoenix
    - helicone
    - promptfoo
    - otel
    - prometheus
    - grafana
    - aws
    - azure
    - gcp
    - wandb
    - cloudwatch

modes:
  - assess
  - compare
  - history-append

outputs:
  - REPORT.md
  - assessment.json
  - assessment.sarif
  - issues.json
  - evidence-graph.json
  - comparison.json
  - history/entry.json

userInputRequiredWhen:
  - evidence class is runtime and no export/plugin credentials available
  - AUTHN-M1: no --base-url / APRF_AUTH_PROBE_BASE_URL and no imports/http-auth-probe/auth-probe-report.json
  - AUTHN-M2: no MCP/S2S inventory export and no --base-url with admin token or email/password for tool_servers fetch
  - AUTHN-M3: no IdP MFA / break-glass coverage under imports/ai-admin-mfa/
  - AUTHN-M4: no identity-propagation design/sample under imports/identity-propagation/ (N/A if no tools/agents/workflows)
  - AUTHN-R1: no short-lived agent/tool credential inventory + prompt/config secret scan under imports/short-lived-agent-tokens/
  - AUTHN-R2: no self-hosted runtime workload-identity coverage under imports/workload-identity-runtimes/ (N/A if no self-hosted runtimes)
  - AUTHZ-M1: no authz denial coverage on privilege-gated AI entry points (run authz-entry-tests with --base-url + admin/limited creds, in-repo denial tests, or import coverage JSON with measuredAt; N/A via privilegedAiFeatureToolOrRetrievalEntryPointsPresent=false)
  - AUTHZ-M2: no cross-tenant attack suite (≥10 cases) for AI data/memory paths (run cross-tenant-tests or import results with measuredAt; N/A via multiTenantAiDataOrMemoryPathsPresent=false)
  - AUTHZ-M3: no agent/automation role matrix + ≤90d access review (run agent-role-matrix or import coverage; N/A via productionAgentOrAutomationIdentitiesPresent=false)
  - AUTHZ-M4: no sensitive document-class ABAC inventory + deny tests (run sensitive-doc-abac or import coverage; N/A via sensitiveDocumentClassesPresent=false)
  - AUTHZ-R1: no tool/model policy-as-code + CI/admission deny evidence (run policy-as-code or import coverage; N/A via toolOrModelAccessControlPresent=false)
  - AUTHZ-R2: no high-privilege agent ≤90d access review + revoke/none-warranted (run high-priv-agent-review or import coverage; N/A via highPrivilegeAgentIdentitiesPresent=false)
  - INF-M1: no CSPM/network scan proving 0 unauthenticated public AI data-store/control-plane endpoints (run ai-public-exposure-scan or import coverage; N/A via aiDataStoresOrControlPlanesPresent=false)
  - INF-M2: no documented patching SLA + inventory/scan proving 100% of production AI runtimes within org SLA (run ai-runtime-patching or import coverage; N/A via productionAiRuntimeEnvironmentsPresent=false)
  - INF-M3: no dependency inventory + least-privilege network/identity connectivity + unauthorized-access deny probe for agent/tool runtimes (run agent-tool-connectivity or import coverage; N/A via agentOrToolRuntimesPresent=false)
  - INF-M4: no shared-accelerator isolation design + ≤90d capacity/isolation test (run shared-accelerator-isolation or import coverage; N/A via sharedAiAcceleratorInfrastructurePresent=false for managed-API/CPU-only/single-tenant/dedicated GPU)
  - SEC2-M1: no secrets-manager wiring and/or clean scan coverage import (run secrets-hygiene or import coverage JSON; empty SARIF alone ≠ clean scan)
  - SEC2-M2: no log/trace redaction config + measured canary cases at 100% (run secret-redaction or import results with non-empty cases/results)
  - SEC2-M3: no key inventory + scope/rotation coverage + 0 privileged client keys (run key-rotation-scope or import results)
  - SEC2-R1: no pre-commit + CI secret-scan covering prompts/fixtures with ≤7d green scan measuredAt (run precommit-ci-secret-scan or import results; generatedAt ignored)
  - SEC2-R2: no credential egress allowlist + documented destinations + ≥1 deny event ≤90d (run credential-egress-controls or import results)
  - SEC2-R3: no dataset secret/PII scan gate before fine-tune/eval publish + 100% linked reports ≤90d (run dataset-secret-scan-gate or import results)
  - SCI-M1: no cosign/Notation/SLSA/OCI/checksum verification + 100% verified pulls + block unverified (run artifact-provenance-integrity or import results; digest pins alone ≠ PASS)
  - SCI-M2: no external AI tool/MCP/plugin inventory with 100% pin+owner+review and 0 unpinned (run ai-external-tool-inventory or import results; lockfiles/Action SHA alone ≠ PASS)
  - SCI-M3: no vuln-scan coverage 100% + org-policy critical block + 0 skipped + retained results (run ai-vuln-scan-gate or import results; app-deps-only ≠ PASS)
  - SCI-M4: no deploy-path policy enforcing unsigned/unapproved/revoked blocks (run ai-deploy-policy-enforcement or import results; Level-5; CI signing alone ≠ PASS)
  - SCI-R1: no last-deploy verify + unsigned reject in test/canary (run ai-verify-on-deploy or import results)
  - SCI-R2: no registry-linked MBOM coverage 100% + retention ≥90d (run ai-model-mbom or import results; container-only SBOM ≠ PASS)
  - TOL-M1: no path coverage 100% + deny suite 100% + no model-output bypass (run tool-gateway-authz or import results; deny suite without path coverage ≠ PASS)
  - TOL-M2: no agentsInventoriedPct=100 + allowlist 100% + unknown-tool deny 100% + runtime invent-reject (run tool-allowlist or import results; deny suite without inventory ≠ PASS)
  - TOL-M3: no highImpactToolsInventoriedPct=100 + gates 100% + ungated execution impossible (run high-impact-tool-gates or import results; bypass suite without inventory ≠ PASS)
  - TOL-M4: no tool inventory 100% + argument schema 100% + invalid fixture reject 100% (run tool-argument-schema or import results; reject suite without inventory ≠ PASS)
  - TOL-M5: no catalog inventory 100% + reject-unsigned + review ≤90d (run signed-tool-catalog or import results; Level-5; reject/review without inventory ≠ PASS)
  - TOL-R1: no destructive-tool inventory 100% + dry-run in non-prod 100% + promotion evidence ≤90d (run destructive-tool-dry-run or import results; promotion without inventory ≠ PASS)
  - TOL-R2: no high-impact inventory 100% + per-tool rate + blast budgets 100% + ≤30d enforcement proof (run tool-rate-limits or import results; enforcement without inventory ≠ PASS)
  - SEC-M1: no injection/privilege-escalation corpus + CI gate at ≥95% deny (run injection-policy-gate or import results)
  - evidence not found after precedence-ordered search
  - N/A applicability needs confirmation
  - ownership / RACI not discoverable in-repo

limitations:
  - Does not call StackRail cloud APIs
  - Does not claim third-party certification
  - Ships TypeScript collectors under collectors/ (local + import ingest); live cloud APIs are opt-in (APRF_AUDITOR_LIVE=1 + credentials)
  - http-auth-probe needs a reachable base URL (or a prior probe report); it does not start the target app for you
  - mcp-s2s-inventory needs a connection inventory export or base URL + admin token/email+password; secrets are redacted from reports
  - ai-admin-mfa needs IdP MFA % + break-glass count/max/monitoring import (or N/A attest); repo MFA docs alone are not a PASS
  - identity-propagation needs design + 100% subject-bound privileged sample with 0 anonymous hops (or N/A if non-agentic); outer HTTP auth alone is not a PASS
  - short-lived-agent-tokens needs TTL≤1h (or owned ≤30d exception) coverage + 0 static keys in prompts/config (or N/A attest); MCP env scanners alone are not a PASS
  - workload-identity-runtimes needs 100% WI coverage + 0 static shared keys + sample calls (or N/A if no self-hosted runtimes); MCP inventories alone are not a PASS
  - authz-entry-tests scores privilege-gated AI entry points (get_admin_user/has_permission/has_access) with denial coverage from tests, imports, or live limited-user probe; authn-only get_verified_user is not AUTHZ-M1 privilege; server-side guards alone are not a PASS; requires measuredAt ≤90d
  - cross-tenant-tests needs ≥10 automated cross-tenant attack cases with 0 unauthorized successes + measuredAt ≤90d; isolation code alone is not a PASS; empty inventory without N/A attest is not a PASS
  - agent-role-matrix needs identitiesInRoleMatrixWithNonAdminDefaultPct=100 + accessReviewWithin90Days + unexplainedPrivilegeEscalations=0 + measuredAt ≤90d; role docs alone are not a PASS
  - sensitive-doc-abac needs sensitiveDocumentClassesEnumerated + inventoryMatchesProductionClasses + unauthorizedClassAccessDeniedInTests + measuredAt ≤90d; ABAC docs alone are not a PASS
  - policy-as-code needs toolAndModelAccessRulesAsCode + ciOrAdmissionEnforcementPresent + lastFailingToPassingPolicyChangeShowsDenyWithin90Days + measuredAt ≤90d; OPA files alone are not a PASS
  - high-priv-agent-review needs everyHighPrivilegeAgentReviewedWithin90Days + revokeOrScopeReductionInLastTwoCyclesOrAttestedNoneWarranted + measuredAt ≤90d; inventory docs alone are not a PASS
  - ai-public-exposure-scan needs publiclyReachableUnauthenticatedCount=0 + openHighOrCriticalFindingsUnwaived=0 + authenticatedEdgeControlsConfigured + cspmOrNetworkScanPresent + measuredAt ≤90d; private-subnet docs alone are not a PASS
  - ai-runtime-patching needs patchingSlaDocumented + productionAiRuntimesWithinDocumentedPatchingSlaPct=100 + openSlaBreachesWithoutApprovedWaiver=0 + vulnerabilityOrImageAgeReportPresent + measuredAt ≤90d; image-tag pinning alone is not a PASS
  - agent-tool-connectivity needs dependencyInventoryDocumented + leastPrivilegeConnectivityControlsConfigured + connectivityControlsMatchDependencyInventory + unauthorizedInternalServiceAccessBlockedInProbe + measuredAt ≤90d; NetworkPolicy files alone are not a PASS; SEC-M4 alone is not a PASS
  - shared-accelerator-isolation needs isolationControlsDocumented + isolationOrCapacityTestMeetsStatedLimits + measuredAt ≤90d; GPU mentions alone are not a PASS; managed-API-only stacks should N/A
  - secrets-hygiene needs secrets-manager refs + import coverage (explicit privilegedSecrets…=0, 100% runtime resolve, prompts/fixtures covered, measuredAt ≤90d); GitHub Actions secrets / CI scan config / empty SARIF alone are not a PASS; heuristic embeds and failing metrics beat present=false N/A
  - secret-redaction needs redaction config + non-empty canary cases/results + detectionRatePct=100 + canaryCoversApiKeyBearerAndAwsKeyPatterns + measuredAt ≤90d; config or bare detectionRatePct alone is not a PASS
  - key-rotation-scope needs key inventory (or present=true) + privilegedProviderOrCloudKeysInClientApps=0 + productionKeysWithDocumentedLeastPrivilegeScopePct=100 + productionKeysWithinRotationPolicyPct=100 + measuredAt ≤90d; rotation/client-key docs alone are not a PASS but block N/A launder
  - precommit-ci-secret-scan needs pre-commit + CI secret-scan + secretScanCoversPromptsAndFixtures + blocksOnHighConfidenceSecrets + lastGreenMainBranchOrPrMergeScanWithin7Days + measuredAt ≤7d (generatedAt ignored); root gitleaks.toml is PARTIAL not not_demonstrated; config alone is not a PASS
  - credential-egress-controls needs egress allowlist/policy + credentialEgressDestinationsDocumented + denyEventCountProvingEnforcementInLast90Days≥1 + measuredAt ≤90d; allowlist docs alone are not a PASS but credential-runtime/deny signals block N/A launder
  - dataset-secret-scan-gate needs scan gate + publishBlockedWhenCriticalFindingsOpen + fineTuneOrEvalCorporaPublishedInLast90DaysWithLinkedScanReportPct=100 + measuredAt ≤90d; dataset cards / corpus-publish alone are not a PASS but block N/A launder
  - artifact-provenance-integrity needs cosign/Notation/SLSA/OCI/checksum verification + productionPullsVerifiedAgainstDigestOrSignaturePct=100 + unverifiedPullsBlocked + measuredAt ≤90d; digest pins / block-unverified text alone are not a PASS but block N/A launder
  - ai-external-tool-inventory needs entriesWithPinOwnerReviewPct=100 + unpinnedLatestOrFloatingEntries=0 + measuredAt ≤90d; MCP/plugin/registry signals alone are not a PASS but block N/A launder
  - ai-vuln-scan-gate needs scanCoveragePct=100 + criticalFindingsBlockPromotion + skippedScans=0 + retainedResults + measuredAt ≤90d; scan/model-serving signals alone are not a PASS but block N/A launder
  - ai-deploy-policy-enforcement needs deploymentPolicyEnforced + unsignedBlocked + unapprovedBlocked + revokedOrUntrustedRejected + measuredAt ≤90d; policy signals alone are not a PASS but block N/A launder
  - ai-verify-on-deploy needs lastDeployVerified + unsignedRejectedInTestOrCanary + measuredAt ≤90d; verify-on-deploy signals alone are not a PASS but block N/A launder
  - ai-model-mbom needs pinsWithLinkedMbomPct=100 + retentionDaysSatisfied + measuredAt ≤90d; MBOM/registry signals alone are not a PASS but block N/A launder; container-only SBOM ≠ PASS
  - tool-gateway-authz needs productionToolInvocationPathsCoveredByAuthzPct=100 + unauthorizedToolCallsDeniedPct=100 + modelOutputAloneCannotBypassGateway + measuredAt ≤90d; gateway docs alone are not a PASS but block N/A launder
  - tool-allowlist needs agentsInventoriedPct=100 + agentsWithExplicitToolAllowlistPct=100 + unknownToolRequestsDeniedPct=100 + unknownOrInventedToolsRejectedAtRuntime + measuredAt ≤90d; allowlist files alone are not a PASS but block N/A launder
  - high-impact-tool-gates needs highImpactToolsInventoriedPct=100 + highImpactToolsWithConfiguredGatePct=100 + ungatedExecutionImpossibleInTests + measuredAt ≤90d; inventory alone is not a PASS but blocks N/A launder
  - tool-argument-schema needs productionToolsInventoriedPct=100 + toolsWithDeclaredArgumentSchemaPct=100 + invalidArgumentFixturesRejectedPct=100 + measuredAt ≤90d; schema files alone are not a PASS but block N/A launder
  - signed-tool-catalog needs productionToolCatalogsInventoriedPct=100 + unsignedOrUnapprovedCatalogsRejected + supplyChainReviewWithin90DaysOrSinceLastChange + measuredAt ≤90d; Level-5; catalog docs alone are not a PASS
  - destructive-tool-dry-run needs destructiveToolsInventoriedPct=100 + destructiveToolsWithDryRunInNonProdPct=100 + lastDestructivePromotionHasDryRunEvidenceWithin90Days + measuredAt ≤90d; dry-run flags alone are not a PASS
  - tool-rate-limits needs highImpactToolsInventoriedPct=100 + highImpactToolsWithRateAndBlastBudgetPct=100 + enforcementProvenWithin30Days + measuredAt ≤90d; global rate limits alone are not a PASS
  - injection-policy-gate needs versioned corpus + CI gate with ≥95% deny and 0 model-text privilege grants; filters alone are not a PASS
  - Published aprf-spec.json is an ID/passCondition mirror; full evidenceRequired lives in Check YAML

collectorRuntime:
  command: "npm run aprf:collect -- --target <path> --out ./aprf-assessment"
  entry: collectors/runner.ts
  liveFlag: APRF_AUDITOR_LIVE=1
  authProbeBaseUrl: APRF_AUTH_PROBE_BASE_URL
  adminToken: APRF_ADMIN_TOKEN
  adminEmail: APRF_ADMIN_EMAIL
  adminPassword: APRF_ADMIN_PASSWORD
  limitedEmail: APRF_AUTHZ_LIMITED_EMAIL
  limitedPassword: APRF_AUTHZ_LIMITED_PASSWORD
  limitedToken: APRF_AUTHZ_LIMITED_TOKEN
  # Same live flags on `aprf audit` / `aprf collect` CLI (--base-url, --admin-*, --limited-*).
  # base-url or creds auto-enable live (no separate --live required).
  importRoot: aprf-assessment/imports/<pluginId>/
  customCatchAll: aprf-assessment/imports/custom/
