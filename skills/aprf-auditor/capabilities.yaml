# Machine-readable capability manifest for APRF Auditor
# Agents SHOULD read this first to know what they can collect vs must ask the user.

version: "0.2.0"
aprfVersion: "0.10.1"
skillId: aprf-auditor

summary: >
  Local, vendor-neutral APRF assessment. Repo + optional runtime collectors.
  No StackRail backend required.

languages:
  - TypeScript
  - JavaScript
  - Python
  - Go
  - Java
  - CSharp
  - Rust
  - note: "Language list is discovery support — Checks remain technology-agnostic unless applicability says otherwise."

ci:
  - GitHub Actions
  - GitLab CI
  - Jenkins
  - Azure Pipelines
  - CircleCI
  - Buildkite

cloud:
  - AWS
  - Azure
  - GCP
  - Kubernetes
  - note: "Cloud plugins are optional; ask user for credentials/exports — never invent runtime state."

agentFrameworks:
  - LangGraph
  - LangChain
  - CrewAI
  - OpenAI Agents SDK
  - AutoGen
  - Semantic Kernel
  - LlamaIndex
  - Haystack
  - Custom MCP / tool hosts

evidenceClasses:
  - id: runtime
    description: Live or exported telemetry / traces / eval runs
    collectorSupport: partial
  - id: ci
    description: Pipeline definitions and run artifacts in-repo or attached
    collectorSupport: yes
  - id: iac
    description: Terraform, Pulumi, CDK, Helm, K8s manifests
    collectorSupport: yes
  - id: runtime-config
    description: App/config that governs production behavior
    collectorSupport: yes
  - id: policy
    description: OPA/Rego, Cedar, org AI policy, allowlists
    collectorSupport: yes
  - id: code
    description: Application source implementing controls
    collectorSupport: yes
  - id: docs
    description: Markdown, ADRs, runbooks, wiki exports checked into repo
    collectorSupport: yes
  - id: user
    description: User-supplied path, paste, or attestation
    collectorSupport: yes

plugins:
  builtin:
    - repo-filesystem
    - github-actions
    - custom
  optional:
    - langsmith
    - phoenix
    - helicone
    - promptfoo
    - otel
    - prometheus
    - grafana
    - aws
    - azure
    - gcp
    - wandb
    - cloudwatch

modes:
  - assess
  - compare
  - history-append

outputs:
  - REPORT.md
  - assessment.json
  - assessment.sarif
  - issues.json
  - evidence-graph.json
  - comparison.json
  - history/entry.json

userInputRequiredWhen:
  - evidence class is runtime and no export/plugin credentials available
  - evidence not found after precedence-ordered search
  - N/A applicability needs confirmation
  - ownership / RACI not discoverable in-repo

limitations:
  - Does not call StackRail cloud APIs
  - Does not claim third-party certification
  - Ships TypeScript collectors under collectors/ (local + import ingest); live cloud APIs are opt-in (APRF_AUDITOR_LIVE=1 + credentials)
  - Published aprf-spec.json is an ID/passCondition mirror; full evidenceRequired lives in Check YAML

collectorRuntime:
  command: "npm run aprf:collect -- --target <path> --out ./aprf-assessment"
  entry: collectors/runner.ts
  liveFlag: APRF_AUDITOR_LIVE=1
  importRoot: aprf-assessment/imports/<pluginId>/
  customCatchAll: aprf-assessment/imports/custom/
