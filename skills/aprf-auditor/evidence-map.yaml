# Global fail-closed patterns (support FAIL with high confidence when matched in scope)
globalFailSignals:
  - id: plaintext-cloud-key
    category: secrets
    pattern: 'AKIA[0-9A-Z]{16}'
    relatedChecks: [SEC2-M1, SEC2-M2, SEC2-M3]
    plugins: [secrets-hygiene, secret-redaction, key-rotation-scope]
  - id: openai-sk-prefix
    category: secrets
    pattern: 'sk-[a-zA-Z0-9]{20,}'
    relatedChecks: [SEC2-M1]
  - id: private-key-pem
    category: secrets
    pattern: '-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----'
    relatedChecks: [SEC2-M1]

# Dedicated AI-system evidence strategies (map to APRF Checks; use precedence + plugins)
aiSpecificStrategies:
  promptInjectionDefenses:
    relatedChecks: [SEC-M1, SEC-M2, SEC-M3]
    search:
      - "**/*guardrail*"
      - "**/*injection*"
      - "**/moderation*"
      - "**/promptfoo*"
      - "**/redteam/**"
