      - "**/sops*"
      - "**/vault/**"
    signals: [secrets manager, secret scan CI, no hardcoded keys]
    failFastPatterns:
      - 'AKIA[0-9A-Z]{16}'
      - 'sk-[a-zA-Z0-9]{20,}'
      - '-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----'
