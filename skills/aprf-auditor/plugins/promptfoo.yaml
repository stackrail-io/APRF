id: promptfoo
title: Promptfoo / eval harness collector
version: "0.2.0"
evidenceClass: ci
alsoEmits: [runtime-config]
inputs: ["promptfoo.yaml", "**/redteam/**", "CI eval job"]
collect:
  - "Find promptfoo/eval configs and recent JSON results"
  - "Link to EVL and SEC injection/red-team Checks"
emits:
  nodeClass: ci
  refPattern: "**/promptfoo*"
