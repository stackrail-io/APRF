id: train-serve-skew-monitor
title: Train/serve skew monitoring for embeddings/features (DG-R2)
version: "0.2.0"
executor: collectors/train-serve-skew-monitor.ts
evidenceClass: runtime-config
alsoEmits: [code]
detectorIds: [repo-train-serve-skew]
inputs:
  - "Target repo (skew monitor configs, thresholds, paging hooks)"
  - "Optional suite: aprf-assessment/imports/train-serve-skew-monitor/*.{json}"
collect:
