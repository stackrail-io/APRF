  - "Detect thresholds and breach ticket/page routing"
  - "Ingest recent job proof; write train-serve-skew-monitor-report.json"
emits:
  nodeClass: runtime-config
  refPattern: "aprf-assessment/imports/train-serve-skew-monitor/*"
