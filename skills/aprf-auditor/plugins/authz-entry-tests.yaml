executor: collectors/authz-entry-tests.ts
id: authz-entry-tests
title: Authz middleware / policy tests for AI entry points (AUTHZ-M1)
version: "0.3.0"
evidenceClass: code
emitsEvidenceTier: E2
detectorIds: [authz-entry-tests]
inputs:
  - "Target repo with FastAPI (or similar) AI routes"
  - "Optional --base-url + admin or limited-user credentials for live denial probe"
  - "Optional prior/imported test inventory: aprf-assessment/imports/authz-entry-tests/*.json"
  - "Optional prior report: aprf-assessment/imports/authz-entry-tests/authz-entry-report.json"
collect:
  - "Discover AI HTTP entry points (reuses http-auth-probe route discovery)"
  - "Classify privilege-gated routes (get_admin_user / has_permission / has_access) vs authn-only"
  - "Scan repo tests for authenticated-but-unauthorized denial coverage"
  - "Optional live probe: limited (non-admin) user against privileged routes expecting 401/403"
  - "Write authz-entry-report.json with typed gapNotes; AUTHZ-M1 needs authz guards + denial suite"
emits:
  nodeClass: code
  refPattern: "aprf-assessment/imports/authz-entry-tests/*"
  signals:
    - authz-entry-tests
    - authz-m1
    - authz-guard
    - authz-test-gap
    - authz-live-probe
mapsToChecks: [AUTHZ-M1]
whenUnavailable: >
  Code that calls has_permission / Depends(get_admin_user) is supporting evidence only.
  AUTHZ-M1 PASS requires server-side authorization on privileged AI feature/tool/retrieval
  entry points AND an authz suite (in-repo tests, imports, or live limited-user probe) showing
  authenticated-but-unauthorized callers denied (measuredAt ≤90 days). Authn-only
  get_verified_user routes are inventoried but not scored as privileged. Empty inventories
  without privilegedAiFeatureToolOrRetrievalEntryPointsPresent=false are not N/A. Do not score
  AUTHN-M1 (unauthenticated rejection) as satisfying this Check.
live:
  required: false
  note: >
    Optional --base-url with admin credentials (creates a temporary limited user) or
    --limited-email/--limited-password / APRF_AUTHZ_LIMITED_* for live denial probes.
