id: one-click-ai-rollback
title: One-click / single-command AI release rollback (CHG-R1)
version: "0.2.0"
executor: collectors/one-click-ai-rollback.ts
evidenceClass: ci
alsoEmits: []
detectorIds: [repo-one-click-ai-rollback]
inputs:
  - "Target repo (one-click/single-command rollback scripts, exercise logs)"
