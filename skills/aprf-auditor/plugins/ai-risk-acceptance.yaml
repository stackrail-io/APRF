id: ai-risk-acceptance
title: AI control-gap risk acceptance / waivers (ORG-R4)
version: "0.2.0"
executor: collectors/ai-risk-acceptance.ts
evidenceClass: docs
alsoEmits: [code]
detectorIds: [repo-ai-risk-acceptance]
inputs:
  - "Target repo (risk-acceptance / waiver registers)"
  - "Optional suite: aprf-assessment/imports/ai-risk-acceptance/*.{json}"
collect:
  - "Detect waiver registers with owner/expiry/escalation signals"
  - "Ingest coverage evidence; write ai-risk-acceptance-report.json"
emits:
  nodeClass: docs
  refPattern: "aprf-assessment/imports/ai-risk-acceptance/*"
  signals:
    - ai-risk-acceptance
    - org-r4
    - repo-ai-risk-acceptance
mapsToChecks: [ORG-R4]
whenUnavailable: >
  Risk signals alone are PARTIAL. ORG-R4 PASS needs imported
  openWaiversIncomplete=0, expiredWaiversWithoutEscalation=0, measuredAt ≤90
  days. No AI control-gap waivers → NOT_APPLICABLE.
live:
  required: false
  note: Offline waiver-register heuristics + optional imported coverage JSON.
