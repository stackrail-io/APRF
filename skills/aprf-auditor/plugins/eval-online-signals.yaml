id: eval-online-signals
title: Online task-success and safety-refusal signals (EVL-M3)
version: "0.2.0"
executor: collectors/eval-online-signals.ts
evidenceClass: runtime-config
alsoEmits: []
detectorIds: [repo-eval-online-signals]
inputs:
