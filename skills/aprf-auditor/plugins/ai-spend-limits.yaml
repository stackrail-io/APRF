id: ai-spend-limits
title: AI spend / rate hard limits with enforce-on-exceed (COST-M1)
version: "0.2.0"
executor: collectors/ai-spend-limits.ts
evidenceClass: runtime-config
alsoEmits: [code, ci]
detectorIds: [repo-rate-limit-config]
inputs:
  - "Target repo (spend ceilings, TPM/RPM quotas, gateway rate limits)"
  - "Optional suite: aprf-assessment/imports/ai-spend-limits/*.{json}"
collect:
  - "Detect hard spend/rate limit config for AI workloads"
  - "Detect enforce-on-exceed test signals"
  - "Ingest deny/throttle evidence; write ai-spend-limits-report.json"
emits:
  nodeClass: runtime-config
  refPattern: "aprf-assessment/imports/ai-spend-limits/*"
  signals:
    - ai-spend-limits
    - cost-m1
    - repo-rate-limit-config
mapsToChecks: [COST-M1]
whenUnavailable: >
  Limit config alone is PARTIAL. COST-M1 PASS needs imported
  enforcedDenyOrThrottle=true (age ≤90d) plus measuredAt ≤90 days.
  No production AI workloads → NOT_APPLICABLE.
live:
  required: false
  note: Offline heuristics + optional imported enforce-on-exceed JSON.
