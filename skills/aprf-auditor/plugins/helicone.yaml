executor: collectors/runtime-vendor.ts
id: helicone
title: Helicone gateway / logging export
version: "0.3.0"
evidenceClass: runtime
alsoEmits: [runtime-config]
inputs:
  - "Helicone base URL / headers / proxy config in-repo"
  - "Optional: aprf-assessment/imports/helicone/"
collect:
  - "Detect Helicone gateway/auth headers in config"
  - "Prefer user export under imports/helicone/ for request logs"
emits:
  nodeClass: runtime
  refPattern: "**/*helicone*|imports/helicone/*"
  signals: [request-log, cost, cache]
mapsToChecks: [OBS-M1, COST-M1, COST-M2]
whenUnavailable: "Ask user for export"
