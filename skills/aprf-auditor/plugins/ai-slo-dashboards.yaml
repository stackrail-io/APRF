mapsToChecks: [OBS-R3]
whenUnavailable: >
  SLO signals alone are PARTIAL. OBS-R3 PASS needs
  namedSloTargetsForCriticalAiJourneys, coversLatencyErrorAndQualityBurn,
  burnRateAlertConfigured, measuredAt ≤90 days.
live:
  required: false
  note: Offline SLO/dashboard heuristics + optional imported JSON.
