id: ai-slo-dashboards
title: AI SLO dashboards + burn-rate alerts (OBS-R3)
version: "0.2.0"
executor: collectors/ai-slo-dashboards.ts
evidenceClass: ci
alsoEmits: []
detectorIds: [repo-ai-slo-dashboards]
inputs:
  - "Target repo (named AI SLOs, latency/error/quality burn, burn alerts, dashboards)"
  - "Optional suite: aprf-assessment/imports/ai-slo-dashboards/*.{json}"
collect:
  - "Detect AI SLO/dashboard and burn-alert signals"
  - "Ingest coverage; write ai-slo-dashboards-report.json"
emits:
  nodeClass: ci
  refPattern: "aprf-assessment/imports/ai-slo-dashboards/*"
