id: secrets-hygiene
title: Secrets manager + repo/CI secret scan (SEC2-M1)
version: "0.2.0"
executor: collectors/secrets-hygiene.ts
evidenceClass: ci
emitsEvidenceTier: E3
alsoEmits: []
detectorIds: [repo-secrets-hygiene]
inputs:
  - "Target repo (Dockerfiles, IaC, CI, prompts, fixtures)"
  - "Optional coverage: aprf-assessment/imports/secrets-hygiene/*.{json,sarif}"
collect:
  - "Detect secrets-manager / sealed-secrets / cloud secret refs in runtime config"
  - "Detect CI secret-scan (gitleaks, trufflehog, detect-secrets) covering repo/prompts"
  - "Heuristic scan for high-confidence embedded privileged secrets (values never stored)"
  - "Ingest coverage; write secrets-hygiene-report.json"
emits:
  nodeClass: ci
  refPattern: "aprf-assessment/imports/secrets-hygiene/*"
  signals: [secrets-hygiene, sec2-m1, repo-secrets-hygiene]
mapsToChecks: [SEC2-M1]
whenUnavailable: >
  Signals alone are PARTIAL. GitHub Actions ${{ secrets.* }} is not a
  production secrets manager. Empty SARIF alone does not attest a clean scan.
  SEC2-M1 PASS needs manager wiring plus explicit
  privilegedSecretsInReposPromptsOrClientBundles=0,
  productionRuntimeSecretsResolvedFromSecretsManagerPct=100,
  secretScanCoversPromptsAndFixtures=true, measuredAt ≤90 days.
  Set productionRuntimeSecretsPresent=false for NOT_APPLICABLE (blocked by
  in-repo manager wiring or heuristic embeds; failing metrics beat N/A).
live:
  required: false
  note: Offline heuristic + CI/IaC discovery; optional imported coverage JSON.
