executor: collectors/secrets-hygiene.ts
id: secrets-hygiene
title: Secrets manager + repo/CI secret scan (SEC2-M1)
version: "0.2.0"
evidenceClass: ci
inputs:
  - "Target repo (Dockerfiles, IaC, CI, prompts, fixtures)"
  - "Optional scan export: aprf-assessment/imports/secrets-hygiene/*.{json,sarif}"
  - "Optional prior report: aprf-assessment/imports/secrets-hygiene/secrets-hygiene-report.json"
collect:
  - "Detect secrets-manager / sealed-secrets / cloud secret refs in runtime config"
  - "Detect CI secret-scan (gitleaks, trufflehog, detect-secrets) covering repo/prompts"
  - "Heuristic scan for high-confidence embedded privileged secrets (values never stored)"
  - "Ingest imported scan reports; write secrets-hygiene-report.json"
emits:
  nodeClass: ci
  refPattern: "aprf-assessment/imports/secrets-hygiene/*"
  signals:
    - secrets-hygiene
    - sec2-m1
    - secrets-manager
    - secret-scan
    - embedded-secret
mapsToChecks: [SEC2-M1]
whenUnavailable: >
  GitHub Actions ${{ secrets.* }} for CI auth is not a production secrets manager.
  SEC2-M1 PASS needs secrets-manager wiring for runtime AND a clean secret-scan report
  covering prompts/fixtures — drop SARIF/JSON under imports/secrets-hygiene/ if CI lives elsewhere.
live:
  required: false
  note: Offline heuristic + CI/IaC discovery; optional imported scan artifacts.
