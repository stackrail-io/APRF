id: precommit-ci-secret-scan
title: Pre-commit + CI secret scanning with prompt/fixture coverage (SEC2-R1)
version: "0.2.0"
executor: collectors/precommit-ci-secret-scan.ts
evidenceClass: ci
alsoEmits: []
detectorIds: [repo-precommit-ci-secret-scan]
inputs:
  - "Target repo (pre-commit, CI workflows, gitleaks/trufflehog config)"
  - "Optional coverage: aprf-assessment/imports/precommit-ci-secret-scan/*.json"
collect:
  - "Detect pre-commit and CI secret-scan configs"
  - "Detect prompt/fixture coverage and blocking signals"
  - "Ingest imported coverage; write precommit-ci-secret-scan-report.json"
emits:
  nodeClass: ci
  refPattern: "aprf-assessment/imports/precommit-ci-secret-scan/*"
  signals: [precommit-ci-secret-scan, sec2-r1, repo-precommit-ci-secret-scan]
mapsToChecks: [SEC2-R1]
whenUnavailable: >
  Signals alone are PARTIAL. SEC2-R1 PASS needs pre-commit + CI secret-scan
  configured, secretScanCoversPromptsAndFixtures=true,
  blocksOnHighConfidenceSecrets=true,
  lastGreenMainBranchOrPrMergeScanWithin7Days=true, measuredAt ≤7 days under
  imports/precommit-ci-secret-scan/. Set
  applicationCodePromptsOrFixturesPresent=false for NOT_APPLICABLE.
live:
  required: false
  note: Offline discovery + optional imported green-scan coverage.
