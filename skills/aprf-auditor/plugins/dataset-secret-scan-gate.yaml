id: dataset-secret-scan-gate
title: Dataset secret/PII scan gate before fine-tune/eval publish (SEC2-R3)
version: "0.2.0"
executor: collectors/dataset-secret-scan-gate.ts
evidenceClass: ci
alsoEmits: []
detectorIds: [repo-dataset-secret-scan-gate]
inputs:
  - "Target repo (dataset/corpus publish pipelines, scan gates)"
  - "Optional coverage: aprf-assessment/imports/dataset-secret-scan-gate/*.json"
collect:
  - "Detect fine-tune/eval corpus publish and dataset secret/PII scan-gate signals"
  - "Detect blocking and scan-report signals"
  - "Ingest imported coverage; write dataset-secret-scan-gate-report.json"
emits:
  nodeClass: ci
  refPattern: "aprf-assessment/imports/dataset-secret-scan-gate/*"
  signals: [dataset-secret-scan-gate, sec2-r3, repo-dataset-secret-scan-gate]
mapsToChecks: [SEC2-R3]
whenUnavailable: >
  Signals alone are PARTIAL. SEC2-R3 PASS needs dataset secret/PII scan gate,
  publishBlockedWhenCriticalFindingsOpen=true,
  fineTuneOrEvalCorporaPublishedInLast90DaysWithLinkedScanReportPct=100,
  measuredAt ≤90 days under imports/dataset-secret-scan-gate/. Set
  fineTuneOrEvalCorpusPublishPresent=false for NOT_APPLICABLE.
live:
  required: false
  note: Offline discovery + optional imported linked-scan coverage.
