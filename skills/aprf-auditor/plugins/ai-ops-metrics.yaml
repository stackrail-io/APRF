id: ai-ops-metrics
title: AI ops latency/error/quality metrics (PERF-M2)
version: "0.2.0"
executor: collectors/ai-ops-metrics.ts
evidenceClass: ci
alsoEmits: []
detectorIds: [repo-ai-ops-metrics]
inputs:
  - "Target repo (latency/error/quality metric definitions or exporters)"
  - "Optional suite: aprf-assessment/imports/ai-ops-metrics/*.{json}"
collect:
  - "Detect AI operational metric signals"
  - "Ingest coverage; write ai-ops-metrics-report.json"
emits:
  nodeClass: ci
  refPattern: "aprf-assessment/imports/ai-ops-metrics/*"
