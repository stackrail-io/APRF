  poisoningScenarioCount≥5, coversCrossTenantWrite + coversPromptInMemory +
  coversStaleTrustedFact, criticalFailsBlockedOrRiskAccepted, measuredAt ≤90
  days. No AI memory surface → NOT_APPLICABLE.
live:
  required: false
  note: Offline poisoning-eval heuristics + optional imported suite JSON.
