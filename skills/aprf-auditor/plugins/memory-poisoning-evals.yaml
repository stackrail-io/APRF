id: memory-poisoning-evals
title: Memory poisoning eval scenarios (MEM-R1)
version: "0.2.0"
executor: collectors/memory-poisoning-evals.ts
evidenceClass: docs
alsoEmits: [code]
detectorIds: [repo-memory-poisoning-evals]
inputs:
  - "Target repo (memory-poisoning cases in adversarial/eval suite)"
  - "Optional suite: aprf-assessment/imports/memory-poisoning-evals/*.{json}"
collect:
  - "Detect poisoning scenarios, suite config, and gate/risk-acceptance signals"
  - "Ingest suite run; write memory-poisoning-evals-report.json"
emits:
  nodeClass: docs
  refPattern: "aprf-assessment/imports/memory-poisoning-evals/*"
  signals:
    - memory-poisoning-evals
    - mem-r1
    - repo-memory-poisoning-evals
mapsToChecks: [MEM-R1]
whenUnavailable: >
