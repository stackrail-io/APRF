id: memory-write-policy
title: Durable memory write policy + deny tests (MEM-M3)
version: "0.2.0"
executor: collectors/memory-write-policy.ts
evidenceClass: docs
alsoEmits: [code]
detectorIds: [repo-memory-write-policy]
inputs:
  - "Target repo (durable-memory write policy + deny tests)"
  - "Optional suite: aprf-assessment/imports/memory-write-policy/*.{json}"
collect:
  - "Detect write policy, enforcement gates, and unauthorized-writer deny tests"
  - "Ingest deny suite; write memory-write-policy-report.json"
emits:
  nodeClass: docs
  refPattern: "aprf-assessment/imports/memory-write-policy/*"
  signals:
    - memory-write-policy
    - mem-m3
    - repo-memory-write-policy
mapsToChecks: [MEM-M3]
