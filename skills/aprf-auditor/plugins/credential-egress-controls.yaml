id: credential-egress-controls
title: Credential egress allowlist + deny-event proof (SEC2-R2)
version: "0.2.0"
executor: collectors/credential-egress-controls.ts
evidenceClass: iac
emitsEvidenceTier: E3
alsoEmits: []
detectorIds: [repo-credential-egress-controls]
inputs:
  - "Target repo (NetworkPolicy, egress allowlists, destination docs)"
  - "Optional coverage: aprf-assessment/imports/credential-egress-controls/*.json"
collect:
  - "Detect egress allowlist/policy and credential-runtime signals"
  - "Detect destination documentation and deny-log signals"
  - "Ingest imported coverage; write credential-egress-controls-report.json"
emits:
  nodeClass: iac
  refPattern: "aprf-assessment/imports/credential-egress-controls/*"
  signals: [credential-egress-controls, sec2-r2, repo-credential-egress-controls]
mapsToChecks: [SEC2-R2]
whenUnavailable: >
  Signals alone are PARTIAL. SEC2-R2 PASS needs egress allowlist/policy,
  credentialEgressDestinationsDocumented=true,
  denyEventCountProvingEnforcementInLast90Days≥1, measuredAt ≤90 days under
  imports/credential-egress-controls/. Runtime/deny signals alone ≠ PASS but
  block N/A launder. Set runtimesHoldingCredentialsPresent=false for
  NOT_APPLICABLE only when no in-repo gate signals.
live:
  required: false
  note: Offline discovery + optional imported deny-event coverage.
