executor: collectors/secret-redaction.ts
id: secret-redaction
title: Log/trace secret redaction + canary tests (SEC2-M2)
version: "0.2.0"
evidenceClass: code
inputs:
  - "Target repo (logging, OTel, tracing, filters)"
  - "Optional harness export: aprf-assessment/imports/secret-redaction/*.json"
  - "Optional prior report: aprf-assessment/imports/secret-redaction/secret-redaction-report.json"
collect:
  - "Detect redaction/masking config in logging and tracing pipelines"
  - "Detect synthetic secret-injection / canary redaction tests"
  - "Ingest imported harness results (detection rate)"
  - "Write secret-redaction-report.json"
emits:
  nodeClass: code
  refPattern: "aprf-assessment/imports/secret-redaction/*"
  signals:
    - secret-redaction
    - sec2-m2
    - redaction-config
    - canary-redaction-test
mapsToChecks: [SEC2-M2]
whenUnavailable: >
  Redaction helpers in code are supporting evidence only. SEC2-M2 PASS requires redaction config
  plus a canary harness showing synthetic API/bearer/AWS-key patterns redacted at 100% in
  persisted logs/traces — drop results under imports/secret-redaction/ if the harness lives in CI.
live:
  required: false
  note: Offline discovery + optional imported canary results.
