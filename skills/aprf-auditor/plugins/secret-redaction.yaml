id: secret-redaction
title: Log/trace secret redaction + canary tests (SEC2-M2)
version: "0.2.0"
executor: collectors/secret-redaction.ts
evidenceClass: code
alsoEmits: []
detectorIds: [repo-secret-redaction]
inputs:
  - "Target repo (logging, OTel, tracing, filters)"
  - "Optional harness: aprf-assessment/imports/secret-redaction/*.json"
collect:
  - "Detect redaction/masking config in logging and tracing pipelines"
  - "Detect synthetic secret-injection / canary redaction tests"
  - "Ingest imported harness results; write secret-redaction-report.json"
emits:
  nodeClass: code
  refPattern: "aprf-assessment/imports/secret-redaction/*"
  signals: [secret-redaction, sec2-m2, repo-secret-redaction]
mapsToChecks: [SEC2-M2]
whenUnavailable: >
  Signals alone are PARTIAL. SEC2-M2 PASS needs redaction config plus
  non-empty cases/results, detectionRatePct=100,
  canaryCoversApiKeyBearerAndAwsKeyPatterns=true, measuredAt ≤90 days under
  imports/secret-redaction/. Bare detectionRatePct without cases is not a PASS.
  Set productionLoggingOrTracingPipelinesPresent=false for NOT_APPLICABLE.
live:
  required: false
  note: Offline discovery + optional imported canary results.
