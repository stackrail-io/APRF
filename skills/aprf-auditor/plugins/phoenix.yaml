id: phoenix
title: Arize Phoenix / similar eval+trace UI export
version: "0.2.0"
evidenceClass: runtime
inputs: ["aprf-assessment/imports/phoenix/"]
collect:
  - "Ingest span/eval exports if present"
  - "Map eval datasets to EVL-* Checks"
emits:
  nodeClass: runtime
  refPattern: "imports/phoenix/*"
  signals: [eval-run, trace]
mapsToChecks: [EVL-M1, OBS-M1, SEC-M1]
whenUnavailable: "Ask for export or mark runtime evidence missing"
