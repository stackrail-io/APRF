id: platform-dx-metrics
title: DX metrics time-to-safe-production + bypass rate (DX-R3)
version: "0.2.0"
executor: collectors/platform-dx-metrics.ts
evidenceClass: docs
alsoEmits: [code]
detectorIds: [repo-dx-metrics]
inputs:
  - "Target repo (DX metric docs, dashboards-as-code, weekly reports)"
  - "Optional suite: aprf-assessment/imports/platform-dx-metrics/*.{json}"
collect:
  - "Detect TTSP and policy-bypass metric definitions"
  - "Detect series/dashboard and bypass alert/owner signals"
  - "Ingest series + ownership proof; write platform-dx-metrics-report.json"
emits:
  nodeClass: docs
  refPattern: "aprf-assessment/imports/platform-dx-metrics/*"
  signals:
    - platform-dx-metrics
    - dx-r3
    - repo-dx-metrics
mapsToChecks: [DX-R3]
whenUnavailable: >
  Metric name signals alone are PARTIAL. DX-R3 PASS needs imported
  ttspFormulaDefined + bypassFormulaDefined + ≥30d series +
  bypassHasAlertOrThreshold + bypassOwnerNamed with measuredAt ≤90 days.
  No AI paved-road surface → NOT_APPLICABLE.
live:
  required: false
  note: Offline metric-doc heuristics + optional imported series/ownership JSON.
