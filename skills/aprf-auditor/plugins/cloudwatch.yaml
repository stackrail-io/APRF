executor: collectors/runtime-vendor.ts
id: cloudwatch
title: AWS CloudWatch alarms / log groups (export or IaC)
version: "0.3.0"
evidenceClass: runtime
alsoEmits: [iac]
inputs:
  - "TF/CDK CloudWatch resources in repo"
  - "Optional: aprf-assessment/imports/cloudwatch/"
collect:
  - "Parse alarm/log definitions from IaC"
  - "Attach user exports when present under imports/cloudwatch/"
emits:
  nodeClass: runtime
  refPattern: "**/*cloudwatch*|imports/cloudwatch/*"
  signals: [alarm, log-group]
mapsToChecks: [OBS-M1, INC-M1, COST-M2]
whenUnavailable: "Ask for export"
