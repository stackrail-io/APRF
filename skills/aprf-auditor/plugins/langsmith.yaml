executor: collectors/runtime-vendor.ts
id: langsmith
title: LangSmith / Langfuse-style LLM observability export
version: "0.3.0"
evidenceClass: runtime
alsoEmits: [runtime-config]
inputs:
  - "LangSmith/Langfuse SDK or env refs in repo"
  - "Optional: user export under aprf-assessment/imports/langsmith/"
collect:
  - "Scan repo for langsmith/langfuse SDK, env, and project config"
  - "If export present under imports/langsmith/, emit runtime nodes for prompt+tool traces"
  - "Config alone → runtime-config signal; measured traces still need export"
emits:
  nodeClass: runtime
  refPattern: "**/*langsmith*|**/*langfuse*|**/*.{ts,tsx,js,jsx,mjs,cjs,py,env}|**/package.json|**/pyproject.toml|**/requirements*.txt|imports/langsmith/*"
  signals: [llm-trace, tool-call, prompt-version]
mapsToChecks: [OBS-M1, OBS-R4, PRM-M1, TOL-M1, SEC-M1]
whenUnavailable: "Ask user for trace export; else NOT_DEMONSTRATED for runtime-only claims"
