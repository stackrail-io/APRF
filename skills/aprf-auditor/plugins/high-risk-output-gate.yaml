id: high-risk-output-gate
title: High-risk output schema/policy gate (SEC-M2)
version: "0.2.0"
executor: collectors/high-risk-output-gate.ts
evidenceClass: code
alsoEmits: []
detectorIds: [repo-high-risk-output-gate]
inputs:
  - "Target repo (output schemas, policy filters, high-risk path inventory, contract tests)"
  - "Optional coverage: aprf-assessment/imports/high-risk-output-gate/*.{json}"
collect:
  - "Detect output schema / policy-filter / contract-test / high-risk path inventory signals"
  - "Ingest coverage; write high-risk-output-gate-report.json"
emits:
  nodeClass: code
  refPattern: "aprf-assessment/imports/high-risk-output-gate/*"
