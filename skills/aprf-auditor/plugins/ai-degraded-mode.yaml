id: ai-degraded-mode
title: Critical journey degraded mode when AI unavailable (REL-M2)
version: "0.2.0"
executor: collectors/ai-degraded-mode.ts
evidenceClass: ci
alsoEmits: []
detectorIds: [repo-ai-degraded-mode]
inputs:
  - "Target repo (degraded-mode specs, feature flags, failover tests)"
  - "Optional suite: aprf-assessment/imports/ai-degraded-mode/*.{json}"
collect:
  - "Detect degraded-mode / fallback / failover-test signals"
  - "Ingest coverage; write ai-degraded-mode-report.json"
emits:
