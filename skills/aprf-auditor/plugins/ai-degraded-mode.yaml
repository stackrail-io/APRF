  degradedModeDocumented, criticalJourneyCount≥1,
  criticalJourneysWithDegradedModePct=100, failoverTestShowsSafeFallback,
  measuredAt ≤90 days.
live:
  required: false
  note: Offline degraded-mode heuristics + optional imported JSON.
