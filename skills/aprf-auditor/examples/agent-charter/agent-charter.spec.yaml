# APRF Agent Charter Specification (v1)
# Usable template for AGN-M1 production-agent governance records.
# Copy to docs/agents/<id>.charter.yaml (or equivalent) and fill every field.
#
# Mapping to AGN-M1 required metadata:
#   agentVersion      → charter version
#   id + environment/system/application/deploymentId → production identifier
#   owner             → named owner
#   lifecycleStatus   → Active | Deprecated | Retired | Experimental
#   purpose           → purpose
#   allowedTools      → approved tool policy / allowlist
#   dataScope         → data scope
#   autonomy          → autonomy boundaries
#   approval          → structured approval (approvedBy, approvalDate, approvalStatus)
#   changeJustification / revisionHistory → change control
#   riskLevel         → optional (Low | Medium | High | Critical)
#   reviewDate        → review date
#   lastUpdated       → last updated (APRF audit freshness)
#   expiryDate        → charter expiry / next mandatory re-approval
#
# Runtime configuration shall stay consistent with this charter; material
# deviations require charter review before deployment.

agentVersion: 1 # integer charter schema / document version

id: "" # stable agent id (unique within environment/system/application)

# At least one production identifier required (disambiguates identically named agents).
environment: "" # e.g. prod, staging
system: "" # product / platform name
application: "" # application or service name
deploymentId: "" # deployment / release identifier

lifecycleStatus: "" # Active | Deprecated | Retired | Experimental

owner: "" # accountable team or person (email or team id)

purpose: "" # why this agent exists; goals it may pursue

allowedTools: [] # approved tool / MCP / API allowlist (ids or policy refs)

forbiddenTools: [] # explicitly denied tools (fail closed if invoked)

dataScope: "" # corpora, systems, and tenants this agent may read/write

memoryPolicy: "" # short/long-term memory retention, isolation, and redaction rules

networkPolicy: "" # egress allowlist / deny-by-default network bounds

autonomy:
  maxSteps: null # hard plan/tool step budget (align with AGN-M2)
  wallClockSeconds: null # hard wall-clock timeout
  spawnDepth: null # max child / sub-agent depth
  notes: "" # escalation or other autonomy boundaries

approval:
  approvedBy: "" # person or role that approved this charter
  approvalDate: "" # ISO date of approval (YYYY-MM-DD)
  approvalStatus: "" # e.g. approved | pending | rejected

# Change control — provide changeJustification and/or revisionHistory.
changeJustification: "" # why autonomy / tools / scope last changed

revisionHistory: [] # optional list of { date, author, summary }

riskLevel: "" # optional: Low | Medium | High | Critical

identityPolicy: "" # subject / workload identity expectations on privileged hops

loggingPolicy: "" # what must be logged/retained for audit and incident review

reviewDate: "" # ISO date of last governance review (YYYY-MM-DD)

lastUpdated: "" # ISO timestamp of last charter edit (required for AGN-M1)

expiryDate: "" # ISO date after which the charter must be re-approved

# Named exceptions (optional). Each row needs justification, approver, an expiry
# within 90 days of the inventory measuredAt, and compensating controls.
exceptions: []
# - justification: ""
#   approver: ""
#   expiry: "" # ISO date ≤90 days after the inventory measuredAt
#   compensatingControls: ""
