name: Catalog / package bug
description: Report a bug in the YAML catalog, schemas, packages, or CI
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Check YAML / catalog
        - JSON Schema
        - "@stackrail-io/aprf-engine"
        - "@stackrail-io/aprf-framework-definition"
        - CI / integrity
        - Docs
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, expected vs actual, relevant Check IDs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Framework / package version
      placeholder: 0.11.0
    validations:
      required: true
