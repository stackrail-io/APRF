name: Catalog / package bug
description: Report a bug in the YAML catalog, schemas, packages, CLI, or CI
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Check YAML / catalog
        - JSON Schema
        - "@stackrail-io/aprf (CLI)"
        - "@stackrail-io/aprf-engine"
        - "@stackrail-io/aprf-framework-definition"
        - Cursor plugin / marketplace
        - Auditor skill / collectors
        - HTML report
        - CI / integrity
        - Docs
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, expected vs actual, relevant Check IDs. For CLI issues, include the command and `npx @stackrail-io/aprf@0.1.6 version` output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package / catalog version
      description: >
        CLI version (e.g. 0.1.6) and/or catalog version from `aprf version`
        (e.g. catalog 0.12.0, framework 0.12.0).
      placeholder: "cli 0.1.6 · catalog 0.12.0"
    validations:
      required: true
