id: "DX-R2"
category: "platform-engineering"
title: "Production systems should have inner-loop eval runners developers can run before PR"
description: "Inner-loop eval runners developers can run before PR"
whyItMatters: "Inner-loop eval runners developers can run before PR Failing this leaves a production
  gap against: Developers can run the core eval subset locally or in a one-command inner loop; last
  sampled AI PR (≤30 days) shows pre-PR eval evidence or documented waiver"
