  - "DX-M3"
  - "DX-R1"
  - "DX-R2"
  - "DX-R3"
tags:
  - "platform-engineering"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "cicd"
    - "kubernetes"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
