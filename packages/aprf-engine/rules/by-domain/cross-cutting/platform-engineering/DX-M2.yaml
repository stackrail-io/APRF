id: "DX-M2"
category: "platform-engineering"
title: "Local or CI self-serve checks must cover critical mandatory controls (auth, secrets, basic evals)"
description: "Local or CI self-serve checks shall cover critical mandatory controls (auth, secrets,
  basic evals)"
whyItMatters: "Local or CI self-serve checks shall cover critical mandatory controls (auth, secrets,
  basic evals) Failing this leaves a production gap against: Default AI pipeline runs auth,
  secret-scan, and basic eval checks; failing any blocks merge/promote in the golden-path template"
severity: "medium"
weight: 2
gate: "mandatory"
passCondition: "Default AI pipeline runs auth, secret-scan, and basic eval checks; failing any
  blocks merge/promote in the golden-path template"
evidenceRequired:
  - "CI/local check config covering auth, secrets, and basic evals"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "CI/local check config covering auth, secrets, and basic evals"
manualVerification: "For this Check (Cover critical mandatory controls (auth, secrets, basic
  evals)): inspect current evidence for [CI/local check config covering auth, secrets, and basic
  evals] and confirm the pass condition holds — Default AI pipeline runs auth, secret-scan, and
  basic eval checks; failing any blocks merge/promote in the golden-path template"
falsePositiveGuidance: "(Platform Engineering): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Local or CI self-serve checks must cover critical mandatory
    controls (auth, secrets, basic evals)"
  - "Retain evidence artifacts required by this Check, starting with: CI/local check config covering
    auth, secrets, and basic evals"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE Workbook — Soft skills / platform thinking parallels"
    url: "https://sre.google/workbook/"
  - title: "CNCF platforms white papers — paved roads concept"
    url: "https://www.cncf.io/"
relatedRules:
