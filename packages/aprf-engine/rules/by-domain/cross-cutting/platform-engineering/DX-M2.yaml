id: "DX-M2"
category: "platform-engineering"
title: "Local or CI self-serve checks must cover critical mandatory controls (auth, secrets, basic evals)"
description: >
  The default AI golden-path pipeline (local and/or CI) shall run authentication,
  secret-scan, and basic eval checks, and failing any of them shall block
  merge or promote.
whyItMatters: >
  Documented golden paths (DX-M1) fail in practice when builders can merge
  without auth wiring, with leaked secrets, or without eval gates. Self-serve
  checks in the default template convert policy into a merge/promote brake.
  Optional or non-blocking jobs leave the unsafe path as easy as the safe one.
severity: "medium"
weight: 2
gate: "mandatory"
passCondition: >
  The default AI pipeline runs auth, secret-scan, and basic eval checks; failing
  any blocks merge or promote in the golden-path template (blocking evidence
  measuredAt ≤90 days). If no AI build/promote surface, score NOT_APPLICABLE.
evidenceRequired:
  - "CI and/or local check config covering auth, secret-scan, and basic evals"
  - "Evidence those checks are required (blocking) on merge/promote for the AI golden-path template"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-pipeline-gates"
      params:
        hint: >
          Discover default AI/CI/local pipelines that run auth checks, secret
          scanning, and basic evals, preferably with blocking/required status.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove all three gates block merge/promote, attest
          pipeline config plus blocking evidence (measuredAt ≤90 days).
manualVerification: >
  1) Confirm AI features use a golden-path or default AI pipeline. If no AI
  build/promote surface, score NOT_APPLICABLE. 2) Locate the default CI workflow
  and/or local pre-commit/make targets for that path. 3) Confirm jobs/steps for
  auth (or authz smoke), secret-scan, and basic evals. 4) Confirm failing any
  blocks merge/promote (required checks, protected branch, or equivalent).
  5) PASS only if all three run and block. DX-M1 docs alone do not satisfy.
  Org-wide unrelated CI without AI template coverage does not satisfy.
falsePositiveGuidance: >
  Do not pass optional/advisory workflows that never block. Do not pass
  secret-scan alone without auth and eval gates. Do not pass eval suites that
  are not wired into the default AI template pipeline. Do not pass DX-M1
  documentation as a substitute for executable checks. Named exceptions need
  owner and expiry ≤90 days.
recommendedFixes:
  - "Add required auth, secret-scan, and basic eval jobs to the AI golden-path CI/local template"
  - "Mark those checks required for merge/promote on protected branches"
  - "Retain blocking proof under imports/platform-ai-pipeline-gates/"
  - "Fail closed when any of the three gates is missing from the default template"
references:
  - title: "Google SRE Workbook — Soft skills / platform thinking parallels"
    url: "https://sre.google/workbook/"
  - title: "CNCF platforms white papers — paved roads concept"
    url: "https://www.cncf.io/"
relatedRules:
  - "DX-M1"
  - "DX-R4"
  - "AUTHN-M1"
  - "SEC2-M1"
  - "SEC2-R1"
  - "EVL-M1"
  - "CHG-M1"
tags:
  - "platform-engineering"
  - "mandatory"
  - "hybrid"
  - "ci-gates"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
