id: "ORG-M4"
category: "organizational-governance"
title: "Internal audit or independent assessment must sample APRF evidence on a defined cadence"
description: "Internal audit or independent assessment shall sample APRF evidence on a defined cadence"
whyItMatters: "Internal audit or independent assessment shall sample APRF evidence on a defined
  cadence Failing this leaves a production gap against: PASS if the last sampling report is ≤12
  months old and lists sampled check IDs and findings"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "PASS if the last sampling report is ≤12 months old and lists sampled check IDs and findings"
evidenceRequired:
  - "Independent assessment or internal-audit sampling report against APRF evidence"
detection:
  capability: "manual"
  detectors: []
manualVerification: "For this Check (Internal audit or independent assessment must sample APRF
  evidence on a defined cadence): inspect current evidence for [Independent assessment or
  internal-audit sampling report against APRF evidence] and confirm the pass condition holds — PASS
  if the last sampling report is ≤12 months old and lists sampled check IDs and findings"
falsePositiveGuidance: "(Organizational Governance): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Internal audit or independent assessment must sample APRF
    evidence on a defined cadence"
  - "Retain evidence artifacts required by this Check, starting with: Independent assessment or
    internal-audit sampling report against APRF evidence"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "ISO/IEC 42001 — AI management systems"
    url: "https://www.iso.org/standard/81230.html"
  - title: "NIST AI RMF — Govern"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "ORG-M1"
  - "ORG-M2"
  - "ORG-M3"
  - "ORG-R1"
  - "ORG-R3"
tags:
  - "organizational-governance"
  - "mandatory"
  - "manual"
applicability:
  technologies: []
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
