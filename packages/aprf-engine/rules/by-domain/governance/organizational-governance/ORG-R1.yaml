id: "ORG-R1"
category: "organizational-governance"
title: "Production systems should have periodic leadership review of AI risk posture and APRF maturity"
description: "Periodic leadership review of AI risk posture and APRF maturity"
whyItMatters: "Periodic leadership review of AI risk posture and APRF maturity Failing this leaves a
  production gap against: Leadership reviewed AI risk posture and APRF capability attained ≤90 days
  ago; open actions have owners and due dates"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Leadership reviewed AI risk posture and APRF capability attained ≤90 days ago; open
  actions have owners and due dates"
evidenceRequired:
  - "Leadership AI risk / APRF maturity review minutes (or board pack excerpt) + action log"
detection:
  capability: "manual"
  detectors: []
manualVerification: "For this Check (Periodic leadership review of AI risk posture and APRF
  maturity): inspect current evidence for [Leadership AI risk / APRF maturity review minutes (or
  board pack excerpt) + action log] and confirm the pass condition holds — Leadership reviewed AI
  risk posture and APRF capability attained ≤90 days ago; open actions have owners and due dates"
falsePositiveGuidance: "(Organizational Governance): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Periodic leadership review of AI risk posture and
    APRF maturity"
  - "Retain evidence artifacts required by this Check, starting with: Leadership AI risk / APRF
    maturity review minutes (or board pack excerpt) + action log"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "ISO/IEC 42001 — AI management systems"
    url: "https://www.iso.org/standard/81230.html"
  - title: "NIST AI RMF — Govern"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "ORG-M1"
  - "ORG-M2"
  - "ORG-M3"
  - "ORG-M4"
  - "ORG-R3"
tags:
  - "organizational-governance"
  - "recommended"
  - "manual"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
