id: "CMP-M1"
category: "compliance"
title: "Applicable obligations for production AI systems must be identified and owned"
description: >
  Every production AI system shall have applicable legal/regulatory/contractual
  obligations identified in a register with a named owner, or an explicit
  “none in scope” attestation with owner and review date within 12 months.
whyItMatters: >
  Unowned AI systems drift outside known compliance scope: teams cannot tell
  which rules apply, who renews them, or whether “none in scope” was a conscious
  decision. An obligations register with owners and fresh reviews turns
  compliance from tribal knowledge into an operable inventory for every
  production AI system ID.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  Every production AI system ID has ≥1 mapped obligation entry or an explicit
  “none in scope” attestation with owner and review date ≤12 months (register
  evidence measuredAt ≤90 days). If no production AI systems exist, score NOT_APPLICABLE.
evidenceRequired:
  - "Inventory of production AI system IDs in scope"
  - "Obligations register mapping each system to obligations (or none-in-scope) with owner and review date"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-obligations-register"
      params:
        hint: >
          Discover AI obligations registers, system inventories, and
          none-in-scope attestations with owners and review dates.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest every production AI system
          ID has ≥1 obligation or none-in-scope with owner and review ≤12 months
          (register measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI systems exist. If none, score NOT_APPLICABLE. 2)
  Inventory production AI system IDs. 3) Open the obligations register: each
  system has ≥1 obligation entry or an explicit none-in-scope attestation. 4)
  Confirm every entry/attest has a named owner and review date ≤12 months. 5)
  PASS only if coverage is 100% and register freshness holds (measuredAt ≤90
  days). A company-wide legal memo that never names system IDs does not
  satisfy. Registers without owners or with reviews older than 12 months do
  not satisfy.
falsePositiveGuidance: >
  Do not pass a generic compliance policy without per-system mappings. Do not
  pass “none in scope” without owner and review date. Do not pass incomplete
  inventories that omit shadow AI systems in production. Do not pass registers
  older than 90 days as current without a fresh measuredAt. Named exceptions
  need owner and expiry ≤90 days.
recommendedFixes:
  - "Publish a production AI system inventory and obligations register with owner per entry"
  - "Require none-in-scope attestations (owner + review date) when no obligations apply"
  - "Review obligations at least annually; treat reviews >12 months as missing"
  - "Retain register under imports/ai-obligations-register/"
references:
  - title: "NIST AI RMF"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 (AI management systems) — conceptual alignment"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "CMP-M2"
  - "CMP-M3"
  - "CMP-R1"
  - "CMP-R2"
  - "CMP-R3"
  - "ORG-M1"
tags:
  - "compliance"
  - "mandatory"
  - "hybrid"
  - "obligations"
  - "register"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
