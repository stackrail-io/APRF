id: "CMP-R1"
category: "compliance"
title: "Production systems should have regular control testing with documented exceptions"
description: "Regular control testing with documented exceptions"
whyItMatters: "Regular control testing with documented exceptions Failing this leaves a production
  gap against: Documented controls were tested on schedule in the last cycle (≤90 days default);
  open exceptions have owner, expiry, and compensating control"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Documented controls were tested on schedule in the last cycle (≤90 days default);
  open exceptions have owner, expiry, and compensating control"
evidenceRequired:
  - "Control-testing schedule + latest test results pack with exceptions register"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Control-testing schedule + latest test results pack with exceptions register"
manualVerification: "For this Check (Regular control testing with documented exceptions): inspect
  current evidence for [Control-testing schedule + latest test results pack with exceptions
  register] and confirm the pass condition holds — Documented controls were tested on schedule in
  the last cycle (≤90 days default); open exceptions have owner, expiry, and compensating control"
falsePositiveGuidance: "re-verify against a current artifact for this specific Check , not a sibling
  control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Regular control testing with documented exceptions"
  - "Retain evidence artifacts required by this Check, starting with: Control-testing schedule +
    latest test results pack with exceptions register"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 (AI management systems) — conceptual alignment"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "CMP-M1"
  - "CMP-M2"
  - "CMP-M3"
  - "CMP-R2"
  - "CMP-R3"
tags:
  - "compliance"
  - "recommended"
  - "manual"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
