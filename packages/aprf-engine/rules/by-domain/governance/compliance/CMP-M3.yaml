id: "CMP-M3"
category: "compliance"
title: "Audit logs for critical AI control-plane changes must be retained per policy"
description: "Audit logs for critical AI control-plane changes shall be retained per policy"
whyItMatters: "Audit logs for critical AI control-plane changes shall be retained per policy Failing
  this leaves a production gap against: Retention configured ≥ policy minimum (e.g. ≥ 365 days);
  synthetic control-plane change appears in audit log within ≤ 5 minutes and remains queryable after
  retention smoke check"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Retention configured ≥ policy minimum (e.g. ≥ 365 days); synthetic control-plane
  change appears in audit log within ≤ 5 minutes and remains queryable after retention smoke check"
evidenceRequired:
  - "Audit log retention config + sample of control-plane change events"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Audit log retention config + sample of control-plane change events"
manualVerification: "For this Check (Audit logs for critical AI control-plane changes must be
  retained per policy): inspect current evidence for [Audit log retention config + sample of
  control-plane change events] and confirm the pass condition holds — Retention configured ≥ policy
  minimum (e.g. ≥ 365 days); synthetic control-plane change appears in audit log within ≤ 5 minutes
  and remains queryable after retention smoke check"
falsePositiveGuidance: "re-verify against a current artifact for this specific Check , not a sibling
  control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Audit logs for critical AI control-plane changes must be retained
    per policy"
  - "Retain evidence artifacts required by this Check, starting with: Audit log retention config +
    sample of control-plane change events"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 (AI management systems) — conceptual alignment"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "CMP-M1"
  - "CMP-M2"
  - "CMP-R1"
  - "CMP-R2"
  - "CMP-R3"
tags:
  - "compliance"
  - "mandatory"
  - "manual"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
