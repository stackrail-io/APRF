id: "CMP-R2"
category: "compliance"
title: "Production systems should have customer-facing trust documentation aligned to APRF pillars"
description: >
  Customer-facing trust/security documentation for production AI systems shall
  cover identity, safety/eval, data handling, and incident contact at minimum;
  include an explicit APRF pillar or Core Profile mapping table; and show a
  last-updated date within 12 months.
whyItMatters: >
  Customers and partners cannot verify how an AI system is governed without a
  current public trust surface. A doc that names identity, safety/eval, data
  handling, and incident contact—and maps those claims to APRF pillars or the
  Core Profile—turns marketing promises into inspectable commitments and keeps
  stale trust pages from outliving the controls they describe.
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  Public trust doc covers identity, safety/eval, data handling, and incident
  contact; pillar/Core mapping table is explicit; last-updated ≤12 months
  (trust-doc evidence measuredAt ≤90 days). If no customer-facing production AI surface, score NOT_APPLICABLE.
evidenceRequired:
  - "Customer-facing trust/security doc with published URL and last-updated date"
  - "Explicit APRF pillar or Core Profile mapping table covering identity, safety/eval, data handling, and incident contact"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-trust-documentation"
      params:
        hint: >
          Discover customer-facing trust/security docs, published URLs,
          last-updated dates, and APRF pillar/Core mapping tables.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest a public trust doc covers
          identity, safety/eval, data handling, and incident contact with an
          explicit pillar/Core map and last-updated ≤12 months (measuredAt ≤90
          days).
manualVerification: >
  1) Confirm the system is customer-facing (or otherwise publishes a trust
  surface). If no customer-facing production AI surface, score NOT_APPLICABLE.
  2) Open the public trust/security doc via published URL. 3) Confirm coverage
  of identity, safety/eval, data handling, and incident contact. 4) Confirm an
  explicit APRF pillar or Core Profile mapping table. 5) Confirm last-updated
  ≤12 months. 6) PASS only if coverage + mapping + freshness hold with
  measuredAt ≤90 days. An internal-only security wiki does not satisfy. A trust
  page without a pillar/Core map or older than 12 months does not satisfy.
falsePositiveGuidance: >
  Do not pass a generic company privacy policy that never mentions AI controls.
  Do not pass marketing pages without identity/safety/data/incident sections.
  Do not pass pillar maps that only list Check IDs with no public narrative. Do
  not pass last-updated stamps older than 12 months. Named exceptions need
  owner and expiry ≤90 days.
recommendedFixes:
  - "Publish a customer-facing trust/security doc with a durable URL"
  - "Cover identity, safety/eval, data handling, and incident contact at minimum"
  - "Add an explicit APRF pillar or Core Profile mapping table"
  - "Refresh last-updated ≤12 months; retain attestation under imports/ai-trust-documentation/"
references:
  - title: "NIST AI RMF"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 (AI management systems) — conceptual alignment"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "CMP-M1"
  - "CMP-M2"
  - "CMP-M3"
  - "CMP-R1"
  - "CMP-R3"
tags:
  - "compliance"
  - "recommended"
  - "hybrid"
  - "trust-documentation"
  - "transparency"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
