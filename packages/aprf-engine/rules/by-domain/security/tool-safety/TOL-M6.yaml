id: "TOL-M6"
category: "tool-safety"
title: "Effective agent data and API access must not exceed the charter"
description: >
  Effective (including transitive and delegated) data and API access of each
  production agent shall be inventoried from an evidence-backed capability graph
  and shall not exceed the approved charter data scope. Unauthorized effective
  paths shall be denied in exercise. Direct tool allowlists alone do not prove
  the absence of MCP-to-API-to-database hops.
whyItMatters: >
  Agents inherit the blast radius of every MCP server, tool, and shared
  credential they can reach. A confused-deputy path to a customer database is
  still unauthorized access even when the agent has no direct database tool.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  A provenance-backed capability graph covers in-scope agents, tools, MCP
  servers, and data stores; high-risk transitive or delegated paths are mapped
  to charter data scope; unauthorized effective paths are denied in exercise
  (or documented absence of transitive hops is graph-proven) (measuredAt ≤90
  days). If no production agents use tools, MCP, or delegation, score
  NOT_APPLICABLE.
evidenceRequired:
  - "Capability graph with evidence provenance for relationships and derived paths"
  - "Charter data-scope mapping for inventoried agents"
  - "Exercise or reachability deny on unauthorized transitive/delegated paths, or graph proof that none exist (measuredAt ≤90 days)"
evidencePolicy:
  minimumTier: E4
  acceptableEvidence:
    - harness_exercise_report
    - connectivity_deny_probe
    - application_logs
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-transitive-tool-access"
      params:
        hint: >
          Build or ingest a capability graph; require exercise deny on
          unauthorized effective paths (measuredAt ≤90 days). Inferred-only
          paths cannot unlock PASS.
    - id: "repo-agent-capability-graph"
      params:
        hint: >
          Emit agent-capability-graph.json from inventory/repo/import. Graph
          output is operational evidence only and cannot unlock PASS.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest graph plus deny
          exercises (measuredAt ≤90 days) or N/A if no tools/MCP/delegation.
manualVerification: >
  1) Confirm tools, MCP, or delegation exist. If none, score NOT_APPLICABLE.
  2) Open the capability graph and charter data scope. 3) Identify derived
  paths to data stores and APIs. 4) Review deny exercises on unauthorized
  hops. 5) PASS only with exercise or runtime deny (or proven absence of
  transitive hops). Inferred graph edges alone do not PASS. Per-agent
  allowlists alone do not prove effective access.
falsePositiveGuidance: >
  Do not pass because a graph file exists without provenance. Do not treat
  inferred MCP hops as independently verified. Do not pass connectivity
  allowlists without mapping to charter scope. Named exceptions need owner
  and expiry ≤90 days.
recommendedFixes:
  - "Narrow MCP and tool grants to charter data scope"
  - "Add deny tests on data stores reachable only through tool chains"
  - "Record graph provenance to evidence-graph nodes"
  - "Retain packs under imports/transitive-tool-access/ and agent-capability-graph.json"
references:
  - title: "OWASP Top 10 for LLM Applications — LLM06 Excessive Agency"
    url: "https://genai.owasp.org/llmrisk/llm062025-excessive-agency/"
  - title: "Model Context Protocol — security considerations"
    url: "https://modelcontextprotocol.io/"
relatedRules:
  - "TOL-M1"
  - "TOL-M2"
  - "AGN-M1"
  - "INF-M3"
  - "AUTHZ-M3"
tags:
  - "tool-safety"
  - "mandatory"
  - "hybrid"
  - "mcp"
  - "capability-graph"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.11.0"
