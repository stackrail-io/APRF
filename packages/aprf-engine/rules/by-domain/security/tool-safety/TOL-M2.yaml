id: "TOL-M2"
category: "tool-safety"
title: "Tools must be allowlisted per agent/workload; unknown tools must not be inventable at runtime"
description: "Tools shall be allowlisted per agent/workload; unknown tools shall not be inventable at runtime"
whyItMatters: "Tools shall be allowlisted per agent/workload; unknown tools shall not be inventable
  at runtime Failing this leaves a production gap against: 100% of production agents have an
  explicit tool allowlist; requests for tools outside the allowlist are denied at 100% in automated
  tests"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of production agents have an explicit tool allowlist; requests for tools
  outside the allowlist are denied at 100% in automated tests"
evidenceRequired:
  - "Per-agent tool allowlist config + negative tests for unknown tool names"
detection:
  capability: "automated"
  detectors:
    - id: "mcp-tool-allowlist"
      params: {}
    - id: "mcp-no-unrestricted-shell"
      params: {}
    - id: "mcp-no-unrestricted-network"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Per-agent tool allowlist config + negative tests for unknown tool names"
manualVerification: "For this Check (Tools must be allowlisted per agent/workload; unknown tools
  must not be inventable at runtime): inspect current evidence for [Per-agent tool allowlist config
  + negative tests for unknown tool names] and confirm the pass condition holds — 100% of production
  agents have an explicit tool allowlist; requests for tools outside the allowlist are denied at
  100% in automated tests"
falsePositiveGuidance: "(Tool Safety): confirm the detector target matches the production path for
  this Check before waiving. Named exceptions need an owner and expiry ≤90 days."
recommendedFixes:
  - "Implement and operationalize: Tools must be allowlisted per agent/workload; unknown tools must
    not be inventable at runtime"
  - "Retain evidence artifacts required by this Check, starting with: Per-agent tool allowlist
    config + negative tests for unknown tool names"
  - "Wire or verify detectors declared on this Check so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Model Context Protocol security considerations"
    url: "https://modelcontextprotocol.io/"
  - title: "OWASP LLM — Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "TOL-M1"
  - "TOL-M3"
  - "TOL-M4"
  - "TOL-M5"
  - "TOL-R1"
tags:
  - "tool-safety"
  - "mandatory"
  - "automated"
applicability:
  technologies:
    - "mcp"
    - "a2a"
    - "openapi"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
