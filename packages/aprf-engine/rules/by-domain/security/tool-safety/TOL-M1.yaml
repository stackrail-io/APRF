id: "TOL-M1"
category: "tool-safety"
title: "Every tool invocation must be authorized server-side independent of model output"
description: >
  Every tool invocation shall be authorized server-side independent of model
  output—proven by automated gateway tests that deny tool calls without a
  valid authz decision at 100%, not by prompt instructions or client-side
  checks alone.
whyItMatters: >
  If the model can invent a tool name or arguments and the gateway executes
  them without an independent authz decision, injection and confused-deputy
  paths become production incidents. Distinct from AUTHZ-M1 (AI HTTP/RPC
  entry-point denial tests), TOL-M2 (per-agent tool allowlists), and AUTHZ-R1
  (tool/model policy-as-code + CI/admission deny).
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Automated tests show tool calls without a valid authz decision are denied
  at 100%; model-proposed tool name/args alone never bypass the gateway
  (measuredAt ≤90 days). If no production tools/agents invoke tools, score
  NOT_APPLICABLE.
evidenceRequired:
  - "Tool gateway / tool-runtime authz enforcement config (server-side)"
  - "Automated deny suite for tool calls missing/forged/invalid authz decisions"
  - "Deny logs or test results proving 100% denial + no model-output bypass (measuredAt ≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-tool-gateway-authz"
      params:
        hint: >
          Discover tool-gateway / tool-runtime authz and deny-suite signals;
          ingest coverage under imports/tool-gateway-authz/; require
          unauthorizedToolCallsDeniedPct=100 +
          modelOutputAloneCannotBypassGateway=true + measuredAt ≤90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest server-side tool authz
          with 100% deny of unauthorized tool calls and no model-output
          bypass (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production agents/tools invoke tools through a gateway or
  runtime. If none, score NOT_APPLICABLE. 2) Confirm authz is enforced
  server-side (not prompt-only). 3) Review automated tests: calls without a
  valid authz decision are denied at 100%. 4) Confirm model-proposed tool
  name/args alone cannot bypass the gateway. 5) PASS only if deny suite +
  no-bypass hold with measuredAt ≤90 days. AUTHZ-M1 entry-point tests alone
  do not prove per-tool-call authz. TOL-M2 allowlists alone do not prove
  authz decisions independent of the allowlist. AUTHZ-R1 policy-as-code alone
  does not prove runtime deny for every tool invocation.
falsePositiveGuidance: >
  Do not pass prompt “ask permission” text as server-side authz. Do not pass
  client SDKs that skip the gateway in production. Do not pass allowlist-only
  configs without an authz decision path. Do not score AUTHZ-M1, TOL-M2, or
  AUTHZ-R1 as substitutes. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Enforce server-side authz on every tool invocation at the gateway/runtime"
  - "Add automated deny tests for missing/forged/invalid authz decisions at 100%"
  - "Prove model-proposed tool name/args cannot bypass the gateway; retain under imports/tool-gateway-authz/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Model Context Protocol — security considerations"
    url: "https://modelcontextprotocol.io/"
  - title: "OWASP LLM — Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "TOL-M2"
  - "TOL-M3"
  - "TOL-M4"
  - "AUTHZ-M1"
  - "AUTHZ-R1"
  - "AGN-M2"
tags:
  - "tool-safety"
  - "mandatory"
  - "hybrid"
  - "tool-gateway"
  - "authorization"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
