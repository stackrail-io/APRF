id: "TOL-M3"
category: "tool-safety"
title: "High-impact tools must require additional gates (approval, dual control, or policy engine)"
description: "High-impact tools shall require additional gates (approval, dual control, or policy engine)"
whyItMatters: "High-impact tools shall require additional gates (approval, dual control, or policy
  engine) Failing this leaves a production gap against: 100% of tools rated
  write/irreversible/financial have a configured gate; automated tests show ungated execution is
  impossible for those tools"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of tools rated write/irreversible/financial have a configured gate; automated
  tests show ungated execution is impossible for those tools"
evidenceRequired:
  - "Impact-tiered tool inventory + gate configuration + bypass tests"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Impact-tiered tool inventory + gate configuration + bypass tests"
manualVerification: "For this Check (Require additional gates (approval, dual control, or policy
  engine)): inspect current evidence for [Impact-tiered tool inventory + gate configuration + bypass
  tests] and confirm the pass condition holds — 100% of tools rated write/irreversible/financial
  have a configured gate; automated tests show ungated execution is impossible for those tools"
falsePositiveGuidance: "(Tool Safety): re-verify against a current artifact for this specific Check
  , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: High-impact tools must require additional gates (approval, dual
    control, or policy engine)"
  - "Retain evidence artifacts required by this Check, starting with: Impact-tiered tool inventory +
    gate configuration + bypass tests"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Model Context Protocol security considerations"
    url: "https://modelcontextprotocol.io/"
  - title: "OWASP LLM — Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "TOL-M1"
  - "TOL-M2"
  - "TOL-M4"
  - "TOL-M5"
  - "TOL-R1"
tags:
  - "tool-safety"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "mcp"
    - "a2a"
    - "openapi"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
