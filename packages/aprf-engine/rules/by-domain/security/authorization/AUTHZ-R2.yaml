id: "AUTHZ-R2"
category: "authorization"
title: "Production systems should have continuous access reviews for high-privilege agents"
description: "Continuous access reviews for high-privilege agents"
whyItMatters: "Continuous access reviews for high-privilege agents Failing this leaves a production
  gap against: Every high-privilege agent identity was reviewed ≤90 days ago; ≥1 revoke or
  scope-reduction appears in the last two cycles (or attestation that none were warranted with
  reviewer sign-off)"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Every high-privilege agent identity was reviewed ≤90 days ago; ≥1 revoke or
  scope-reduction appears in the last two cycles (or attestation that none were warranted with
  reviewer sign-off)"
evidenceRequired:
  - "High-privilege agent inventory + last access-review spreadsheet/report with decisions
    (keep/revoke/modify)"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "High-privilege agent inventory + last access-review spreadsheet/report with decisions
          (keep/revoke/modify)"
manualVerification: "For this Check (Continuous access reviews for high-privilege agents): inspect
  current evidence for [High-privilege agent inventory + last access-review spreadsheet/report with
  decisions (keep/revoke/modify)] and confirm the pass condition holds — Every high-privilege agent
  identity was reviewed ≤90 days ago; ≥1 revoke or scope-reduction appears in the last two cycles
  (or attestation that none were warranted with reviewer sign-off)"
falsePositiveGuidance: "re-verify against a current artifact for this specific Check , not a sibling
  control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Continuous access reviews for high-privilege agents"
  - "Retain evidence artifacts required by this Check, starting with: High-privilege agent inventory
    + last access-review spreadsheet/report with decisions (keep/revoke/modify)"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Access Control Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "AUTHZ-M1"
  - "AUTHZ-M2"
  - "AUTHZ-M3"
  - "AUTHZ-M4"
  - "AUTHZ-R1"
tags:
  - "authorization"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "mcp"
    - "a2a"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
