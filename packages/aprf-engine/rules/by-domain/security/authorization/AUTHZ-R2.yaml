id: "AUTHZ-R2"
category: "authorization"
title: "Production systems should have continuous access reviews for high-privilege agents"
description: >
  Every high-privilege agent identity shall be reviewed ≤90 days ago, with
  ≥1 revoke or scope-reduction in the last two cycles—or a signed
  attestation that none were warranted.
whyItMatters: >
  High-privilege agents accumulate standing power; without recurring
  reviews that actually revoke or shrink scope, least-privilege erodes
  into permanent admin bots. A fresh inventory plus review decisions
  (keep/revoke/modify) with revoke evidence—or signed “none warranted”—
  makes continuous access review measurable. Distinct from AUTHZ-M3
  (complete role matrix + unexplained-escalation count for all
  agent/automation identities), AUTHZ-R1 (tool/model policy-as-code),
  and AGN-R3 (RACI ownership).
severity: "critical"
weight: 4
gate: "recommended"
passCondition: >
  Every high-privilege agent identity was reviewed ≤90 days ago; ≥1 revoke
  or scope-reduction appears in the last two cycles (or attestation that
  none were warranted with reviewer sign-off) (measuredAt ≤90 days). If no
  high-privilege agent identities exist, score NOT_APPLICABLE.
evidenceRequired:
  - "Inventory of high-privilege agent identities"
  - "Last access-review report with keep/revoke/modify decisions (≤90 days)"
  - "Evidence of ≥1 revoke/scope-reduction in last two cycles, or signed none-warranted attestation"
detection:
  capability: "hybrid"
  detectors:
    - id: "high-priv-agent-review"
      params:
        hint: >
          Discover high-privilege agent inventory and access-review
          signals; ingest coverage under imports/high-priv-agent-review/
          requiring everyHighPrivilegeAgentReviewedWithin90Days=true and
          revokeOrScopeReductionInLastTwoCyclesOrAttestedNoneWarranted=true,
          measuredAt ≤90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest every high-privilege
          agent reviewed ≤90 days with ≥1 revoke/scope-reduction in the
          last two cycles (or signed none-warranted) (measuredAt ≤90 days).
manualVerification: >
  1) Confirm high-privilege agent identities exist. If none, score
  NOT_APPLICABLE. 2) Obtain the high-privilege agent inventory. 3) Review
  the latest access-review report (≤90 days): every in-scope identity has
  a keep/revoke/modify decision. 4) Confirm ≥1 revoke or scope-reduction
  in the last two cycles, or a reviewer-signed attestation that none were
  warranted. 5) PASS only if inventory + full review + revoke/attestation
  hold with measuredAt ≤90 days. AUTHZ-M3 role-matrix coverage alone does
  not prove recurring high-privilege reviews with revoke evidence.
  AUTHZ-R1 policy-as-code alone does not prove agent access reviews.
  AGN-R3 RACI ownership alone does not prove privilege revoke cycles.
falsePositiveGuidance: >
  Do not pass a one-time role matrix without a ≤90-day review cycle. Do
  not pass “all keep” reviews without revoke evidence or a signed
  none-warranted attestation. Do not pass empty inventories without an
  explicit N/A attest. Do not score AUTHZ-M3, AUTHZ-R1, or AGN-R3 as
  substitutes. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Maintain an inventory of high-privilege agent identities"
  - "Run ≤90-day access reviews with keep/revoke/modify decisions"
  - "Record ≥1 revoke/scope-reduction per two cycles (or signed none-warranted) under imports/high-priv-agent-review/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "OWASP Access Control Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "AUTHZ-M1"
  - "AUTHZ-M2"
  - "AUTHZ-M3"
  - "AUTHZ-M4"
  - "AUTHZ-R1"
  - "AGN-R3"
tags:
  - "authorization"
  - "recommended"
  - "hybrid"
  - "access-review"
  - "high-privilege"
  - "agent-identity"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
