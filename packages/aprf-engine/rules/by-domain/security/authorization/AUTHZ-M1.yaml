  - "AUTHZ-M3"
  - "AUTHZ-M4"
  - "AUTHZ-R1"
  - "AUTHZ-R2"
  - "AUTHN-M1"
  - "AUTHN-M4"
  - "TOL-M1"
tags:
  - "authorization"
  - "mandatory"
  - "hybrid"
  - "server-side"
  - "authz-suite"
  - "least-privilege"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
