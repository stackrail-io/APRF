id: "AUTHZ-M2"
category: "authorization"
title: "Multi-tenant isolation must be tested for AI data and memory paths"
description: >
  Multi-tenant AI data and memory paths shall deny unauthorized cross-tenant
  reads and writes—proven by an automated attack suite, not by tenant
  filters in code alone.
whyItMatters: >
  Missing or bypassed tenant boundaries on chats, knowledge, files, vectors,
  and memory turn shared AI backends into cross-tenant confidentiality
  failures. A fresh attack suite (≥10 cases, 0 successful unauthorized
  accesses) makes isolation measurable. Distinct from AUTHZ-M1
  (authenticated-but-unauthorized on feature/tool/retrieval entry points),
  MEM-M1 (memory-store isolation specifically), and AUTHN-M1
  (unauthenticated rejection).
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  0 successful unauthorized cross-tenant reads/writes across ≥10 automated
  attack cases on AI data and memory paths (measuredAt ≤90 days). If no
  multi-tenant AI data or memory paths exist, score NOT_APPLICABLE.
evidenceRequired:
  - "Inventory or scope note of multi-tenant AI data and memory paths (chats, knowledge, files, vectors, memory, or equivalent)"
  - "Cross-tenant attack test suite results (≥10 cases) covering those paths"
  - "Scoring report showing 0 successful unauthorized cross-tenant reads/writes (measuredAt ≤90 days)"
evidencePolicy:
  minimumTier: E3
  acceptableEvidence:
    - application_logs
    - repo_signal
    - policy_scan_report
    - cloud_audit_logs
detection:
  capability: "hybrid"
  detectors:
    - id: "cross-tenant-tests"
      params:
        hint: >
          Discover tenant-isolation helpers and AI data/memory path hints;
          score cross-tenant attack cases in-repo or ingest suite results
          under imports/cross-tenant-tests/; require ≥10 cases, 0 leaks,
          measuredAt ≤90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest ≥10 automated
          cross-tenant attack cases on AI data/memory paths with 0
          successful unauthorized reads/writes (measuredAt ≤90 days).
manualVerification: >
  1) Confirm multi-tenant AI data or memory paths exist (chats, knowledge,
  files, vectors, memory, or equivalent). If none, score NOT_APPLICABLE.
  2) Inventory in-scope paths. 3) Confirm tenant isolation is enforced
  server-side on those paths. 4) Review ≥10 automated attack cases
  attempting unauthorized cross-tenant reads/writes: 0 successes. 5) PASS
  only if suite scope covers those AI data/memory paths and freshness holds
  (measuredAt ≤90 days). AUTHZ-M1 entry-point permission suites alone do
  not prove cross-tenant isolation. MEM-M1 memory-only suites alone do not
  prove broader AI data-path coverage required here when non-memory AI data
  paths are in scope. Isolation helpers in code without an attack suite do
  not satisfy. AUTHN-M1 unauthenticated probes alone do not satisfy.
falsePositiveGuidance: >
  Do not pass tenant filters in code without a ≥10-case attack suite. Do
  not pass empty inventories without an explicit N/A attest. Do not score
  AUTHZ-M1, AUTHN-M1, or a memory-only MEM-M1 suite as a full substitute
  when non-memory AI data paths are in scope. Named exceptions need owner
  and expiry ≤90 days.
recommendedFixes:
  - "Enforce tenant isolation on every multi-tenant AI data and memory path"
  - "Add ≥10 automated cross-tenant attack cases asserting deny on unauthorized reads/writes"
  - "Retain scored report under imports/cross-tenant-tests/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "OWASP Access Control Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html"
  - title: "OWASP API Security Top 10 — API1 Broken Object Level Authorization"
    url: "https://owasp.org/API-Security/"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "AUTHZ-M1"
  - "AUTHZ-M3"
  - "AUTHZ-M4"
  - "AUTHZ-R1"
  - "AUTHZ-R2"
  - "MEM-M1"
  - "AUTHN-M1"
tags:
  - "authorization"
  - "mandatory"
  - "hybrid"
  - "multi-tenant"
  - "cross-tenant"
  - "isolation"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
