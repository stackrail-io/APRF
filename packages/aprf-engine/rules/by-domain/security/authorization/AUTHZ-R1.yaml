id: "AUTHZ-R1"
category: "authorization"
title: "Production systems should have policy-as-code for tool and model access"
description: "Policy-as-code for tool and model access"
whyItMatters: "Policy-as-code for tool and model access Failing this leaves a production gap
  against: Tool and model access rules are expressed as code and enforced in CI or admission; last
  failing-to-passing policy change ≤90 days shows a deny for unauthorized tool/model"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Tool and model access rules are expressed as code and enforced in CI or admission;
  last failing-to-passing policy change ≤90 days shows a deny for unauthorized tool/model"
evidenceRequired:
  - "Policy-as-code repo/config for tool and model access (OPA/Cedar/IAM-as-code or equivalent) +
    latest CI policy-check report"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-policy-as-code"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Policy-as-code repo/config for tool and model access (OPA/Cedar/IAM-as-code or equivalent) +
          latest CI policy-check report"
manualVerification: "For this Check (Policy-as-code for tool and model access): inspect current
  evidence for [Policy-as-code repo/config for tool and model access (OPA/Cedar/IAM-as-code or
  equivalent) + latest CI policy-check report] and confirm the pass condition holds — Tool and model
  access rules are expressed as code and enforced in CI or admission; last failing-to-passing policy
  change ≤90 days shows a deny for unauthorized tool/model"
falsePositiveGuidance: "when automation and attestation disagree, prefer the stricter outcome until
  reconciled. Waive only with owner, expiry, and which signal covers the gap."
recommendedFixes:
  - "Implement and operationalize: this Check: Policy-as-code for tool and model access"
  - "Retain evidence artifacts required by this Check, starting with: Policy-as-code repo/config for
    tool and model access (OPA/Cedar/IAM-as-code or equivalent) + latest CI policy-check report"
  - "Wire or verify detectors declared on this Check so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Access Control Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "AUTHZ-M1"
  - "AUTHZ-M2"
  - "AUTHZ-M3"
  - "AUTHZ-M4"
  - "AUTHZ-R2"
tags:
  - "authorization"
  - "recommended"
  - "hybrid"
applicability:
  technologies:
    - "openapi"
    - "mcp"
    - "a2a"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
