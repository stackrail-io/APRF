id: "AUTHN-R2"
category: "authentication"
title: "Self-hosted model runtimes should authenticate with workload identity"
description: >
  Every self-hosted model runtime in production should authenticate via
  workload identity (SPIFFE, cloud IAM role, or equivalent)—so inference
  nodes and model servers do not rely on shared static keys.
whyItMatters: >
  Self-hosted runtimes that share static API keys or service passwords create
  a single stolen secret that impersonates the entire model plane. Binding
  each runtime to workload identity and proving 0 static shared keys in the
  inventory makes that assurance measurable. Distinct from AUTHN-M2 (MCP/S2S
  connection identity), AUTHN-R1 (short-lived agent/tool tokens in prompts),
  and REL-R6 (warm-standby capacity for self-hosted inference).
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  Every self-hosted model runtime in production authenticates via workload
  identity (SPIFFE/IAM role/equivalent); 0 static shared keys in the runtime
  inventory; sample authenticated calls (or harness) present (measuredAt ≤90
  days). If no self-hosted model runtimes exist, score NOT_APPLICABLE.
evidenceRequired:
  - "Inventory of self-hosted model runtimes in production"
  - "Workload-identity binding config per runtime (SPIFFE, IAM role, or equivalent)"
  - "Sample authenticated call traces (or harness) showing workload identity; 0 static shared keys"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-workload-identity-runtimes"
      params:
        hint: >
          Discover self-hosted runtime and workload-identity binding signals;
          ingest coverage under imports/workload-identity-runtimes/; require
          measuredAt ≤90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest every self-hosted model
          runtime uses workload identity and the inventory has 0 static shared
          keys (measuredAt ≤90 days).
manualVerification: >
  1) Confirm self-hosted model runtimes exist in production (vLLM, TGI,
  Triton, custom inference pods, or equivalent). If none (fully hosted
  providers only), score NOT_APPLICABLE. 2) Inventory those runtimes. 3)
  Confirm each binds to workload identity (SPIFFE/SPIRE, cloud IAM role,
  K8s service account + IRSA/Workload Identity, or equivalent)—not a shared
  static key. 4) Review sample authenticated calls or harness output; count
  static shared keys in the inventory = 0. 5) PASS only if inventory +
  workload identity + 0 static keys hold with measuredAt ≤90 days. AUTHN-M2
  MCP inventories alone do not prove inference-runtime identity. AUTHN-R1
  prompt-token TTL alone does not prove runtime workload identity. REL-R6
  warm-standby alone does not prove authentication binding.
falsePositiveGuidance: >
  Do not pass shared cluster secrets labeled “for the model.” Do not pass
  node IAM when the model process still presents a static API key to
  callers. Do not fail fully hosted (non-self-hosted) estates—use N/A.
  Do not score AUTHN-M2, AUTHN-R1, or REL-R6 as substitutes. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Bind every self-hosted model runtime to workload identity (SPIFFE/IAM role/equivalent)"
  - "Remove static shared keys from the runtime inventory"
  - "Retain inventory + binding + sample traces under imports/workload-identity-runtimes/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "SPIFFE — Secure Production Identity Framework For Everyone"
    url: "https://spiffe.io/"
  - title: "OWASP Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
  - title: "CIS Benchmarks — Identity controls"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "AUTHN-M1"
  - "AUTHN-M2"
  - "AUTHN-M3"
  - "AUTHN-M4"
  - "AUTHN-R1"
  - "REL-R6"
  - "INF-M3"
tags:
  - "authentication"
  - "recommended"
  - "hybrid"
  - "workload-identity"
  - "self-hosted"
  - "model-runtime"
applicability:
