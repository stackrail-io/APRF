id: "AUTHN-M3"
category: "authentication"
title: "Administrative access to AI control planes must require strong authentication including MFA"
description: "Administrative access to AI control planes shall require strong authentication including MFA"
whyItMatters: "Administrative access to AI control planes shall require strong authentication
  including MFA Failing this leaves a production gap against: 100% of AI control-plane admin roles
  enforce MFA; break-glass accounts ≤ documented maximum and have monitoring enabled"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of AI control-plane admin roles enforce MFA; break-glass accounts ≤ documented
  maximum and have monitoring enabled"
evidenceRequired:
  - "IdP MFA policy export for AI admin roles + break-glass account inventory with monitoring"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "IdP MFA policy export for AI admin roles + break-glass account inventory with monitoring"
manualVerification: "For this Check (Administrative access to AI control planes must require strong
  authentication including MFA): inspect current evidence for [IdP MFA policy export for AI admin
  roles + break-glass account inventory with monitoring] and confirm the pass condition holds — 100%
  of AI control-plane admin roles enforce MFA; break-glass accounts ≤ documented maximum and have
  monitoring enabled"
falsePositiveGuidance: "re-verify against a current artifact for this specific Check , not a sibling
  control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Administrative access to AI control planes must require strong
    authentication including MFA"
  - "Retain evidence artifacts required by this Check, starting with: IdP MFA policy export for AI
    admin roles + break-glass account inventory with monitoring"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
  - title: "CIS Benchmarks — Identity controls"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "AUTHN-M1"
  - "AUTHN-M2"
  - "AUTHN-M4"
  - "AUTHN-R1"
  - "AUTHN-R2"
tags:
  - "authentication"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "mcp"
    - "a2a"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
