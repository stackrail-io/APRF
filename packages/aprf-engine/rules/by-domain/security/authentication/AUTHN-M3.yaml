id: "AUTHN-M3"
category: "authentication"
title: "Administrative access to AI control planes must require strong authentication including MFA"
description: >
  Administrative access to AI control planes shall require strong
  authentication including MFA—so operators who can change prompts, tools,
  models, or deployments cannot rely on password-only or shared credentials.
whyItMatters: >
  Control-plane admin roles without MFA are a single stolen password away from
  rewriting production AI behavior. A fresh IdP MFA export plus a bounded,
  monitored break-glass inventory makes the assurance measurable. Distinct
  from AUTHN-M1 (customer-facing API unauthenticated rejection), AUTHN-M2
  (MCP/S2S machine identity), and AUTHN-M4 (end-user subject propagation
  through agent/tool hops).
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  100% of AI control-plane admin roles enforce MFA; break-glass accounts ≤
  documented maximum and have monitoring enabled (measuredAt ≤90 days). If
  no AI control-plane admin access exists, score NOT_APPLICABLE.
evidenceRequired:
  - "IdP MFA policy export covering AI control-plane admin roles"
  - "Break-glass account inventory with documented maximum"
  - "Evidence break-glass accounts have monitoring/alerting enabled"
evidencePolicy:
  minimumTier: E3
  acceptableEvidence:
    - application_logs
    - cloud_audit_logs
    - repo_signal
    - policy_scan_report
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-admin-mfa"
      params:
        hint: >
          Discover IdP/MFA policy and break-glass inventory signals; ingest
          MFA coverage + break-glass counts/monitoring under
          imports/ai-admin-mfa/; require measuredAt ≤90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of AI control-plane
          admin roles enforce MFA and break-glass accounts are ≤ documented
          maximum with monitoring enabled (measuredAt ≤90 days).
manualVerification: >
  1) Confirm AI control-plane admin access exists (prompt/model/tool/deploy
  consoles or equivalent). If none, score NOT_APPLICABLE. 2) Obtain an IdP
  MFA policy export for those admin roles—password-only fails. 3) Inventory
  break-glass accounts: count ≤ documented maximum; each has monitoring or
  alerting enabled. 4) PASS only if MFA=100% on admin roles + break-glass
  bound + monitoring hold with measuredAt ≤90 days. AUTHN-M1 HTTP probes
  alone do not prove admin MFA. AUTHN-M2 MCP inventories alone do not prove
  human admin MFA. AUTHN-M4 subject propagation alone does not prove admin
  MFA. Org-wide MFA without AI control-plane role mapping does not satisfy.
falsePositiveGuidance: >
  Do not pass generic org MFA without AI control-plane role coverage. Do not
  pass unlimited or unmonitored break-glass accounts. Do not pass code
  comments about MFA without an IdP export or equivalent. Do not score
  AUTHN-M1, AUTHN-M2, or AUTHN-M4 as substitutes. Named exceptions need
  owner and expiry ≤90 days.
recommendedFixes:
  - "Enforce MFA on every AI control-plane admin role in the IdP"
  - "Cap break-glass accounts at a documented maximum with monitoring/alerting"
  - "Retain MFA + break-glass evidence under imports/ai-admin-mfa/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "OWASP Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
  - title: "NIST SP 800-63B — Digital Identity Guidelines (Authentication)"
    url: "https://pages.nist.gov/800-63-3/sp800-63b.html"
  - title: "CIS Benchmarks — Identity controls"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "AUTHN-M1"
  - "AUTHN-M2"
  - "AUTHN-M4"
  - "AUTHN-R1"
  - "AUTHN-R2"
  - "AUTHZ-M1"
tags:
  - "authentication"
  - "mandatory"
  - "hybrid"
  - "mfa"
  - "control-plane"
  - "break-glass"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
