id: "AUTHN-M4"
category: "authentication"
title: "End-user identity must remain bound through agent and tool chains"
description: "End-user identity shall remain bound through agent and tool chains"
whyItMatters: "End-user identity shall remain bound through agent and tool chains Failing this
  leaves a production gap against: PASS if 100% of sampled privileged tool calls in the latest
  review carry an end-user (or documented service) subject; 0 anonymous privileged hops"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "PASS if 100% of sampled privileged tool calls in the latest review carry an end-user
  (or documented service) subject; 0 anonymous privileged hops"
evidenceRequired:
  - "Identity-propagation design + sample traces showing end-user subject on tool calls"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Identity-propagation design + sample traces showing end-user subject on tool calls"
manualVerification: "For this Check (End-user identity must remain bound through agent and tool
  chains): inspect current evidence for [Identity-propagation design + sample traces showing
  end-user subject on tool calls] and confirm the pass condition holds — PASS if 100% of sampled
  privileged tool calls in the latest review carry an end-user (or documented service) subject; 0
  anonymous privileged hops"
falsePositiveGuidance: "re-verify against a current artifact for this specific Check , not a sibling
  control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: End-user identity must remain bound through agent and tool chains"
  - "Retain evidence artifacts required by this Check, starting with: Identity-propagation design +
    sample traces showing end-user subject on tool calls"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
  - title: "CIS Benchmarks — Identity controls"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "AUTHN-M1"
  - "AUTHN-M2"
  - "AUTHN-M3"
  - "AUTHN-R1"
  - "AUTHN-R2"
tags:
  - "authentication"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "mcp"
    - "a2a"
    - "cicd"
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
