id: "AUTHN-M1"
category: "authentication"
title: "Customer-facing AI APIs must reject unauthenticated callers"
description: "Customer-facing AI APIs shall reject unauthenticated callers"
whyItMatters: "Customer-facing AI APIs shall reject unauthenticated callers Failing this leaves a
  production gap against: 100% of probed production AI endpoints return 401/403 without valid
  credentials; probe inventory matches production route catalog"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of probed production AI endpoints return 401/403 without valid credentials;
  probe inventory matches production route catalog"
evidenceRequired:
  - "Automated auth probe report covering all production AI HTTP/RPC routes"
detection:
  capability: "automated"
  detectors:
    - id: "http-auth-probe"
      params:
        expectStatus:
          - 401
          - 403
manualVerification: "For this Check (Customer-facing AI APIs must reject unauthenticated callers):
  inspect current evidence for [Automated auth probe report covering all production AI HTTP/RPC
  routes] and confirm the pass condition holds — 100% of probed production AI endpoints return
  401/403 without valid credentials; probe inventory matches production route catalog"
falsePositiveGuidance: "confirm the detector target matches the production path for this Check
  before waiving. Named exceptions need an owner and expiry ≤90 days."
recommendedFixes:
  - "Implement and operationalize: Customer-facing AI APIs must reject unauthenticated callers"
  - "Retain evidence artifacts required by this Check, starting with: Automated auth probe report
    covering all production AI HTTP/RPC routes"
  - "Wire or verify detectors declared on this Check so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
  - title: "CIS Benchmarks — Identity controls"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "AUTHN-M2"
  - "AUTHN-M3"
  - "AUTHN-M4"
  - "AUTHN-R1"
  - "AUTHN-R2"
tags:
  - "authentication"
  - "mandatory"
  - "automated"
applicability:
  technologies:
    - "openapi"
    - "mcp"
    - "a2a"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
