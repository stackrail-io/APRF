id: "SCI-M1"
category: "supply-chain"
title: "Production model and container artifacts must have verified provenance/integrity"
description: >
  Production model and container artifacts shall have verified
  provenance/integrity—proven by signature, attestation, or digest
  verification with unverified pulls blocked, not by digest pins in Dockerfiles
  alone.
whyItMatters: >
  Unsigned or unattested model weights and container images let supply-chain
  tampering reach production silently. Cosign/Notation signatures, SLSA/OCI
  provenance, and model checksum validation—with measured 100% verified pulls
  and blocked unverified pulls—make integrity enforceable. Distinct from
  SCI-M2 (external AI tool / MCP / plugin inventory pins + review), SCI-M3
  (vuln scan gates on production AI artifacts/deps/runtimes), and MOD-R3
  (model license/provenance review—policy review, not pull-time
  verify/block).
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Provenance/integrity verification is configured for production model and/or
  container artifacts (signature, attestation, OCI provenance, and/or checksum/
  digest); 100% of production model/container pulls in the sample window verify
  against expected digest or signature; unverified pulls are blocked
  (measuredAt ≤90 days). If no production model or container artifacts are
  pulled, score NOT_APPLICABLE.
evidenceRequired:
  - "Signature / attestation / provenance / checksum verification config (cosign, Notation, SLSA, OCI, or equivalent)"
  - "Digest or signature verification logs for production model/container pulls in the sample window"
  - "Proof unverified pulls are blocked (admission policy, registry policy, or deploy gate; measuredAt ≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-artifact-provenance-integrity"
      params:
        hint: >
          Discover cosign/Notation/SLSA/OCI/checksum/digest-pin signals; ingest
          coverage under imports/artifact-provenance-integrity/; require
          verification config (or present=true),
          productionPullsVerifiedAgainstDigestOrSignaturePct=100,
          unverifiedPullsBlocked=true, measuredAt ≤90 days.
    - id: "artifact-signature-verification"
      params:
        hint: Generic artifact signature verification policy or verify logs for production pulls.
    - id: "cosign-verification"
      params:
        hint: Cosign sign/verify, keyless OIDC, or policy-controller evidence for images/models.
    - id: "notation-verification"
      params:
        hint: Notation / ORAS signature verification trust policy for OCI artifacts.
    - id: "slsa-attestation"
      params:
        hint: SLSA provenance attestations verified at deploy/admit (in-toto / SLSA verifier).
    - id: "oci-provenance"
      params:
        hint: OCI referrers / provenance artifacts attached and verified for production images.
    - id: "model-checksum-validation"
      params:
        hint: Model weight/artifact checksum or digest validation before load or promote.
    - id: "docker-image-digest-pinned"
      params:
        hint: Supporting signal — digest-pinned image refs; alone does not satisfy verify+block.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest verification config plus
          100% verified production pulls and blocked unverified pulls
          (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production pulls model weights and/or container images. If none,
  score NOT_APPLICABLE. 2) Locate verification config (cosign, Notation, SLSA
  attestation, OCI provenance, model checksum, or equivalent). 3) Review
  verification logs for the sample window: 100% of production pulls verify
  against expected digest or signature. 4) Confirm unverified pulls are
  blocked (admission/registry/deploy gate). 5) PASS only if config + 100%
  verified + block hold with measuredAt ≤90 days. Dockerfile digest pins
  alone do not prove runtime verification. SCI-M2 AI-tool/MCP/plugin inventory
  pins alone do not prove artifact signatures. MOD-R3 license reviews alone do
  not prove pull-time verify/block.
falsePositiveGuidance: >
  Do not pass digest pins without verification logs and a block on unverified
  pulls. Do not pass signing in CI without admit/deploy verification. Do not
  pass SBOM generation alone as provenance verification. Do not score SCI-M2,
  SCI-M3, or MOD-R3 as substitutes. Named exceptions need owner and expiry ≤90
  days.
recommendedFixes:
  - "Sign model/container artifacts (cosign, Notation, or equivalent) and verify at pull/admit"
  - "Attach and verify SLSA/OCI provenance; validate model checksums before load"
  - "Block unverified pulls; retain coverage under imports/artifact-provenance-integrity/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "SLSA — Supply-chain Levels for Software Artifacts"
    url: "https://slsa.dev/"
  - title: "Sigstore Cosign"
    url: "https://docs.sigstore.dev/cosign/overview/"
  - title: "Notary Project — Notation"
    url: "https://notaryproject.dev/"
  - title: "CNCF Software Supply Chain Best Practices"
    url: "https://www.cncf.io/"
  - title: "OWASP LLM — Supply Chain Vulnerabilities"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "SCI-M2"
  - "SCI-M3"
  - "SCI-M4"
  - "SCI-R1"
  - "SCI-R2"
  - "MOD-R3"
  - "INF-M2"
tags:
