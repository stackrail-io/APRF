id: "SCI-R1"
category: "supply-chain"
title: "Production systems should verify signed model/container artifacts on
  deploy (SLSA-aligned)"
description: >
  Production model and container (or equivalent AI package) deploys should
  verify signatures or attestations at deploy/promote time and reject unsigned
  artifacts—proven by the last successful verified deploy plus a recorded
  unsigned-reject test or canary, not by CI signing or digest pins alone.
whyItMatters: >
  Signing in CI without verify-on-deploy still lets an unsigned image or model
  package reach production. A measured last deploy that verified the signature
  (or attestation) plus a recorded reject of an unsigned artifact closes that
  gap for Level-4 maturity. Distinct from SCI-M1 (mandatory pull-time
  provenance/integrity verify+block), SCI-M4 (Level-5 deploy-path policy that
  also blocks unapproved and revoked/untrusted signatures with full deny
  logs), SCI-M3 (vuln scan gates), and SCI-R2 (MBOM retention).
severity: "critical"
weight: 4
gate: "recommended"
passCondition: >
  The last production model/container (or equivalent AI package) deploy
  verified a signature or attestation successfully; an unsigned artifact is
  rejected in a recorded test, canary, or deny log within 90 days (evidence
  measuredAt ≤90 days). If no production model/container AI artifacts are
  deployed, score NOT_APPLICABLE.
evidenceRequired:
  - "Verify-on-deploy / promote-path policy or gate for signed model/container (or equivalent AI package) artifacts"
  - "Last production deploy verification log showing signature or attestation success"
  - "Recorded test, canary, or deny log showing an unsigned artifact was rejected (within 90 days; measuredAt ≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-verify-on-deploy"
      params:
        hint: >
          Discover verify-on-deploy / promote-path signature or attestation
          checks (pipeline gates, registry policies, cloud deploy policies,
          admission controllers, or AI-platform gates); ingest coverage under
          imports/ai-verify-on-deploy/; require lastDeployVerified=true,
          unsignedRejectedInTestOrCanary=true, measuredAt ≤90 days.
    - id: "cosign-verification"
      params:
        hint: >
          Supporting signal — Cosign verify/policy evidence; alone does not
          prove last production deploy verified or unsigned reject test.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest last production deploy
          verified signature/attestation and an unsigned reject test or deny
          log within 90 days (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production deploys model/container (or equivalent AI package)
  artifacts. If none, score NOT_APPLICABLE. 2) Locate verify-on-deploy or
  promote-path policy (pipeline gate, registry policy, cloud deploy policy,
  admission controller, or AI-platform gate)—not CI signing alone. 3) Review
  the last production deploy log: signature or attestation verification
  succeeded. 4) Confirm an unsigned artifact was rejected in a recorded test,
  canary, or deny log within 90 days (measuredAt ≤90 days). 5) PASS only if
  last verified deploy + unsigned reject hold. SCI-M1 pull-time verify metrics
  alone do not prove deploy-path verification. Digest pins alone do not
  satisfy. SCI-M4 Level-5 unapproved/revoked matrix is stronger and
  substitutes for this recommended Check when fully met; do not require
  Kyverno specifically.
falsePositiveGuidance: >
  Do not pass CI cosign/sign jobs without deploy-path verification. Do not
  pass Dockerfile digest pins as verify-on-deploy. Do not pass SCI-M1
  pull-sample metrics as a substitute for last-deploy verification. Do not
  require Kubernetes admission when an equivalent pipeline/cloud/registry/
  platform gate is proven. Do not score SCI-M3 or SCI-R2 as substitutes. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Add verify-on-deploy / promote-path checks for signed model/container (or equivalent AI package) artifacts"
  - "Record last successful verified production deploy; run an unsigned-reject test or canary"
  - "Retain evidence under imports/ai-verify-on-deploy/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days; plan Level-5 SCI-M4 when ready for full deploy-policy enforcement"
references:
  - title: "SLSA — Supply-chain Levels for Software Artifacts"
    url: "https://slsa.dev/"
  - title: "Sigstore Cosign"
    url: "https://docs.sigstore.dev/cosign/overview/"
  - title: "CNCF Software Supply Chain Best Practices"
    url: "https://www.cncf.io/"
  - title: "OWASP LLM — LLM03 Supply Chain"
    url: "https://genai.owasp.org/llmrisk/llm032025-supply-chain/"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
