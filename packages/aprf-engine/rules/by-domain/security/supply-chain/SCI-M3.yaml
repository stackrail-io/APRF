id: "SCI-M3"
category: "supply-chain"
title: "Dependency, container image, and AI runtime vulnerability scanning gates
  must apply before production deployment"
description: >
  Production AI artifacts—including language dependencies, OCI/container
  images, serverless packages, and model-serving runtimes—shall be scanned
  for vulnerabilities before promotion, with organization-defined critical
  findings blocking deploy unless waived with owner and expiry—not by
  scanning app deps while skipping inference servers or CUDA stacks.
whyItMatters: >
  Unscanned AI runtimes and model-serving stacks (vLLM, TGI, Triton, Ollama,
  llama.cpp, TensorRT, CUDA libraries, and language deps) ship known
  exploits into production. Org-policy critical gates (CVSS, EPSS, CISA KEV,
  reachability, exploit maturity, or equivalent)—with retained scan results
  and no skipped scans—make promotion hygiene measurable. Distinct from
  SCI-M1 (provenance/signature verify+block), SCI-M2 (AI-tool/MCP/plugin
  inventory pins + review), SCI-M4 (Level-5 deploy-path policy blocking
  unsigned/unapproved/revoked artifacts), and SCI-R1 (recommended
  verify-on-deploy for lower maturity).
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  100% of production AI artifacts in the sample window (language
  dependencies, OCI/container images, serverless packages, and model-serving
  runtimes including inference servers and accelerator libraries in scope)
  were vulnerability-scanned with no skipped scans; findings that are
  critical per organizational policy block promotion unless waived with
  named owner and expiry ≤14 days; scan results are retained (evidence
  measuredAt ≤90 days). If no production AI artifacts are built or
  deployed, score NOT_APPLICABLE.
evidenceRequired:
  - "Vulnerability scanner config covering production AI artifacts (deps, containers/serverless packages, model-serving runtimes)"
  - "CI/CD or promote-path gate that blocks critical findings per org policy (CVSS, EPSS, CISA KEV, reachability, exploit maturity, or equivalent)"
  - "Retained scan results for the sample window showing 100% coverage and 0 skipped scans (measuredAt ≤90 days)"
  - "Waiver records for any critical exceptions (owner + expiry ≤14 days), or proof none were granted"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-vuln-scan-gate"
      params:
        hint: >
          Discover vuln-scan and promote-gate config for AI deps, images,
          serverless packages, and model-serving runtimes (vLLM, TGI, Triton,
          Ollama, llama.cpp, TensorRT, CUDA, etc.); ingest coverage under
          imports/ai-vuln-scan-gate/; require scan coverage 100%,
          criticalFindingsBlockPromotion=true (org policy),
          skippedScans=0, retainedResults=true, measuredAt ≤90 days.
    - id: "repo-vuln-scan-config"
      params:
        hint: >
          Supporting signal — dependency/image vuln scanner config in repo
          or CI; alone does not prove 100% AI-artifact coverage, model-serving
          runtime inclusion, or blocked critical promotes.
    - id: "repo-dependency-update-config"
      params:
        hint: >
          Supporting signal — Dependabot/Renovate/equivalent update automation;
          alone does not prove vuln scan gates or critical-block policy.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% scan coverage of
          production AI artifacts (deps, containers/serverless, model-serving
          runtimes), org-policy critical block on promote, retained results,
          0 skipped scans, and waiver owner+expiry ≤14 days where used
          (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI artifacts exist (language deps, OCI/container
  images, serverless packages, and/or model-serving runtimes such as vLLM,
  TGI, Triton, Ollama, llama.cpp, TensorRT, CUDA stacks). If none, score
  NOT_APPLICABLE. 2) Confirm scanner config covers those artifacts—not only
  app deps while omitting inference servers. 3) Confirm the promote path
  blocks findings that are critical per organizational policy (document the
  policy: CVSS and/or EPSS, CISA KEV, reachability, exploit maturity, or
  equivalent—do not require a fixed CVSS ≥9.0). 4) Review retained scan
  results for the sample window: 100% coverage, 0 skipped scans; any critical
  waivers have owner and expiry ≤14 days (measuredAt ≤90 days). 5) PASS only
  if coverage + critical-block + retention + no skips hold. SCI-M1 signature
  verify alone does not prove vuln scanning. SCI-M2 inventory pins alone do
  not prove scan gates. SCI-M4 deploy-path unsigned/unapproved blocks alone
  do not prove CVE/policy gates.
falsePositiveGuidance: >
  Do not pass scanners that cover only application npm/pip deps while
  omitting model-serving runtimes or CUDA/inference images. Do not pass
  Dependabot/Renovate without a blocking promote gate. Do not require CVSS
  ≥9.0 when org policy uses EPSS/KEV/reachability instead—and do not pass
  “informational” scans with no block. Do not pass skipped or optional scan
  jobs as 100% coverage. Do not score SCI-M1, SCI-M2, SCI-M4, or SCI-R1 as
  substitutes. Named exceptions need owner and expiry ≤90 days (critical
  promote waivers ≤14 days).
recommendedFixes:
  - "Enable vulnerability scanning for production AI artifacts: language deps, containers/serverless packages, and model-serving runtimes (vLLM/TGI/Triton/Ollama/llama.cpp/TensorRT/CUDA as applicable)"
  - "Block promotion on org-policy critical findings; document the policy (CVSS/EPSS/KEV/reachability/exploit maturity)"
  - "Retain scan results; forbid skipped scans; time-box critical waivers (owner + expiry ≤14 days) under imports/ai-vuln-scan-gate/ (measuredAt ≤90 days)"
  - "Time-box other gaps with owner and expiry ≤90 days"
references:
  - title: "SLSA — Supply-chain Levels for Software Artifacts"
    url: "https://slsa.dev/"
  - title: "CNCF Software Supply Chain Best Practices"
    url: "https://www.cncf.io/"
