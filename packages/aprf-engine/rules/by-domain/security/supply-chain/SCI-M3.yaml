id: "SCI-M3"
category: "supply-chain"
title: "Dependency and image vulnerability scanning gates must apply to AI runtimes"
description: "Dependency and image vulnerability scanning gates shall apply to AI runtimes"
whyItMatters: "Dependency and image vulnerability scanning gates shall apply to AI runtimes Failing
  this leaves a production gap against: 100% of AI runtime image builds in the last 30 days ran
  vulnerability scan; critical CVEs (CVSS ≥ 9.0 or org policy equivalent) block promote unless
  waived with expiry ≤ 14 days"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of AI runtime image builds in the last 30 days ran vulnerability scan; critical
  CVEs (CVSS ≥ 9.0 or org policy equivalent) block promote unless waived with expiry ≤ 14 days"
evidenceRequired:
  - "Scanner config + CI gate reports for AI runtime images/deps"
detection:
  capability: "automated"
  detectors:
    - id: "repo-vuln-scan-config"
      params: {}
    - id: "repo-dependency-update-config"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Scanner config + CI gate reports for AI runtime images/deps"
manualVerification: "For this Check (Dependency and image vulnerability scanning gates must apply to
  AI runtimes): inspect current evidence for [Scanner config + CI gate reports for AI runtime
  images/deps] and confirm the pass condition holds — 100% of AI runtime image builds in the last 30
  days ran vulnerability scan; critical CVEs (CVSS ≥ 9.0 or org policy equivalent) block promote
  unless waived with expiry ≤ 14 days"
falsePositiveGuidance: "(Supply Chain Integrity): confirm the detector target matches the production
  path for this Check before waiving. Named exceptions need an owner and expiry ≤90 days."
recommendedFixes:
  - "Implement and operationalize: Dependency and image vulnerability scanning gates must apply to
    AI runtimes"
  - "Retain evidence artifacts required by this Check, starting with: Scanner config + CI gate
    reports for AI runtime images/deps"
  - "Wire or verify detectors declared on this Check so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "SLSA — Supply-chain Levels for Software Artifacts"
    url: "https://slsa.dev/"
  - title: "CNCF Software Supply Chain Best Practices"
    url: "https://www.cncf.io/"
  - title: "OWASP LLM — Supply Chain Vulnerabilities"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "SCI-M1"
  - "SCI-M2"
  - "SCI-M4"
  - "SCI-R1"
  - "SCI-R2"
tags:
  - "supply-chain"
  - "mandatory"
  - "automated"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "cicd"
    - "docker"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
