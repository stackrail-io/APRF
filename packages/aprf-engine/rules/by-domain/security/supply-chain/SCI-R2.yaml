id: "SCI-R2"
category: "supply-chain"
title: "Production systems should have machine-readable model bill of materials (MBOM) for
  production models"
description: "Machine-readable model bill of materials (MBOM) for production models"
whyItMatters: "Machine-readable model bill of materials (MBOM) for production models Failing this
  leaves a production gap against: 100% of production model pins have an MBOM/SBOM artifact retained
  ≥90 days and linked from the model registry entry"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "100% of production model pins have an MBOM/SBOM artifact retained ≥90 days and
  linked from the model registry entry"
evidenceRequired:
  - "Machine-readable MBOM (or SBOM+model metadata) for each production model pin + retention
    location"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-sbom-config"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Machine-readable MBOM (or SBOM+model metadata) for each production model pin + retention
          location"
manualVerification: "For this Check (SCI: Machine-readable model bill of materials (MBOM) for
  production models): inspect current evidence for [Machine-readable MBOM (or SBOM+model metadata)
  for each production model pin + retention location] and confirm the pass condition holds — 100% of
  production model pins have an MBOM/SBOM artifact retained ≥90 days and linked from the model
  registry entry"
falsePositiveGuidance: "(Supply Chain Integrity): when automation and attestation disagree, prefer
  the stricter outcome until reconciled. Waive only with owner, expiry, and which signal covers the
  gap."
recommendedFixes:
  - "Implement and operationalize: this Check: Machine-readable model bill of materials (MBOM) for
    production models"
  - "Retain evidence artifacts required by this Check, starting with: Machine-readable MBOM (or
    SBOM+model metadata) for each production model pin + retention location"
  - "Wire or verify detectors declared on this Check so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "SLSA — Supply-chain Levels for Software Artifacts"
    url: "https://slsa.dev/"
  - title: "CNCF Software Supply Chain Best Practices"
    url: "https://www.cncf.io/"
  - title: "OWASP LLM — Supply Chain Vulnerabilities"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "SCI-M1"
  - "SCI-M2"
  - "SCI-M3"
  - "SCI-M4"
  - "SCI-R1"
tags:
  - "supply-chain"
  - "recommended"
  - "hybrid"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "cicd"
    - "docker"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
