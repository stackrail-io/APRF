id: "SEC2-R1"
category: "secrets"
title: "Production systems should have pre-commit and CI secret scanning including prompt/fixture files"
description: "Pre-commit and CI secret scanning including prompt/fixture files"
whyItMatters: "Pre-commit and CI secret scanning including prompt/fixture files Failing this leaves
  a production gap against: Secret scanning covers application code, prompts, and fixtures; blocking
  on high-confidence secrets; last green main-branch scan ≤7 days (or last PR merge evidence)"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Secret scanning covers application code, prompts, and fixtures; blocking on
  high-confidence secrets; last green main-branch scan ≤7 days (or last PR merge evidence)"
evidenceRequired:
  - "Pre-commit + CI secret-scan config including prompt/fixture globs + latest scan report with
    findings disposition"
detection:
  capability: "automated"
  detectors:
    - id: "repo-secret-scan-config"
      params: {}
    - id: "repo-pre-commit-config"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Pre-commit + CI secret-scan config including prompt/fixture globs + latest scan report with
          findings disposition"
manualVerification: "For this Check (Pre-commit and CI secret scanning including prompt/fixture
  files): inspect current evidence for [Pre-commit + CI secret-scan config including prompt/fixture
  globs + latest scan report with findings disposition] and confirm the pass condition holds —
  Secret scanning covers application code, prompts, and fixtures; blocking on high-confidence
  secrets; last green main-branch scan ≤7 days (or last PR merge evidence)"
falsePositiveGuidance: "confirm the detector target matches the production path for this Check
  before waiving. Named exceptions need an owner and expiry ≤90 days."
recommendedFixes:
  - "Implement and operationalize: this Check: Pre-commit and CI secret scanning including
    prompt/fixture files"
  - "Retain evidence artifacts required by this Check, starting with: Pre-commit + CI secret-scan
    config including prompt/fixture globs + latest scan report with findings disposition"
  - "Wire or verify detectors declared on this Check so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "SEC2-M1"
  - "SEC2-M2"
  - "SEC2-M3"
  - "SEC2-R2"
  - "SEC2-R3"
tags:
  - "secrets"
  - "recommended"
  - "automated"
applicability:
  technologies:
    - "github"
    - "cicd"
    - "prompt-templates"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
