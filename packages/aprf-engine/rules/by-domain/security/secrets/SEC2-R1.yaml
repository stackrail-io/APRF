  - "SEC2-M2"
  - "SEC2-M3"
  - "SEC2-R2"
  - "SEC2-R3"
  - "DX-M2"
  - "PRM-R2"
tags:
  - "secrets"
  - "recommended"
  - "hybrid"
  - "secret-scan"
  - "pre-commit"
  - "ci"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
