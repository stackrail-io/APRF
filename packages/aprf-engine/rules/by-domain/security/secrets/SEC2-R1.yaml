id: "SEC2-R1"
category: "secrets"
title: "Production systems should have pre-commit and CI secret scanning including
  prompt/fixture files"
description: >
  Pre-commit and CI secret scanning shall cover application code, prompts, and
  fixtures and block on high-confidence secrets—proven by scanner config plus a
  fresh green main-branch (or PR-merge) scan ≤7 days, not by a secrets-manager
  or a single ≤90-day content scan alone.
whyItMatters: >
  Secret scanners that skip prompts/fixtures or never block allow credentials to
  land on main. Dual pre-commit + CI gates with prompt/fixture coverage and a
  ≤7-day green scan make the control operational. Distinct from SEC2-M1
  (secrets-manager wiring + 0 privileged findings ≤90 days), DX-M2 (AI paved-road
  pipeline gates including auth/eval), and PRM-R2 (prompt-lint rules, not
  secret scanners).
severity: "critical"
weight: 4
gate: "recommended"
passCondition: >
  Pre-commit and CI secret scanning are configured; both cover application
  code, prompts, and fixtures; scanning blocks on high-confidence secrets; the
  latest green main-branch scan (or last PR-merge scan evidence) is ≤7 days
  (measuredAt ≤7 days). If no application code, prompts, or fixtures exist,
  score NOT_APPLICABLE.
evidenceRequired:
  - "Pre-commit secret-scan hook/config covering prompts and fixtures"
  - "CI secret-scan workflow covering prompts and fixtures"
  - "Proof scanning blocks on high-confidence secrets"
  - "Latest green main-branch or PR-merge secret-scan evidence (measuredAt ≤7 days)"
evidencePolicy:
  minimumTier: E3
  acceptableEvidence:
    - repo_signal
    - policy_scan_report
    - cloud_audit_logs
    - application_logs
    - cloud_configuration
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-precommit-ci-secret-scan"
      params:
        hint: >
          Discover pre-commit and CI secret-scan configs (prompt/fixture
          coverage, blocking); ingest coverage under
          imports/precommit-ci-secret-scan/; require pre-commit + CI
          configured (or present=true), secretScanCoversPromptsAndFixtures,
          blocksOnHighConfidenceSecrets,
          lastGreenMainBranchOrPrMergeScanWithin7Days, measuredAt ≤7 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest pre-commit + CI secret
          scanning covering prompts/fixtures, blocking on high-confidence
          secrets, and a green main-branch or PR-merge scan ≤7 days
          (measuredAt ≤7 days).
manualVerification: >
  1) Confirm application code, prompts, or fixtures exist. If none, score
  NOT_APPLICABLE. 2) Confirm a pre-commit secret-scan hook/config. 3) Confirm
  a CI secret-scan workflow. 4) Confirm both cover prompts and fixtures
  (required—do not PASS from app-code-only globs). 5) Confirm the scanner
  blocks on high-confidence secrets. 6) Review the latest green main-branch
  (or PR-merge) scan ≤7 days. 7) PASS only if pre-commit + CI + coverage +
  blocking + fresh green scan hold. SEC2-M1 secrets-manager / ≤90-day content
  scan alone does not prove dual gates or ≤7-day freshness. DX-M2 AI pipeline
  gates alone do not prove prompt/fixture secret-scan coverage.
falsePositiveGuidance: >
  Do not pass CI secret-scan config without a ≤7-day green main/PR-merge
  report. Do not pass pre-commit alone without CI (or vice versa). Do not pass
  scanners that exclude prompts/fixtures. Do not score SEC2-M1, DX-M2, or
  PRM-R2 as substitutes. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Add pre-commit and CI secret scanning (gitleaks, trufflehog, detect-secrets, or equivalent) covering prompts and fixtures"
  - "Configure blocking on high-confidence secrets; retain last green main/PR-merge evidence ≤7 days"
  - "Retain coverage under imports/precommit-ci-secret-scan/ (measuredAt ≤7 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
  - title: "gitleaks"
    url: "https://github.com/gitleaks/gitleaks"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
