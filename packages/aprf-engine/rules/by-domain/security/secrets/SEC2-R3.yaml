id: "SEC2-R3"
category: "secrets"
title: "Production systems should have dataset scanning before fine-tuning or eval
  corpus publish"
description: >
  Fine-tune and eval corpora shall be scanned for secrets/PII before publish—
  proven by a publish-blocking scan gate plus linked scan reports for 100% of
  corpora published in the last 90 days, not by dataset cards or repo secret
  scanning alone.
whyItMatters: >
  Fine-tune and eval corpora that ship with embedded secrets or PII poison
  models and leak credentials into training/eval artifacts. A gate that blocks
  publish on critical findings, with linked scan reports for every recent
  publish, makes hygiene measurable. Distinct from SEC2-R1 (pre-commit/CI scan
  of code/prompts/fixtures), SEC2-M1 (secrets-manager + source/prompt content
  scans), DG-M2 (provenance/quality criteria), and DG-R3 (dataset cards with
  purpose/source/PII handling fields—documentation, not a scan gate).
severity: "critical"
weight: 4
gate: "recommended"
passCondition: >
  A secret/PII scan gate is configured before fine-tune or eval corpus publish;
  publish is blocked when critical findings are open; 100% of fine-tune/eval
  corpora published in the last 90 days have a linked scan report (measuredAt
  ≤90 days). If no fine-tune or eval corpus publish exists, score
  NOT_APPLICABLE.
evidenceRequired:
  - "Dataset secret/PII scan gate config before fine-tune or eval corpus publish"
  - "Proof publish is blocked when critical findings are open"
  - "Linked scan reports covering 100% of fine-tune/eval corpora published in the last 90 days (measuredAt ≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-dataset-secret-scan-gate"
      params:
        hint: >
          Discover dataset secret/PII scan-gate and publish-block signals;
          ingest coverage under imports/dataset-secret-scan-gate/; require gate
          config (or present=true), publishBlockedWhenCriticalFindingsOpen,
          fineTuneOrEvalCorporaPublishedInLast90DaysWithLinkedScanReportPct=100,
          measuredAt ≤90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest a secret/PII scan gate
          before fine-tune/eval corpus publish, blocking on critical findings,
          and linked scan reports for 100% of corpora published in the last 90
          days (measuredAt ≤90 days).
manualVerification: >
  1) Confirm fine-tune or eval corpus publish exists. If none, score
  NOT_APPLICABLE. 2) Locate a secret/PII scan gate before publish (required—do
  not PASS from a single sample scan report alone). 3) Confirm publish is
  blocked when critical findings are open. 4) Inventory corpora published in
  the last 90 days; confirm 100% have a linked scan report (measuredAt ≤90
  days). 5) PASS only if gate + blocking + 100% linked reports hold. SEC2-R1
  code/prompt scanners alone do not prove corpus publish gates. DG-M2
  provenance cards alone do not prove secret/PII scanning. DG-R3 PII-handling
  fields on cards alone do not prove a blocking scan gate.
falsePositiveGuidance: >
  Do not pass dataset cards without a scan gate and linked reports. Do not
  pass a gate config without 100% coverage of recent publishes. Do not pass
  scanners that only cover application code/prompts (SEC2-R1) as corpus
  publish gates. Do not score DG-M2, DG-R3, SEC2-R1, or SEC2-M1 as substitutes.
  Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Add a secret/PII scan gate before fine-tune and eval corpus publish; block on critical findings"
  - "Link a scan report to every published corpus; close gaps for the last 90 days"
  - "Retain coverage under imports/dataset-secret-scan-gate/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
  - title: "NIST AI RMF — Manage / Map (data)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
