id: "SEC2-R3"
category: "secrets"
title: "Production systems should have dataset scanning before fine-tuning or eval corpus publish"
description: "Dataset scanning before fine-tuning or eval corpus publish"
whyItMatters: "Dataset scanning before fine-tuning or eval corpus publish Failing this leaves a
  production gap against: 100% of fine-tune/eval corpora published in the last 90 days have a linked
  scan report; publish is blocked when critical findings are open"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "100% of fine-tune/eval corpora published in the last 90 days have a linked scan
  report; publish is blocked when critical findings are open"
evidenceRequired:
  - "Dataset secret/PII scan gate config before fine-tune or eval corpus publish + last scan report
    for a published corpus"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Dataset secret/PII scan gate config before fine-tune or eval corpus publish + last scan
          report for a published corpus"
manualVerification: "For this Check (Dataset scanning before fine-tuning or eval corpus publish):
  inspect current evidence for [Dataset secret/PII scan gate config before fine-tune or eval corpus
  publish + last scan report for a published corpus] and confirm the pass condition holds — 100% of
  fine-tune/eval corpora published in the last 90 days have a linked scan report; publish is blocked
  when critical findings are open"
falsePositiveGuidance: "re-verify against a current artifact for this specific Check , not a sibling
  control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Dataset scanning before fine-tuning or eval corpus
    publish"
  - "Retain evidence artifacts required by this Check, starting with: Dataset secret/PII scan gate
    config before fine-tune or eval corpus publish + last scan report for a published corpus"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "SEC2-M1"
  - "SEC2-M2"
  - "SEC2-M3"
  - "SEC2-R1"
  - "SEC2-R2"
tags:
  - "secrets"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "github"
    - "cicd"
    - "prompt-templates"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
