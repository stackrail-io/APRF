id: "SEC2-M3"
category: "secrets"
title: "Provider and cloud keys must be rotatable and scoped; client apps must not hold
  privileged keys"
description: >
  Provider and cloud keys shall be rotatable and least-privilege scoped, and
  client apps shall not hold privileged keys—proven by a key inventory with
  scope and rotation evidence plus a client-bundle/scan report, not by
  secrets-manager presence alone.
whyItMatters: >
  Long-lived, over-scoped keys in mobile/SPA/desktop clients or unmanaged
  server configs are standing credentials. An inventory showing 0 privileged
  keys in client apps and 100% of production keys with documented scope and
  rotation within policy (≤90 days or provider-managed short-lived
  credentials) makes hygiene measurable. Distinct from SEC2-M1 (secrets-
  manager wiring and source/prompt scans), SEC2-M2 (log/trace redaction),
  and AUTHN-R1 (short-lived agent/tool credentials in prompts/config).
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Inventory of production provider/cloud keys exists; 0 privileged
  provider/cloud keys are embedded in client apps; 100% of production keys
  have a documented least-privilege scope and are within rotation policy
  (≤90 days or provider-managed short-lived credentials) (measuredAt ≤90
  days). If no production provider/cloud keys exist, score NOT_APPLICABLE.
evidenceRequired:
  - "Inventory of production provider/cloud keys with least-privilege scope"
  - "Rotation dates or provider-managed short-lived credential evidence within policy"
  - "Client bundle/scan report showing 0 privileged provider/cloud keys (measuredAt ≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-key-rotation-scope"
      params:
        hint: >
          Discover key-inventory, rotation-policy, scope/IAM, and
          client-bundle/scan signals; ingest coverage under
          imports/key-rotation-scope/; require inventory (or present=true),
          privilegedProviderOrCloudKeysInClientApps=0,
          productionKeysWithDocumentedLeastPrivilegeScopePct=100,
          productionKeysWithinRotationPolicyPct=100, measuredAt ≤90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest a production key
          inventory with least-privilege scope, rotation within policy (or
          provider-managed short-lived credentials), and 0 privileged keys
          in client apps (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production provider/cloud keys exist. If none, score
  NOT_APPLICABLE. 2) Inventory those keys and document least-privilege
  scope (required—do not PASS from rotation docs alone). 3) Confirm each
  key is within rotation policy (≤90 days) or uses provider-managed
  short-lived credentials. 4) Review a client bundle/scan report: 0
  privileged provider/cloud keys embedded in client apps (measuredAt ≤90
  days). 5) PASS only if inventory + scope + rotation/short-lived + zero
  client embeds hold. SEC2-M1 secrets-manager wiring alone does not prove
  scope/rotation. AUTHN-R1 agent/tool TTL alone does not prove provider/
  cloud key inventory for all production keys.
falsePositiveGuidance: >
  Do not pass secrets-manager presence without a key inventory and
  scope/rotation evidence. Do not pass rotation calendars without client
  bundle/scan proof of 0 privileged embeds. Do not score SEC2-M1, SEC2-M2,
  or AUTHN-R1 as substitutes. Named exceptions need owner and expiry ≤90
  days.
recommendedFixes:
  - "Inventory production provider/cloud keys; document least-privilege scopes and rotation (or move to short-lived provider credentials)"
  - "Remove privileged keys from client apps; prefer backend proxy or scoped public tokens"
  - "Retain coverage under imports/key-rotation-scope/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
  - title: "NIST SP 800-57 — Recommendation for Key Management"
    url: "https://csrc.nist.gov/publications/detail/sp/800-57-part-1/rev-5/final"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
