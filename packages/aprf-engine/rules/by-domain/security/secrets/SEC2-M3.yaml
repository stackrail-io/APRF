id: "SEC2-M3"
category: "secrets"
title: "Provider and cloud keys must be rotatable and scoped; client apps must not hold privileged keys"
description: "Provider and cloud keys shall be rotatable and scoped; client apps shall not hold privileged keys"
whyItMatters: "Provider and cloud keys shall be rotatable and scoped; client apps shall not hold
  privileged keys Failing this leaves a production gap against: 0 privileged provider/cloud keys
  embedded in client apps; every production key has a documented least-privilege scope and a
  rotation date within policy (≤90 days or provider-managed short-lived credentials)"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "0 privileged provider/cloud keys embedded in client apps; every production key has a
  documented least-privilege scope and a rotation date within policy (≤90 days or provider-managed
  short-lived credentials)"
evidenceRequired:
  - "Key inventory with least-privilege scope + rotation dates + client bundle/scan report"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Key inventory with least-privilege scope + rotation dates + client bundle/scan report"
manualVerification: "For this Check (Provider and cloud keys must be rotatable and scoped; client
  apps must not hold privileged keys): inspect current evidence for [Key inventory with
  least-privilege scope + rotation dates + client bundle/scan report] and confirm the pass condition
  holds — 0 privileged provider/cloud keys embedded in client apps; every production key has a
  documented least-privilege scope and a rotation date within policy (≤90 days or provider-managed
  short-lived credentials)"
falsePositiveGuidance: "re-verify against a current artifact for this specific Check , not a sibling
  control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Provider and cloud keys must be rotatable and scoped; client apps
    must not hold privileged keys"
  - "Retain evidence artifacts required by this Check, starting with: Key inventory with
    least-privilege scope + rotation dates + client bundle/scan report"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "SEC2-M1"
  - "SEC2-M2"
  - "SEC2-R1"
  - "SEC2-R2"
  - "SEC2-R3"
tags:
  - "secrets"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "github"
    - "cicd"
    - "prompt-templates"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
