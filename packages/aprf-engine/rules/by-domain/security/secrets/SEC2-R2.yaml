id: "SEC2-R2"
category: "secrets"
title: "Production systems should have egress controls limiting where runtime credentials
  can be used"
description: >
  Egress controls shall limit where runtime credentials can be used—proven by
  an allowlist/policy for runtimes that hold credentials plus ≥1 observed deny
  event in test or production logs within 90 days, not by secrets-manager
  presence or model-path trust-boundary docs alone.
whyItMatters: >
  Stolen or over-scoped runtime credentials that can call arbitrary destinations
  become standing exfiltration paths. Documented destinations plus a fresh deny
  event proving enforcement make credential egress measurable. Distinct from
  SEC-M4 (model/tool identity trust boundary to internal admin/data stores),
  INF-M3 (agent/tool least-privilege connectivity to documented dependencies),
  and SEC2-M1 (secrets-manager wiring / content scans).
severity: "critical"
weight: 4
gate: "recommended"
passCondition: >
  Egress allowlist/policy is configured for production runtimes that hold
  credentials; destinations are documented; ≥1 deny event is observed in test
  or production logs proving enforcement (measuredAt ≤90 days). If no
  production runtimes hold credentials, score NOT_APPLICABLE.
evidenceRequired:
  - "Egress allowlist/policy config for runtimes that hold credentials"
  - "Documented allowed destinations for those credentials"
  - "Sample deny (and optionally allow) logs proving enforcement (measuredAt ≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-credential-egress-controls"
      params:
        hint: >
          Discover credential egress allowlist/policy and deny-log signals;
          ingest coverage under imports/credential-egress-controls/; require
          allowlist/policy (or present=true),
          credentialEgressDestinationsDocumented,
          denyEventCountProvingEnforcementInLast90Days≥1, measuredAt ≤90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest egress allowlist/policy
          for credential-holding runtimes, documented destinations, and ≥1
          deny event proving enforcement (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production runtimes hold credentials (API keys, cloud tokens, or
  equivalent). If none, score NOT_APPLICABLE. 2) Locate egress allowlist/policy
  for those runtimes (required—do not PASS from deny-log snippets alone).
  3) Confirm allowed destinations are documented. 4) Review test or production
  logs showing ≥1 deny event proving enforcement (measuredAt ≤90 days).
  5) PASS only if allowlist/policy + documented destinations + ≥1 deny event
  hold. SEC-M4 model-path probes alone do not prove credential-use egress
  controls. INF-M3 dependency connectivity alone does not prove credential
  destination allowlisting. SEC2-M1 secrets-manager wiring alone does not
  prove egress enforcement.
falsePositiveGuidance: >
  Do not pass open egress with “deny in docs only.” Do not pass allowlists
  without a ≤90-day deny event proving enforcement. Do not pass cluster-wide
  NetworkPolicies that omit credential-holding runtime identities. Do not
  score SEC-M4, INF-M3, or SEC2-M1 as substitutes. Named exceptions need owner
  and expiry ≤90 days.
recommendedFixes:
  - "Define egress allowlists for runtimes that hold credentials; document allowed destinations"
  - "Enforce deny-by-default; retain ≥1 deny event from test or production (measuredAt ≤90 days)"
  - "Retain coverage under imports/credential-egress-controls/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
  - title: "NIST SP 800-207 — Zero Trust Architecture"
    url: "https://csrc.nist.gov/publications/detail/sp/800-207/final"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
