id: "SEC2-R2"
category: "secrets"
title: "Production systems should have egress controls limiting where runtime credentials can be used"
description: "Egress controls limiting where runtime credentials can be used"
whyItMatters: "Egress controls limiting where runtime credentials can be used Failing this leaves a
  production gap against: Runtime credentials can only call documented destinations; ≥1 deny event
  is observed in test or production logs proving enforcement in the last 90 days"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Runtime credentials can only call documented destinations; ≥1 deny event is observed
  in test or production logs proving enforcement in the last 90 days"
evidenceRequired:
  - "Egress allowlist/policy config for runtimes that hold credentials + sample deny/allow logs
    (24h)"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Egress allowlist/policy config for runtimes that hold credentials + sample deny/allow logs
          (24h)"
manualVerification: "For this Check (Egress controls limiting where runtime credentials can be
  used): inspect current evidence for [Egress allowlist/policy config for runtimes that hold
  credentials + sample deny/allow logs (24h)] and confirm the pass condition holds — Runtime
  credentials can only call documented destinations; ≥1 deny event is observed in test or production
  logs proving enforcement in the last 90 days"
falsePositiveGuidance: "re-verify against a current artifact for this specific Check , not a sibling
  control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Egress controls limiting where runtime credentials
    can be used"
  - "Retain evidence artifacts required by this Check, starting with: Egress allowlist/policy config
    for runtimes that hold credentials + sample deny/allow logs (24h)"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "SEC2-M1"
  - "SEC2-M2"
  - "SEC2-M3"
  - "SEC2-R1"
  - "SEC2-R3"
tags:
  - "secrets"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "github"
    - "cicd"
    - "prompt-templates"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
