id: "SEC2-M2"
category: "secrets"
title: "Logging and tracing pipelines must redact secret-like patterns"
description: >
  Logging and tracing pipelines shall redact secret-like patterns—proven by
  redaction/masking config plus a fresh canary harness that injects API
  key/bearer/AWS-key patterns and shows 100% redaction in persisted
  logs/traces, not by filter code alone.
whyItMatters: >
  Secrets that reach logs and traces become durable exfiltration via
  observability backends. A canary that injects synthetic privileged patterns
  and measures 100% redaction makes the control measurable. Distinct from
  SEC2-M1 (secrets-manager wiring and source/prompt scans), OBS-M2 / AI
  trace-sensitive redaction (AI payload redaction in traces), and SEC2-M3
  (rotation/scoping of provider keys).
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Logging/tracing secret-redaction config is present; a canary harness injects
  synthetic API key/bearer/AWS-key patterns and shows 100% redaction in
  persisted logs/traces (measuredAt ≤90 days). If no production logging or
  tracing pipelines exist, score NOT_APPLICABLE.
evidenceRequired:
  - "Redaction/masking config for logging and/or tracing pipelines"
  - "Synthetic secret-injection canary harness covering API key/bearer/AWS-key patterns"
  - "Canary results showing 100% detection/redaction in persisted logs/traces (measuredAt ≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-secret-redaction"
      params:
        hint: >
          Discover log/trace redaction config and canary-test signals; ingest
          harness coverage under imports/secret-redaction/; require redaction
          config, detectionRatePct=100, canary covering API key/bearer/AWS-key
          patterns, measuredAt ≤90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest redaction config plus a
          ≤90-day canary showing 100% redaction of synthetic API key/bearer/
          AWS-key patterns in persisted logs/traces.
manualVerification: >
  1) Confirm production logging or tracing pipelines exist. If none, score
  NOT_APPLICABLE. 2) Confirm redaction/masking config for those pipelines
  (required—do not PASS from canary docs alone). 3) Review a canary harness
  that injects synthetic API key/bearer/AWS-key patterns. 4) Confirm 100%
  are redacted in persisted logs/traces (measuredAt ≤90 days). 5) PASS only
  if config + 100% canary hold. SEC2-M1 secret scans alone do not prove
  log/trace redaction. Filter helpers without a measured canary do not
  satisfy.
falsePositiveGuidance: >
  Do not pass redaction helpers without a measured canary at 100%. Do not
  pass canary rate imports without redaction config (in-repo or attested).
  Do not pass LLM “redacted_thinking” or UI censoring as log/trace redaction.
  Do not score SEC2-M1 or OBS AI-trace redaction as substitutes. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Add secret-pattern redaction to logging and tracing pipelines (filters, OTel processors, or equivalent)"
  - "Run a canary that injects API key/bearer/AWS-key patterns and asserts 100% redaction in persisted outputs"
  - "Retain harness results under imports/secret-redaction/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "OWASP Logging Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
