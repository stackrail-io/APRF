id: "SEC2-M2"
category: "secrets"
title: "Logging and tracing pipelines must redact secret-like patterns"
description: "Logging and tracing pipelines shall redact secret-like patterns"
whyItMatters: "Logging and tracing pipelines shall redact secret-like patterns Failing this leaves a
  production gap against: Synthetic secrets (API key/bearer/AWS-key patterns) injected into a canary
  request are redacted in persisted logs/traces at 100% detection in the test harness"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "Synthetic secrets (API key/bearer/AWS-key patterns) injected into a canary request
  are redacted in persisted logs/traces at 100% detection in the test harness"
evidenceRequired:
  - "Redaction config + sample of redacted traces + synthetic secret-injection test results"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Redaction config + sample of redacted traces + synthetic secret-injection test results"
manualVerification: "For this Check (Logging and tracing pipelines must redact secret-like
  patterns): inspect current evidence for [Redaction config + sample of redacted traces + synthetic
  secret-injection test results] and confirm the pass condition holds — Synthetic secrets (API
  key/bearer/AWS-key patterns) injected into a canary request are redacted in persisted logs/traces
  at 100% detection in the test harness"
falsePositiveGuidance: "re-verify against a current artifact for this specific Check , not a sibling
  control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Logging and tracing pipelines must redact secret-like patterns"
  - "Retain evidence artifacts required by this Check, starting with: Redaction config + sample of
    redacted traces + synthetic secret-injection test results"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "SEC2-M1"
  - "SEC2-M3"
  - "SEC2-R1"
  - "SEC2-R2"
  - "SEC2-R3"
tags:
  - "secrets"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "github"
    - "cicd"
    - "prompt-templates"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
