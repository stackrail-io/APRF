id: "SEC2-M1"
category: "secrets"
title: "Production secrets must live in a secrets manager and not in prompts, repos, or
  prod notebooks"
description: >
  Production secrets shall resolve from a secrets manager at runtime and must
  not appear in repos, prompt registries, or client bundles—proven by
  secrets-manager wiring plus a fresh secret-scan covering prompts/fixtures,
  not by CI ${{ secrets.* }} alone.
whyItMatters: >
  Hardcoded API keys and cloud credentials in prompts, notebooks, or image
  env turn every leak into standing privileged access. Secrets-manager
  wiring for 100% of production runtime secrets, plus a ≤90-day scan with 0
  privileged findings in repos/prompts/client bundles, makes hygiene
  measurable. Distinct from AUTHN-R1 (short-lived agent/tool credentials in
  prompts/config), SEC2-M2 (log/trace redaction of secret-like patterns),
  and SEC2-M3 (rotation).
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Secrets-manager wiring covers production runtime secrets; 100% of those
  secrets resolve from the secrets manager; the latest secret scan covering
  repos, prompt registries, and client bundles finds 0 privileged production
  secrets (measuredAt ≤90 days). If no production runtime secrets exist,
  score NOT_APPLICABLE.
evidenceRequired:
  - "Secrets-manager / sealed-secrets / cloud secret-ref wiring for production runtime"
  - "CI/repo secret-scan config covering prompts and fixtures"
  - "Latest secret-scan report with 0 privileged findings (measuredAt ≤90 days)"
  - "Attest or inventory showing 100% of production runtime secrets resolve from the secrets manager"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-secrets-hygiene"
      params:
        hint: >
          Discover secrets-manager wiring and CI secret-scan signals; run
          high-confidence embedded-secret heuristics (values never stored);
          ingest coverage under imports/secrets-hygiene/; require manager
          wiring (or present=true), secretScanCoversPromptsAndFixtures,
          privilegedSecretsInReposPromptsOrClientBundles=0,
          productionRuntimeSecretsResolvedFromSecretsManagerPct=100,
          measuredAt ≤90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest secrets-manager
          wiring for production runtime secrets, 100% resolve from the
          manager, and a ≤90-day secret scan covering prompts/fixtures with
          0 privileged findings.
manualVerification: >
  1) Confirm production runtime secrets exist. If none, score
  NOT_APPLICABLE. 2) Confirm secrets-manager / sealed-secrets / cloud
  secret-ref wiring (CI ${{ secrets.* }} alone does not count). 3) Confirm
  100% of production runtime secrets resolve from that manager. 4) Review a
  secret scan covering repos, prompt registries, and client bundles
  (measuredAt ≤90 days): 0 privileged findings. 5) PASS only if manager +
  100% resolve + clean scan hold. AUTHN-R1 agent/tool TTL inventory alone
  does not prove secrets-manager wiring. SEC2-M2 log redaction alone does
  not prove secrets are not embedded in source.
falsePositiveGuidance: >
  Do not pass GitHub Actions / CI auth secrets as a production secrets
  manager. Do not pass secret-scan CI config without a fresh clean report
  (or equivalent import). Do not pass manager docs without 100% runtime
  resolve attest. Do not score AUTHN-R1 or SEC2-M2 as substitutes. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Move production secrets into a secrets manager (External Secrets, Vault, cloud SM, sealed-secrets, or equivalent) and wire runtime resolution"
  - "Add CI secret scanning covering prompts/fixtures; close privileged findings"
  - "Retain scored report under imports/secrets-hygiene/ (measuredAt ≤90 days)"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "SEC2-M2"
  - "SEC2-M3"
  - "SEC2-R1"
  - "SEC2-R2"
  - "SEC2-R3"
  - "AUTHN-R1"
tags:
  - "secrets"
  - "mandatory"
  - "hybrid"
  - "secrets-manager"
  - "secret-scan"
applicability:
  technologies: []
  minCriticality: 1
  requiredFromLevel: 2
status: "active"
introducedIn: "0.10.0"
