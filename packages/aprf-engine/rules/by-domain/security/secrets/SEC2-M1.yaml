id: "SEC2-M1"
category: "secrets"
title: "Production secrets must live in a secrets manager and not in prompts, repos, or prod notebooks"
description: "Production secrets shall live in a secrets manager and not in prompts, repos, or prod notebooks"
whyItMatters: "Production secrets shall live in a secrets manager and not in prompts, repos, or prod
  notebooks Failing this leaves a production gap against: 0 privileged production secrets found in
  repos, prompt registries, or client bundles in the latest scan; 100% of production runtime secrets
  resolve from the secrets manager"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "0 privileged production secrets found in repos, prompt registries, or client bundles
  in the latest scan; 100% of production runtime secrets resolve from the secrets manager"
evidenceRequired:
  - "Secrets-manager config + CI/repo secret-scan report including prompt and fixture paths"
detection:
  capability: "automated"
  detectors:
    - id: "secrets-not-embedded"
      params: {}
    - id: "docker-no-secrets-in-env"
      params: {}
    - id: "repo-secret-scan-config"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Secrets-manager config + CI/repo secret-scan report including prompt and fixture paths"
manualVerification: "For this Check (Production secrets must live in a secrets manager and not in
  prompts, repos, or prod notebooks): inspect current evidence for [Secrets-manager config + CI/repo
  secret-scan report including prompt and fixture paths] and confirm the pass condition holds — 0
  privileged production secrets found in repos, prompt registries, or client bundles in the latest
  scan; 100% of production runtime secrets resolve from the secrets manager"
falsePositiveGuidance: "confirm the detector target matches the production path for this Check
  before waiving. Named exceptions need an owner and expiry ≤90 days."
recommendedFixes:
  - "Implement and operationalize: Production secrets must live in a secrets manager and not in
    prompts, repos, or prod notebooks"
  - "Retain evidence artifacts required by this Check, starting with: Secrets-manager config +
    CI/repo secret-scan report including prompt and fixture paths"
  - "Wire or verify detectors declared on this Check so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Secrets Management Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - title: "CIS Benchmarks — credential hygiene"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "SEC2-M2"
  - "SEC2-M3"
  - "SEC2-R1"
  - "SEC2-R2"
  - "SEC2-R3"
tags:
  - "secrets"
  - "mandatory"
  - "automated"
applicability:
  technologies:
    - "github"
    - "cicd"
    - "prompt-templates"
  minCriticality: 1
  requiredFromLevel: 2
status: "active"
introducedIn: "0.10.0"
