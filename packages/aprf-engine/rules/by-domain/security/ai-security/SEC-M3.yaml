id: "SEC-M3"
category: "ai-security"
title: "Abuse, jailbreak, and injection testing must gate customer-facing releases"
description: >
  Customer-facing releases shall run an abuse/jailbreak/injection security
  suite—with those case classes present—as a blocking gate, or record a
  time-boxed waiver (owner + expiry ≤30 days) when the gate does not pass.
whyItMatters: >
  Shipping without a blocking adversarial suite leaves injection and jailbreak
  regressions free to reach customers. Requiring 100% of production releases
  in the last 30 days to show gate=pass (or an owned ≤30-day waiver) turns the
  suite into a release control. Distinct from SEC-M1 privilege-mediation deny
  rates, SAF-M2 content-safety eval gates, SAF-R2 jailbreak-to-harm red teams,
  and SEC-R1 multi-turn/RAG/MCP red-team depth.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  100% of production releases in the last 30 days show an
  abuse/jailbreak/injection suite gate = pass (suite must include those case
  classes), or a time-boxed waiver with owner and expiry ≤30 days
  (measuredAt ≤90 days).
evidenceRequired:
  - "Abuse/jailbreak/injection suite definition covering those case classes"
  - "CI/release gate configuration that blocks promote on suite fail"
  - "Last 30 days of release reports showing gate=pass, or owned waivers (expiry ≤30 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-abuse-injection-release-gate"
      params:
        hint: >
          Discover abuse/jailbreak/injection suites, blocking CI/release
          gates, and ≤30-day owned waivers; ingest coverage under
          imports/abuse-injection-release-gate/.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of production
          releases in the last 30 days ran the abuse/jailbreak/injection suite
          gate to pass, or owned waiver expiry ≤30 days (measuredAt ≤90 days).
manualVerification: >
  1) Confirm customer-facing / production AI releases exist. If none, score
  NOT_APPLICABLE. 2) Locate an abuse/jailbreak/injection suite that includes
  those case classes (not quality-only, not content-safety-only). 3) Confirm
  the suite is a blocking CI/release gate. 4) Review the last 30 days: 100% of
  production releases show gate=pass, or a waiver with owner and expiry ≤30
  days. 5) PASS only if suite + blocking gate + 100% coverage/waivers hold with
  measuredAt ≤90 days. SEC-M1 corpus deny rates alone do not prove release
  gating. SAF-M2 safety eval gates alone do not prove security abuse suites.
  SAF-R2 harm red teams alone do not prove customer-facing release gates.
  SEC-R1 multi-turn/RAG depth alone does not prove last-30-day release coverage.
falsePositiveGuidance: >
  Do not pass content-safety-only suites as abuse/injection gates. Do not pass
  optional (non-blocking) adversarial jobs. Do not pass coverage under 100% of
  production releases in the last 30 days without owned ≤30-day waivers. Do not
  pass open-ended waivers. Sibling SEC-M1, SAF-M2, SAF-R2, and SEC-R1 do not
  substitute. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Define an abuse/jailbreak/injection suite covering those case classes"
  - "Require the suite as a blocking CI/release gate on every customer-facing promote"
  - "Track ≤30-day owned waivers; retain evidence under imports/abuse-injection-release-gate/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "OWASP Top 10 for Large Language Model Applications — LLM01 Prompt Injection"
    url: "https://genai.owasp.org/llmrisk/llm01-prompt-injection/"
  - title: "NIST AI Risk Management Framework"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "CIS Controls (select mappings for AI workloads)"
    url: "https://www.cisecurity.org/controls"
relatedRules:
