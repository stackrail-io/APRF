id: "SEC-M3"
category: "ai-security"
title: "Abuse, jailbreak, and injection testing must gate customer-facing releases"
description: "Abuse, jailbreak, and injection testing shall gate customer-facing releases"
whyItMatters: "Abuse, jailbreak, and injection testing shall gate customer-facing releases Failing
  this leaves a production gap against: 100% of production releases in the last 30 days show an
  abuse/jailbreak/injection suite gate = pass (suite must include those case classes), or a
  time-boxed waiver with owner and expiry ≤ 30 days"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of production releases in the last 30 days show an abuse/jailbreak/injection
  suite gate = pass (suite must include those case classes), or a time-boxed waiver with owner and
  expiry ≤ 30 days"
evidenceRequired:
  - "CI gate configuration for abuse/jailbreak/injection suite + last 30 days of release reports
    showing that suite passed (or waiver)"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "CI gate configuration for abuse/jailbreak/injection suite + last 30 days of release reports"
manualVerification: "For this Check (Abuse, jailbreak, and injection testing must gate
  customer-facing releases): inspect current evidence for [CI gate configuration for
  abuse/jailbreak/injection suite + last 30 days of release reports showing that suite passed (or
  waiver)] and confirm the pass condition holds — 100% of production releases in the last 30 days
  show an abuse/jailbreak/injection suite gate = pass (suite must include those case classes), or a
  time-boxed waiver with owner and expiry ≤ 30 days"
falsePositiveGuidance: "(Adversarial Security): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Abuse, jailbreak, and injection testing must gate customer-facing
    releases"
  - "Retain evidence artifacts required by this Check, starting with: CI gate configuration for
    abuse/jailbreak/injection suite + last 30 days of release reports"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Top 10 for Large Language Model Applications"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - title: "NIST AI Risk Management Framework"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "CIS Controls (select mappings for AI workloads)"
    url: "https://www.cisecurity.org/controls"
relatedRules:
  - "SEC-M1"
  - "SEC-M2"
  - "SEC-M4"
  - "SEC-M5"
  - "SEC-R1"
tags:
  - "ai-security"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "prompt-templates"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
