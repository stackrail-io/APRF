id: "SEC-M1"
category: "ai-security"
title: "Untrusted input must never authorize privileged actions without server-side policy"
description: "Untrusted input shall never authorize privileged actions without server-side policy"
whyItMatters: "Untrusted input shall never authorize privileged actions without server-side policy
  Failing this leaves a production gap against: ≥95% of corpus cases that attempt privilege
  escalation via untrusted input are denied; 0 cases where model text alone granted a privileged
  tool call in the suite"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "≥95% of corpus cases that attempt privilege escalation via untrusted input are
  denied; 0 cases where model text alone granted a privileged tool call in the suite"
evidenceRequired:
  - "Injection/privilege-escalation corpus (versioned) + CI gate report + policy-engine deny sample
    logs"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Injection/privilege-escalation corpus (versioned) + CI gate report + policy-engine deny
          sample logs"
manualVerification: "For this Check (Untrusted input must never authorize privileged actions without
  server-side policy): inspect current evidence for [Injection/privilege-escalation corpus
  (versioned) + CI gate report + policy-engine deny sample logs] and confirm the pass condition
  holds — ≥95% of corpus cases that attempt privilege escalation via untrusted input are denied; 0
  cases where model text alone granted a privileged tool call in the suite"
falsePositiveGuidance: "(Adversarial Security): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Untrusted input must never authorize privileged actions without
    server-side policy"
  - "Retain evidence artifacts required by this Check, starting with: Injection/privilege-escalation
    corpus (versioned) + CI gate report + policy-engine deny sample logs"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Top 10 for Large Language Model Applications"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - title: "NIST AI Risk Management Framework"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "CIS Controls (select mappings for AI workloads)"
    url: "https://www.cisecurity.org/controls"
relatedRules:
  - "SEC-M2"
  - "SEC-M3"
  - "SEC-M4"
  - "SEC-M5"
  - "SEC-R1"
tags:
  - "ai-security"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "prompt-templates"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
