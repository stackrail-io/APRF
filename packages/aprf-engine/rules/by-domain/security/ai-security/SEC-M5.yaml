id: "SEC-M5"
category: "ai-security"
title: "Canary tokens or tripwires must detect exfiltration attempts in sensitive AI contexts"
description: "Canary tokens or tripwires shall detect exfiltration attempts in sensitive AI contexts"
whyItMatters: "Canary tokens or tripwires shall detect exfiltration attempts in sensitive AI
  contexts Failing this leaves a production gap against: PASS if canaries/tripwires are deployed in
  production-sensitive paths and the latest detection test (≤90 days) shows expected alerts with 0
  silent misses in the suite"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "PASS if canaries/tripwires are deployed in production-sensitive paths and the latest
  detection test (≤90 days) shows expected alerts with 0 silent misses in the suite"
evidenceRequired:
  - "Canary/tripwire design + detection test report with sample alerts for sensitive contexts"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Canary/tripwire design + detection test report with sample alerts for sensitive contexts"
manualVerification: "For this Check (Canary tokens or tripwires must detect exfiltration attempts in
  sensitive AI contexts): inspect current evidence for [Canary/tripwire design + detection test
  report with sample alerts for sensitive contexts] and confirm the pass condition holds — PASS if
  canaries/tripwires are deployed in production-sensitive paths and the latest detection test (≤90
  days) shows expected alerts with 0 silent misses in the suite"
falsePositiveGuidance: "(Adversarial Security): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Canary tokens or tripwires must detect exfiltration attempts in
    sensitive AI contexts"
  - "Retain evidence artifacts required by this Check, starting with: Canary/tripwire design +
    detection test report with sample alerts for sensitive contexts"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Top 10 for Large Language Model Applications"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - title: "NIST AI Risk Management Framework"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "CIS Controls (select mappings for AI workloads)"
    url: "https://www.cisecurity.org/controls"
relatedRules:
  - "SEC-M1"
  - "SEC-M2"
  - "SEC-M3"
  - "SEC-M4"
  - "SEC-R1"
tags:
  - "ai-security"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "prompt-templates"
    - "cicd"
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
