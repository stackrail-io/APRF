id: "SEC-M2"
category: "ai-security"
title: "High-risk outputs must be schema-validated or policy-filtered before side effects"
description: >
  High-risk model outputs shall be schema-validated or policy-filtered before
  any write, irreversible, or financial side effect—so non-conforming output
  cannot drive privileged downstream actions.
whyItMatters: >
  Free-form model text that triggers writes, irreversible changes, or money
  movement turns a generation bug into a production incident. A complete
  high-risk path inventory plus contract tests proving 100% rejection of
  non-conforming output makes the gate measurable. Distinct from SEC-M1
  injection/privilege-escalation mediation, TOL-M4 tool-argument schemas, and
  SAF-M2 content-safety release gates.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  100% of high-risk side-effect paths (impact tier write/irreversible/financial)
  reject non-conforming model output in contract tests; coverage inventory lists
  every such path (measuredAt ≤90 days). If production AI cannot drive write, irreversible, or financial side effects, score NOT_APPLICABLE.
evidenceRequired:
  - "Coverage inventory of high-risk side-effect paths (write/irreversible/financial)"
  - "Schema or policy filter definitions applied before those side effects"
  - "Contract test results showing non-conforming output rejected on 100% of inventoried paths"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-high-risk-output-gate"
      params:
        hint: >
          Discover high-risk path inventories, output schema/policy filters,
          and contract tests; ingest coverage under imports/high-risk-output-gate/.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest a complete high-risk
          path inventory and 100% contract-test rejection of non-conforming
          output before side effects (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI can drive write, irreversible, or financial side
  effects. If none, score NOT_APPLICABLE. 2) Locate a coverage inventory of
  every such path. 3) Confirm each path applies schema validation or a policy
  filter before the side effect (not prompt-only). 4) Review contract tests:
  non-conforming fixtures are rejected on 100% of inventoried paths. 5) PASS
  only if inventory + schema/policy + 100% rejection hold with measuredAt ≤90
  days. SEC-M1 injection deny suites alone do not prove output schema gates.
  TOL-M4 tool-argument schemas alone do not prove model-output filtering before
  side effects. SAF-M2 safety eval release gates alone do not prove per-path
  output contracts.
falsePositiveGuidance: >
  Do not pass prompt-only “follow the schema” instructions. Do not pass
  inventories that omit write/irreversible/financial paths. Do not pass
  contract coverage under 100% of inventoried high-risk paths. Do not pass
  tool-argument validation (TOL-M4) as model-output gating. Sibling SEC-M1,
  TOL-M4, and SAF-M2 do not substitute. Named exceptions need owner and
  expiry ≤90 days.
recommendedFixes:
  - "Inventory every write/irreversible/financial side-effect path driven by model output"
  - "Enforce JSON Schema (or equivalent) or policy filter before those side effects"
  - "Add contract tests that reject non-conforming fixtures on 100% of inventoried paths"
  - "Retain evidence under imports/high-risk-output-gate/; time-box gaps ≤90 days"
references:
  - title: "OWASP Top 10 for Large Language Model Applications — LLM05 Improper Output Handling"
    url: "https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/"
  - title: "NIST AI Risk Management Framework"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "CIS Controls (select mappings for AI workloads)"
    url: "https://www.cisecurity.org/controls"
relatedRules:
