id: "SEC-M4"
category: "ai-security"
title: "Network and identity boundaries must prevent the model path from becoming a universal proxy
  to internal systems"
description: "Network and identity boundaries shall prevent the model path from becoming a universal
  proxy to internal systems"
whyItMatters: "Network and identity boundaries shall prevent the model path from becoming a
  universal proxy to internal systems Failing this leaves a production gap against: Automated or
  reviewed probe shows the model/tool runtime can reach only allowlisted destinations; 0
  unrestricted routes to internal admin APIs or data stores from the model identity"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "Automated or reviewed probe shows the model/tool runtime can reach only allowlisted
  destinations; 0 unrestricted routes to internal admin APIs or data stores from the model identity"
evidenceRequired:
  - "Architecture diagram of model/tool trust boundaries + network policy or egress allowlist export"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Architecture diagram of model/tool trust boundaries + network policy or egress allowlist
          export"
manualVerification: "For this Check (Network and identity boundaries must prevent the model path
  from becoming a universal proxy to internal systems): inspect current evidence for [Architecture
  diagram of model/tool trust boundaries + network policy or egress allowlist export] and confirm
  the pass condition holds — Automated or reviewed probe shows the model/tool runtime can reach only
  allowlisted destinations; 0 unrestricted routes to internal admin APIs or data stores from the
  model identity"
falsePositiveGuidance: "(Adversarial Security): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Network and identity boundaries must prevent the model path from
    becoming a universal proxy to internal systems"
  - "Retain evidence artifacts required by this Check, starting with: Architecture diagram of
    model/tool trust boundaries + network policy or egress allowlist export"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP Top 10 for Large Language Model Applications"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - title: "NIST AI Risk Management Framework"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "CIS Controls (select mappings for AI workloads)"
    url: "https://www.cisecurity.org/controls"
relatedRules:
  - "SEC-M1"
  - "SEC-M2"
  - "SEC-M3"
  - "SEC-M5"
  - "SEC-R1"
tags:
  - "ai-security"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "prompt-templates"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
