id: "INF-M1"
category: "infrastructure"
title: "AI data stores and control planes must not be publicly exposed without authenticated edge
  controls"
description: "AI data stores and control planes shall not be publicly exposed without authenticated
  edge controls"
whyItMatters: "AI data stores and control planes shall not be publicly exposed without authenticated
  edge controls Failing this leaves a production gap against: 0 AI data stores or control-plane
  endpoints publicly reachable without authentication in the latest scan; findings severity ≥ high
  closed or waived with expiry"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "0 AI data stores or control-plane endpoints publicly reachable without
  authentication in the latest scan; findings severity ≥ high closed or waived with expiry"
evidenceRequired:
  - "CSPM/network scan of AI data stores and control planes + edge auth config"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "CSPM/network scan of AI data stores and control planes + edge auth config"
manualVerification: "For this Check (AI data stores and control planes must not be publicly exposed
  without authenticated edge controls): inspect current evidence for [CSPM/network scan of AI data
  stores and control planes + edge auth config] and confirm the pass condition holds — 0 AI data
  stores or control-plane endpoints publicly reachable without authentication in the latest scan;
  findings severity ≥ high closed or waived with expiry"
falsePositiveGuidance: "confirm the detector target matches the production path for this Check
  before waiving. Named exceptions need an owner and expiry ≤90 days."
recommendedFixes:
  - "Implement and operationalize: AI data stores and control planes must not be publicly exposed
    without authenticated edge controls"
  - "Retain evidence artifacts required by this Check, starting with: CSPM/network scan of AI data
    stores and control planes + edge auth config"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "CIS Benchmarks"
    url: "https://www.cisecurity.org/cis-benchmarks"
  - title: "CNCF security technical advisory guidance"
    url: "https://www.cncf.io/"
  - title: "AWS Well-Architected — Security"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "INF-M2"
  - "INF-M3"
  - "INF-M4"
  - "INF-R1"
  - "INF-R3"
tags:
  - "infrastructure"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
    - "terraform"
    - "docker"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
