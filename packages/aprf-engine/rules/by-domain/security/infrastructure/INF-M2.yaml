id: "INF-M2"
category: "infrastructure"
title: "Base images and runtimes must follow documented patching SLAs"
description: "Base images and runtimes shall follow documented patching SLAs"
whyItMatters: "Base images and runtimes shall follow documented patching SLAs Failing this leaves a
  production gap against: 100% of production AI runtime images are within patching SLA (e.g.
  critical fixes ≤ 14 days); report shows 0 SLA breaches or open waivers with expiry"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of production AI runtime images are within patching SLA (e.g. critical fixes ≤
  14 days); report shows 0 SLA breaches or open waivers with expiry"
evidenceRequired:
  - "Patching SLA policy + image age/CVE backlog report for AI runtimes"
detection:
  capability: "hybrid"
  detectors:
    - id: "docker-no-latest-tag"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Patching SLA policy + image age/CVE backlog report for AI runtimes"
manualVerification: "For this Check (Base images and runtimes must follow documented patching SLAs):
  inspect current evidence for [Patching SLA policy + image age/CVE backlog report for AI runtimes]
  and confirm the pass condition holds — 100% of production AI runtime images are within patching
  SLA (e.g. critical fixes ≤ 14 days); report shows 0 SLA breaches or open waivers with expiry"
falsePositiveGuidance: "when automation and attestation disagree, prefer the stricter outcome until
  reconciled. Waive only with owner, expiry, and which signal covers the gap."
recommendedFixes:
  - "Implement and operationalize: Base images and runtimes must follow documented patching SLAs"
  - "Retain evidence artifacts required by this Check, starting with: Patching SLA policy + image
    age/CVE backlog report for AI runtimes"
  - "Wire or verify detectors declared on this Check so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "CIS Benchmarks"
    url: "https://www.cisecurity.org/cis-benchmarks"
  - title: "CNCF security technical advisory guidance"
    url: "https://www.cncf.io/"
  - title: "AWS Well-Architected — Security"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "INF-M1"
  - "INF-M3"
  - "INF-M4"
  - "INF-R1"
  - "INF-R3"
tags:
  - "infrastructure"
  - "mandatory"
  - "hybrid"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
    - "terraform"
    - "docker"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
