id: "INF-M3"
category: "infrastructure"
title: "Network segmentation must limit agent/tool reachability to required dependencies"
description: "Network segmentation shall limit agent/tool reachability to required dependencies"
whyItMatters: "Network segmentation shall limit agent/tool reachability to required dependencies
  Failing this leaves a production gap against: Egress/east-west allowlists for agent/tool
  identities match the documented dependency inventory; probe from agent identity to a
  non-allowlisted internal service fails at 100%"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Egress/east-west allowlists for agent/tool identities match the documented
  dependency inventory; probe from agent identity to a non-allowlisted internal service fails at
  100%"
evidenceRequired:
  - "Network policy / security-group export for agent and tool runtimes + dependency allowlist"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-network-policy"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Network policy / security-group export for agent and tool runtimes + dependency allowlist"
manualVerification: "For this Check (Network segmentation must limit agent/tool reachability to
  required dependencies): inspect current evidence for [Network policy / security-group export for
  agent and tool runtimes + dependency allowlist] and confirm the pass condition holds —
  Egress/east-west allowlists for agent/tool identities match the documented dependency inventory;
  probe from agent identity to a non-allowlisted internal service fails at 100%"
falsePositiveGuidance: "when automation and attestation disagree, prefer the stricter outcome until
  reconciled. Waive only with owner, expiry, and which signal covers the gap."
recommendedFixes:
  - "Implement and operationalize: Network segmentation must limit agent/tool reachability to
    required dependencies"
  - "Retain evidence artifacts required by this Check, starting with: Network policy /
    security-group export for agent and tool runtimes + dependency allowlist"
  - "Wire or verify detectors declared on this Check so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "CIS Benchmarks"
    url: "https://www.cisecurity.org/cis-benchmarks"
  - title: "CNCF security technical advisory guidance"
    url: "https://www.cncf.io/"
  - title: "AWS Well-Architected — Security"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "INF-M1"
  - "INF-M2"
  - "INF-M4"
  - "INF-R1"
  - "INF-R3"
tags:
  - "infrastructure"
  - "mandatory"
  - "hybrid"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
    - "terraform"
    - "docker"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
