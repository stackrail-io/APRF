id: "PRM-M1"
category: "prompt-engineering"
title: "Every production prompt must have an immutable version identifier and owner"
description: >
  Every production prompt shall carry an immutable version identifier and a
  named owner in a registry (or equivalent versioned store)—with zero
  unversioned production prompts and zero prompts missing an owner.
whyItMatters: >
  Unversioned prompts cannot be reviewed, rolled back, or tied to eval gates.
  Missing owners leave regressions without a pager. Immutable IDs plus named
  ownership turn prompts into release artifacts—not anonymous strings in code.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  100% of production prompts have an immutable version ID and named owner; 0
  unversioned production prompts (registry evidence measuredAt ≤90 days). If none (the system ships production prompts (templates, system prompts, or managed prompt configs)), score NOT_APPLICABLE.
evidenceRequired:
  - "Prompt registry (or versioned prompt store) listing production prompts with immutable version IDs"
  - "Owner field populated for each production prompt; query showing 0 unversioned / 0 missing-owner"
detection:
  capability: "hybrid"
  detectors:
    - id: "prompt-versioned"
      params:
        hint: >
          Discover production prompts with immutable version identifiers in a
          registry or versioned prompt store.
    - id: "prompt-has-owner"
      params:
        hint: >
          Discover named owners on production prompt registry entries.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of production
          prompts have immutable version IDs and named owners with 0
          unversioned prompts (measuredAt ≤90 days).
manualVerification: >
  1) Confirm the system ships production prompts (templates, system prompts,
  or managed prompt configs). If none, score NOT_APPLICABLE. 2) Open the prompt
  registry or versioned store; confirm each production prompt has an immutable
  version ID (not “latest”/floating alias). 3) Confirm each has a named owner.
  4) Query for unversioned or ownerless production prompts: both counts = 0.
  5) PASS only if version + owner coverage hold with measuredAt ≤90 days.
  Hardcoded prompt strings in app code without registry IDs do not satisfy.
  PRM-M2 review/eval linkage alone does not satisfy version+owner inventory.
falsePositiveGuidance: >
  Do not pass git history of a single file as an immutable version ID. Do not
  pass “team” without a named owner. Do not pass floating aliases (latest,
  current) as immutable versions. Do not pass evidence older than 90 days as
  current. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Register every production prompt with an immutable version ID and named owner"
  - "Eliminate unversioned production prompts; fail closed on missing owner/version"
  - "Retain registry export under imports/prompt-version-registry/"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE Workbook — Managing Risk (change management parallels)"
    url: "https://sre.google/workbook/"
  - title: "OWASP LLM — LLM01 Prompt Injection"
    url: "https://genai.owasp.org/llmrisk/llm01-prompt-injection/"
relatedRules:
  - "PRM-M3"
  - "PRM-R1"
  - "PRM-R2"
  - "PRM-R3"
  - "PRM-M2"
  - "MOD-M1"
  - "EVL-M1"
tags:
  - "prompt-engineering"
  - "mandatory"
  - "hybrid"
  - "prompt-version"
  - "ownership"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
