id: "PRM-R3"
category: "prompt-engineering"
title: "Production systems should use A/B or shadow evaluation for high-traffic prompt changes"
description: >
  High-traffic production prompt changes should run A/B or shadow evaluation
  with pre-registered metrics, and promotion should require non-inferiority (or
  better) on safety and the primary quality SLI.
whyItMatters: >
  High-traffic prompt edits move quality and safety for most users at once.
  Offline review alone misses live distribution shift. A/B or shadow with
  pre-registered metrics—and a non-inferiority promotion gate—keeps regressions
  from becoming the default path.
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  Last high-traffic prompt change used A/B or shadow eval with pre-registered
  metrics; promotion required non-inferiority (or better) on safety and primary
  quality SLI (experiment evidence measuredAt ≤90 days). If no high-traffic
  prompt change is in scope, score NOT_APPLICABLE.
evidenceRequired:
  - "A/B or shadow-eval config for high-traffic prompt changes"
  - "Last experiment report with quality/safety deltas + non-inferiority promotion gate"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-prompt-ab-shadow-eval"
      params:
        hint: >
          Discover A/B or shadow eval configs and promotion gates for
          high-traffic prompt changes with pre-registered metrics.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest the last high-traffic
          prompt change used A/B or shadow eval with pre-registered metrics and
          a non-inferiority promotion gate (measuredAt ≤90 days)—or attest no
          high-traffic prompt changes in scope.
manualVerification: >
  1) Confirm high-traffic production prompt changes occur. If none in scope,
  score NOT_APPLICABLE. 2) Open A/B or shadow-eval config for prompt changes;
  confirm pre-registered metrics. 3) Confirm the last high-traffic prompt
  change ran that experiment and retained quality/safety deltas. 4) Confirm
  promotion requires non-inferiority (or better) on safety and primary quality
  SLI. 5) PASS only if experiment + gate hold with measuredAt ≤90 days. PRM-M2
  review/eval linkage alone does not satisfy. EVL-M4 model/system cutover
  shadow alone does not satisfy. Offline-only suites without live A/B/shadow
  do not satisfy.
falsePositiveGuidance: >
  Do not pass feature-flag rollouts without eval metrics. Do not pass
  experiments without pre-registered success criteria. Do not pass promotion
  that ignores safety SLI. Do not pass evidence older than 90 days as current.
  Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Require A/B or shadow eval on high-traffic prompt changes with pre-registered metrics"
  - "Gate promotion on non-inferiority for safety and primary quality SLI"
  - "Retain experiment reports under imports/prompt-ab-shadow-eval/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Workbook — Managing Risk (change management parallels)"
    url: "https://sre.google/workbook/"
  - title: "OWASP LLM — LLM01 Prompt Injection"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
