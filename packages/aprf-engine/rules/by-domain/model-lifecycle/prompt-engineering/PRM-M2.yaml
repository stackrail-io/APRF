id: "PRM-M2"
category: "prompt-engineering"
title: "Prompt changes must go through review and be tied to evaluation results before release"
description: >
  Production prompt releases shall go through human (or equivalent) review and
  link a passing eval artifact before promotion, with promote-without-review-
  and-eval blocked on the release path.
whyItMatters: >
  Prompt edits change model behavior as much as model swaps—but often ship as
  “config.” Without review IDs and linked eval passes, regressions land on
  customers first. Gating promotion on both turns prompt change into a
  deliberate, measurable release.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  100% of production prompt releases in the last 30 days have a review ID and
  eval pass artifact; promote-without-both is blocked (release evidence
  measuredAt ≤90 days).
evidenceRequired:
  - "Change records linking prompt versions to review IDs and eval pass artifacts"
  - "CI/registry gate (or equivalent) blocking promote without review + eval"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-prompt-change-review-eval"
      params:
        hint: >
          Discover prompt-release change records with review IDs and eval pass
          artifacts, and gates that block promote-without-both.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of production prompt
          releases in the last 30 days have review ID + eval pass artifact and
          promote-without-both is blocked (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production prompt releases occur. If none, score NOT_APPLICABLE.
  2) Open change records for the last 30 days; confirm each release links a
  review ID and an eval pass artifact. 3) Confirm promote-without-both is
  blocked (failed/missing gate prevents release). 4) PASS only if 100% linkage
  + blocking gate hold with measuredAt ≤90 days. PRM-M1 version/owner inventory
  alone does not satisfy. EVL-M1 journey suites without prompt-release linkage
  do not satisfy. MOD-M2 model-promotion gates alone do not satisfy.
falsePositiveGuidance: >
  Do not pass informal Slack approvals without a review ID. Do not pass eval
  runs unrelated to the released prompt version. Do not pass optional CI checks
  that can be skipped. Do not pass evidence older than 90 days as current.
  Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Require review ID + eval pass artifact on every production prompt release"
  - "Block promote-without-both in CI or the prompt registry"
  - "Retain change records under imports/prompt-change-review-eval/"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE Workbook — Managing Risk (change management parallels)"
    url: "https://sre.google/workbook/"
  - title: "OWASP LLM Prompt Injection guidance"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "PRM-M1"
  - "PRM-M3"
  - "PRM-R1"
  - "PRM-R2"
  - "PRM-R3"
  - "EVL-M1"
  - "EVL-M2"
  - "MOD-M2"
  - "CHG-M1"
tags:
  - "prompt-engineering"
  - "mandatory"
  - "hybrid"
  - "prompt-review"
  - "eval-gate"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
