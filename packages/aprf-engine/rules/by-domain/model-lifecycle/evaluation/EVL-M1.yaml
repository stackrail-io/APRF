id: "EVL-M1"
category: "evaluation"
title: "Critical customer journeys must have automated offline eval suites on every relevant change"
description: >
  Every journey marked critical shall have a versioned offline eval suite, and
  every relevant production change in the last 30 days shall have triggered
  that suite—or carry a documented waiver ≤14 days.
whyItMatters: >
  Shipping prompt, model, or tool changes without offline evals on critical
  journeys turns production into the test environment. Silent quality and
  safety regressions land on customers first. Versioned suites wired to
  relevant changes—with short, owned waivers only—make eval a release
  control, not an optional homework assignment.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  100% of journeys marked critical have a versioned offline suite; 100% of
  relevant production changes in the last 30 days triggered the suite (or
  documented waiver ≤14 days) (suite/CI evidence measuredAt ≤90 days). If no journeys are marked critical, score NOT_APPLICABLE.
evidenceRequired:
  - "Eval suite registry mapping critical journeys to versioned offline suites"
  - "CI (or equivalent) runs on prompt/model/tool changes for the last 30 days, or waivers ≤14 days"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-eval-suite-present"
      params:
        hint: >
          Discover versioned offline eval suites mapped to critical journeys
          and CI/workflow triggers on prompt/model/tool changes.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of critical
          journeys have a versioned offline suite and 100% of relevant
          production changes in the last 30 days triggered the suite or have
          a waiver ≤14 days (measuredAt ≤90 days).
manualVerification: >
  1) Confirm the system has journeys marked critical. If none, score
  NOT_APPLICABLE. 2) Open the eval suite registry; confirm each
  critical journey maps to a versioned offline suite. 3) Review relevant
  production changes in the last 30 days (prompt/model/tool/config that affects
  those journeys). 4) Confirm each change triggered the suite in CI (or
  equivalent) or has a documented waiver ≤14 days with owner. 5) PASS only if
  registry coverage + change trigger/waiver hold with measuredAt ≤90 days.
  Ad-hoc notebooks without versioning do not satisfy. Suites that never run on
  change do not satisfy.
falsePositiveGuidance: >
  Do not pass a single shared “smoke prompt” as coverage for every critical
  journey. Do not pass unit tests that never exercise model/prompt behavior.
  Do not pass DX-R2 local inner-loop evals as a substitute for CI-triggered
  suites on production-relevant changes. Do not pass waivers older than 14
  days as current. Do not pass evidence older than 90 days as current. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Register every critical journey to a versioned offline eval suite (promptfoo or equivalent)"
  - "Trigger suites on prompt/model/tool changes in CI; fail closed when unset"
  - "Limit waivers to ≤14 days with named owner; retain under imports/eval-suite-ci/"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Measure"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "Google SRE — Monitoring Distributed Systems (measurement culture)"
    url: "https://sre.google/sre-book/monitoring-distributed-systems/"
relatedRules:
  - "EVL-M2"
  - "EVL-M3"
  - "EVL-M4"
  - "EVL-R1"
  - "EVL-R2"
  - "CHG-M1"
  - "DX-R2"
tags:
  - "evaluation"
  - "mandatory"
  - "hybrid"
  - "offline-eval"
  - "ci-gate"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
