id: "MOD-M3"
category: "model-governance"
title: "Model changes must require evaluation evidence before promotion"
description: "Model changes shall require evaluation evidence before promotion"
whyItMatters: "Model changes shall require evaluation evidence before promotion Failing this leaves
  a production gap against: 100% of production model promotions in last 30 days have linked eval
  pass artifacts; promote without eval is blocked by gate"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of production model promotions in last 30 days have linked eval pass artifacts;
  promote without eval is blocked by gate"
evidenceRequired:
  - "Promotion policy + CI/registry requiring eval artifact on model version bumps"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Promotion policy + CI/registry requiring eval artifact on model version bumps"
manualVerification: "For this Check (Model changes must require evaluation evidence before
  promotion): inspect current evidence for [Promotion policy + CI/registry requiring eval artifact
  on model version bumps] and confirm the pass condition holds — 100% of production model promotions
  in last 30 days have linked eval pass artifacts; promote without eval is blocked by gate"
falsePositiveGuidance: "(Model Governance): re-verify against a current artifact for this specific
  Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Model changes must require evaluation evidence before promotion"
  - "Retain evidence artifacts required by this Check, starting with: Promotion policy + CI/registry
    requiring eval artifact on model version bumps"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Map"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "AWS Well-Architected — Operational Excellence (change management parallels)"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "MOD-M1"
  - "MOD-M2"
  - "MOD-R1"
  - "MOD-R2"
  - "MOD-R3"
tags:
  - "model-governance"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
