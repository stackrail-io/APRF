id: "MOD-R2"
category: "model-governance"
title: "Production systems should have capability allowlists (e.g., code execution, vision) per workload"
description: "Capability allowlists (e.g., code execution, vision) per workload"
whyItMatters: "Capability allowlists (e.g., code execution, vision) per workload Failing this leaves
  a production gap against: Each production workload has an explicit capability allowlist; a denied
  capability attempt is recorded in test or prod within 90 days"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Each production workload has an explicit capability allowlist; a denied capability
  attempt is recorded in test or prod within 90 days"
evidenceRequired:
  - "Per-workload capability allowlist config (code execution, vision, browsing, etc.) + deny logs"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Per-workload capability allowlist config (code execution, vision, browsing, etc.) + deny
          logs"
manualVerification: "For this Check (MOD: Capability allowlists (e.g., code execution, vision) per
  workload): inspect current evidence for [Per-workload capability allowlist config (code execution,
  vision, browsing, etc.) + deny logs] and confirm the pass condition holds — Each production
  workload has an explicit capability allowlist; a denied capability attempt is recorded in test or
  prod within 90 days"
falsePositiveGuidance: "(Model Governance): re-verify against a current artifact for this specific
  Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Capability allowlists (e.g., code execution, vision)
    per workload"
  - "Retain evidence artifacts required by this Check, starting with: Per-workload capability
    allowlist config (code execution, vision, browsing, etc.) + deny logs"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Map"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "AWS Well-Architected — Operational Excellence (change management parallels)"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "MOD-M1"
  - "MOD-M2"
  - "MOD-M3"
  - "MOD-R1"
  - "MOD-R3"
tags:
  - "model-governance"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
