id: "CTX-M2"
category: "context-engineering"
title: "Retrieved and tool-sourced content must be labeled and access-checked before inclusion"
description: "Retrieved and tool-sourced content shall be labeled and access-checked before inclusion"
whyItMatters: "Retrieved and tool-sourced content shall be labeled and access-checked before
  inclusion Failing this leaves a production gap against: Automated tests: unauthorized retrieval
  chunks are excluded at 100%; included chunks carry a source label/type field in 100% of sampled
  assembled contexts"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Automated tests: unauthorized retrieval chunks are excluded at 100%; included chunks
  carry a source label/type field in 100% of sampled assembled contexts"
evidenceRequired:
  - "Context assembly code/tests showing source labels + ACL checks on retrieval/tool results"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Context assembly code/tests showing source labels + ACL checks on retrieval/tool results"
manualVerification: "For this Check (Retrieved and tool-sourced content must be labeled and
  access-checked before inclusion): inspect current evidence for [Context assembly code/tests
  showing source labels + ACL checks on retrieval/tool results] and confirm the pass condition holds
  — Automated tests: unauthorized retrieval chunks are excluded at 100%; included chunks carry a
  source label/type field in 100% of sampled assembled contexts"
falsePositiveGuidance: "(Context Engineering): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Retrieved and tool-sourced content must be labeled and
    access-checked before inclusion"
  - "Retain evidence artifacts required by this Check, starting with: Context assembly code/tests
    showing source labels + ACL checks on retrieval/tool results"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Map and Measure functions"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — Sensitive Information Disclosure"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "CTX-M1"
  - "CTX-M3"
  - "CTX-R1"
  - "CTX-R2"
  - "CTX-R3"
tags:
  - "context-engineering"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "rag-pipelines"
    - "prompt-templates"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
