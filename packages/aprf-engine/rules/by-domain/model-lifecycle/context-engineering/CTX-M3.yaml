id: "CTX-M3"
category: "context-engineering"
title: "Sensitive context classes (secrets, regulated data) must have explicit inclusion policies"
description: >
  Production context assembly shall apply a documented inclusion policy that
  enumerates sensitive classes—including secrets and regulated data—with
  allow/deny rules, and shall strip or block disallowed classes before they
  enter the model context.
whyItMatters: >
  Without a written allow/deny policy for sensitive context classes, assembly
  code improvises: API keys, regulated fields, and credentials leak into prompts
  and tool-result dumps. Explicit classes plus enforcement tests make inclusion
  a fail-closed control—not a hope that the model “won’t repeat secrets.”
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  Policy enumerates sensitive classes and allow/deny rules; tests show
  disallowed classes are stripped or blocked at ≥95% on the sensitive-class
  fixture suite (policy/suite evidence measuredAt ≤90 days).
evidenceRequired:
  - "Data-class inclusion policy enumerating sensitive classes with allow/deny rules"
  - "Enforcement tests or DLP hooks showing ≥95% strip/block on the sensitive-class fixture suite"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-context-sensitive-inclusion"
      params:
        hint: >
          Discover sensitive-context inclusion policies (secrets, regulated
          classes) with allow/deny rules and strip/block enforcement tests on
          context assembly.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove rates, attest a policy enumerating
          sensitive classes with allow/deny rules and a fixture suite showing
          ≥95% strip/block of disallowed classes (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production context assembly can include user, retrieved, or tool
  content that might carry secrets or regulated data. If context is purely
  static non-sensitive templates with no such paths, score NOT_APPLICABLE. 2)
  Open the inclusion policy; confirm sensitive classes are enumerated with
  allow/deny (or equivalent) rules. 3) Review enforcement tests or DLP hooks on
  assembly: disallowed classes stripped/blocked at ≥95% on the fixture suite.
  4) PASS only if policy + ≥95% enforcement hold with measuredAt ≤90 days.
  Generic secrets scanning of the git repo alone does not satisfy. Prompt-only
  “never include secrets” instructions without enforcement do not satisfy.
falsePositiveGuidance: >
  Do not pass PRI-M1 payload classification alone unless it also governs
  context-assembly inclusion with allow/deny and fixture tests. Do not pass
  suites below the ≥95% strip/block threshold. Do not pass policies that list
  classes without deny/strip actions. Do not pass suites older than 90 days as
  current. Sibling Checks (CTX-M2 ACL labels, SEC2 secrets hygiene) do not
  substitute for context-class inclusion policy. Named exceptions need owner
  and expiry ≤90 days.
recommendedFixes:
  - "Publish a sensitive-context inclusion policy with enumerated classes and allow/deny rules"
  - "Wire strip/block (or DLP) on context assembly for disallowed classes"
  - "Add a sensitive-class fixture suite targeting ≥95% block/strip; retain under imports/context-sensitive-inclusion/"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Map and Measure functions"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — LLM02 Sensitive Information Disclosure"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "CTX-M1"
  - "CTX-M2"
  - "CTX-R1"
  - "CTX-R2"
  - "CTX-R3"
  - "PRI-M1"
  - "PRI-M2"
  - "SEC2-M1"
tags:
