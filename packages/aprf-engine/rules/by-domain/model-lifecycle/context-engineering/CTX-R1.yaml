id: "CTX-R1"
category: "context-engineering"
title: "Production systems should monitor context budgets per request with alerts on saturation"
description: >
  Production AI requests should emit per-request context-budget usage metrics,
  and operators should be alerted when usage saturates a documented share of
  max context—or when hard-truncate rate exceeds a defined threshold.
whyItMatters: >
  CTX-M1 budgets only help if someone notices when builders run near the
  ceiling. Without per-request usage telemetry and saturation (or truncate-rate)
  alerts, overflow and silent instruction loss stay invisible until quality or
  cost incidents. Monitoring turns the budget into an operable control.
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  ≥99% of production requests in a 24h sample emit context-budget usage; an
  alert fires when usage exceeds the documented % of max context (or hard
  truncate rate exceeds threshold) (metrics/alert evidence measuredAt ≤90 days).
evidenceRequired:
  - "Per-request context token/budget usage metrics (dashboard or telemetry export)"
  - "Alert rule for context saturation and/or hard-truncate rate with notify proof"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-context-budget-monitoring"
      params:
        hint: >
          Discover per-request context-budget metrics, saturation thresholds,
          and truncate-rate or budget-saturation alert rules.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest ≥99% of production
          requests in a 24h sample emit context-budget usage and a saturation
          or truncate-rate alert that notifies (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI requests assemble bounded context. If none, score
  NOT_APPLICABLE. 2) Open per-request context-budget usage metrics for a 24h
  sample; confirm ≥99% emit usage. 3) Confirm an alert on documented % of max
  context (saturation) and/or hard-truncate rate with a notify channel. 4)
  Review notify proof ≤90 days (synthetic fire or production page). 5) PASS
  only if emit coverage + alert/notify hold with measuredAt ≤90 days. CTX-M1
  budget config alone does not satisfy. Generic LLM latency alerts do not
  satisfy.
falsePositiveGuidance: >
  Do not pass completion max_tokens metrics as context-assembly budget usage.
  Do not pass dashboards without alert rules or unproven notify routing. Do
  not pass samples below ≥99% emit coverage. Do not pass COST-M2 spend alerts
  as context saturation. Do not pass evidence older than 90 days as current.
  Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Emit per-request context_budget_used / max (or equivalent) on production AI paths"
  - "Alert when usage exceeds the documented % of max context, or when hard-truncate rate exceeds threshold"
  - "Prove notify with a synthetic fire; retain under imports/context-budget-monitoring/"
  - "Tune thresholds with owner and expiry ≤90 days when muting"
references:
  - title: "NIST AI RMF — Map and Measure functions"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OpenTelemetry — GenAI semantic conventions"
    url: "https://opentelemetry.io/docs/specs/semconv/gen-ai/"
relatedRules:
