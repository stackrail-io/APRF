id: "CTX-R3"
category: "context-engineering"
title: "Production systems should have structured context blocks (JSON/XML sections) separate
  instructions from data"
description: "Structured context blocks (JSON/XML sections) separate instructions from data"
whyItMatters: "Structured context blocks (JSON/XML sections) separate instructions from data Failing
  this leaves a production gap against: Production assembler emits labeled structured sections (e.g.
  JSON/XML); untrusted data cannot overwrite the instruction section in a red-team or unit test"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Production assembler emits labeled structured sections (e.g. JSON/XML); untrusted
  data cannot overwrite the instruction section in a red-team or unit test"
evidenceRequired:
  - "Context assembly schema/spec separating instruction vs data blocks + sample rendered request"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Context assembly schema/spec separating instruction vs data blocks + sample rendered request"
manualVerification: "For this Check (CTX: Structured context blocks (JSON/XML sections) separate
