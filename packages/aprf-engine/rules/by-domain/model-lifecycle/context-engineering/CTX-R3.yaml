  instruction vs data blocks + sample rendered request] and confirm the pass condition holds —
  Production assembler emits labeled structured sections (e.g. JSON/XML); untrusted data cannot
  overwrite the instruction section in a red-team or unit test"
falsePositiveGuidance: "(Context Engineering): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
