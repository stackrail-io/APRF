id: "INC-M1"
category: "incident-readiness"
title: "AI-specific incident playbooks must exist for abuse, leakage, bad actions, and provider outage"
description: >
  Production AI systems must maintain incident playbooks for abuse, data
  leakage, bad agent/tool actions, and provider outage—each with a named owner
  and a review date within the last 12 months.
whyItMatters: >
  Generic outage runbooks do not cover AI-specific failure modes. Without
  owned, recently reviewed playbooks for abuse, leakage, bad actions, and
  provider loss, on-call improvises under pressure and containment is slow or
  incomplete.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  Four playbooks present (abuse, leakage, bad actions, provider outage), each
  with owner and review date ≤12 months (playbook evidence measuredAt ≤90
  days).
evidenceRequired:
  - "Playbook set covering abuse, leakage, bad actions, and provider outage with owners"
  - "Review dates ≤12 months for each of the four playbooks"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-incident-playbooks"
      params:
        hint: >
          Discover AI-specific incident playbooks for abuse, leakage, bad
          actions, and provider outage, plus owner and review-date coverage.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest all four playbooks exist
          with owners and review dates ≤12 months (measuredAt ≤90 days).
manualVerification: >
  1) Confirm a production AI system is in scope. If none, score NOT_APPLICABLE.
  2) Confirm playbooks exist for abuse, leakage, bad actions, and provider
  outage. 3) Confirm each has a named owner. 4) Confirm each was reviewed
  within the last 12 months. 5) PASS only if all four + owners + fresh reviews
  hold with measuredAt ≤90 days. INC-M2 containment drills alone do not prove
  the four playbooks. Generic SRE incident docs that omit AI scenarios do not
  satisfy. A single combined doc may pass only if it clearly covers all four
  scenarios with owners and review dates.
falsePositiveGuidance: >
  Do not pass placeholder stubs without owners or review dates. Do not pass
  reviews older than 12 months. Do not pass a provider-outage playbook that only
  covers non-AI infrastructure. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Author and own playbooks for abuse, leakage, bad actions, and provider outage"
  - "Review each playbook on a ≤12-month cadence and retain dates"
  - "Retain evidence under imports/incident-playbooks/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE — Managing Incidents"
    url: "https://sre.google/sre-book/managing-incidents/"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "INC-M2"
  - "INC-R2"
  - "INC-R4"
  - "INC-R1"
  - "INC-R3"
  - "AGN-M3"
  - "CHG-M2"
tags:
  - "incident-readiness"
  - "mandatory"
  - "hybrid"
  - "playbooks"
  - "ai-incidents"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
