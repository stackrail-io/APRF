id: "INC-R1"
category: "incident-readiness"
title: "Production systems should page on safety and quality signals, not only infra"
description: >
  On-call should receive page-worthy alerts for at least two non-infra AI
  safety/quality signals, each with a documented threshold and owner, and a
  policy reviewed within 90 days.
whyItMatters: >
  Infra pages alone miss AI failure modes—refusal spikes, eval drops,
  toxicity/jailbreak hits—until customers or regulators notice. Paging with
  owned thresholds turns those signals into incidents before blast radius grows.
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  At least two non-infra signals (e.g. refusal-rate spike, eval-score drop,
  toxicity/jailbreak hit rate) page an on-call; each has a documented threshold
  and owner; policy reviewed ≤90 days ago (alert evidence measuredAt ≤90 days).
evidenceRequired:
  - "On-call alert policy export listing safety/quality pages"
  - "Last 90 days of triggered incidents or drill tickets for those pages"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-safety-quality-alerts"
      params:
        hint: >
          Discover on-call alert policies for non-infra AI safety/quality
          signals with thresholds and owners.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest ≥2 non-infra safety/
          quality signals page on-call, each with threshold and owner, and
          policy reviewed ≤90 days (measuredAt ≤90 days).
manualVerification: >
  1) Confirm a production AI system is in scope. If none, score NOT_APPLICABLE.
  2) Confirm an on-call alert policy lists ≥2 non-infra safety/quality signals
  that page (e.g. refusal-rate spike, eval-score drop, toxicity/jailbreak hit
  rate). 3) Confirm each signal has a documented threshold and owner. 4)
  Confirm policy review ≤90 days ago (or triggered incidents/drill tickets in
  last 90 days). 5) PASS only if all hold with measuredAt ≤90 days. Infra-only
  CPU/memory/latency pages do not satisfy. COST spend alerts alone do not
  satisfy. OBS dashboards without paging do not satisfy.
falsePositiveGuidance: >
  Do not pass dashboards that do not page. Do not pass a single signal. Do not
  pass thresholds without owners. Do not pass policy older than 90 days. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Define ≥2 non-infra AI safety/quality paging signals with thresholds and owners"
  - "Wire those signals to on-call and retain policy export + recent pages/drills"
  - "Retain evidence under imports/ai-safety-quality-alerts/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE — Monitoring Distributed Systems"
    url: "https://sre.google/sre-book/monitoring-distributed-systems/"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "INC-M1"
  - "INC-M2"
  - "INC-R2"
  - "INC-R3"
  - "INC-R4"
  - "OBS-M1"
tags:
  - "incident-readiness"
  - "recommended"
  - "hybrid"
  - "paging"
  - "safety-quality"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
