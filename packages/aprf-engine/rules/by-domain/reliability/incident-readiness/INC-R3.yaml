id: "INC-R3"
category: "incident-readiness"
title: "Production systems should have customer notification criteria for AI-related events"
description: "Customer notification criteria for AI-related events"
whyItMatters: "Customer notification criteria for AI-related events Failing this leaves a production
  gap against: Criteria map event types (safety incident, widespread quality fail, data exposure) to
  notify / no-notify; last drill or incident ≤12 months followed the criteria with timestamps"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Criteria map event types (safety incident, widespread quality fail, data exposure)
  to notify / no-notify; last drill or incident ≤12 months followed the criteria with timestamps"
evidenceRequired:
  - "Customer notification criteria for AI-related events + last drill or real notification sample"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Customer notification criteria for AI-related events + last drill or real notification
          sample"
manualVerification: "For this Check (Customer notification criteria for AI-related events): inspect
  current evidence for [Customer notification criteria for AI-related events + last drill or real
  notification sample] and confirm the pass condition holds — Criteria map event types (safety
  incident, widespread quality fail, data exposure) to notify / no-notify; last drill or incident
  ≤12 months followed the criteria with timestamps"
falsePositiveGuidance: "(Incident Readiness): re-verify against a current artifact for this specific
  Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Customer notification criteria for AI-related events"
  - "Retain evidence artifacts required by this Check, starting with: Customer notification criteria
    for AI-related events + last drill or real notification sample"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE — Managing Incidents"
    url: "https://sre.google/sre-book/managing-incidents/"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
