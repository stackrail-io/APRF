id: "PERF-M2"
category: "performance-slo"
title: "Online dashboards must track AI latency, error, and at least one quality or task-success signal"
description: "Online dashboards shall track AI latency, error, and at least one quality or task-success signal"
whyItMatters: "Online dashboards shall track AI latency, error, and at least one quality or
  task-success signal Failing this leaves a production gap against: Dashboard panels for latency,
  error rate, and ≥1 quality/task-success signal are live with freshness ≤ 15 minutes"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Dashboard panels for latency, error rate, and ≥1 quality/task-success signal are
  live with freshness ≤ 15 minutes"
evidenceRequired:
  - "Dashboard URLs/config showing latency, error, and quality/task-success panels"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Dashboard URLs/config showing latency, error, and quality/task-success panels"
manualVerification: "For this Check (Online dashboards must track AI latency, error, and at least
  one quality or task-success signal): inspect current evidence for [Dashboard URLs/config showing
  latency, error, and quality/task-success panels] and confirm the pass condition holds — Dashboard
  panels for latency, error rate, and ≥1 quality/task-success signal are live with freshness ≤ 15
  minutes"
falsePositiveGuidance: "(Performance & SLO Engineering): re-verify against a current artifact for
  this specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Online dashboards must track AI latency, error, and at least one
    quality or task-success signal"
  - "Retain evidence artifacts required by this Check, starting with: Dashboard URLs/config showing
    latency, error, and quality/task-success panels"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE — Service Level Objectives"
    url: "https://sre.google/sre-book/service-level-objectives/"
  - title: "AWS Well-Architected — Performance Efficiency"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "PERF-M1"
  - "PERF-M3"
  - "PERF-R1"
  - "PERF-R2"
  - "PERF-R3"
tags:
  - "performance-slo"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "cicd"
    - "kubernetes"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
