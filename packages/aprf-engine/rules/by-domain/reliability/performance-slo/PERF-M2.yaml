id: "PERF-M2"
category: "performance-slo"
title: "Production AI services must expose latency, error, and AI quality metrics"
description: >
  Production AI services must collect and make available operational metrics
  for latency, error rate, and at least one AI-specific quality or task-success
  indicator.
whyItMatters: >
  Without emitted latency, error, and AI quality metrics, operators cannot
  monitor journeys, burn error budgets, or feed dashboards and alerts. Written
  SLOs (PERF-M1) stay aspirational until the underlying time series exist.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  Metrics for latency, error rate, and at least one AI-specific quality or
  task-success indicator are collected and available for operational monitoring
  (metrics evidence measuredAt ≤90 days). If no production AI services are in scope, score NOT_APPLICABLE.
evidenceRequired:
  - "Metric definitions or exporters covering latency, error rate, and ≥1 AI quality/task-success signal"
  - "Proof metrics are queryable/available for operational monitoring"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-ops-metrics"
      params:
        hint: >
          Discover latency, error-rate, and AI quality/task-success metric
          definitions or exporters available for operational monitoring.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest latency, error rate, and
          ≥1 AI quality/task-success metric are collected and available for
          operational monitoring (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI services are in scope. If none, score
  NOT_APPLICABLE. 2) Confirm latency metrics are collected and queryable.
  3) Confirm error-rate metrics are collected and queryable. 4) Confirm at
  least one AI-specific quality or task-success metric is collected and
  queryable. 5) PASS only if all three classes are available with measuredAt
  ≤90 days. PERF-R4 near-real-time dashboards alone do not prove collection.
  PERF-M1 SLO catalog alone does not prove emitted metrics. EVL-M3 covers
  online eval/refusal signals but does not replace latency/error ops metrics.
falsePositiveGuidance: >
  Do not pass infra CPU metrics as AI latency. Do not pass a single quality
  metric without latency and error. Do not pass metric stubs that are not
  queryable in an ops tool. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Emit latency, error-rate, and ≥1 AI quality/task-success metrics from production AI paths"
  - "Expose them in the ops metrics backend used for monitoring"
  - "Retain evidence under imports/ai-ops-metrics/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE — Service Level Objectives"
    url: "https://sre.google/sre-book/service-level-objectives/"
  - title: "AWS Well-Architected — Performance Efficiency"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
