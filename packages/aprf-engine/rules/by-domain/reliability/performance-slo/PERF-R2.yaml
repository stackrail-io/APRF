id: "PERF-R2"
category: "performance-slo"
title: "Production systems should have capacity and load tests include adversarial long-prompt and
  agent-loop scenarios"
description: "Capacity and load tests include adversarial long-prompt and agent-loop scenarios"
whyItMatters: "Capacity and load tests include adversarial long-prompt and agent-loop scenarios
  Failing this leaves a production gap against: Last capacity test ≤90 days includes adversarial
  long prompts and multi-step agent loops; p95 latency and error rate stay within SLO under
  documented concurrency"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Last capacity test ≤90 days includes adversarial long prompts and multi-step agent
  loops; p95 latency and error rate stay within SLO under documented concurrency"
evidenceRequired:
  - "Load-test plan including long-prompt and agent-loop scenarios + latest capacity test report"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Load-test plan including long-prompt and agent-loop scenarios + latest capacity test report"
manualVerification: "For this Check (Capacity and load tests include adversarial long-prompt and
  agent-loop scenarios): inspect current evidence for [Load-test plan including long-prompt and
  agent-loop scenarios + latest capacity test report] and confirm the pass condition holds — Last
  capacity test ≤90 days includes adversarial long prompts and multi-step agent loops; p95 latency
  and error rate stay within SLO under documented concurrency"
falsePositiveGuidance: "(Performance & SLO Engineering): re-verify against a current artifact for
  this specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Capacity and load tests include adversarial
    long-prompt and agent-loop scenarios"
  - "Retain evidence artifacts required by this Check, starting with: Load-test plan including
    long-prompt and agent-loop scenarios + latest capacity test report"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE — Service Level Objectives"
    url: "https://sre.google/sre-book/service-level-objectives/"
  - title: "AWS Well-Architected — Performance Efficiency"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "PERF-M1"
  - "PERF-M2"
  - "PERF-M3"
  - "PERF-R1"
  - "PERF-R3"
tags:
  - "performance-slo"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "cicd"
    - "kubernetes"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
