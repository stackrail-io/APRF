  - "PERF-M2"
  - "PERF-M3"
  - "PERF-R2"
  - "PERF-R3"
  - "PERF-R4"
  - "CHG-R3"
  - "CHG-M1"
tags:
  - "performance-slo"
  - "recommended"
  - "hybrid"
  - "error-budget"
  - "release-gate"
applicability:
