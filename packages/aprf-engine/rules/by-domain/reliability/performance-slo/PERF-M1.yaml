id: "PERF-M1"
category: "performance-slo"
title: "Critical AI user journeys must have documented latency and availability SLOs"
description: "Critical AI user journeys shall have documented latency and availability SLOs"
whyItMatters: "Critical AI user journeys shall have documented latency and availability SLOs Failing
  this leaves a production gap against: 100% of journeys marked critical have availability % and
  latency percentile targets recorded"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of journeys marked critical have availability % and latency percentile targets recorded"
evidenceRequired:
  - "SLO catalog with numeric targets per journey"
detection:
  capability: "manual"
  detectors: []
manualVerification: "For this Check (Critical AI user journeys must have documented latency and
  availability SLOs): inspect current evidence for [SLO catalog with numeric targets per journey]
  and confirm the pass condition holds — 100% of journeys marked critical have availability % and
  latency percentile targets recorded"
falsePositiveGuidance: "(Performance & SLO Engineering): re-verify against a current artifact for
  this specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Critical AI user journeys must have documented latency and
    availability SLOs"
  - "Retain evidence artifacts required by this Check, starting with: SLO catalog with numeric
    targets per journey"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE — Service Level Objectives"
    url: "https://sre.google/sre-book/service-level-objectives/"
  - title: "AWS Well-Architected — Performance Efficiency"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "PERF-M2"
  - "PERF-M3"
  - "PERF-R1"
  - "PERF-R2"
  - "PERF-R3"
tags:
  - "performance-slo"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "cicd"
    - "kubernetes"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
