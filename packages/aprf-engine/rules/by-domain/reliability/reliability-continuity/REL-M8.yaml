id: "REL-M8"
category: "reliability-continuity"
title: "Contractual and technical multi-provider options must exist for Level 5 continuity"
description: "Contractual and technical multi-provider options shall exist for Level 5 continuity"
whyItMatters: "Contractual and technical multi-provider options shall exist for Level 5 continuity
  Failing this leaves a production gap against: PASS if Level 5 workloads have a documented
  alternate provider/path and a successful failover test ≤180 days"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "PASS if Level 5 workloads have a documented alternate provider/path and a successful
  failover test ≤180 days"
evidenceRequired:
  - "Provider contract summary + technical failover design and test evidence"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Provider contract summary + technical failover design and test evidence"
manualVerification: "For this Check (Contractual and technical multi-provider options must exist for
  Level 5 continuity): inspect current evidence for [Provider contract summary + technical failover
  design and test evidence] and confirm the pass condition holds — PASS if Level 5 workloads have a
  documented alternate provider/path and a successful failover test ≤180 days"
falsePositiveGuidance: "(Reliability & Continuity): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Contractual and technical multi-provider options must exist for
    Level 5 continuity"
  - "Retain evidence artifacts required by this Check, starting with: Provider contract summary +
    technical failover design and test evidence"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Disaster Recovery"
    url: "https://sre.google/sre-book/disaster-recovery/"
relatedRules:
  - "REL-M1"
  - "REL-M2"
  - "REL-M3"
  - "REL-M4"
  - "REL-M5"
tags:
  - "reliability-continuity"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
