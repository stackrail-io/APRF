id: "REL-M3"
category: "reliability-continuity"
title: "Tool-using AI workflows must detect partial failures and prevent false-success completion"
description: >
  Tool-using AI workflows shall detect partial tool failures (success then
  failure mid-sequence, truncated results, or failed side effects) and must
  not report overall success without explicit compensation, rollback, retry,
  or human approval.
whyItMatters: >
  Partial tool success followed by a later failure is a common false-success
  path: the workflow claims the goal completed while side effects are
  incomplete or inconsistent. Without test evidence that this outcome is
  prevented, production systems silently leave users and downstream systems
  in a broken state.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  Test evidence demonstrates that when a tool partially succeeds and a later
  step fails, the workflow does not report overall success without explicit
  compensation, rollback, retry, or human approval (measuredAt ≤90 days).
evidenceRequired:
  - "Agent/tool error-handling policy or code that detects partial tool failure"
  - "Test evidence (integration, chaos, e2e, replay, contract, simulator, or equivalent) showing no false-success without compensation/rollback/retry/approval (≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-partial-tool-failure"
      params:
        hint: >
          Discover partial-failure handling for tool/agent workflows and test
          evidence that asserts no false-success without compensation,
          rollback, retry, or approval.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest test evidence shows the
          workflow never reports overall success after partial tool failure
          without compensation, rollback, retry, or human approval
          (measuredAt ≤90 days).
manualVerification: >
  1) Confirm tool-using agents or workflows exist. If none, score
  NOT_APPLICABLE. 2) Locate detection of partial tool failure (mid-sequence
  error, truncated payload, failed side effect after earlier success). 3)
  Review test evidence ≤90 days (integration, chaos, e2e, replay, contract,
  simulator, or equivalent) demonstrating that when a tool partially succeeds
  and a later step fails, the workflow does not claim overall success without
  compensation, rollback, retry, or human approval. 4) PASS only if handling +
  outcome evidence hold. REL-M1 timeouts alone do not prove partial-failure
  detection. REL-M2 degraded-mode docs alone do not prove mid-tool-sequence
  handling. Generic exception handling that suppresses or masks failures while
  reporting successful completion does not satisfy this control.
falsePositiveGuidance: >
  Do not pass unit tests that only assert thrown exceptions without checking
  the workflow’s final success claim. Do not pass retries that remask partial
  failure as eventual success without a defined abort, rollback, compensation,
  or approval path. Do not pass prompt-only “check tool results” guidance.
  Do not require a specific test technique (injection-only) when other valid
  evidence demonstrates the outcome. Sibling REL-M1/REL-M2 and tool-schema
  Checks (TOL-*) do not substitute. Named exceptions need owner and expiry
  ≤90 days.
recommendedFixes:
  - "Detect partial tool failures explicitly; abort, rollback, retry, compensate, or require human approval before reporting success"
  - "Add test evidence (integration, chaos, e2e, replay, contract, or simulator) that proves no false overall success after partial failure"
  - "Retain evidence under imports/ai-partial-tool-failure/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Testing for Reliability"
    url: "https://sre.google/sre-book/testing-reliability/"
relatedRules:
