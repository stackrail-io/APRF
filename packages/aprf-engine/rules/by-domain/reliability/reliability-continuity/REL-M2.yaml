id: "REL-M2"
category: "reliability-continuity"
title: "Critical user journeys must define a degraded mode when AI is unavailable"
description: >
  Every critical user journey that depends on AI shall document degraded
  behavior when the AI dependency fails, and a failover test shall show a
  non-AI or safe fallback activates—not a blank error or silent hang.
whyItMatters: >
  When the model, tool, or AI gateway is down, critical journeys still need a
  defined path: cached answer, human handoff, rule-based fallback, or graceful
  denial. Undocumented degraded modes leave operators improvising under
  outage and customers stuck with opaque failures.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  100% of critical AI-dependent journeys document degraded behavior; a failover
  test shows non-AI or safe fallback activates when the AI dependency fails
  (measuredAt ≤90 days). If no critical AI-dependent user journeys exist, score NOT_APPLICABLE.
evidenceRequired:
  - "Degraded-mode specification covering each critical AI-dependent journey"
  - "Feature-flag, circuit-breaker, or fallback test proving safe activation when AI fails (≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-degraded-mode"
      params:
        hint: >
          Discover degraded-mode / fallback / feature-flag specs for critical
          AI journeys and failover-test signals that exercise safe fallback.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of critical
          AI-dependent journeys document degraded behavior and a failover test
          shows safe fallback (measuredAt ≤90 days).
manualVerification: >
  1) Confirm critical AI-dependent user journeys exist. If none, score
  NOT_APPLICABLE. 2) For each journey, locate documented degraded behavior
  (non-AI path, safe denial, human handoff, or equivalent). Blank “AI
  required” with no fallback fails. 3) Review a failover test ≤90 days that
  forces AI failure and shows the safe fallback activates. 4) PASS only if
  documentation coverage is 100% and the test holds. REL-R3 continuity-option
  docs alone do not prove journey-level degraded mode. REL-M5 RTO/RPO alone
  does not prove runtime fallback. Multi-provider model routing alone does
  not prove a non-AI or safe user-facing fallback.
falsePositiveGuidance: >
  Do not pass marketing “graceful degradation” claims without a journey-level
  spec. Do not pass generic HTTP 503 pages that omit AI-journey behavior. Do
  not pass feature flags that only disable AI without defined degraded UX. Do
  not pass untested runbooks. Sibling REL-R3, REL-M5, and multi-provider
  fallback Checks do not substitute. Named exceptions need owner and expiry
  ≤90 days.
recommendedFixes:
  - "Document degraded mode for every critical AI-dependent journey"
  - "Add a failover test that forces AI failure and asserts safe fallback activation"
  - "Retain evidence under imports/ai-degraded-mode/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Embracing Risk"
    url: "https://sre.google/sre-book/embracing-risk/"
relatedRules:
  - "REL-M1"
  - "REL-M3"
  - "REL-R3"
  - "REL-M5"
  - "PERF-M1"
  - "CHG-M2"
tags:
