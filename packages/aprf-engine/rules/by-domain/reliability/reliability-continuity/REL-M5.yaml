id: "REL-M5"
category: "reliability-continuity"
title: "Business-critical AI services must have documented RTO and RPO objectives"
description: >
  Every business-critical AI service must have numeric RTO and RPO documented
  in continuity, service-catalog, or disaster-recovery materials and linked to
  a tested restore or failover procedure.
whyItMatters: >
  Disaster recovery is planned for services, not per feature. Without numeric
  RTO/RPO tied to a tested restore path, business-critical AI services have no
  continuity contract—operators discover recovery time only during an outage.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  100% of business-critical AI services have numeric RTO and RPO documented
  and linked to a tested restore/failover procedure (continuity evidence
  measuredAt ≤90 days). If none (business-critical AI services are in scope), score NOT_APPLICABLE.
evidenceRequired:
  - "Business continuity, service-catalog, or disaster-recovery documentation with numeric RTO and RPO for business-critical AI services"
  - "Linkage from each in-scope service to a tested restore/failover procedure"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-rto-rpo-catalog"
      params:
        hint: >
          Discover BCP, service-catalog, or DR documentation with numeric RTO
          and RPO for business-critical AI services plus tested
          restore/failover linkage.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of business-critical
          AI services have numeric RTO and RPO documented and linked to a
          tested restore/failover procedure (measuredAt ≤90 days).
manualVerification: >
  1) Confirm business-critical AI services are in scope. If none, score
  NOT_APPLICABLE. 2) Confirm numeric RTO and RPO appear in business continuity,
  service-catalog, or disaster-recovery documentation (not only a standalone
  RTO/RPO spreadsheet). 3) Confirm each in-scope service links to a restore or
  failover procedure that has been tested. 4) PASS only if coverage is 100%
  with measuredAt ≤90 days. REL-M4 backup/restore of control-plane artifacts
  alone does not prove service RTO/RPO. PERF-M1 latency/availability SLOs alone
  do not prove recovery objectives. Untested runbooks without a
  restore/failover link do not satisfy.
falsePositiveGuidance: >
  Do not pass blank RTO templates. Do not pass RTO without RPO (or the reverse).
  Do not pass feature-level notes that omit the owning business-critical
  service. Do not pass unlinked procedures or untested failover docs. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Document numeric RTO and RPO for every business-critical AI service in BCP, service catalog, or DR materials"
  - "Link each service to a tested restore/failover procedure"
  - "Retain evidence under imports/ai-rto-rpo-catalog/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Disaster Recovery"
    url: "https://sre.google/sre-book/disaster-recovery/"
relatedRules:
