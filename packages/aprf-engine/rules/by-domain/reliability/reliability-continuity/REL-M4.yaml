id: "REL-M4"
category: "reliability-continuity"
title: "Backups must include AI control-plane artifacts needed to restore service"
description: >
  Backup inventories shall include the AI control-plane artifacts required to
  restore service (prompt registry, policies, indexes, and other declared
  dependencies), and a restore test of a sample artifact set shall succeed
  within 90 days.
whyItMatters: >
  Restoring compute without prompts, policies, or retrieval indexes leaves the
  AI service unable to serve correctly. Control-plane backups plus a recent
  restore test prove the system can return to a working state—not just that
  disks were snapshotted.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  Backup inventory includes required AI control-plane artifacts; a restore test
  in the last 90 days succeeds for a sample artifact set (measuredAt ≤90 days).
evidenceRequired:
  - "Backup job or inventory covering required AI control-plane artifacts (prompt registry, policies, indexes, as applicable)"
  - "Restore test report for a sample artifact set (≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-control-plane-backup"
      params:
        hint: >
          Discover backup inventory/config covering AI control-plane artifacts
          and restore-test signals for a sample artifact set.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest backup inventory includes
          required AI control-plane artifacts and a restore test succeeded in
          the last 90 days (measuredAt ≤90 days).
manualVerification: >
  1) Confirm AI control-plane artifacts exist in scope (prompt registry,
  policies, vector/index state, or equivalent). If none, score NOT_APPLICABLE.
  2) Locate backup inventory or job config that includes those artifact classes.
  App/DB backups that omit AI control-plane artifacts fail. 3) Review a restore
  test ≤90 days that restores a sample artifact set successfully. 4) PASS only
  if inventory coverage + restore evidence hold. REL-M5 RTO/RPO alone does not
  prove control-plane backups. REL-R3 continuity-option docs alone do not prove
  restoreable artifact inventories.
falsePositiveGuidance: >
  Do not pass infrastructure snapshots that omit prompt registries, policy
  stores, or indexes required for AI restore. Do not pass backup configs without
  a recent successful restore test. Do not pass restore of unrelated app data as
  control-plane evidence. Sibling REL-M5 and REL-R3 do not substitute. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Include prompt registry, policies, indexes, and other required AI control-plane artifacts in backup inventory"
  - "Run and retain a sample restore test at least every 90 days"
  - "Retain evidence under imports/ai-control-plane-backup/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Disaster Recovery"
    url: "https://sre.google/sre-book/disaster-recovery/"
relatedRules:
