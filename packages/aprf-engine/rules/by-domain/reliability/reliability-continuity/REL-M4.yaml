id: "REL-M4"
category: "reliability-continuity"
title: "Critical AI-dependent processes must have documented continuity options"
description: "Critical AI-dependent processes shall have documented continuity options"
whyItMatters: "Critical AI-dependent processes shall have documented continuity options Failing this
  leaves a production gap against: 100% of processes marked critical-AI-dependent have ≥1 documented
  continuity option with owner"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of processes marked critical-AI-dependent have ≥1 documented continuity option with owner"
evidenceRequired:
  - "Continuity options doc per critical process (failover, manual, alternate provider)"
detection:
  capability: "manual"
  detectors: []
manualVerification: "For this Check (Critical AI-dependent processes must have documented continuity
  options): inspect current evidence for [Continuity options doc per critical process (failover,
  manual, alternate provider)] and confirm the pass condition holds — 100% of processes marked
  critical-AI-dependent have ≥1 documented continuity option with owner"
falsePositiveGuidance: "(Reliability & Continuity): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Critical AI-dependent processes must have documented continuity
    options"
  - "Retain evidence artifacts required by this Check, starting with: Continuity options doc per
    critical process (failover, manual, alternate provider)"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Disaster Recovery"
    url: "https://sre.google/sre-book/disaster-recovery/"
relatedRules:
  - "REL-M1"
  - "REL-M2"
  - "REL-M3"
  - "REL-M5"
  - "REL-M6"
tags:
  - "reliability-continuity"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
