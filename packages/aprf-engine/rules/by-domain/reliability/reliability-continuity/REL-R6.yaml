id: "REL-R6"
category: "reliability-continuity"
title: "Production systems should have warm standby for self-hosted inference where required"
description: "Warm standby for self-hosted inference where required"
whyItMatters: "Warm standby for self-hosted inference where required Failing this leaves a
  production gap against: Failover to warm standby completes within documented RTO in the last test
  (≤90 days); standby capacity covers declared peak for critical workloads"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Failover to warm standby completes within documented RTO in the last test (≤90
  days); standby capacity covers declared peak for critical workloads"
evidenceRequired:
  - "Warm-standby inference architecture + last failover test report with RTO result"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Warm-standby inference architecture + last failover test report with RTO result"
manualVerification: "For this Check (Warm standby for self-hosted inference where required): inspect
  current evidence for [Warm-standby inference architecture + last failover test report with RTO
  result] and confirm the pass condition holds — Failover to warm standby completes within
  documented RTO in the last test (≤90 days); standby capacity covers declared peak for critical
  workloads"
falsePositiveGuidance: "(Reliability & Continuity): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Warm standby for self-hosted inference where required"
  - "Retain evidence artifacts required by this Check, starting with: Warm-standby inference
    architecture + last failover test report with RTO result"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Disaster Recovery"
    url: "https://sre.google/sre-book/disaster-recovery/"
relatedRules:
  - "REL-M1"
  - "REL-M2"
  - "REL-M3"
  - "REL-M4"
  - "REL-M5"
tags:
  - "reliability-continuity"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
