id: "DEP-M2"
category: "change-management"
title: "Production AI artifact changes must be recorded (who/what/when) and linked to reviews"
description: >
  Every production AI artifact change should record who changed what and when,
  and link to a review (PR, ticket, or approval ID).
whyItMatters: >
  Without who/what/when plus a review link, production prompt, model, and tool
  changes cannot be audited or blamed correctly—and silent hotfixes become
  invisible to reconstruct after an incident.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  100% of production AI artifact changes in the last 30 days have who/what/when
  fields and a review link (PR, ticket, or approval ID) (change-record evidence
  measuredAt ≤90 days).
evidenceRequired:
  - "Change log or ticket export for AI artifact releases"
  - "Last-30-day coverage showing who/what/when + review link on every change"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-artifact-change-records"
      params:
        hint: >
          Discover change logs / ticket exports for AI artifact releases with
          who/what/when fields and review links.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of last-30-day
          production AI artifact changes have who/what/when and a review link
          (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI artifact changes exist. If none, score
  NOT_APPLICABLE. 2) Confirm a change log or ticket export covers those
  releases. 3) Confirm 100% of changes in the last 30 days have who, what,
  when, and a review link (PR, ticket, or approval ID). 4) PASS only if
  coverage holds with measuredAt ≤90 days. DEP-M1 promotion-path adherence
  alone does not prove who/what/when completeness. DEP-M3 config-as-code alone
  does not prove review linkage. Generic app deploy logs without AI artifact
  scope do not satisfy.
falsePositiveGuidance: >
  Do not pass changelogs missing actor, timestamp, or review ID. Do not pass
  bulk "system" actors without a linked review. Do not pass coverage older than
  90 days or windows shorter than the last 30 days of changes. Named exceptions
  need owner and expiry ≤90 days.
recommendedFixes:
  - "Require who/what/when + review link on every production AI artifact change"
  - "Export and retain last-30-day change coverage for prompts/models/tools"
  - "Retain evidence under imports/ai-artifact-change-records/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
