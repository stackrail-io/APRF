id: "DEP-R2"
category: "change-management"
title: "Production systems should have environment parity checks for model pins and tool catalogs"
description: "Environment parity checks for model pins and tool catalogs"
whyItMatters: "Environment parity checks for model pins and tool catalogs Failing this leaves a
  production gap against: Prod vs staging model pins and tool catalogs match except documented
  deltas; last parity scan ≤30 days with 0 unexplained drifts"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Prod vs staging model pins and tool catalogs match except documented deltas; last
  parity scan ≤30 days with 0 unexplained drifts"
evidenceRequired:
  - "Environment parity checklist for model pins and tool catalogs + last parity scan across envs"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Environment parity checklist for model pins and tool catalogs + last parity scan across envs"
manualVerification: "For this Check (Environment parity checks for model pins and tool catalogs):
  inspect current evidence for [Environment parity checklist for model pins and tool catalogs + last
  parity scan across envs] and confirm the pass condition holds — Prod vs staging model pins and
  tool catalogs match except documented deltas; last parity scan ≤30 days with 0 unexplained drifts"
falsePositiveGuidance: "(Change Management & Release): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Environment parity checks for model pins and tool
    catalogs"
  - "Retain evidence artifacts required by this Check, starting with: Environment parity checklist
    for model pins and tool catalogs + last parity scan across envs"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "DEP-M1"
  - "DEP-M2"
  - "DEP-M3"
  - "CHG-M1"
  - "CHG-M2"
tags:
  - "change-management"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "azure-devops"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
