id: "DEP-R2"
category: "change-management"
title: "Production systems should run environment parity checks for model pins and tool catalogs"
description: >
  Prod and staging model pins and tool catalogs should match except documented
  deltas, proven by a parity scan within the last 30 days with zero unexplained
  drifts.
whyItMatters: >
  Staging that silently diverges from production model pins or tool catalogs
  makes promotions unrepresentative. A recent parity scan with unexplained
  drifts at zero keeps non-prod a trustworthy rehearsal of prod.
severity: "critical"
weight: 4
gate: "recommended"
passCondition: >
  Prod vs staging model pins and tool catalogs match except documented deltas;
  last parity scan ≤30 days with 0 unexplained drifts (parity evidence
  measuredAt ≤90 days). If no model pins and/or tool catalogs exist across prod and staging, score NOT_APPLICABLE.
evidenceRequired:
  - "Environment parity checklist for model pins and tool catalogs"
  - "Last parity scan across envs with 0 unexplained drifts (≤30 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-env-parity-model-tool-catalog"
      params:
        hint: >
          Discover prod vs staging parity checks for model pins and tool
          catalogs, plus a recent scan with unexplained drifts = 0.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest prod vs staging model
          pins and tool catalogs match except documented deltas, with last
          parity scan ≤30 days and unexplained drifts = 0 (measuredAt ≤90
          days).
manualVerification: >
  1) Confirm model pins and/or tool catalogs exist across prod and staging. If
  none, score NOT_APPLICABLE. 2) Confirm a parity checklist or scan covers both
  model pins and tool catalogs. 3) Confirm the last scan is ≤30 days old. 4)
  Confirm unexplained drifts = 0 (documented deltas allowed). 5) PASS only if
  scan freshness + unexplained = 0 hold with measuredAt ≤90 days. DEP-M3
  live-vs-declared drift alone does not prove prod-vs-staging parity. DEP-R1
  canary alone does not prove environment parity. Generic env-diff tools that
  omit model pins or tool catalogs do not satisfy.
falsePositiveGuidance: >
  Do not pass parity that covers only app config and skips model pins/tool
  catalogs. Do not pass unexplained drifts marked "known" without owner and
  expiry. Do not pass a scan older than 30 days. Named exceptions need owner
  and expiry ≤90 days.
recommendedFixes:
  - "Run prod vs staging parity for model pins and tool catalogs on a ≤30-day cadence"
  - "Document allowed deltas; remediate unexplained drifts to 0"
  - "Retain evidence under imports/env-parity-model-tool-catalog/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
