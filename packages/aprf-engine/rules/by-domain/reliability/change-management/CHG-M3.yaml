id: "CHG-M3"
category: "change-management"
title: "Rollback must be tested in a drill or real event on a defined cadence"
description: >
  Production systems shall complete ≥1 successful rollback (drill or real
  incident) in the last 90 days with measured time-to-restore ≤ documented RTO.
whyItMatters: >
  Walkthroughs prove operators can find the runbook; only a timed restore proves
  the path still works under real constraints. Cadenced successful rollback
  within RTO is the difference between a documented hope and a rehearsed escape
  hatch.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  ≥1 successful rollback (drill or real) in the last 90 days with measured
  time-to-restore ≤ documented RTO (drill evidence measuredAt ≤90 days). If none (production AI changes that may need rollback), score NOT_APPLICABLE.
evidenceRequired:
  - "Documented RTO for AI/prompt/model/deploy rollback"
  - "Drill or incident record with timestamps, outcome, and measured time-to-restore"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-rollback-drill"
      params:
        hint: >
          Discover rollback drill or incident records showing successful restore
          within documented RTO in the last 90 days.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest ≥1 successful rollback
          (drill or real) in the last 90 days with measured time-to-restore ≤
          documented RTO (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI changes that may need rollback. If none, score
  NOT_APPLICABLE. 2) Confirm a documented RTO for rollback. 3) Open the latest
  drill or incident record; confirm a successful rollback with timestamps and
  measured time-to-restore ≤ RTO, completed within the last 90 days. 4) PASS
  only if successful restore-within-RTO holds with measuredAt ≤90 days. CHG-M2
  on-call walkthroughs without a successful restore do not satisfy. CHG-M1
  retention dry-runs in staging alone do not satisfy a timed production-path
  drill/incident. PRM-M3 prompt-only restore does not cover full AI rollback
  scope for this Check unless that is the only rollback class in scope.
falsePositiveGuidance: >
  Do not pass a tabletop without an executed restore. Do not pass a failed
  rollback as success. Do not pass time-to-execute of reading a runbook as
  time-to-restore. Do not pass evidence older than 90 days. Named exceptions
  need owner and expiry ≤90 days.
recommendedFixes:
  - "Schedule and execute a rollback drill with measured time-to-restore ≤ RTO"
  - "Retain drill/incident records with timestamps and outcome"
  - "Retain evidence under imports/rollback-drill/"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
