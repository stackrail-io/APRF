id: "DEP-M3"
category: "change-management"
title: "Infrastructure and AI config must be defined as code or equivalent declarative config"
description: >
  Production AI gateway, model pins, tool catalogs, and prompts should be
  declared in IaC or equivalent declarative config, with drift checks showing
  no unmanaged resources and live pins matching declared versions.
whyItMatters: >
  Console-edited AI config drifts from what was reviewed and is hard to roll
  back. Declarative sources plus a recent drift check keep live pins equal to
  what the repo says is production.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Drift check shows 0 unmanaged production AI config resources outside
  declarative sources; sample of live pins matches declared versions at 100%
  (drift evidence measuredAt ≤90 days).
evidenceRequired:
  - "IaC/config repo paths for AI gateway, model pins, tool catalogs, and prompts"
  - "Drift check showing 0 unmanaged AI config resources + 100% live-pin match"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-config-as-code"
      params:
        hint: >
          Discover declarative AI config (gateway, model pins, tool catalogs,
          prompts) and ingest drift/live-pin coverage.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove drift coverage, attest 0 unmanaged
          production AI config resources and 100% live-pin match to declared
          versions (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI config exists (gateway, model pins, tool catalogs,
  or prompts). If none, score NOT_APPLICABLE. 2) Confirm declarative
  IaC/config sources cover those resources. 3) Confirm a drift check shows 0
  unmanaged production AI config resources outside those sources. 4) Confirm a
  sample of live pins matches declared versions at 100%. 5) PASS only if
  declarative coverage + drift = 0 + live match = 100% hold with measuredAt
  ≤90 days. DEP-M1 promotion path alone does not prove config-as-code. DEP-M2
  change records alone do not prove live pins match declared versions. Generic
  app Terraform without AI gateway/pins/tools/prompts does not satisfy.
falsePositiveGuidance: >
  Do not pass README-only config docs without declarative sources. Do not pass
  a drift check that excludes model pins or tool catalogs in scope. Do not
  pass evidence older than 90 days. Named exceptions need owner and expiry
  ≤90 days.
recommendedFixes:
  - "Declare AI gateway, model pins, tool catalogs, and prompts as code"
  - "Run and retain drift checks showing 0 unmanaged resources and 100% live-pin match"
  - "Retain evidence under imports/ai-config-as-code/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
