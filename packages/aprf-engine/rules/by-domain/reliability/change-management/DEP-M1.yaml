id: "DEP-M1"
category: "change-management"
title: "A promotion path must exist from non-prod to prod for prompts, models, and tools"
description: >
  Production prompt, model, and tool releases must flow through a documented
  non-prod→prod promotion path, with no production hot-edits lacking a linked
  change record.
whyItMatters: >
  Hot-editing prompts, model pins, or tools in production skips review and
  rollbackability. A documented promotion path makes every production AI
  artifact change reconstructible and reversible.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  100% of production prompt/model/tool releases in the last 30 days flowed
  through the documented promotion path; 0 production hot-edits without a
  linked change record (promotion evidence measuredAt ≤90 days).
evidenceRequired:
  - "Pipeline/runbook documenting non-prod→prod promotion for prompts, models, and tools"
  - "Last-30-day release coverage showing path adherence + 0 hot-edits without change records"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-artifact-promotion-path"
      params:
        hint: >
          Discover non-prod→prod promotion pipelines/runbooks for prompts,
          models, and tools, plus release-coverage evidence.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of last-30-day
          production prompt/model/tool releases used the documented path and
          hot-edits without change records = 0 (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production prompt/model/tool releases exist. If none, score
  NOT_APPLICABLE. 2) Confirm a documented non-prod→prod promotion path covers
  prompts, models, and tools. 3) Confirm 100% of such releases in the last 30
  days used that path. 4) Confirm 0 production hot-edits without a linked
  change record. 5) PASS only if path + coverage + hot-edit = 0 hold with
  measuredAt ≤90 days. DEP-M2 change-log completeness alone does not prove a
  promotion path. DEP-M3 config-as-code alone does not prove non-prod→prod
  flow. CHG rollback Checks alone do not satisfy promotion-path adherence.
falsePositiveGuidance: >
  Do not pass a generic app CD pipeline that excludes prompts/models/tools.
  Do not pass staging-only promotion docs. Do not pass coverage older than 90
  days or windows shorter than the last 30 days of releases. Named exceptions
  need owner and expiry ≤90 days.
recommendedFixes:
  - "Document and enforce non-prod→prod promotion for prompts, models, and tools"
  - "Eliminate production hot-edits without linked change records"
  - "Retain evidence under imports/ai-artifact-promotion-path/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
