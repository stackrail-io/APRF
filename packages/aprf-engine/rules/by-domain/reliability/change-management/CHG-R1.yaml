id: "CHG-R1"
category: "change-management"
title: "Production systems should have one-click or single-command rollback for AI release units"
description: >
  AI release units (prompts, model pins, tool configs, or AI deploys) should
  roll back with a single documented command or action, proven by an exercise
  or real rollback in the last 90 days completed within documented RTO.
whyItMatters: >
  Multi-step tribal rollback fails under pager load. A single documented action
  plus a recent timed exercise keeps AI release units as reversible units—not
  irreversible config spaghetti.
severity: "critical"
weight: 4
gate: "recommended"
passCondition: >
  AI release unit can be rolled back with a single documented command/action;
  exercise or real rollback ≤90 days completed within documented RTO
  (exercise evidence measuredAt ≤90 days). If none (AI release units ship (prompts, model pins, tools, or AI deploys)), score NOT_APPLICABLE.
evidenceRequired:
  - "One-command or one-click rollback script/action for AI release units"
  - "Last rollback exercise or real event log showing completion within documented RTO (≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-one-click-ai-rollback"
      params:
        hint: >
          Discover single-command/one-click rollback for AI release units and a
          recent exercise or real rollback within RTO.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest a single documented
          command/action rolls back AI release units and an exercise or real
          rollback ≤90 days completed within RTO (measuredAt ≤90 days).
manualVerification: >
  1) Confirm AI release units ship (prompts, model pins, tools, or AI deploys).
  If none, score NOT_APPLICABLE. 2) Confirm a single documented command or
  one-click action rolls back an AI release unit. 3) Confirm an exercise or
  real rollback in the last 90 days completed within documented RTO. 4) PASS
  only if single-action path + timed exercise hold with measuredAt ≤90 days.
  CHG-M2 multi-step runbook walkthroughs alone do not satisfy. CHG-M3 successful
  restore without a single-action path does not satisfy. CHG-R3 SLO-burn
  automation alone does not satisfy a documented one-click operator path.
falsePositiveGuidance: >
  Do not pass a multi-step kubectl/playbook as one-click. Do not pass undeploy
  of the whole service as AI-unit rollback. Do not pass an exercise older than
  90 days or without RTO comparison. Named exceptions need owner and expiry
  ≤90 days.
recommendedFixes:
  - "Provide a single documented command or one-click action to roll back AI release units"
  - "Exercise that path ≤90 days and retain completion within RTO"
  - "Retain evidence under imports/one-click-ai-rollback/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
