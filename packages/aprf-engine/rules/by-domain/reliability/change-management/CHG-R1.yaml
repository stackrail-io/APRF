id: "CHG-R1"
category: "change-management"
title: "Production systems should have one-click or single-command rollback for AI release units"
description: "One-click or single-command rollback for AI release units"
whyItMatters: "One-click or single-command rollback for AI release units Failing this leaves a
  production gap against: AI release unit can be rolled back with a single documented
  command/action; exercise or real rollback ≤90 days completed within documented RTO"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "AI release unit can be rolled back with a single documented command/action; exercise
  or real rollback ≤90 days completed within documented RTO"
evidenceRequired:
  - "Rollback runbook or one-command script for AI release units + last rollback exercise log"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Rollback runbook or one-command script for AI release units + last rollback exercise log"
manualVerification: "For this Check (One-click or single-command rollback for AI release units):
  inspect current evidence for [Rollback runbook or one-command script for AI release units + last
  rollback exercise log] and confirm the pass condition holds — AI release unit can be rolled back
  with a single documented command/action; exercise or real rollback ≤90 days completed within
  documented RTO"
falsePositiveGuidance: "(Change Management & Release): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: One-click or single-command rollback for AI release
    units"
  - "Retain evidence artifacts required by this Check, starting with: Rollback runbook or
    one-command script for AI release units + last rollback exercise log"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
