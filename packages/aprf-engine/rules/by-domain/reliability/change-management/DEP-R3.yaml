id: "DEP-R3"
category: "change-management"
title: "Production systems should automate migration for embedding/index version upgrades"
description: >
  Embedding and index version upgrades should run via automated migration with
  validation gates, and the last upgrade within 12 months should succeed without
  dual-write gaps—or an N/A attestation when no upgrade occurred.
whyItMatters: >
  Manual re-embeds leave dual-write windows and silent retrieval breakage.
  Automated migration with validation gates keeps index versions coherent—and a
  recent successful upgrade (or attested no-upgrade) proves the path is real.
severity: "critical"
weight: 4
gate: "recommended"
passCondition: >
  Index/embedding version upgrades run via automated migration with validation
  gates; last upgrade ≤12 months (or N/A attestation if no upgrade) succeeded
  without dual-write gaps (migration evidence measuredAt ≤90 days).
evidenceRequired:
  - "Embedding/index migration runbook with validation gates"
  - "Last automated migration job log and validation (≤12 months) or no-upgrade attestation"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-embedding-index-migration"
      params:
        hint: >
          Discover automated embedding/index migration with validation gates
          and last-upgrade (or no-upgrade) evidence.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest automated migration with
          validation gates and last upgrade ≤12 months succeeded without
          dual-write gaps—or attest no upgrade in window (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production embeddings or vector indexes exist. If none, score
  NOT_APPLICABLE. 2) If no version upgrade occurred in the last 12 months,
  score NOT_APPLICABLE only with a retained no-upgrade attestation. 3) Confirm
  upgrades run via automated migration with validation gates. 4) Confirm the
  last upgrade ≤12 months succeeded without dual-write gaps. 5) PASS only if
  automation + validation + successful last upgrade hold with measuredAt ≤90
  days. DEP-M3 config-as-code alone does not prove migration automation.
  DEP-R2 env parity alone does not prove embedding/index upgrades. Manual
  re-index scripts without validation gates do not satisfy.
falsePositiveGuidance: >
  Do not pass a one-off notebook re-embed without automation and gates. Do not
  pass dual-write periods left open without cutover validation. Do not pass an
  upgrade older than 12 months as current. Named exceptions need owner and
  expiry ≤90 days.
recommendedFixes:
  - "Automate embedding/index version migrations with validation gates"
  - "Retain last successful migration log ≤12 months (or no-upgrade attestation)"
  - "Retain evidence under imports/embedding-index-migration/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
