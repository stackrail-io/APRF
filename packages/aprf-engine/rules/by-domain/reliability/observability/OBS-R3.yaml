id: "OBS-R3"
category: "observability"
title: "Production systems should have SLO dashboards for AI latency, error, and quality burn"
description: >
  Critical AI journeys should have named SLOs with numeric targets for latency,
  error, and quality burn, plus burn-rate alerts and a dashboard retained for
  review.
whyItMatters: >
  Without journey-level SLOs and burn alerts, AI latency/error/quality
  regressions stay invisible until users escalate. Dashboards turn error budgets
  into operable signals for on-call and release owners.
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  Named SLOs with numeric targets cover latency, error, and quality burn for
  each critical AI journey; burn-rate alerts fire when burn exceeds the
  documented threshold (SLO evidence measuredAt ≤90 days). If none (critical AI journeys are in scope), score NOT_APPLICABLE.
evidenceRequired:
  - "Named SLO targets for critical AI journeys covering latency, error, and quality burn"
  - "Burn-rate alert config + dashboard screenshot or URL with retention note"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-slo-dashboards"
      params:
        hint: >
          Discover named AI SLO targets (latency/error/quality burn), burn-rate
          alerts, and dashboard/retention evidence.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest named SLOs with numeric
          targets for latency, error, and quality burn on each critical AI
          journey, plus burn-rate alerts (measuredAt ≤90 days).
manualVerification: >
  1) Confirm critical AI journeys are in scope. If none, score NOT_APPLICABLE.
  2) Confirm named SLOs with numeric targets exist for each critical journey.
  3) Confirm coverage includes latency, error, and quality burn. 4) Confirm
  burn-rate alerts fire when burn exceeds a documented threshold. 5) Confirm a
  dashboard (screenshot/URL) with a retention note. 6) PASS only if SLOs +
  burn coverage + alerts hold with measuredAt ≤90 days. OBS-M1 linkage alone
  does not prove SLOs. CHG-R3 quality-SLO auto-rollback alone does not prove
  dashboards for all three burn dimensions. Generic infra SLOs without AI
  journey scope do not satisfy.
falsePositiveGuidance: >
  Do not pass dashboard mocks without named numeric targets. Do not pass
  latency-only SLOs missing error or quality burn. Do not pass alerts without a
  documented burn threshold. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Define named numeric SLOs for latency, error, and quality burn per critical AI journey"
  - "Wire burn-rate alerts to the documented threshold and retain a dashboard with retention note"
  - "Retain evidence under imports/ai-slo-dashboards/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Workbook — Observability"
    url: "https://sre.google/workbook/observability/"
  - title: "OpenTelemetry"
    url: "https://opentelemetry.io/"
relatedRules:
  - "OBS-M1"
  - "OBS-M2"
  - "OBS-R1"
  - "OBS-R2"
  - "OBS-R4"
  - "CHG-R3"
  - "INC-M1"
tags:
  - "observability"
  - "recommended"
  - "hybrid"
  - "slo"
  - "burn-rate"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
