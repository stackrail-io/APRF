id: "OBS-R1"
category: "observability"
title: "Production systems should have replay tooling for failed traces in a secure environment"
description: >
  On-call should be able to replay a failed AI trace in a restricted
  environment within a documented RTO, with a drill or real replay in the last
  90 days.
whyItMatters: >
  Linked traces (OBS-M1) without a secure replay path leave on-call reading
  redacted spans instead of reproducing the failure. Restricted replay turns
  failed production traces into diagnosable incidents without exposing secrets
  to broad tooling.
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  On-call can replay a failed AI trace in a restricted environment within the
  documented RTO; last drill or real replay ≤90 days old (replay evidence
  measuredAt ≤90 days).
evidenceRequired:
  - "Secure/restricted replay tooling config for failed AI traces"
  - "Documented RTO for replay"
  - "Drill or real replay sample ≤90 days (redacted)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-trace-replay"
      params:
        hint: >
          Discover secure AI trace replay tooling, documented RTO, and recent
          drill or real replay evidence.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest on-call can replay a
          failed AI trace in a restricted environment within documented RTO,
          with last drill or real replay ≤90 days (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI tracing with failed traces is in scope. If none,
  score NOT_APPLICABLE. 2) Confirm replay tooling exists in a restricted
  environment (not unrestricted prod copies). 3) Confirm a documented RTO for
  replay. 4) Confirm a drill or real replay ≤90 days. 5) PASS only if tooling +
  RTO + recent replay hold with measuredAt ≤90 days. OBS-M1 linkage alone does
  not prove replay. OBS-R2 quality annotations alone do not prove replay.
  Unrestricted local dumps of production traces do not satisfy.
falsePositiveGuidance: >
  Do not pass a debugger without restricted access controls. Do not pass RTO
  docs without a recent drill/real replay. Do not pass replays older than 90
  days. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Provide restricted-environment replay for failed AI traces with a documented RTO"
  - "Run a drill (or retain a real replay) ≤90 days"
  - "Retain evidence under imports/ai-trace-replay/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "Google SRE Workbook — Observability"
    url: "https://sre.google/workbook/observability/"
  - title: "OpenTelemetry"
    url: "https://opentelemetry.io/"
relatedRules:
  - "OBS-M1"
  - "OBS-M2"
  - "OBS-R2"
  - "OBS-R3"
  - "OBS-R4"
  - "INC-M1"
tags:
  - "observability"
  - "recommended"
  - "hybrid"
  - "trace-replay"
  - "incident-debug"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
