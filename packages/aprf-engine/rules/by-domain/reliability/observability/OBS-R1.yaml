id: "OBS-R1"
category: "observability"
title: "Production systems should have replay tooling for failed traces in a secure environment"
description: "Replay tooling for failed traces in a secure environment"
whyItMatters: "Replay tooling for failed traces in a secure environment Failing this leaves a
  production gap against: On-call can replay a failed AI trace in a restricted environment within
  the documented RTO; last drill or real replay ≤90 days old"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "On-call can replay a failed AI trace in a restricted environment within the
  documented RTO; last drill or real replay ≤90 days old"
evidenceRequired:
  - "Secure replay tooling config + sample replay session for a failed production trace (redacted)"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Secure replay tooling config + sample replay session for a failed production trace
          (redacted)"
manualVerification: "For this Check (Replay tooling for failed traces in a secure environment):
  inspect current evidence for [Secure replay tooling config + sample replay session for a failed
  production trace (redacted)] and confirm the pass condition holds — On-call can replay a failed AI
  trace in a restricted environment within the documented RTO; last drill or real replay ≤90 days
  old"
falsePositiveGuidance: "re-verify against a current artifact for this specific Check , not a sibling
  control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Replay tooling for failed traces in a secure
    environment"
  - "Retain evidence artifacts required by this Check, starting with: Secure replay tooling config +
    sample replay session for a failed production trace (redacted)"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "Google SRE Workbook — Observability"
    url: "https://sre.google/workbook/observability/"
  - title: "OpenTelemetry"
    url: "https://opentelemetry.io/"
relatedRules:
  - "OBS-M1"
  - "OBS-M2"
  - "OBS-M3"
  - "OBS-R2"
  - "OBS-R3"
tags:
  - "observability"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
