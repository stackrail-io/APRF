id: "AGN-M3"
category: "agent-governance"
title: "Operators must have a production kill switch to pause or terminate agent runs"
description: >
  Authorized operators shall be able to pause or terminate production agent
  runs through a control-plane action that stops further planning and in-flight
  or queued tool/MCP/A2A side effects within a documented time-to-effect SLO.
  The control must not depend on the model cooperating and must not be
  disableable by the agent runtime itself.
whyItMatters: >
  Hard step/time limits contain normal loops; they do not stop an already-bad
  run, a stuck multi-agent mesh, or a session that is burning tools and budget
  under the configured ceiling. Without an operable pause/terminate path,
  on-call cannot interrupt runaway agency during an incident—only wait for
  natural timeout or redeploy. Kill switches are containment controls: they
  convert “the agent went rogue” into a bounded, reversible stop with a
  measurable time-to-effect.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Documented pause/terminate control exists for production agents; control is
  restricted to authorized operators (not end-user-only and not model-invoked);
  ≥1 successful pause or terminate action in drill or production in the last
  90 days shows recorded time-to-effect ≤ documented numeric SLO; evidence
  shows further tool/MCP/A2A side effects for that run (and its spawned
  children, if any) were stopped or drained without requiring the model to
  refuse.
evidenceRequired:
  - "Kill-switch/pause runbook: who may invoke, scope (run / agent type / fleet), expected effect, and numeric time-to-effect SLO"
  - "Successful drill or production use record (≤90 days) with timestamps for invoke → effect, covering at least one production agent path"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: >
          Confirm an authorized operator control exists, SLO is numeric, and a
          ≤90-day drill/prod record shows time-to-effect ≤ SLO with side effects
          stopped—not a docs-only or UI-cancel-without-tool-halt path.
manualVerification: >
  1) Identify the pause/terminate control (API, console, break-glass runbook)
  and who is authorized (on-call / operator role). Confirm the agent cannot
  disable or ignore the control via tool calls.
  2) Verify documented scope and a numeric time-to-effect SLO (e.g. p95 ≤ N
  seconds). Missing or non-numeric SLO fails.
  3) Review a drill or production use ≤90 days: timestamps from invoke to
  observed stop; confirm in-flight/queued tools and child/spawned agents were
  halted or cancelled—not merely “chat stopped while tools continued.”
  4) Spot-check that coverage maps to production agent inventory (same scope
  as charters): at least the drilled path is a production agent; note any
  agent types lacking a kill path as gaps.
  5) PASS only if documentation + measured successful action meet the pass
  condition.
falsePositiveGuidance: >
  Do not pass on runbooks without a reachable control, or on “cancel chat” /
  client disconnect that leaves tool/MCP calls running. Do not pass because
  step/time limits exist—those are proactive bounds, not a reactive kill
  switch. Do not pass a drill that only stops new sessions while current runs
  continue, or that lacks timestamps / SLO comparison. End-user mute/cancel
  without an operator control-plane path is insufficient for production
  incident response. A single undocumented ad-hoc kill (SSH, redeploy) without
  a retained drill record and SLO does not satisfy this Check. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Expose an authenticated operator pause/terminate API or console action scoped to run, agent type, and optionally fleet/tenant"
  - "Define a numeric time-to-effect SLO; implement cancellation that stops planners, drains/cancels tool queues, and prevents child respawn"
  - "Run a recurring ≤90-day kill-switch drill on a production-representative agent path; retain invoke/effect timestamps and outcome"
  - "Map kill-switch coverage to the production agent inventory and close gaps before release"
references:
  - title: "OWASP Top 10 for LLM Applications — LLM06 Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - title: "NIST AI Risk Management Framework — Govern / Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
