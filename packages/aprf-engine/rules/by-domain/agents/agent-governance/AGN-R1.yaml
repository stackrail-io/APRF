id: "AGN-R1"
category: "agent-governance"
title: "Production systems should have goal conflict detection and policy checks before plan execution"
description: "Goal conflict detection and policy checks before plan execution"
whyItMatters: "Goal conflict detection and policy checks before plan execution Failing this leaves a
  production gap against: Agent planner runs policy checks before side-effecting tools; ≥1 synthetic
  conflict is denied in test or prod logs within 90 days; rules have a named owner"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Agent planner runs policy checks before side-effecting tools; ≥1 synthetic conflict
  is denied in test or prod logs within 90 days; rules have a named owner"
evidenceRequired:
  - "Pre-execution policy checks for agent plans (goal-conflict / disallowed-goal rules) + sample
    deny/allow traces"
detection:
  capability: "manual"
  detectors: []
manualVerification: "For this Check (Goal conflict detection and policy checks before plan
  execution): inspect current evidence for [Pre-execution policy checks for agent plans
  (goal-conflict / disallowed-goal rules) + sample deny/allow traces] and confirm the pass condition
  holds — Agent planner runs policy checks before side-effecting tools; ≥1 synthetic conflict is
  denied in test or prod logs within 90 days; rules have a named owner"
falsePositiveGuidance: "(Agent Governance): re-verify against a current artifact for this specific
  Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Goal conflict detection and policy checks before plan
    execution"
  - "Retain evidence artifacts required by this Check, starting with: Pre-execution policy checks
    for agent plans (goal-conflict / disallowed-goal rules) + sample deny/allow traces"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "OWASP LLM — Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - title: "NIST AI RMF — Govern"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
