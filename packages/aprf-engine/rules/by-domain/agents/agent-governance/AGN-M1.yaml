  appliesTo:
    - "production agent runtimes"
    - "multi-agent systems"
    - "autonomous workflows"
    - "MCP clients with autonomous behavior"
    - "MCP servers with autonomous behavior"
    - "A2A runtimes"
  notApplicableTo:
    - "agent frameworks"
    - "SDKs"
    - "libraries"
    - "inference-only services"
    - "embedding services"
    - "classifiers"
    - "rerankers"
  minCriticality: 2
  requiredFromLevel: 3
