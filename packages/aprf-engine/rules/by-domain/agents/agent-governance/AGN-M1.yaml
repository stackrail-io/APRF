id: "AGN-M1"
category: "agent-governance"
title: "Every production agent must have a documented charter"
description: "Each production agent (any autonomous or semi-autonomous runtime that plans, loops, or
  invokes tools on behalf of a product capability—including in-process agents, MCP clients/servers
  acting as agents, and A2A participants) shall be represented in a version-controlled inventory
  with a current charter covering purpose, owner, approved tool policy, data scope, autonomy
  boundaries, review metadata, and approval status."
whyItMatters: "Without a charter, agents become unbounded co-processors: they can pursue undefined
  goals, touch undeclared tools and corpora, and escalate autonomy without an accountable owner.
  Missing charters are usually governance debt rather than an immediately exploitable defect—but
  when production agents cannot be enumerated or have no owner, governance has failed and risk
  escalates. Charters make allowed agency reviewable before incidents, not reconstructable after."
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Every production agent is represented in a version-controlled inventory. Each inventory
  entry references a current charter containing purpose, owner, approved tool policy, data scope,
  autonomy boundaries, review date, last updated, charter version, and approval status. No
  production agent is missing any required governance metadata; inventory completeness is attested
  (coversAllProductionAgents) with measuredAt ≤90 days."
evidenceRequired:
  - "Version-controlled agent inventory listing every production agent with owner and charter URI/id"
  - "Per-agent charter documents (or equivalent structured records) covering purpose, owner, approved
    tool policy reference, data scope, autonomy boundaries, review date, last updated, charter
    version, and approval status"
detection:
  capability: "automated"
  detectors:
    - id: "repo-agent-charter-inventory"
      params:
        requireFields:
          - "purpose"
          - "tool-allowlist"
          - "data-scope"
          - "autonomy-limits"
          - "owner"
          - "review-date"
          - "last-updated"
          - "charter-version"
          - "approval-status"
        requireInventoryCompleteness: true
        defaultSeverity: "high"
        escalateToCriticalWhen:
          - "inventory-completeness-unproven"
          - "production-agents-unenumerable"
          - "autonomous-agent-without-owner"
          - "unknown-or-shadow-production-agents"
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove inventory completeness, attest a versioned
          production-agent inventory with charter fields (purpose, owner, approved
          tool policy, data scope, autonomy boundaries, review date, last updated,
          charter version, approval status) and 0 missing rows. Escalate finding
          severity to critical when completeness or ownership cannot be demonstrated.
manualVerification: "1) Define “production agent” for this system (any agent runtime reachable from
  production traffic or scheduled jobs—not only MCP/A2A). Build or export a version-controlled
  inventory of those agents with owners. 2) For each inventory row, open the linked charter and
  verify it states: purpose/goals; approved tool policy reference (config id, policy id, or doc
  URI); data/corpora scope; autonomy boundaries (e.g. max steps, wall-clock, spawn depth, or
  escalation rules—consistent with AGN-M2 where applicable); named owner; review date; last updated;
  charter version; approval status. 3) PASS only if the inventory query (or equivalent review) shows
  0 production agents missing any required field and completeness is attested. Agents in
  non-production environments may be excluded if the inventory documents the exclusion rule.
  4) Treat the finding as Critical (not High) when production agents cannot be enumerated, inventory
  completeness cannot be established, autonomous agents have no accountable owner, or unknown/shadow
  production agents are present."
falsePositiveGuidance: "Do not pass on architecture or design docs that name agent types without a
  current inventory (registry/CMDB/manifest export ≤90 days) of deployed production agents. Do not
  treat a type-level row as covering every deployed instance. Chatbots without tool/autonomy loops
  are out of scope unless your documented production-agent definition includes them. A tool
  allowlist in code does not satisfy this Check unless each charter references it. Stub charters
  (empty purpose, unset owner, missing autonomy limits, missing review/version/approval metadata)
  fail. Passing step-limit or kill-switch Checks does not substitute for charters. Do not score
  Critical solely because a known, owned agent is missing a polished charter while inventory
  completeness and ownership remain proven—that is High governance debt. Named exceptions need owner
  and expiry ≤90 days."
recommendedFixes:
  - "Create a single agent inventory (registry, CMDB table, or repo manifest) that lists every
    production agent with owner and charter link"
  - "Adopt the APRF agent charter spec (skills/aprf-auditor/examples/agent-charter/agent-charter.spec.yaml)
    with fields agentVersion, id, owner, purpose, allowedTools, forbiddenTools, dataScope,
    memoryPolicy, networkPolicy, autonomy, approvalPolicy, identityPolicy, loggingPolicy, reviewDate,
    lastUpdated, expiryDate; migrate existing agents onto it"
  - "Gate new agent promotion to production on inventory + charter completeness (fail closed when
    fields are missing)"
  - "Schedule a recurring inventory audit (≤90 days) with a named owner and retain the report;
    escalate to Critical when completeness or ownership cannot be demonstrated"
references:
  - title: "OWASP Top 10 for LLM Applications — LLM06 Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - title: "NIST AI Risk Management Framework — Govern"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 — AI management system (roles, responsibilities, documentation)"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
