  - "AGN-M3"
  - "AGN-M4"
  - "AGN-R1"
  - "AGN-R2"
  - "HUM-M1"
tags:
  - "agent-governance"
  - "mandatory"
  - "automated"
  - "charter"
  - "inventory"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
