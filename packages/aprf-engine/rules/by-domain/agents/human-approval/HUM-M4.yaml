id: "HUM-M4"
category: "human-approval"
title: "Dual control must be required for Level 5 irreversible actions"
description: "Dual control shall be required for Level 5 irreversible actions"
whyItMatters: "Dual control shall be required for Level 5 irreversible actions Failing this leaves a
  production gap against: PASS if Level 5 irreversible actions are inventoried and 100% of sampled
  executions show dual approval; 0 single-approver completes in the sample"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "PASS if Level 5 irreversible actions are inventoried and 100% of sampled executions
  show dual approval; 0 single-approver completes in the sample"
evidenceRequired:
  - "Dual-control workflow config + sample approval records for irreversible actions"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Dual-control workflow config + sample approval records for irreversible actions"
manualVerification: "For this Check (Dual control must be required for Level 5 irreversible
  actions): inspect current evidence for [Dual-control workflow config + sample approval records for
  irreversible actions] and confirm the pass condition holds — PASS if Level 5 irreversible actions
  are inventoried and 100% of sampled executions show dual approval; 0 single-approver completes in
  the sample"
falsePositiveGuidance: "(Human Approval): re-verify against a current artifact for this specific
  Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Dual control must be required for Level 5 irreversible actions"
  - "Retain evidence artifacts required by this Check, starting with: Dual-control workflow config +
    sample approval records for irreversible actions"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Govern and Manage (human oversight)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
