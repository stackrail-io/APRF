id: "HUM-M4"
category: "human-approval"
title: "Dual control must be required for Level 5 irreversible actions"
description: >
  Irreversible actions in Level 5 (regulated / highest capability) systems shall
  require dual control: two distinct authorized humans must approve before
  execution. Sampled executions shall show dual approval with 0 single-approver
  completes.
whyItMatters: >
  At Level 5 blast radius, a single fatigued or compromised approver can
  authorize irreversible harm. Dual control separates intent from execution and
  raises the cost of insider or session abuse. Without it, single-gate approvals
  remain a single point of failure for the highest stakes.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Level 5 irreversible action classes are inventoried; 100% of sampled
  executions of those classes show dual approval by two distinct actors; 0
  single-approver completes in the sample (sample/config measuredAt ≤90 days).
evidenceRequired:
  - "Inventory of Level 5 irreversible action classes requiring dual control"
  - "Dual-control workflow configuration (two distinct approvers)"
  - "Sample approval records showing dual approval and 0 single-approver completes"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-dual-control-config"
      params:
        hint: >
          Discover dual-control / four-eyes / two-person approval config for
          irreversible high-impact actions.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove samples, attest dual-control config plus
          sampled records with 100% dual approval and 0 single-approver completes
          (measuredAt ≤90 days).
manualVerification: >
  1) Confirm the system is assessed at requiredFromLevel ≥5 / Level 5 scope; if
  not in Level 5 scope, score NOT_APPLICABLE. 2) Inventory irreversible action
  classes requiring dual control. 3) Verify workflow config requires two distinct
  approvers. 4) Sample recent executions: 100% dual approval, 0 single-approver.
  5) PASS only if inventory + config + sample all hold with measuredAt ≤90 days.
falsePositiveGuidance: >
  Do not pass two clicks by the same user/session as dual control. Do not pass
  maker-checker that allows the same principal both roles. Do not apply this
  Check as a Level 3 substitute—use HUM-M1/M3 for single-gate systems. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Mark irreversible Level 5 actions and require two distinct approver identities in workflow config"
  - "Reject dual-control completions where both approvals share the same actor or session"
  - "Export dual-control samples under imports/human-dual-control/ for assessments"
  - "Alert on single-approver attempts against dual-control classes"
references:
  - title: "NIST AI RMF — Govern and Manage (human oversight)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP Top 10 for LLM Applications — LLM06 Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "HUM-M1"
  - "HUM-M2"
  - "HUM-M3"
  - "ORG-R5"
  - "CHG-M1"
tags:
  - "human-approval"
  - "mandatory"
  - "hybrid"
  - "dual-control"
  - "level-5"
applicability:
  technologies: []
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
