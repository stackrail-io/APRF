id: "HUM-M3"
category: "human-approval"
title: "Approval must not be bypassable via alternate agent or API paths"
description: >
  Human approval gates for high-impact actions shall apply on every entry path
  (UI, API, agent/tool, batch/job)—not only the primary console. Alternate-path
  bypass tests shall show 0 successful ungated high-impact executions.
whyItMatters: >
  A gate that exists only in the web UI is not a control: agents, internal APIs,
  and cron jobs routinely hit the same side effects. Attackers and confused
  deputies prefer the ungated path. Bypass tests across entry points prove the
  gate is a platform invariant, not a frontend courtesy.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Automated or reviewed bypass tests cover alternate UI, API, and agent/job
  entry points for inventoried high-impact actions; 0 successful ungated
  high-impact executions in those tests.
evidenceRequired:
  - "Bypass-path threat model or test matrix across UI, API, and agent/job entry points"
  - "Test results showing 0 successful ungated high-impact executions"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-approval-bypass-tests"
      params:
        hint: >
          Discover bypass/negative tests that attempt high-impact actions via
          alternate API/agent/job paths without approval.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest a reviewed bypass suite
          across UI/API/agent paths with 0 successful ungated executions.
manualVerification: >
  1) Confirm high-impact gates exist (HUM-M1 scope). 2) List entry paths that
  can invoke those actions (UI, public/private API, agent tools, batch). 3)
  Review bypass tests that omit approval tokens/sessions on each path. 4) PASS
  only if tests (or imports) show 0 successful ungated high-impact executions.
  A single gated UI with open APIs fails.
falsePositiveGuidance: >
  Do not pass unit tests of the approval service alone without path coverage.
  Do not pass network ACLs as a substitute for approval on privileged APIs.
  Do not pass because HUM-M1 inventory exists without bypass evidence. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Enforce approval checks in the shared authorization/execution layer shared by UI, API, and agents"
  - "Add automated bypass tests for each high-impact class across alternate entry points"
  - "Block releases when bypass suites are missing or any ungated execution succeeds"
  - "Retain bypass results under imports/human-approval-bypass/"
references:
  - title: "NIST AI RMF — Govern and Manage (human oversight)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP Top 10 for LLM Applications — LLM06 Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "HUM-M1"
  - "HUM-M2"
  - "AUTHZ-M1"
  - "AUTHN-M1"
  - "TOL-M1"
tags:
  - "human-approval"
  - "mandatory"
  - "hybrid"
  - "bypass"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
