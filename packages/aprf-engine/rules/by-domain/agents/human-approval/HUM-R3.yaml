id: "HUM-R3"
category: "human-approval"
title: "Production systems should have sLA for approval queues to avoid unsafe workarounds"
description: "SLA for approval queues to avoid unsafe workarounds"
whyItMatters: "SLA for approval queues to avoid unsafe workarounds Failing this leaves a production
  gap against: Documented SLA (e.g. p95 queue age) exists; measured p95 for the last 30 days is
  within SLA or open exceptions have owners and expiry"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Documented SLA (e.g. p95 queue age) exists; measured p95 for the last 30 days is
  within SLA or open exceptions have owners and expiry"
evidenceRequired:
  - "Approval-queue SLA definition + queue age/metrics dashboard for the last 30 days"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Approval-queue SLA definition + queue age/metrics dashboard for the last 30 days"
manualVerification: "For this Check (SLA for approval queues to avoid unsafe workarounds): inspect
  current evidence for [Approval-queue SLA definition + queue age/metrics dashboard for the last 30
  days] and confirm the pass condition holds — Documented SLA (e.g. p95 queue age) exists; measured
  p95 for the last 30 days is within SLA or open exceptions have owners and expiry"
falsePositiveGuidance: "(Human Approval): re-verify against a current artifact for this specific
  Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: SLA for approval queues to avoid unsafe workarounds"
  - "Retain evidence artifacts required by this Check, starting with: Approval-queue SLA definition
    + queue age/metrics dashboard for the last 30 days"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Govern and Manage (human oversight)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "HUM-M1"
  - "HUM-M2"
  - "HUM-M3"
  - "HUM-M4"
  - "HUM-R1"
tags:
  - "human-approval"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "a2a"
    - "mcp"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
