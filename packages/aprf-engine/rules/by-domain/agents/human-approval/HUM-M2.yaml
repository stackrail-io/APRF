id: "HUM-M2"
category: "human-approval"
title: "Approval decisions must be logged with actor, context, and outcome"
description: >
  Every human approval or denial of a gated high-impact action shall be recorded
  with actor identity, action context (what was proposed), and approve/deny
  outcome in a durable audit log that passes schema validation.
whyItMatters: >
  Gates without attributable logs cannot support incident reconstruction,
  regulator questions, or insider-abuse review. Missing actor or context turns
  approvals into unverifiable clicks. Schema-valid logs convert HITL into an
  auditable control rather than an informal chat ack.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  100% of sampled approvals in the last 30 days include actor ID, action
  context, and approve/deny outcome; schema validation for the approval audit
  log passes.
evidenceRequired:
  - "Approval audit log schema (actor, context, outcome, timestamp) as code or documented contract"
  - "Sample approval records from the last 30 days covering required fields"
  - "Schema validation test or import proving samples conform"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-approval-audit-log"
      params:
        hint: >
          Discover approval audit log schema/emitters and tests that require
          actor, context, and outcome fields.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove sample coverage, attest ≤30-day samples
          with 100% required fields plus a passing schema validation result.
manualVerification: >
  1) Confirm gated approvals exist (else NOT_APPLICABLE with HUM-M1 N/A or no
  gates). 2) Open the audit log schema; require actor ID, action context, and
  approve/deny outcome (plus timestamp). 3) Sample approvals from the last 30
  days; 100% must include those fields. 4) Confirm schema validation tests or
  imports pass. 5) PASS only if schema + complete samples hold.
falsePositiveGuidance: >
  Do not pass on application access logs that omit action context. Do not pass
  chat transcripts as the approval system of record. Do not pass schemas without
  recent samples. Sibling Checks (gates, bypass tests) do not prove audit
  completeness. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Define and version an approval audit schema with actor, context, outcome, and timestamp"
  - "Emit durable records on every approve/deny; block emit paths that omit required fields"
  - "Add schema validation tests; retain ≤30-day sample export under imports/human-approval-audit/"
  - "Alert on approval events missing required fields"
references:
  - title: "NIST AI RMF — Govern and Manage (human oversight)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP Top 10 for LLM Applications — LLM06 Excessive Agency"
    url: "https://genai.owasp.org/llmrisk/llm062025-excessive-agency/"
relatedRules:
  - "HUM-M1"
  - "HUM-M3"
  - "OBS-M1"
  - "CMP-M2"
tags:
  - "human-approval"
  - "mandatory"
  - "hybrid"
  - "audit-log"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
