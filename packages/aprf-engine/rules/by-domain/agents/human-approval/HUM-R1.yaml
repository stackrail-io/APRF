id: "HUM-R1"
category: "human-approval"
title: "Production systems should have risk-based UI showing tool args, diffs, and confidence before approve"
description: >
  High-impact approval experiences should present tool arguments, a change diff
  (or equivalent preview), and confidence/risk context before the human
  approves or denies—so decisions are informed, not rubber-stamped.
whyItMatters: >
  Approvers who see only “Approve action?” absorb model risk without evidence.
  Hidden tool args and missing diffs produce rubber-stamp HITL that fails under
  incident review. Surfacing args, diffs, and confidence makes human judgment
  real and measurable in sampled approvals.
severity: "critical"
weight: 4
gate: "recommended"
passCondition: >
  High-impact approvals display tool args, change diff (or equivalent), and
  confidence/risk; ≥10 sampled approvals in the last 90 days show those fields
  populated.
evidenceRequired:
  - "Approval UI/spec showing tool args, diff/preview, and confidence/risk fields"
  - "≥10 sampled approval records (≤90 days) with those fields populated"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-approval-ui-context"
      params:
        hint: >
          Discover approval UI/components or schemas that render tool args,
          diffs/previews, and confidence/risk before approve.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove samples, attest UI/spec evidence plus ≥10
          sampled approvals ≤90 days with args, diff, and confidence populated.
manualVerification: >
  1) Confirm high-impact approval UI/flows exist. 2) Verify the approve surface
  shows tool args, diff/preview, and confidence/risk (screenshots or spec). 3)
  Sample ≥10 approvals from the last 90 days; required fields must be populated.
  4) PASS only if UI/spec + sample volume/completeness hold. Voice/async channels
  need equivalent context payloads, not only web UI.
falsePositiveGuidance: >
  Do not pass generic modal confirms without args/diff. Do not pass logs that
  store fields the UI never showed the approver. Do not pass <10 samples or
  samples older than 90 days. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Extend the approval UX to require tool args, diff/preview, and confidence/risk before enable approve"
  - "Persist those fields on the approval record for audit (align with HUM-M2)"
  - "Sample ≥10 recent approvals per assessment window; export under imports/human-approval-ui/"
  - "Block approve CTA when required context fields are missing"
references:
  - title: "NIST AI RMF — Govern and Manage (human oversight)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP Top 10 for LLM Applications — LLM06 Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "HUM-M1"
  - "HUM-M2"
  - "HUM-R3"
  - "DX-M1"
tags:
  - "human-approval"
  - "recommended"
  - "hybrid"
  - "approval-ui"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
