id: "HUM-R1"
category: "human-approval"
title: "Production systems should have risk-based UI showing tool args, diffs, and confidence before
  approve"
description: "Risk-based UI showing tool args, diffs, and confidence before approve"
whyItMatters: "Risk-based UI showing tool args, diffs, and confidence before approve Failing this
  leaves a production gap against: High-impact approvals display tool args, change diff (or
  equivalent), and confidence/risk; ≥10 sampled approvals in 90 days show those fields populated"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "High-impact approvals display tool args, change diff (or equivalent), and
  confidence/risk; ≥10 sampled approvals in 90 days show those fields populated"
evidenceRequired:
  - "Approval UI screenshots/spec showing tool args, diffs, and confidence + sample approval records"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Approval UI screenshots/spec showing tool args, diffs, and confidence + sample approval
          records"
manualVerification: "For this Check (Risk-based UI showing tool args, diffs, and confidence before
  approve): inspect current evidence for [Approval UI screenshots/spec showing tool args, diffs, and
  confidence + sample approval records] and confirm the pass condition holds — High-impact approvals
  display tool args, change diff (or equivalent), and confidence/risk; ≥10 sampled approvals in 90
  days show those fields populated"
falsePositiveGuidance: "(Human Approval): re-verify against a current artifact for this specific
  Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Risk-based UI showing tool args, diffs, and
    confidence before approve"
  - "Retain evidence artifacts required by this Check, starting with: Approval UI screenshots/spec
    showing tool args, diffs, and confidence + sample approval records"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Govern and Manage (human oversight)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "HUM-M1"
  - "HUM-M2"
  - "HUM-M3"
  - "HUM-M4"
  - "HUM-R3"
tags:
  - "human-approval"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "a2a"
    - "mcp"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
