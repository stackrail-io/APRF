id: "EXP-R1"
category: "explainability"
title: "Production systems should have user-facing rationale for material automated decisions"
description: "User-facing rationale for material automated decisions"
whyItMatters: "User-facing rationale for material automated decisions Failing this leaves a
  production gap against: 100% of decision types marked material in the catalog return a rationale
  field or UI explanation in a 20-case sample; gaps tracked with owners"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "100% of decision types marked material in the catalog return a rationale field or UI
  explanation in a 20-case sample; gaps tracked with owners"
evidenceRequired:
  - "Product UI/API screenshots or traces showing user-facing rationale for material automated
    decisions + decision catalog"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Product UI/API screenshots or traces showing user-facing rationale for material automated
          decisions + decision catalog"
manualVerification: "For this Check (User-facing rationale for material automated decisions):
  inspect current evidence for [Product UI/API screenshots or traces showing user-facing rationale
  for material automated decisions + decision catalog] and confirm the pass condition holds — 100%
  of decision types marked material in the catalog return a rationale field or UI explanation in a
  20-case sample; gaps tracked with owners"
falsePositiveGuidance: "(Explainability & Transparency): re-verify against a current artifact for
  this specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: User-facing rationale for material automated
    decisions"
  - "Retain evidence artifacts required by this Check, starting with: Product UI/API screenshots or
    traces showing user-facing rationale for material automated decisions + decision catalog"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Explainability and Interpretability"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "EXP-M1"
  - "EXP-M2"
  - "EXP-M3"
  - "EXP-M4"
  - "EXP-R3"
tags:
  - "explainability"
  - "recommended"
  - "manual"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
