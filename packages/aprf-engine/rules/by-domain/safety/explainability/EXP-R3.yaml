id: "EXP-R3"
category: "explainability"
title: "Counterfactual or change summaries should be available for material model/prompt version diffs"
description: >
  Material model or prompt promotions should retain a change or counterfactual
  summary describing what differed and expected impact—so operators can
  explain version-to-version behavior without archaeology.
whyItMatters: >
  Version IDs and eval gates alone do not tell on-call or auditors what changed
  in the last promotion. A retained change/counterfactual summary turns opaque
  model/prompt diffs into explainable releases. Distinct from PRM-M2 review/eval
  linkage and CHG-M1 registry retention depth.
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  The last material model or prompt promotion includes a retained change or
  counterfactual summary (measuredAt ≤90 days). If no material model or prompt promotions occur, score NOT_APPLICABLE.
evidenceRequired:
  - "Change/counterfactual summary tooling or template for model/prompt promotions"
  - "Retained summary for the last material model or prompt promotion (≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-change-summary"
      params:
        hint: >
          Discover change/counterfactual summary tooling and retained summaries
          for material model/prompt promotions.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest the last material
          model/prompt promotion has a retained change/counterfactual summary
          (measuredAt ≤90 days).
manualVerification: >
  1) Confirm material model or prompt promotions occur. If none occur, score
  NOT_APPLICABLE. 2) Locate tooling or a template that produces change or
  counterfactual summaries for those promotions. 3) Confirm the last material
  promotion retains such a summary ≤90 days. 4) PASS only if tooling/template
  + retained last-promotion summary hold with measuredAt ≤90 days. PRM-M2
  review/eval linkage alone does not prove a human-readable change summary.
  CHG-M1 version retention alone does not prove a counterfactual/change
  narrative. EVL-M4 shadow/A-B metrics alone do not prove a retained
  promotion summary.
falsePositiveGuidance: >
  Do not pass git commit messages as change summaries unless they document
  expected behavioral impact. Do not pass empty “N/A” summaries for material
  promotions. Do not pass summaries older than the last material promotion
  without linking to that promotion. Sibling PRM-M2, CHG-M1, and EVL-M4 do
  not substitute. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Require a change or counterfactual summary on every material model/prompt promotion"
  - "Retain the last promotion’s summary under imports/ai-change-summary/"
  - "Wire summary generation into the promotion checklist or CI gate"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "NIST AI RMF — Explainability and Interpretability"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "Google SRE — Embracing Risk"
    url: "https://sre.google/sre-book/embracing-risk/"
relatedRules:
