id: "EXP-R3"
category: "explainability"
title: "Production systems should have formal explainability requirements mapped for regulated features"
description: "Formal explainability requirements mapped for regulated features"
whyItMatters: "Formal explainability requirements mapped for regulated features Failing this leaves
  a production gap against: Every regulated AI feature lists required explanation type and evidence;
  matrix reviewed ≤12 months ago with named owner"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Every regulated AI feature lists required explanation type and evidence; matrix
  reviewed ≤12 months ago with named owner"
evidenceRequired:
  - "Explainability requirements matrix (feature × regulation/obligation) + last compliance review
    record"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Explainability requirements matrix (feature × regulation/obligation) + last compliance review
          record"
manualVerification: "For this Check (Formal explainability requirements mapped for regulated
  features): inspect current evidence for [Explainability requirements matrix (feature ×
  regulation/obligation) + last compliance review record] and confirm the pass condition holds —
  Every regulated AI feature lists required explanation type and evidence; matrix reviewed ≤12
  months ago with named owner"
falsePositiveGuidance: "(Explainability & Transparency): re-verify against a current artifact for
  this specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Formal explainability requirements mapped for
    regulated features"
  - "Retain evidence artifacts required by this Check, starting with: Explainability requirements
    matrix (feature × regulation/obligation) + last compliance review record"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Explainability and Interpretability"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "EXP-M1"
  - "EXP-M2"
  - "EXP-M3"
  - "EXP-M4"
  - "EXP-R1"
tags:
  - "explainability"
  - "recommended"
  - "manual"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
