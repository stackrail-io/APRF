id: "EXP-M2"
category: "explainability"
title: "Operators must reconstruct the decision path for a sampled production outcome"
description: >
  Operators shall reconstruct the production decision path
  (model→retrieval/tools→outcome) for sampled traces within a documented
  time budget—so incidents and disputes can be explained from retained
  evidence, not guesswork.
whyItMatters: >
  When customers challenge an AI outcome, on-call needs a repeatable way to
  walk model choice, retrieval/tool calls, and final outcome from production
  traces. Untimed or untested reconstruction fails under pressure. Distinct
  from EXP-M1 answer citations and OBS-M1 distributed trace linkage alone.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  On-call or operator successfully reconstructs model→retrieval/tools→outcome
  for 3/3 sampled production traces within the documented time budget (e.g.
  ≤15 minutes each; measuredAt ≤90 days). If no production AI outcomes with reconstructable paths exist, score NOT_APPLICABLE.
evidenceRequired:
  - "Operator reconstruction procedure with documented time budget"
  - "Timed drill record covering ≥3 sampled production traces (≤90 days)"
  - "Evidence each sample reconstructed model→retrieval/tools→outcome within budget"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-decision-path-recon"
      params:
        hint: >
          Discover operator reconstruction procedures, decision-path runbooks,
          and timed drill records on sampled production traces.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 3/3 sampled production
          traces reconstructed within documented time budget (measuredAt ≤90
          days).
manualVerification: >
  1) Confirm production AI outcomes with reconstructable paths exist. If none,
  score NOT_APPLICABLE. 2) Locate an operator reconstruction procedure that
  documents the time budget. 3) Review a timed drill ≤90 days covering ≥3
  sampled production traces. 4) Confirm each sample reconstructs
  model→retrieval/tools→outcome within budget. 5) PASS only if procedure +
  3/3 within-budget reconstructions hold with measuredAt ≤90 days. EXP-M1
  citation evals alone do not prove operator path reconstruction. OBS-M1
  trace linkage alone does not prove a timed operator drill. EXP-R1
  user-facing rationale alone does not prove operator reconstruction.
falsePositiveGuidance: >
  Do not pass generic observability docs without a reconstruction procedure
  and time budget. Do not pass drills with fewer than 3 samples or without
  timed results. Do not pass tabletop discussion without reconstructing real
  production traces. Sibling EXP-M1, OBS-M1, and EXP-R1 do not substitute.
  Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Document an operator decision-path reconstruction procedure with a time budget"
  - "Run a timed drill on ≥3 production traces ≤90 days; retain results"
  - "Retain evidence under imports/ai-decision-path-recon/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "NIST AI RMF — Explainability and Interpretability"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
relatedRules:
  - "EXP-M1"
  - "EXP-M3"
  - "EXP-R3"
  - "EXP-R1"
  - "OBS-M1"
  - "INC-M1"
tags:
