id: "EXP-M2"
category: "explainability"
title: "Operators must reconstruct the decision path for a sampled production outcome"
description: "Operators shall reconstruct the decision path for a sampled production outcome"
whyItMatters: "Operators shall reconstruct the decision path for a sampled production outcome
  Failing this leaves a production gap against: On-call or operator successfully reconstructs
  model→retrieval/tools→outcome for 3/3 sampled production traces within documented time budget
  (e.g. ≤15 minutes each)"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "On-call or operator successfully reconstructs model→retrieval/tools→outcome for 3/3
  sampled production traces within documented time budget (e.g. ≤15 minutes each)"
evidenceRequired:
  - "Operator reconstruction procedure + timed drill record on ≥3 sampled traces"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Operator reconstruction procedure + timed drill record on ≥3 sampled traces"
manualVerification: "For this Check (Operators must reconstruct the decision path for a sampled
  production outcome): inspect current evidence for [Operator reconstruction procedure + timed drill
  record on ≥3 sampled traces] and confirm the pass condition holds — On-call or operator
  successfully reconstructs model→retrieval/tools→outcome for 3/3 sampled production traces within
  documented time budget (e.g. ≤15 minutes each)"
falsePositiveGuidance: "(Explainability & Transparency): re-verify against a current artifact for
  this specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Operators must reconstruct the decision path for a sampled
    production outcome"
  - "Retain evidence artifacts required by this Check, starting with: Operator reconstruction
    procedure + timed drill record on ≥3 sampled traces"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Explainability and Interpretability"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "EXP-M1"
  - "EXP-M3"
  - "EXP-M4"
  - "EXP-R1"
  - "EXP-R3"
tags:
  - "explainability"
  - "mandatory"
  - "manual"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
