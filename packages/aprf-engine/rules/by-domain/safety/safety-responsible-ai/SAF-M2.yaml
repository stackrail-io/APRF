id: "SAF-M2"
category: "safety-responsible-ai"
title: "Automated safety evaluation gates must run on relevant releases"
description: >
  In-scope releases shall run an automated safety evaluation suite with
  numeric thresholds that blocks promote on fail—unless a time-boxed waiver
  (expiry ≤14 days) with a named owner is recorded.
whyItMatters: >
  A domain-specific AI safety policy without release gates leaves unsafe
  content free to ship.
  Requiring 100% safety-gate execution on in-scope releases in the last 30
  days turns policy into a blocking control. Distinct from SAF-M1 domain
  safety policy, EVL-M2 journey quality/safety metrics, and SEC-M1 injection
  suites.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Safety gate executed on 100% of in-scope releases in the last 30 days;
  fail blocks promote unless a time-boxed waiver (expiry ≤14 days) with
  owner is recorded (measuredAt ≤90 days).
evidenceRequired:
  - "Safety suite definition with numeric thresholds"
  - "CI/gate reports covering in-scope releases in the last 30 days (100%)"
  - "Waiver register for gate failures (owner + expiry ≤14 days) when used"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-safety-eval-gates"
      params:
        hint: >
          Discover safety eval suites with numeric thresholds, CI release
          gates, and time-boxed waiver records for failed promotes.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of in-scope
          releases in the last 30 days ran the safety gate and fails block
          promote unless owned waiver expiry ≤14 days (measuredAt ≤90 days).
manualVerification: >
  1) Confirm in-scope AI releases exist. If none, score NOT_APPLICABLE. 2)
  Locate a safety suite definition with numeric thresholds. 3) Review CI/gate
  reports for the last 30 days showing 100% of in-scope releases executed the
  gate. 4) Confirm fails block promote unless a waiver with owner and expiry
  ≤14 days is recorded. 5) PASS only if suite + 100% execution + blocking/
  waiver behavior hold with measuredAt ≤90 days. SAF-M1 domain AI safety
  policy alone does
  not prove release gating. EVL-M2 quality/safety journey metrics alone do
  not prove content-safety suite coverage. SEC-M1 injection deny rates alone
  do not prove domain harm-safety gates.
falsePositiveGuidance: >
  Do not pass quality-only eval suites as safety gates. Do not pass optional
  (non-blocking) safety jobs. Do not pass coverage under 100% of in-scope
  releases in the last 30 days. Do not pass open-ended waivers without owner
  or expiry ≤14 days. Sibling SAF-M1, EVL-M2, and SEC-M1 do not substitute.
  Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Define a safety eval suite with numeric thresholds"
  - "Require the suite as a blocking CI/release gate on every in-scope promote"
  - "Track ≤14-day owned waivers; retain evidence under imports/ai-safety-eval-gates/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "NIST AI RMF — Trustworthiness characteristics"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 — AI management systems"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "SAF-M1"
  - "SAF-M3"
  - "SAF-M4"
  - "SAF-R2"
  - "SAF-R1"
  - "EVL-M2"
  - "SEC-M1"
tags:
  - "safety-responsible-ai"
  - "mandatory"
  - "hybrid"
  - "safety-eval"
  - "release-gate"
  - "ci"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
