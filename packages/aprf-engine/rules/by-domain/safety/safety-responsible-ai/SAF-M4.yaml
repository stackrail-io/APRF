id: "SAF-M4"
category: "safety-responsible-ai"
title: "Fairness/disparity evaluation must cover high-stakes decision paths"
description: "Fairness/disparity evaluation shall cover high-stakes decision paths"
whyItMatters: "Fairness/disparity evaluation shall cover high-stakes decision paths Failing this
  leaves a production gap against: PASS if in-scope high-stakes paths are inventoried and the latest
  eval (≤90 days) is retained with thresholds and owners"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "PASS if in-scope high-stakes paths are inventoried and the latest eval (≤90 days) is
  retained with thresholds and owners"
evidenceRequired:
  - "Fairness/disparity eval methodology + latest run report for in-scope high-stakes paths"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Fairness/disparity eval methodology + latest run report for in-scope high-stakes paths"
manualVerification: "For this Check (Fairness/disparity evaluation must cover high-stakes decision
  paths): inspect current evidence for [Fairness/disparity eval methodology + latest run report for
  in-scope high-stakes paths] and confirm the pass condition holds — PASS if in-scope high-stakes
  paths are inventoried and the latest eval (≤90 days) is retained with thresholds and owners"
falsePositiveGuidance: "(Safety & Responsible AI): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Fairness/disparity evaluation must cover high-stakes decision
    paths"
  - "Retain evidence artifacts required by this Check, starting with: Fairness/disparity eval
    methodology + latest run report for in-scope high-stakes paths"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Trustworthiness characteristics"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 — AI management systems"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "SAF-M1"
  - "SAF-M2"
  - "SAF-M3"
  - "SAF-R2"
  - "SAF-R3"
tags:
  - "safety-responsible-ai"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "prompt-templates"
  minCriticality: 3
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
