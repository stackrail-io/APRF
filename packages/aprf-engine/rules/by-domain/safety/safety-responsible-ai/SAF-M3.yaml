id: "SAF-M3"
category: "safety-responsible-ai"
title: "Users must be disclosed when interacting with AI where required by policy or law"
description: >
  Where policy or law requires it, in-scope user surfaces shall disclose that
  the user is interacting with AI—so people are not misled about automated
  vs human counterparts.
whyItMatters: >
  Undisclosed AI interactions create regulatory, trust, and consent gaps.
  An inventory of in-scope surfaces plus an audit showing 100% disclosure
  coverage (0 critical misses) makes the obligation measurable. Distinct
  from SAF-M1 domain AI safety policy, SAF-M2 safety eval gates, and INC customer-
  notification criteria for incidents.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  AI-interaction disclosure present on 100% of in-scope user surfaces per
  policy checklist; 0 critical surfaces missing disclosure in the latest
  audit (measuredAt ≤90 days). If policy or law does not require AI-interaction disclosure for in-scope surfaces, score NOT_APPLICABLE.
evidenceRequired:
  - "Disclosure UX inventory of in-scope user surfaces (policy checklist)"
  - "Latest screenshot/checklist audit showing coverage + critical-surface status"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-interaction-disclosure"
      params:
        hint: >
          Discover AI-interaction disclosure copy, UX inventory, and audit
          checklists/screenshots for in-scope user surfaces.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove coverage, attest 100% of in-scope
          surfaces show AI-interaction disclosure and 0 critical surfaces
          missing disclosure in the latest audit (measuredAt ≤90 days).
manualVerification: >
  1) Confirm policy or law requires AI-interaction disclosure for in-scope
  surfaces. If none apply (and no AI user surfaces), score NOT_APPLICABLE.
  2) Locate a disclosure UX inventory / policy checklist of in-scope
  surfaces. 3) Review the latest audit (screenshots or checklist) showing
  disclosure present on 100% of those surfaces. 4) Confirm 0 critical
  surfaces are missing disclosure. 5) PASS only if inventory + 100%
  coverage + 0 critical misses hold with measuredAt ≤90 days. SAF-M1/M2
  alone do not prove user-facing disclosure. INC-R3 customer-notification
  criteria alone do not prove everyday AI-interaction labeling. Marketing
  “powered by AI” badges on unrelated pages alone do not prove in-scope
  surface coverage.
falsePositiveGuidance: >
  Do not pass footer/legal boilerplate that never appears on the AI
  interaction surface. Do not pass inventories without a latest audit.
  Do not pass audits with any critical surface missing disclosure. Sibling
  SAF-M1, SAF-M2, and INC notification Checks do not substitute. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Inventory in-scope user surfaces requiring AI-interaction disclosure"
  - "Add clear disclosure copy/UI on every in-scope surface"
  - "Run a checklist/screenshot audit; retain under imports/ai-interaction-disclosure/"
  - "Time-box gaps with owner and expiry ≤90 days"
references:
  - title: "NIST AI RMF — Trustworthiness characteristics"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 — AI management systems"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "SAF-M1"
  - "SAF-M2"
  - "SAF-M4"
  - "SAF-R2"
  - "SAF-R1"
  - "INC-R3"
tags:
  - "safety-responsible-ai"
  - "mandatory"
  - "hybrid"
  - "disclosure"
  - "transparency"
  - "ux"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
