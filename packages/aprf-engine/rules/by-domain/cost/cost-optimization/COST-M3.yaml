id: "COST-M3"
category: "cost-optimization"
title: "Retry and loop policies must prevent unbounded cost amplification"
description: >
  Production AI clients shall enforce finite retry/backoff and loop budgets so
  forced failures cannot amplify completions without bound—covering HTTP/SDK
  clients and agent loops, not prompt-only “try again” guidance.
whyItMatters: >
  Provider blips, tool timeouts, and flaky dependencies trigger retry storms
  that multiply token spend far beyond the original request. Unbounded
  maxRetries, missing backoff, or open agent loops turn a transient error into
  denial-of-wallet even when hard spend ceilings eventually trip. Finite retry
  and loop policies with amplification tests keep cost growth bounded under
  failure.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  Max retries and max agent/client loops are finite for 100% of production AI
  clients; amplification tests show cost cannot grow without bound under forced
  failure/retry (bounded token or $ ceiling; test measuredAt ≤90 days).
evidenceRequired:
  - "Retry/backoff config (finite maxRetries + backoff) for production AI/model clients"
  - "Agent or client loop budget config where applicable (finite iterations/steps)"
  - "Amplification test results: forced failure/retry hits a bounded token or $ ceiling (≤90 days)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-retry-amplification-config"
      params:
        hint: >
          Discover finite maxRetries/backoff and AI client or agent loop budgets
          that bound completion amplification under failure.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove amplification bounds, attest finite retry
          and loop config plus an amplification test hitting a token/$ ceiling
          (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI/model clients exist. If none, score NOT_APPLICABLE.
  2) For each client path (SDK, gateway, agent runtime), locate finite
  maxRetries/backoff and any loop/iteration budget. Infinite, null, or
  unset-as-unlimited fails. 3) Review amplification tests: under forced
  failure/retry, spend hits a documented token or $ bound (not unbounded growth).
  4) PASS only if config coverage is complete and ≤90-day test evidence holds.
  AGN-M2 step limits help agents but do not alone prove client retry bounds;
  COST-M1 ceilings do not substitute for preventing retry storms.
falsePositiveGuidance: >
  Do not pass prompt-only “limit retries” instructions. Do not pass CI job
  retries or generic HTTP retries that do not cover AI/model completion paths.
  Do not pass AGN-M2 alone when non-agent AI clients lack finite maxRetries.
  Do not pass COST-M1 enforce-on-exceed alone without retry/loop policy evidence.
  Do not pass backoff without a finite max retry count. Named exceptions need
  owner and expiry ≤90 days.
recommendedFixes:
  - "Set finite maxRetries + exponential backoff on all production AI/model clients; fail closed when unset"
  - "Cap agent/client loop iterations; align with AGN-M2 where agents are in scope"
  - "Add an amplification test that forces failure/retry and asserts a token or $ ceiling; retain under imports/ai-retry-amplification/"
  - "Alert when retry rates spike so operators can tune without removing bounds"
references:
  - title: "AWS Well-Architected — Cost Optimization"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "FinOps Foundation practices"
    url: "https://www.finops.org/"
relatedRules:
  - "COST-M1"
  - "COST-M2"
  - "AGN-M2"
  - "PERF-M1"
  - "REL-M1"
tags:
  - "cost-optimization"
  - "mandatory"
  - "hybrid"
  - "retry"
  - "amplification"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
