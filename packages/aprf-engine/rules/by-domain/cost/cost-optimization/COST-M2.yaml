id: "COST-M2"
category: "cost-optimization"
title: "Cost must be monitored with alerts on anomaly and budget burn"
description: >
  Production AI spend shall be monitored with alert policies for budget burn
  and spend anomaly that notify operators per runbook—not dashboards alone.
whyItMatters: >
  Hard spend ceilings stop unbounded burn, but without budget-burn and anomaly
  alerts operators learn too late that quotas are being hit, tenants are
  runaway, or unit economics have drifted. A dashboard nobody pages on is not
  a control. Proven notify (synthetic test or ≤90-day fire) turns FinOps
  telemetry into an operational signal.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  Alerts exist for both budget burn and spend anomaly covering production AI
  spend; a synthetic or historical burn/anomaly event would page/notify per
  runbook (alert test or documented fire measuredAt ≤90 days).
evidenceRequired:
  - "Cost/spend dashboard or telemetry views covering production AI workloads"
  - "Alert policies for budget burn and spend anomaly (IaC, provider, or gateway)"
  - "Notify proof: alert test or documented fire ≤90 days with page/notify outcome"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-cost-alert-config"
      params:
        hint: >
          Discover budget-burn and spend-anomaly alert policies, cost dashboards,
          or FinOps/gateway cost alarm config for AI/model/agent workloads.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove notify, attest both alert types plus an
          alert test or documented fire that paged/notified (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI spend exists. If none, score NOT_APPLICABLE.
  2) Locate monitoring for AI/model/agent cost (tokens, $, RPM). Generic infra
  CPU alerts alone fail. 3) Confirm distinct (or clearly dual-purpose) alerts
  for budget burn and spend anomaly with notify destinations. 4) Review notify
  proof ≤90 days (synthetic fire or production page). 5) PASS only if both
  alert classes and notify proof hold. COST-M1 hard limits do not substitute.
falsePositiveGuidance: >
  Do not pass on cost dashboards without alert policies. Do not pass a single
  generic “high spend” alert that does not cover both budget burn and anomaly
  intent unless the policy explicitly encodes both. Do not pass CPU/latency
  SLO alerts as cost controls. Do not pass COST-M1 enforce-on-exceed alone.
  Do not pass alert definitions with no notify channel or unproven routing.
  Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Add budget-burn and spend-anomaly alerts on production AI cost metrics; page/notify on-call or FinOps owner"
  - "Run a synthetic burn/anomaly alert test at least quarterly; retain under imports/ai-cost-alerts/"
  - "Tag alerts by tenant/feature so responders can attribute runaway spend"
  - "Document mute/suppress windows with owner and expiry ≤90 days"
references:
  - title: "AWS Well-Architected — Cost Optimization"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "FinOps Foundation practices"
    url: "https://www.finops.org/"
relatedRules:
  - "COST-M1"
  - "COST-M3"
  - "OBS-M1"
  - "OBS-R4"
  - "INC-M1"
tags:
  - "cost-optimization"
  - "mandatory"
  - "hybrid"
  - "budget-burn"
  - "anomaly-alert"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
