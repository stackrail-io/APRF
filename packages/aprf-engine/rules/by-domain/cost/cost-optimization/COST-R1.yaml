id: "COST-R1"
category: "cost-optimization"
title: "Production systems should have caching for idempotent or repeated prompts where safe"
description: "Caching for idempotent or repeated prompts where safe"
whyItMatters: "Caching for idempotent or repeated prompts where safe Failing this leaves a
  production gap against: Cache enabled for documented idempotent paths; sensitive/personalized
  prompts are excluded; hit-rate and savings reported for ≥30 days"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Cache enabled for documented idempotent paths; sensitive/personalized prompts are
  excluded; hit-rate and savings reported for ≥30 days"
evidenceRequired:
  - "Prompt/response cache config with safety exclusions + hit-rate report for 30 days"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Prompt/response cache config with safety exclusions + hit-rate report for 30 days"
manualVerification: "For this Check (Caching for idempotent or repeated prompts where safe): inspect
  current evidence for [Prompt/response cache config with safety exclusions + hit-rate report for 30
  days] and confirm the pass condition holds — Cache enabled for documented idempotent paths;
  sensitive/personalized prompts are excluded; hit-rate and savings reported for ≥30 days"
falsePositiveGuidance: "(Cost Optimization): re-verify against a current artifact for this specific
  Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Caching for idempotent or repeated prompts where safe"
  - "Retain evidence artifacts required by this Check, starting with: Prompt/response cache config
    with safety exclusions + hit-rate report for 30 days"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "AWS Well-Architected — Cost Optimization"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "FinOps Foundation practices"
    url: "https://www.finops.org/"
relatedRules:
  - "COST-M1"
  - "COST-M2"
  - "COST-M3"
  - "COST-R2"
  - "COST-R3"
tags:
  - "cost-optimization"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
