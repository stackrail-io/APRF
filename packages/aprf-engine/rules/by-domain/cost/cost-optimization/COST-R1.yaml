id: "COST-R1"
category: "cost-optimization"
title: "Production systems should have caching for idempotent or repeated prompts where safe"
description: >
  Production AI systems should cache prompt/response results for documented
  idempotent or repeated paths, with explicit exclusions for sensitive or
  personalized prompts, and report hit-rate and savings for ≥30 days.
whyItMatters: >
  Identical or near-identical completions burned on every request waste tokens
  and latency. Caching safe idempotent paths cuts spend without changing
  answers; caching personalized or sensitive prompts leaks data across users
  or sessions. Hit-rate and savings reports prove the control is operating—not
  just that a cache library is imported.
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  Cache is enabled for documented idempotent/repeated prompt paths;
  sensitive/personalized prompts are excluded; hit-rate and savings are
  reported for a window of ≥30 days (report measuredAt within the last 90 days).
evidenceRequired:
  - "Prompt/response cache config naming idempotent paths and safety exclusions"
  - "Hit-rate and savings report covering ≥30 days (import or dashboard export)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-prompt-cache-config"
      params:
        hint: >
          Discover prompt/response/semantic cache config for AI workloads and
          exclusion rules for sensitive or personalized prompts.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove hit-rate/savings, attest cache config with
          exclusions plus a ≥30-day report (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production AI traffic with potentially cacheable prompts. If none
  (or all paths are documented non-cacheable/sensitive), score NOT_APPLICABLE.
  2) Locate cache config (provider prompt cache, app semantic/exact cache,
  gateway). 3) Confirm documented idempotent paths and explicit exclusions for
  sensitive/personalized prompts. 4) Review hit-rate and savings for ≥30 days.
  5) PASS only if config + exclusions + report hold. HTTP CDN or generic Redis
  without AI prompt scope does not satisfy.
falsePositiveGuidance: >
  Do not pass a cache library import without enabled paths and exclusions.
  Do not pass caching of user-specific or secret-bearing prompts. Do not pass
  browser/HTTP caches for static assets as prompt caching. Do not pass COST-M1
  spend limits or COST-R2 model routing as substitutes. Named exceptions need
  owner and expiry ≤90 days.
recommendedFixes:
  - "Enable exact or semantic cache on documented idempotent AI paths; fail closed for unmarked sensitive paths"
  - "Document and enforce exclusions for personalized, PII, or secret-bearing prompts"
  - "Export ≥30-day hit-rate and savings under imports/ai-prompt-cache/"
  - "Alert when hit-rate collapses so regressions are visible"
references:
  - title: "AWS Well-Architected — Cost Optimization"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "FinOps Foundation practices"
    url: "https://www.finops.org/"
relatedRules:
  - "COST-M1"
  - "COST-M2"
  - "COST-M3"
  - "COST-R2"
  - "PRI-M1"
  - "SEC2-M2"
tags:
  - "cost-optimization"
  - "recommended"
  - "hybrid"
  - "prompt-cache"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
