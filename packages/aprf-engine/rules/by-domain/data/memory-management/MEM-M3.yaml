  - "mandatory"
  - "hybrid"
  - "write-policy"
  - "durable-memory"
applicability:
  technologies:
    - "vector-databases"
    - "mcp"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
