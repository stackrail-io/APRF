id: "MEM-R3"
category: "memory-management"
title: "Production systems should have separate working memory from durable memory with promotion rules"
description: "Separate working memory from durable memory with promotion rules"
whyItMatters: "Separate working memory from durable memory with promotion rules Failing this leaves
  a production gap against: Working memory cannot silently become durable without a promotion rule;
  last 10 promotions show rule ID and actor; TTL differs by memory class"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Working memory cannot silently become durable without a promotion rule; last 10
  promotions show rule ID and actor; TTL differs by memory class"
evidenceRequired:
  - "Memory architecture doc + config showing working vs durable stores and promotion rules + sample
    promotion audit"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Memory architecture doc + config showing working vs durable stores and promotion rules +
          sample promotion audit"
manualVerification: "For this Check (Separate working memory from durable memory with promotion
  rules): inspect current evidence for [Memory architecture doc + config showing working vs durable
  stores and promotion rules + sample promotion audit] and confirm the pass condition holds —
  Working memory cannot silently become durable without a promotion rule; last 10 promotions show
  rule ID and actor; TTL differs by memory class"
falsePositiveGuidance: "(Memory Management): re-verify against a current artifact for this specific
  Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Separate working memory from durable memory with
    promotion rules"
  - "Retain evidence artifacts required by this Check, starting with: Memory architecture doc +
    config showing working vs durable stores and promotion rules + sample promotion audit"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Govern and Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — Training Data Poisoning / Vector and Embedding Weaknesses"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "MEM-M1"
  - "MEM-M2"
  - "MEM-M3"
  - "MEM-M4"
  - "MEM-R1"
tags:
  - "memory-management"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "vector-databases"
    - "mcp"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
