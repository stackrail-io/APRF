id: "MEM-M4"
category: "memory-management"
title: "Critical memory records must have cryptographic or signed integrity protection"
description: "Critical memory records shall have cryptographic or signed integrity protection"
whyItMatters: "Critical memory records shall have cryptographic or signed integrity protection
  Failing this leaves a production gap against: Critical memory classes are inventoried;
  cryptographic verification or signature check succeeds for those classes in the latest check (≤90
  days)"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Critical memory classes are inventoried; cryptographic verification or signature
  check succeeds for those classes in the latest check (≤90 days)"
evidenceRequired:
  - "Integrity/signing design + verification sample for critical memory stores"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Integrity/signing design + verification sample for critical memory stores"
manualVerification: "For this Check (Critical memory records must have cryptographic or signed
  integrity protection): inspect current evidence for [Integrity/signing design + verification
  sample for critical memory stores] and confirm the pass condition holds — Critical memory classes
  are inventoried; cryptographic verification or signature check succeeds for those classes in the
  latest check (≤90 days)"
falsePositiveGuidance: "(Memory Management): re-verify against a current artifact for this specific
  Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Critical memory records must have cryptographic or signed
    integrity protection"
  - "Retain evidence artifacts required by this Check, starting with: Integrity/signing design +
    verification sample for critical memory stores"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Govern and Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — Training Data Poisoning / Vector and Embedding Weaknesses"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "MEM-M1"
  - "MEM-M2"
  - "MEM-M3"
  - "MEM-R1"
  - "MEM-R3"
tags:
  - "memory-management"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "vector-databases"
    - "mcp"
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
