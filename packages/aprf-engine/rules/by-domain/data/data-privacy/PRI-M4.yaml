id: "PRI-M4"
category: "data-privacy"
title: "Residency-constrained routing must be enforced for regulated workloads"
description: "Residency-constrained routing shall be enforced for regulated workloads"
whyItMatters: "Residency-constrained routing shall be enforced for regulated workloads Failing this
  leaves a production gap against: PASS if regulated workloads are labeled and 100% of sampled
  regulated requests stay in approved regions"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "PASS if regulated workloads are labeled and 100% of sampled regulated requests stay
  in approved regions"
evidenceRequired:
  - "Routing policy config + sample routing decisions for regulated tenants/regions"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Routing policy config + sample routing decisions for regulated tenants/regions"
manualVerification: "For this Check (Residency-constrained routing must be enforced for regulated
  workloads): inspect current evidence for [Routing policy config + sample routing decisions for
  regulated tenants/regions] and confirm the pass condition holds — PASS if regulated workloads are
  labeled and 100% of sampled regulated requests stay in approved regions"
falsePositiveGuidance: "(Data Privacy): re-verify against a current artifact for this specific Check
  , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Residency-constrained routing must be enforced for regulated
    workloads"
  - "Retain evidence artifacts required by this Check, starting with: Routing policy config + sample
    routing decisions for regulated tenants/regions"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — privacy considerations"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — Sensitive Information Disclosure"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "PRI-M1"
  - "PRI-M2"
  - "PRI-M3"
  - "PRI-M5"
  - "PRI-R1"
tags:
  - "data-privacy"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "vector-databases"
  minCriticality: 3
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
