id: "PRI-R1"
category: "data-privacy"
title: "Production systems should have tokenization or redaction before model calls for
  high-sensitivity fields"
description: "Tokenization or redaction before model calls for high-sensitivity fields"
whyItMatters: "Tokenization or redaction before model calls for high-sensitivity fields Failing this
  leaves a production gap against: Documented high-sensitivity fields never appear in cleartext in
  model request samples (≥50 sampled calls); pipeline fails closed when redaction errors"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Documented high-sensitivity fields never appear in cleartext in model request
  samples (≥50 sampled calls); pipeline fails closed when redaction errors"
evidenceRequired:
  - "Pre-model tokenization/redaction pipeline config + sample of redacted payloads for
    high-sensitivity fields"
detection:
  capability: "hybrid"
  detectors:
    - id: "prompt-no-pii-patterns"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Pre-model tokenization/redaction pipeline config + sample of redacted payloads for
          high-sensitivity fields"
manualVerification: "For this Check (Tokenization or redaction before model calls for
  high-sensitivity fields): inspect current evidence for [Pre-model tokenization/redaction pipeline
  config + sample of redacted payloads for high-sensitivity fields] and confirm the pass condition
  holds — Documented high-sensitivity fields never appear in cleartext in model request samples (≥50
  sampled calls); pipeline fails closed when redaction errors"
falsePositiveGuidance: "(Data Privacy): when automation and attestation disagree, prefer the
  stricter outcome until reconciled. Waive only with owner, expiry, and which signal covers the
  gap."
recommendedFixes:
  - "Implement and operationalize: this Check: Tokenization or redaction before model calls for
    high-sensitivity fields"
  - "Retain evidence artifacts required by this Check, starting with: Pre-model
    tokenization/redaction pipeline config + sample of redacted payloads for high-sensitivity
    fields"
  - "Wire or verify detectors declared on this Check so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — privacy considerations"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — Sensitive Information Disclosure"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "PRI-M1"
  - "PRI-M2"
  - "PRI-M3"
  - "PRI-M4"
  - "PRI-M5"
tags:
  - "data-privacy"
  - "recommended"
  - "hybrid"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "vector-databases"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
