id: "PRI-R1"
category: "data-privacy"
title: "Production systems should have tokenization or redaction before model calls for
  high-sensitivity fields"
description: >
  Production paths that send data to models should tokenize or redact documented
  high-sensitivity fields before the model call, with fail-closed behavior when
  redaction errors.
whyItMatters: >
  High-sensitivity fields in cleartext model requests expand blast radius: vendor
  logs, training opt-ins, and tool hops see data classification alone cannot
  strip. Tokenization or redaction before the call—plus fail-closed on pipeline
  errors—keeps those fields out of the model path. Classification without
  pre-model scrubbing still leaks. This strengthens maturity beyond the
  mandatory classification floor.
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  Documented high-sensitivity fields never appear in cleartext in ≥50 sampled
  production model requests; the pre-model tokenization/redaction pipeline fails
  closed on errors (sample/pipeline evidence measuredAt ≤90 days).
evidenceRequired:
  - "Inventory or policy listing high-sensitivity fields subject to pre-model tokenization/redaction"
  - "Pre-model tokenization/redaction pipeline config with fail-closed on redaction errors"
  - "Sample of ≥50 production model requests showing 0 cleartext hits for those fields"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-model-payload-redaction"
      params:
        hint: >
          Discover pre-model tokenization/redaction pipelines, high-sensitivity
          field inventories, fail-closed error handling, and sample evidence.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove samples, attest documented high-sensitivity
          fields, a fail-closed pre-model pipeline, and ≥50 samples with 0
          cleartext hits (measuredAt ≤90 days).
manualVerification: >
  1) Confirm production traffic sends data to models and high-sensitivity fields
  exist in scope. If none, score NOT_APPLICABLE. 2) Open the field inventory or
  policy naming high-sensitivity fields subject to pre-model scrubbing. 3) Open
  the tokenization/redaction pipeline config; confirm it runs before the model
  call and fails closed on redaction errors. 4) Review ≥50 sampled production
  model requests: 0 cleartext hits for those fields. 5) PASS only if inventory +
  fail-closed pipeline + clean sample hold with measuredAt ≤90 days. Log/trace
  secret redaction alone (post-call) does not satisfy. Classification tags
  without scrubbing do not satisfy.
falsePositiveGuidance: >
  Do not pass UI-only masking that still sends cleartext to the model. Do not
  pass regex filters applied only in logging after the call. Do not pass samples
  under 50 requests or older than 90 days. Do not pass pipelines that soft-fail
  and forward unredacted payloads on error. Named exceptions need owner and
  expiry ≤90 days.
recommendedFixes:
  - "Document high-sensitivity fields and require tokenization/redaction before every model call"
  - "Fail closed when the redaction pipeline errors or skips a required field"
  - "Export ≤90-day ≥50-request samples under imports/model-payload-redaction/"
  - "Alert when cleartext high-sensitivity patterns appear in outbound model payloads"
references:
  - title: "NIST AI RMF — privacy considerations"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — LLM02 Sensitive Information Disclosure"
    url: "https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/"
relatedRules:
  - "PRI-M1"
  - "PRI-M2"
  - "PRI-M3"
  - "PRI-R2"
  - "PRI-R3"
  - "SEC2-M2"
tags:
  - "data-privacy"
  - "recommended"
  - "hybrid"
  - "tokenization"
  - "redaction"
  - "model-payload"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "vector-databases"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
