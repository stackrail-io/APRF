id: "PRI-M3"
category: "data-privacy"
title: "Residency-constrained routing must be enforced for regulated workloads"
description: >
  Regulated workloads shall be labeled, and model/tool routing shall keep 100%
  of sampled regulated requests in approved regions—enforced by policy or
  gateway controls, not prompt instructions alone.
whyItMatters: >
  Cross-region model calls and tool hops can move regulated payloads out of
  approved boundaries without an application bug. Unlabeled tenants and
  default global endpoints make residency accidental. Labeled workloads plus
  sampled routing proof turn data-residency policy into an enforceable control
  on the AI path.
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: >
  Regulated workloads are labeled; 100% of sampled regulated requests stay in
  approved regions (routing sample/policy evidence measuredAt ≤90 days). If no regulated workloads or tenants are in scope, or residency constraints do
  not apply, score NOT_APPLICABLE.
evidenceRequired:
  - "Routing policy config naming approved regions for regulated tenants/workloads"
  - "Sample routing decisions (or deny logs) showing 100% of sampled regulated requests stayed in approved regions"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-ai-residency-routing"
      params:
        hint: >
          Discover residency/region routing policy for regulated AI workloads
          and sample/deny evidence that regulated requests stay in approved
          regions.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove samples, attest regulated workload labels,
          approved-region policy, and a sample with 100% in-region routing
          (measuredAt ≤90 days).
manualVerification: >
  1) Confirm regulated workloads/tenants are in scope or residency constraints
  apply. If neither applies, score NOT_APPLICABLE. 2) Confirm regulated workloads are
  labeled (tenant tag, data class, or equivalent). 3) Open routing policy:
  approved regions/endpoints for those labels. 4) Review a sample of regulated
  model/tool requests: 100% stayed in approved regions (or were denied). 5)
  PASS only if labels + policy + 100% in-region sample hold with measuredAt
  ≤90 days. DNS/geo defaults without labeled enforcement do not satisfy.
  Prompt-only “stay in region” does not satisfy.
falsePositiveGuidance: >
  Do not pass a cloud region preference that agents/APIs can bypass. Do not
  pass unlabeled “EU customers” spreadsheets without runtime routing evidence.
  Do not pass samples that mix unregulated traffic into the denominator. Do
  not pass policy docs older than 90 days without a fresh sample. Named
  exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Label regulated tenants/workloads and bind them to approved-region model/tool routes"
  - "Enforce residency in the gateway or router; deny cross-region for regulated labels"
  - "Export ≤90-day routing samples under imports/ai-residency-routing/"
  - "Alert when regulated traffic hits a non-approved region or endpoint"
references:
  - title: "NIST AI RMF — privacy considerations"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — LLM02 Sensitive Information Disclosure"
    url: "https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/"
relatedRules:
  - "PRI-M1"
  - "PRI-M2"
  - "PRI-R3"
  - "PRI-R1"
  - "PRI-R2"
  - "AUTHZ-M1"
tags:
  - "data-privacy"
  - "mandatory"
  - "hybrid"
  - "residency"
  - "routing"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "vector-databases"
  minCriticality: 3
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
