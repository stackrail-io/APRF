id: "DG-R2"
category: "data-governance"
title: "Production embedding and feature pipelines should monitor train/serve skew"
description: >
  Every production embedding or feature pipeline shall run a train/serve skew
  job within the last 7 days, document at least one skew threshold, and open a
  tracked ticket or page on breach.
whyItMatters: >
  When train-time embeddings or features drift from what serve-time traffic
  sees, retrieval quality and ranking degrade without an obvious model change.
  Undetected skew looks like random hallucinations or recall loss. Regular
  skew jobs with thresholds and paging turn distribution drift into an owned
  operational signal.
severity: "high"
weight: 3
gate: "recommended"
passCondition: >
  A skew job ran within the last 7 days for every production embedding/feature
  pipeline; at least one documented threshold exists; breach creates a tracked
  ticket or page (job/alert evidence measuredAt ≤7 days).
evidenceRequired:
  - "Skew monitor config covering each production embedding/feature pipeline"
  - "Last weekly (or ≤7-day) skew report comparing train vs serve distributions"
  - "Threshold definition plus ticket/page routing on breach"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-train-serve-skew"
      params:
        hint: >
          Discover train/serve skew monitors for embeddings or features,
          threshold configs, and breach ticket/page hooks.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove recent runs, attest per-pipeline skew job
          ≤7 days, threshold present, and breach creates ticket/page
          (measuredAt ≤7 days).
manualVerification: >
  1) Confirm production embedding or feature pipelines exist. If none, score
  NOT_APPLICABLE. 2) Locate skew monitor config for each pipeline. 3) Confirm
  a skew job ran within the last 7 days. 4) Confirm at least one documented
  threshold. 5) Confirm breach opens a tracked ticket or page. 6) PASS only if
  all pipelines, recent run, threshold, and breach routing hold. Corpus
  freshness metrics alone do not satisfy. One-off notebooks without schedule
  or paging do not satisfy.
falsePositiveGuidance: >
  Do not pass offline EDA charts without a recurring job. Do not pass train-only
  distribution plots that never compare to serve. Do not pass a threshold with
  no ticket/page on breach. Do not pass reports older than 7 days as current.
  Named exceptions need owner and expiry ≤30 days.
recommendedFixes:
  - "Schedule train/serve skew jobs for every production embedding/feature pipeline"
  - "Document numeric skew thresholds and wire breach to ticket or page"
  - "Retain last-run reports under imports/train-serve-skew-monitor/"
  - "Fail closed when a new production pipeline ships without a skew monitor"
references:
  - title: "NIST AI RMF — Map and Measure (data)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ML systems engineering — data quality practices"
    url: "https://ml-ops.org/"
relatedRules:
  - "DG-M1"
  - "DG-R1"
  - "DG-R3"
  - "OBS-M1"
  - "OBS-M2"
  - "MOD-M1"
tags:
  - "data-governance"
  - "recommended"
  - "hybrid"
  - "train-serve-skew"
applicability:
  technologies:
    - "vector-databases"
    - "rag-pipelines"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
