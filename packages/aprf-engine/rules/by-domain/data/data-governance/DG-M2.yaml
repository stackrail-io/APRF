id: "DG-M2"
category: "data-governance"
title: "Data used for evals or fine-tuning must have documented provenance and quality criteria"
description: >
  Every dataset used in production eval gates or fine-tunes shall have
  documented provenance and quality criteria, and promotion shall be blocked
  when those are missing.
whyItMatters: >
  Eval and fine-tune sets without provenance or quality bars silently bake in
  bias, leakage, or unlicensed content. Gates that pass on undocumented data
  give false confidence; fine-tunes on mystery corpora are hard to recall or
  remediate. Documented cards plus a promotion brake make training and eval
  data first-class production artifacts.
severity: "high"
weight: 3
gate: "mandatory"
passCondition: >
  100% of datasets used in production gates or fine-tunes have provenance +
  quality criteria documented; promotion is blocked if missing (CI or review
  checklist evidence; inventory measuredAt ≤90 days).
evidenceRequired:
  - "Dataset cards or registry entries for eval/fine-tune sets covering provenance and quality criteria"
  - "CI or review-checklist evidence that promotion is blocked when cards are missing"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-dataset-provenance"
      params:
        hint: >
          Discover dataset cards, datasheets, or registry entries for
          eval/fine-tune sets with provenance and quality criteria, plus
          promotion-gate signals.
    - id: "manual-attest"
      params:
        hint: >
          If automation cannot prove 100% coverage or promotion blocking,
          attest inventory with zero missing provenance/quality fields and
          promotionBlockedIfMissing (measuredAt ≤90 days).
manualVerification: >
  1) Confirm the system uses datasets for production eval gates or fine-tunes.
  If neither, score NOT_APPLICABLE. 2) Inventory those datasets. 3) Confirm
  each has documented provenance and quality criteria (dataset card or
  registry). 4) Confirm promotion/release is blocked when cards are missing
  (CI check or review checklist). 5) PASS only if coverage is 100% and the
  promotion brake holds. Retrieval-index inventories (DG-M1) do not satisfy.
  Informal README lists without provenance/quality fields do not satisfy.
falsePositiveGuidance: >
  Do not pass empty Hugging Face card stubs. Do not pass provenance without
  quality criteria (or the reverse). Do not pass cards for unused sample
  datasets as covering production gates. Do not pass advisory linters that
  never block promote. Named exceptions need owner and expiry ≤90 days.
recommendedFixes:
  - "Publish dataset cards with provenance and quality criteria for every eval/fine-tune set"
  - "Add a CI or review checklist gate that blocks promote when cards are missing"
  - "Retain inventory under imports/dataset-provenance-governance/"
  - "Refuse fine-tune or gate promotion jobs that reference undocumented datasets"
references:
  - title: "NIST AI RMF — Map and Measure (data)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ML systems engineering — data quality practices"
    url: "https://ml-ops.org/"
relatedRules:
  - "DG-M1"
  - "DG-M3"
  - "DG-R3"
  - "EVL-M1"
  - "MOD-M1"
  - "SCI-M2"
tags:
  - "data-governance"
  - "mandatory"
  - "hybrid"
  - "dataset-cards"
  - "provenance"
applicability:
  technologies:
    - "vector-databases"
    - "rag-pipelines"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
