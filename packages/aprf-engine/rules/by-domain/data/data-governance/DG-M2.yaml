id: "DG-M2"
category: "data-governance"
title: "Data used for evals or fine-tuning must have documented provenance and quality criteria"
description: "Data used for evals or fine-tuning shall have documented provenance and quality criteria"
whyItMatters: "Data used for evals or fine-tuning shall have documented provenance and quality
  criteria Failing this leaves a production gap against: 100% of datasets used in production gates
  or fine-tunes have provenance + quality criteria documented; promotion blocked if missing (CI or
  review checklist evidence)"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of datasets used in production gates or fine-tunes have provenance + quality
  criteria documented; promotion blocked if missing (CI or review checklist evidence)"
evidenceRequired:
  - "Dataset cards or registry entries for eval/fine-tune sets"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Dataset cards or registry entries for eval/fine-tune sets"
manualVerification: "For this Check (Data used for evals or fine-tuning must have documented
  provenance and quality criteria): inspect current evidence for [Dataset cards or registry entries
  for eval/fine-tune sets] and confirm the pass condition holds — 100% of datasets used in
  production gates or fine-tunes have provenance + quality criteria documented; promotion blocked if
  missing (CI or review checklist evidence)"
falsePositiveGuidance: "(Data Governance & Quality): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Data used for evals or fine-tuning must have documented
    provenance and quality criteria"
  - "Retain evidence artifacts required by this Check, starting with: Dataset cards or registry
    entries for eval/fine-tune sets"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Map and Measure (data)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ML systems engineering — data quality practices"
    url: "https://ml-ops.org/"
relatedRules:
  - "DG-M1"
  - "DG-M3"
  - "DG-R1"
  - "DG-R2"
  - "DG-R3"
tags:
  - "data-governance"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "vector-databases"
    - "rag-pipelines"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
