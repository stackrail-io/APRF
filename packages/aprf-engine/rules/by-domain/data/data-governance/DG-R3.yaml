id: "DG-R3"
category: "data-governance"
title: "Production systems should have dataset cards for major eval and fine-tune sets"
description: "Dataset cards for major eval and fine-tune sets"
whyItMatters: "Dataset cards for major eval and fine-tune sets Failing this leaves a production gap
  against: 100% of major eval/fine-tune sets used in production promotion have a dataset card with
  purpose, source, PII handling, and last-updated date ≤12 months"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "100% of major eval/fine-tune sets used in production promotion have a dataset card
  with purpose, source, PII handling, and last-updated date ≤12 months"
evidenceRequired:
  - "Dataset cards (or equivalent metadata) for each major eval and fine-tune corpus in the registry"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Dataset cards (or equivalent metadata) for each major eval and fine-tune corpus in the
          registry"
manualVerification: "For this Check (Dataset cards for major eval and fine-tune sets): inspect
  current evidence for [Dataset cards (or equivalent metadata) for each major eval and fine-tune
  corpus in the registry] and confirm the pass condition holds — 100% of major eval/fine-tune sets
  used in production promotion have a dataset card with purpose, source, PII handling, and
  last-updated date ≤12 months"
falsePositiveGuidance: "(Data Governance & Quality): re-verify against a current artifact for this
  specific Check , not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: this Check: Dataset cards for major eval and fine-tune sets"
  - "Retain evidence artifacts required by this Check, starting with: Dataset cards (or equivalent
    metadata) for each major eval and fine-tune corpus in the registry"
  - "Schedule recurring manual verification for this Check with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until this Check passes"
references:
  - title: "NIST AI RMF — Map and Measure (data)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ML systems engineering — data quality practices"
    url: "https://ml-ops.org/"
relatedRules:
  - "DG-M1"
  - "DG-M2"
  - "DG-M3"
  - "DG-R1"
  - "DG-R2"
tags:
  - "data-governance"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "vector-databases"
    - "rag-pipelines"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
