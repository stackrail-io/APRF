id: "COST-M1"
category: "cost-optimization"
title: "Production AI workloads must have hard spend or rate limits"
description: "Production AI workloads shall have hard spend or rate limits"
whyItMatters: "COST-M1 (Cost Optimization, mandatory): Production AI workloads shall have hard spend
  or rate limits Failing this leaves a production gap against: Enforced limit demonstrably denies or
  throttles when exceeded (automated test or production event log within last 90 days)"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Enforced limit demonstrably denies or throttles when exceeded (automated test or
  production event log within last 90 days)"
evidenceRequired:
  - "Gateway/provider quota config"
detection:
  capability: "automated"
  detectors:
    - id: "repo-rate-limit-config"
      params: {}
    - id: "cicd-concurrency-present"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Gateway/provider quota config"
manualVerification: "For COST-M1 (Production AI workloads must have hard spend or rate limits):
  inspect current evidence for [Gateway/provider quota config] and confirm the pass condition holds
  — Enforced limit demonstrably denies or throttles when exceeded (automated test or production
  event log within last 90 days)"
falsePositiveGuidance: "COST-M1 (Cost Optimization): confirm the detector target matches the
  production path for this Check before waiving. Named exceptions need an owner and expiry ≤90
  days."
recommendedFixes:
  - "Implement and operationalize: Production AI workloads must have hard spend or rate limits
    (COST-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Gateway/provider quota config"
  - "Wire or verify detectors declared on COST-M1 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until COST-M1 passes"
references:
  - title: "AWS Well-Architected — Cost Optimization"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "FinOps Foundation practices"
    url: "https://www.finops.org/"
relatedRules:
  - "COST-M2"
  - "COST-M3"
  - "COST-R1"
  - "COST-R2"
  - "COST-R3"
tags:
  - "cost-optimization"
  - "mandatory"
  - "automated"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
  minCriticality: 1
  requiredFromLevel: 2
status: "active"
introducedIn: "0.10.0"
