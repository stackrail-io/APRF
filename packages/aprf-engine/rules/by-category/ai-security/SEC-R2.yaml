id: "SEC-R2"
category: "ai-security"
title: "SEC-R2: Content safety and malware scanning on multimodal inputs where applicable"
description: "Content safety and malware scanning on multimodal inputs where applicable"
whyItMatters: "SEC-R2 (Adversarial Security, recommended): Content safety and malware scanning on
  multimodal inputs where applicable Failing this leaves a production gap against: Where multimodal
  inputs are accepted, scanner runs before model ingest; last report ≤90 days shows coverage of
  image/file types in use and 0 unscanned producti…"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Where multimodal inputs are accepted, scanner runs before model ingest; last report
  ≤90 days shows coverage of image/file types in use and 0 unscanned production paths"
evidenceRequired:
  - "Multimodal input safety/malware scanner config + latest CI or batch scan report for
    production-bound media"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Multimodal input safety/malware scanner config + latest CI or batch scan report for
          production-bound media"
manualVerification: "For SEC-R2 (SEC-R2: Content safety and malware scanning on multimodal inputs
  where applicable): inspect current evidence for [Multimodal input safety/malware scanner config +
  latest CI or batch scan report for production-bound media] and confirm the pass condition holds —
  Where multimodal inputs are accepted, scanner runs before model ingest; last report ≤90 days shows
  coverage of image/file types in use and 0 unscanned production paths"
falsePositiveGuidance: "SEC-R2 (Adversarial Security): re-verify against a current artifact for this
  specific Check (SEC-R2), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: SEC-R2: Content safety and malware scanning on multimodal inputs
    where applicable (SEC-R2)"
  - "Retain evidence artifacts required by this Check, starting with: Multimodal input
    safety/malware scanner config + latest CI or batch scan report for production-boun…"
  - "Schedule recurring manual verification for SEC-R2 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until SEC-R2 passes"
references:
  - title: "OWASP Top 10 for Large Language Model Applications"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - title: "NIST AI Risk Management Framework"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "CIS Controls (select mappings for AI workloads)"
    url: "https://www.cisecurity.org/controls"
relatedRules:
  - "SEC-M1"
  - "SEC-M2"
  - "SEC-M3"
  - "SEC-M4"
  - "SEC-M5"
tags:
  - "ai-security"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "prompt-templates"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
