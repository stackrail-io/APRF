id: "SEC-M4"
category: "ai-security"
title: "Network and identity boundaries must prevent the model path from becoming a universal proxy
  to internal sys…"
description: "Network and identity boundaries shall prevent the model path from becoming a universal
  proxy to internal systems"
whyItMatters: "SEC-M4 (Adversarial Security, mandatory): Network and identity boundaries shall
  prevent the model path from becoming a universal proxy to internal systems Failing this leaves a
  production gap against: Automated or reviewed probe shows the model/tool runtime can reach only
  allowlisted destinations; 0 unrestricted routes to internal admin APIs or data stores f…"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "Automated or reviewed probe shows the model/tool runtime can reach only allowlisted
  destinations; 0 unrestricted routes to internal admin APIs or data stores from the model identity"
evidenceRequired:
  - "Architecture diagram of model/tool trust boundaries + network policy or egress allowlist export"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Architecture diagram of model/tool trust boundaries + network policy or egress allowlist
          export"
manualVerification: "For SEC-M4 (Network and identity boundaries must prevent the model path from
  becoming a universal proxy to internal sys…): inspect current evidence for [Architecture diagram
  of model/tool trust boundaries + network policy or egress allowlist export] and confirm the pass
  condition holds — Automated or reviewed probe shows the model/tool runtime can reach only
  allowlisted destinations; 0 unrestricted routes to internal admin APIs or data stores from the
  model identi…"
falsePositiveGuidance: "SEC-M4 (Adversarial Security): re-verify against a current artifact for this
  specific Check (SEC-M4), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Network and identity boundaries must prevent the model path from
    becoming a universal proxy to internal sys… (SEC-M4)"
  - "Retain evidence artifacts required by this Check, starting with: Architecture diagram of
    model/tool trust boundaries + network policy or egress allowlist export"
  - "Schedule recurring manual verification for SEC-M4 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until SEC-M4 passes"
references:
  - title: "OWASP Top 10 for Large Language Model Applications"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - title: "NIST AI Risk Management Framework"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "CIS Controls (select mappings for AI workloads)"
    url: "https://www.cisecurity.org/controls"
relatedRules:
  - "SEC-M1"
  - "SEC-M2"
  - "SEC-M3"
  - "SEC-M5"
  - "SEC-R1"
tags:
  - "ai-security"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "prompt-templates"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
