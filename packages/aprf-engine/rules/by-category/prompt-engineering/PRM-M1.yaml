id: "PRM-M1"
category: "prompt-engineering"
title: "Every production prompt must have an immutable version identifier and owner"
description: "Every production prompt shall have an immutable version identifier and owner"
whyItMatters: "PRM-M1 (Prompt Engineering, mandatory): Every production prompt shall have an
  immutable version identifier and owner Failing this leaves a production gap against: 100% of
  production prompts have immutable version ID + owner; 0 unversioned production prompts"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of production prompts have immutable version ID + owner; 0 unversioned production prompts"
evidenceRequired:
  - "Prompt registry export"
detection:
  capability: "automated"
  detectors:
    - id: "prompt-versioned"
      params: {}
    - id: "prompt-has-owner"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Prompt registry export"
manualVerification: "For PRM-M1 (Every production prompt must have an immutable version identifier
  and owner): inspect current evidence for [Prompt registry export] and confirm the pass condition
  holds — 100% of production prompts have immutable version ID + owner; 0 unversioned production
  prompts"
falsePositiveGuidance: "PRM-M1 (Prompt Engineering): confirm the detector target matches the
  production path for this Check before waiving. Named exceptions need an owner and expiry ≤90
  days."
recommendedFixes:
  - "Implement and operationalize: Every production prompt must have an immutable version identifier
    and owner (PRM-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Prompt registry export"
  - "Wire or verify detectors declared on PRM-M1 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until PRM-M1 passes"
references:
  - title: "Google SRE Workbook — Managing Risk (change management parallels)"
    url: "https://sre.google/workbook/"
  - title: "OWASP LLM Prompt Injection guidance"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "PRM-M2"
  - "PRM-M3"
  - "PRM-R1"
  - "PRM-R2"
  - "PRM-R3"
tags:
  - "prompt-engineering"
  - "mandatory"
  - "automated"
applicability:
  technologies:
    - "prompt-templates"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
