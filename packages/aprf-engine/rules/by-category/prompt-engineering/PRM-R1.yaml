id: "PRM-R1"
category: "prompt-engineering"
title: "PRM-R1: Prompt templates are parameterized; secrets and PII never hardcoded"
description: "Prompt templates are parameterized; secrets and PII never hardcoded"
whyItMatters: "PRM-R1 (Prompt Engineering, recommended): Prompt templates are parameterized; secrets
  and PII never hardcoded Failing this leaves a production gap against: 100% of production prompt
  templates are parameterized for variable inputs; scan of templates finds 0 secrets and 0 hardcoded
  customer PII fields"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "100% of production prompt templates are parameterized for variable inputs; scan of
  templates finds 0 secrets and 0 hardcoded customer PII fields"
evidenceRequired:
  - "Prompt template inventory showing parameters + static analysis or review finding zero hardcoded
    secrets/PII"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Prompt template inventory showing parameters + static analysis or review finding zero
          hardcoded secrets/PII"
manualVerification: "For PRM-R1 (PRM-R1: Prompt templates are parameterized; secrets and PII never
  hardcoded): inspect current evidence for [Prompt template inventory showing parameters + static
  analysis or review finding zero hardcoded secrets/PII] and confirm the pass condition holds — 100%
  of production prompt templates are parameterized for variable inputs; scan of templates finds 0
  secrets and 0 hardcoded customer PII fields"
falsePositiveGuidance: "PRM-R1 (Prompt Engineering): re-verify against a current artifact for this
  specific Check (PRM-R1), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: PRM-R1: Prompt templates are parameterized; secrets and PII never
    hardcoded (PRM-R1)"
  - "Retain evidence artifacts required by this Check, starting with: Prompt template inventory
    showing parameters + static analysis or review finding zero hardcoded sec…"
  - "Schedule recurring manual verification for PRM-R1 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until PRM-R1 passes"
references:
  - title: "Google SRE Workbook — Managing Risk (change management parallels)"
    url: "https://sre.google/workbook/"
  - title: "OWASP LLM Prompt Injection guidance"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "PRM-M1"
  - "PRM-M2"
  - "PRM-M3"
  - "PRM-R2"
  - "PRM-R3"
tags:
  - "prompt-engineering"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "prompt-templates"
  minCriticality: 1
  requiredFromLevel: 2
status: "active"
introducedIn: "0.10.0"
