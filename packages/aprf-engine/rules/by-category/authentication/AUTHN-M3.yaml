id: "AUTHN-M3"
category: "authentication"
title: "Administrative access to AI control planes must require strong authentication including MFA"
description: "Administrative access to AI control planes shall require strong authentication including MFA"
whyItMatters: "AUTHN-M3 (Authentication, mandatory): Administrative access to AI control planes
  shall require strong authentication including MFA Failing this leaves a production gap against:
  100% of AI control-plane admin roles enforce MFA; break-glass accounts ≤ documented maximum and
  have monitoring enabled"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of AI control-plane admin roles enforce MFA; break-glass accounts ≤ documented
  maximum and have monitoring enabled"
evidenceRequired:
  - "IdP policy export for AI admin roles + break-glass account inventory"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "IdP policy export for AI admin roles + break-glass account inventory"
manualVerification: "For AUTHN-M3 (Administrative access to AI control planes must require strong
  authentication including MFA): inspect current evidence for [IdP policy export for AI admin roles
  + break-glass account inventory] and confirm the pass condition holds — 100% of AI control-plane
  admin roles enforce MFA; break-glass accounts ≤ documented maximum and have monitoring enabled"
falsePositiveGuidance: "AUTHN-M3 (Authentication): re-verify against a current artifact for this
  specific Check (AUTHN-M3), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: Administrative access to AI control planes must require strong
    authentication including MFA (AUTHN-M3)"
  - "Retain evidence artifacts required by this Check, starting with: IdP policy export for AI admin
    roles + break-glass account inventory"
  - "Schedule recurring manual verification for AUTHN-M3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until AUTHN-M3 passes"
references:
  - title: "OWASP Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
  - title: "CIS Benchmarks — Identity controls"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "AUTHN-M1"
  - "AUTHN-M2"
  - "AUTHN-M4"
  - "AUTHN-R1"
  - "AUTHN-R2"
tags:
  - "authentication"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "mcp"
    - "a2a"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
