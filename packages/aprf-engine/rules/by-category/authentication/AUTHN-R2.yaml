id: "AUTHN-R2"
category: "authentication"
title: "AUTHN-R2: Workload identity for self-hosted model runtimes"
description: "Workload identity for self-hosted model runtimes"
whyItMatters: "AUTHN-R2 (Authentication, recommended): Workload identity for self-hosted model
  runtimes Failing this leaves a production gap against: Every self-hosted model runtime in
  production authenticates via workload identity (SPIFFE/IAM role/equivalent); 0 static shared keys
  in the runtime inventory"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Every self-hosted model runtime in production authenticates via workload identity
  (SPIFFE/IAM role/equivalent); 0 static shared keys in the runtime inventory"
evidenceRequired:
  - "Workload-identity binding config for self-hosted model runtimes + sample authenticated call
    traces"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Workload-identity binding config for self-hosted model runtimes + sample authenticated call
          traces"
manualVerification: "For AUTHN-R2 (AUTHN-R2: Workload identity for self-hosted model runtimes):
  inspect current evidence for [Workload-identity binding config for self-hosted model runtimes +
  sample authenticated call traces] and confirm the pass condition holds — Every self-hosted model
  runtime in production authenticates via workload identity (SPIFFE/IAM role/equivalent); 0 static
  shared keys in the runtime inventory"
falsePositiveGuidance: "AUTHN-R2 (Authentication): re-verify against a current artifact for this
  specific Check (AUTHN-R2), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: AUTHN-R2: Workload identity for self-hosted model runtimes
    (AUTHN-R2)"
  - "Retain evidence artifacts required by this Check, starting with: Workload-identity binding
    config for self-hosted model runtimes + sample authenticated call traces"
  - "Schedule recurring manual verification for AUTHN-R2 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until AUTHN-R2 passes"
references:
  - title: "OWASP Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
  - title: "CIS Benchmarks — Identity controls"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "AUTHN-M1"
  - "AUTHN-M2"
  - "AUTHN-M3"
  - "AUTHN-M4"
  - "AUTHN-R1"
tags:
  - "authentication"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "mcp"
    - "a2a"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
