id: "AUTHN-R1"
category: "authentication"
title: "AUTHN-R1: Short-lived tokens for agents and tools; no long-lived static keys in prompts"
description: "Short-lived tokens for agents and tools; no long-lived static keys in prompts"
whyItMatters: "AUTHN-R1 (Authentication, recommended): Short-lived tokens for agents and tools; no
  long-lived static keys in prompts Failing this leaves a production gap against: 100% of
  inventoried agent/tool credentials have TTL ≤1h (or a named exception ≤30 days); secret scan of
  prompts/config finds 0 long-lived static API keys"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "100% of inventoried agent/tool credentials have TTL ≤1h (or a named exception ≤30
  days); secret scan of prompts/config finds 0 long-lived static API keys"
evidenceRequired:
  - "IdP/token TTL policy export + inventory of agent/tool credentials used in production
    prompts/config"
detection:
  capability: "hybrid"
  detectors:
    - id: "mcp-no-secrets-in-env"
      params: {}
    - id: "secrets-not-embedded"
      params: {}
    - id: "manual-attest"
      params:
        hint: "IdP/token TTL policy export + inventory of agent/tool credentials used in production
          prompts/config"
manualVerification: "For AUTHN-R1 (AUTHN-R1: Short-lived tokens for agents and tools; no long-lived
  static keys in prompts): inspect current evidence for [IdP/token TTL policy export + inventory of
  agent/tool credentials used in production prompts/config] and confirm the pass condition holds —
  100% of inventoried agent/tool credentials have TTL ≤1h (or a named exception ≤30 days); secret
  scan of prompts/config finds 0 long-lived static API keys"
falsePositiveGuidance: "AUTHN-R1 (Authentication): when automation and attestation disagree, prefer
  the stricter outcome until reconciled. Waive only with owner, expiry, and which signal covers the
  gap."
recommendedFixes:
  - "Implement and operationalize: AUTHN-R1: Short-lived tokens for agents and tools; no long-lived
    static keys in prompts (AUTHN-R1)"
  - "Retain evidence artifacts required by this Check, starting with: IdP/token TTL policy export +
    inventory of agent/tool credentials used in production prompts/config"
  - "Wire or verify detectors declared on AUTHN-R1 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until AUTHN-R1 passes"
references:
  - title: "OWASP Authentication Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
  - title: "CIS Benchmarks — Identity controls"
    url: "https://www.cisecurity.org/cis-benchmarks"
relatedRules:
  - "AUTHN-M1"
  - "AUTHN-M2"
  - "AUTHN-M3"
  - "AUTHN-M4"
  - "AUTHN-R2"
tags:
  - "authentication"
  - "recommended"
  - "hybrid"
applicability:
  technologies:
    - "openapi"
    - "mcp"
    - "a2a"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
