id: "PRI-M1"
category: "data-privacy"
title: "Data flowing to models must be classified; sensitive classes must have documented handling rules"
description: "Data flowing to models shall be classified; sensitive classes shall have documented
  handling rules"
whyItMatters: "PRI-M1 (Data Privacy, mandatory): Data flowing to models shall be classified;
  sensitive classes shall have documented handling rules Failing this leaves a production gap
  against: Classification scheme covers AI payload classes; ≥1 automated or sampled audit shows 100%
  of sampled production model requests tagged with a class, and sensiti…"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "Classification scheme covers AI payload classes; ≥1 automated or sampled audit shows
  100% of sampled production model requests tagged with a class, and sensitive-class handling
  matches policy"
evidenceRequired:
  - "Data classification scheme + handling rules for model-bound payloads"
detection:
  capability: "hybrid"
  detectors:
    - id: "prompt-no-pii-patterns"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Data classification scheme + handling rules for model-bound payloads"
manualVerification: "For PRI-M1 (Data flowing to models must be classified; sensitive classes must
  have documented handling rules): inspect current evidence for [Data classification scheme +
  handling rules for model-bound payloads] and confirm the pass condition holds — Classification
  scheme covers AI payload classes; ≥1 automated or sampled audit shows 100% of sampled production
  model requests tagged with a class, and sensitive-class handling ma…"
falsePositiveGuidance: "PRI-M1 (Data Privacy): when automation and attestation disagree, prefer the
  stricter outcome until reconciled. Waive only with owner, expiry, and which signal covers the
  gap."
recommendedFixes:
  - "Implement and operationalize: Data flowing to models must be classified; sensitive classes must
    have documented handling rules (PRI-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Data classification scheme +
    handling rules for model-bound payloads"
  - "Wire or verify detectors declared on PRI-M1 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until PRI-M1 passes"
references:
  - title: "NIST AI RMF — privacy considerations"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "OWASP LLM — Sensitive Information Disclosure"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "PRI-M2"
  - "PRI-M3"
  - "PRI-M4"
  - "PRI-M5"
  - "PRI-R1"
tags:
  - "data-privacy"
  - "mandatory"
  - "hybrid"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "vector-databases"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
