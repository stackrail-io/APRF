id: "REL-M7"
category: "reliability-continuity"
title: "Chaos experiments must cover AI dependency failure modes"
description: "Chaos experiments shall cover AI dependency failure modes"
whyItMatters: "REL-M7 (Reliability & Continuity, mandatory): Chaos experiments shall cover AI
  dependency failure modes Failing this leaves a production gap against: PASS if at least one
  AI-dependency chaos exercise completed in the last 180 days with retained actions"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "PASS if at least one AI-dependency chaos exercise completed in the last 180 days
  with retained actions"
evidenceRequired:
  - "Chaos experiment plan + dated after-action report including AI provider/tool failures"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-chaos-tests"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Chaos experiment plan + dated after-action report including AI provider/tool failures"
manualVerification: "For REL-M7 (Chaos experiments must cover AI dependency failure modes): inspect
  current evidence for [Chaos experiment plan + dated after-action report including AI provider/tool
  failures] and confirm the pass condition holds — PASS if at least one AI-dependency chaos exercise
  completed in the last 180 days with retained actions"
falsePositiveGuidance: "REL-M7 (Reliability & Continuity): when automation and attestation disagree,
  prefer the stricter outcome until reconciled. Waive only with owner, expiry, and which signal
  covers the gap."
recommendedFixes:
  - "Implement and operationalize: Chaos experiments must cover AI dependency failure modes (REL-M7)"
  - "Retain evidence artifacts required by this Check, starting with: Chaos experiment plan + dated
    after-action report including AI provider/tool failures"
  - "Wire or verify detectors declared on REL-M7 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until REL-M7 passes"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Disaster Recovery"
    url: "https://sre.google/sre-book/disaster-recovery/"
relatedRules:
  - "REL-M1"
  - "REL-M2"
  - "REL-M3"
  - "REL-M4"
  - "REL-M5"
tags:
  - "reliability-continuity"
  - "mandatory"
  - "hybrid"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
