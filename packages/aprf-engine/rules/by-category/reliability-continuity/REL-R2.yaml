id: "REL-R2"
category: "reliability-continuity"
title: "REL-R2: Multi-provider or multi-region fallback with eval coverage"
description: "Multi-provider or multi-region fallback with eval coverage"
whyItMatters: "REL-R2 (Reliability & Continuity, recommended): Multi-provider or multi-region
  fallback with eval coverage Failing this leaves a production gap against: Fallback path is
  configured and was exercised ≤90 days; fallback eval meets minimum quality/safety bars (not only
  connectivity)"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Fallback path is configured and was exercised ≤90 days; fallback eval meets minimum
  quality/safety bars (not only connectivity)"
evidenceRequired:
  - "Multi-provider or multi-region fallback config + eval report comparing primary vs fallback
    quality/safety"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Multi-provider or multi-region fallback config + eval report comparing primary vs fallback
          quality/safety"
manualVerification: "For REL-R2 (REL-R2: Multi-provider or multi-region fallback with eval
  coverage): inspect current evidence for [Multi-provider or multi-region fallback config + eval
  report comparing primary vs fallback quality/safety] and confirm the pass condition holds —
  Fallback path is configured and was exercised ≤90 days; fallback eval meets minimum quality/safety
  bars (not only connectivity)"
falsePositiveGuidance: "REL-R2 (Reliability & Continuity): re-verify against a current artifact for
  this specific Check (REL-R2), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: REL-R2: Multi-provider or multi-region fallback with eval
    coverage (REL-R2)"
  - "Retain evidence artifacts required by this Check, starting with: Multi-provider or multi-region
    fallback config + eval report comparing primary vs fallback quality/…"
  - "Schedule recurring manual verification for REL-R2 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until REL-R2 passes"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Disaster Recovery"
    url: "https://sre.google/sre-book/disaster-recovery/"
relatedRules:
  - "REL-M1"
  - "REL-M2"
  - "REL-M3"
  - "REL-M4"
  - "REL-M5"
tags:
  - "reliability-continuity"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
