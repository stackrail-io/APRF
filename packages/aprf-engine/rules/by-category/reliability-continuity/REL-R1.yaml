id: "REL-R1"
category: "reliability-continuity"
title: "REL-R1: Circuit breakers and bulkheads around provider clients"
description: "Circuit breakers and bulkheads around provider clients"
whyItMatters: "REL-R1 (Reliability & Continuity, recommended): Circuit breakers and bulkheads around
  provider clients Failing this leaves a production gap against: Breaker opens under induced failure
  in test or observed prod trip within 90 days; bulkhead limits concurrent calls per provider
  dependency"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Breaker opens under induced failure in test or observed prod trip within 90 days;
  bulkhead limits concurrent calls per provider dependency"
evidenceRequired:
  - "Client library/config showing circuit breakers and bulkheads around model/provider calls + last
    trip log"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Client library/config showing circuit breakers and bulkheads around model/provider calls +
          last trip log"
manualVerification: "For REL-R1 (REL-R1: Circuit breakers and bulkheads around provider clients):
  inspect current evidence for [Client library/config showing circuit breakers and bulkheads around
  model/provider calls + last trip log] and confirm the pass condition holds — Breaker opens under
  induced failure in test or observed prod trip within 90 days; bulkhead limits concurrent calls per
  provider dependency"
falsePositiveGuidance: "REL-R1 (Reliability & Continuity): re-verify against a current artifact for
  this specific Check (REL-R1), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: REL-R1: Circuit breakers and bulkheads around provider clients
    (REL-R1)"
  - "Retain evidence artifacts required by this Check, starting with: Client library/config showing
    circuit breakers and bulkheads around model/provider calls + last tri…"
  - "Schedule recurring manual verification for REL-R1 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until REL-R1 passes"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Disaster Recovery"
    url: "https://sre.google/sre-book/disaster-recovery/"
