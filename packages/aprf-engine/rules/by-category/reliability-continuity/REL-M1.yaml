id: "REL-M1"
category: "reliability-continuity"
title: "All model and tool calls must have timeouts and bounded retries"
description: "All model and tool calls shall have timeouts and bounded retries"
whyItMatters: "REL-M1 (Reliability & Continuity, mandatory): All model and tool calls shall have
  timeouts and bounded retries Failing this leaves a production gap against: 100% of model/tool
  client call sites have finite timeout and max-retry ≤ bound; verified by static check or
  integration test"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of model/tool client call sites have finite timeout and max-retry ≤ bound;
  verified by static check or integration test"
evidenceRequired:
  - "Client config / static analysis report for timeouts and max retries"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Client config / static analysis report for timeouts and max retries"

manualVerification: "For REL-M1 (All model and tool calls must have timeouts and bounded retries):
  inspect current evidence for [Client config / static analysis report for timeouts and max retries]
  and confirm the pass condition holds — 100% of model/tool client call sites have finite timeout
  and max-retry ≤ bound; verified by static check or integration test"
falsePositiveGuidance: "REL-M1 (Reliability & Continuity): confirm the detector target matches the
  production path for this Check before waiving. Named exceptions need an owner and expiry ≤90
  days."
recommendedFixes:
  - "Implement and operationalize: All model and tool calls must have timeouts and bounded retries
    (REL-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Client config / static
    analysis report for timeouts and max retries"
  - "Schedule recurring manual verification for REL-M1 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until REL-M1 passes"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Disaster Recovery"
    url: "https://sre.google/sre-book/disaster-recovery/"
relatedRules:
  - "REL-M2"
  - "REL-M3"
  - "REL-M4"
  - "REL-M5"
  - "REL-M6"
tags:
  - "reliability-continuity"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
