id: "REL-M5"
category: "reliability-continuity"
title: "Backups must include AI control-plane artifacts needed to restore service"
description: "Backups shall include AI control-plane artifacts needed to restore service"
whyItMatters: "REL-M5 (Reliability & Continuity, mandatory): Backups shall include AI control-plane
  artifacts needed to restore service Failing this leaves a production gap against: Backup inventory
  includes required AI control-plane artifacts; restore test in last 90 days succeeds for a sample
  artifact set"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Backup inventory includes required AI control-plane artifacts; restore test in last
  90 days succeeds for a sample artifact set"
evidenceRequired:
  - "Backup job config covering prompt registry, policies, indexes as required + restore test"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Backup job config covering prompt registry, policies, indexes as required + restore test"
manualVerification: "For REL-M5 (Backups must include AI control-plane artifacts needed to restore
  service): inspect current evidence for [Backup job config covering prompt registry, policies,
  indexes as required + restore test] and confirm the pass condition holds — Backup inventory
  includes required AI control-plane artifacts; restore test in last 90 days succeeds for a sample
  artifact set"
falsePositiveGuidance: "REL-M5 (Reliability & Continuity): re-verify against a current artifact for
  this specific Check (REL-M5), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: Backups must include AI control-plane artifacts needed to restore
    service (REL-M5)"
  - "Retain evidence artifacts required by this Check, starting with: Backup job config covering
    prompt registry, policies, indexes as required + restore test"
  - "Schedule recurring manual verification for REL-M5 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until REL-M5 passes"
references:
  - title: "Google SRE Book — Addressing Cascading Failures"
    url: "https://sre.google/sre-book/addressing-cascading-failures/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Disaster Recovery"
    url: "https://sre.google/sre-book/disaster-recovery/"
relatedRules:
  - "REL-M1"
  - "REL-M2"
  - "REL-M3"
  - "REL-M4"
  - "REL-M6"
tags:
  - "reliability-continuity"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
    - "kubernetes"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
