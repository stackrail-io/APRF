id: "INC-M4"
category: "incident-readiness"
title: "Regular tabletop exercises must cover AI-specific incidents"
description: "Regular tabletop exercises shall cover AI-specific incidents"
whyItMatters: "INC-M4 (Incident Readiness, mandatory): Regular tabletop exercises shall cover
  AI-specific incidents Failing this leaves a production gap against: PASS if an AI-focused tabletop
  completed ≤180 days with retained actions and owners"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "PASS if an AI-focused tabletop completed ≤180 days with retained actions and owners"
evidenceRequired:
  - "Tabletop plan + dated after-action report for an AI incident scenario"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Tabletop plan + dated after-action report for an AI incident scenario"
manualVerification: "For INC-M4 (Regular tabletop exercises must cover AI-specific incidents):
  inspect current evidence for [Tabletop plan + dated after-action report for an AI incident
  scenario] and confirm the pass condition holds — PASS if an AI-focused tabletop completed ≤180
  days with retained actions and owners"
falsePositiveGuidance: "INC-M4 (Incident Readiness): re-verify against a current artifact for this
  specific Check (INC-M4), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Regular tabletop exercises must cover AI-specific incidents
    (INC-M4)"
  - "Retain evidence artifacts required by this Check, starting with: Tabletop plan + dated
    after-action report for an AI incident scenario"
  - "Schedule recurring manual verification for INC-M4 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until INC-M4 passes"
references:
  - title: "Google SRE — Managing Incidents"
    url: "https://sre.google/sre-book/managing-incidents/"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "INC-M1"
  - "INC-M2"
  - "INC-M3"
  - "INC-R1"
  - "INC-R3"
tags:
  - "incident-readiness"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "cicd"
  minCriticality: 3
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
