id: "INC-M2"
category: "incident-readiness"
title: "On-call must be able to execute containment: pause agents, disable tools, roll back
  prompts/models"
description: "On-call shall be able to execute containment: pause agents, disable tools, roll back
  prompts/models"
whyItMatters: "INC-M2 (Incident Readiness, mandatory): On-call shall be able to execute containment:
  pause agents, disable tools, roll back prompts/models Failing this leaves a production gap
  against: Drill in last 90 days successfully demonstrated pause agents, disable tools, and roll
  back prompt/model within documented time budgets"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Drill in last 90 days successfully demonstrated pause agents, disable tools, and
  roll back prompt/model within documented time budgets"
evidenceRequired:
  - "Containment runbook + drill record exercising pause, disable, and rollback"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Containment runbook + drill record exercising pause, disable, and rollback"
manualVerification: "For INC-M2 (On-call must be able to execute containment: pause agents, disable
  tools, roll back prompts/models): inspect current evidence for [Containment runbook + drill record
  exercising pause, disable, and rollback] and confirm the pass condition holds — Drill in last 90
  days successfully demonstrated pause agents, disable tools, and roll back prompt/model within
  documented time budgets"
falsePositiveGuidance: "INC-M2 (Incident Readiness): re-verify against a current artifact for this
  specific Check (INC-M2), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: On-call must be able to execute containment: pause agents,
    disable tools, roll back prompts/models (INC-M2)"
  - "Retain evidence artifacts required by this Check, starting with: Containment runbook + drill
    record exercising pause, disable, and rollback"
  - "Schedule recurring manual verification for INC-M2 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until INC-M2 passes"
references:
  - title: "Google SRE — Managing Incidents"
    url: "https://sre.google/sre-book/managing-incidents/"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "INC-M1"
  - "INC-M3"
  - "INC-M4"
  - "INC-R1"
  - "INC-R3"
tags:
  - "incident-readiness"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
