id: "INC-M1"
category: "incident-readiness"
title: "AI-specific incident playbooks must exist for abuse, leakage, bad actions, and provider outage"
description: "AI-specific incident playbooks shall exist for abuse, leakage, bad actions, and provider outage"
whyItMatters: "INC-M1 (Incident Readiness, mandatory): AI-specific incident playbooks shall exist
  for abuse, leakage, bad actions, and provider outage Failing this leaves a production gap against:
  Four playbooks present (abuse, leakage, bad actions, provider outage), each with owner and review
  date ≤ 12 months"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Four playbooks present (abuse, leakage, bad actions, provider outage), each with
  owner and review date ≤ 12 months"
evidenceRequired:
  - "Playbook set covering the four scenarios with owners"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-incident-playbooks"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Playbook set covering the four scenarios with owners"
manualVerification: "For INC-M1 (AI-specific incident playbooks must exist for abuse, leakage, bad
  actions, and provider outage): inspect current evidence for [Playbook set covering the four
  scenarios with owners] and confirm the pass condition holds — Four playbooks present (abuse,
  leakage, bad actions, provider outage), each with owner and review date ≤ 12 months"
falsePositiveGuidance: "INC-M1 (Incident Readiness): when automation and attestation disagree,
  prefer the stricter outcome until reconciled. Waive only with owner, expiry, and which signal
  covers the gap."
recommendedFixes:
  - "Implement and operationalize: AI-specific incident playbooks must exist for abuse, leakage, bad
    actions, and provider outage (INC-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Playbook set covering the four
    scenarios with owners"
  - "Wire or verify detectors declared on INC-M1 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until INC-M1 passes"
references:
  - title: "Google SRE — Managing Incidents"
    url: "https://sre.google/sre-book/managing-incidents/"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "INC-M2"
  - "INC-M3"
  - "INC-M4"
  - "INC-R1"
  - "INC-R3"
tags:
  - "incident-readiness"
  - "mandatory"
  - "hybrid"
applicability:
  technologies:
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
