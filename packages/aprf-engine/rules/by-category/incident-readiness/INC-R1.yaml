id: "INC-R1"
category: "incident-readiness"
title: "INC-R1: Page-worthy alerts for safety and quality signals, not only infra"
description: "Page-worthy alerts for safety and quality signals, not only infra"
whyItMatters: "INC-R1 (Incident Readiness, recommended): Page-worthy alerts for safety and quality
  signals, not only infra Failing this leaves a production gap against: At least two non-infra
  signals (e.g. refusal-rate spike, eval-score drop, toxicity/jailbreak hit rate) page an on-call;
  each has a documented threshold and own…"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "At least two non-infra signals (e.g. refusal-rate spike, eval-score drop,
  toxicity/jailbreak hit rate) page an on-call; each has a documented threshold and owner; policy
  reviewed ≤90 days ago"
evidenceRequired:
  - "On-call alert policy export listing safety/quality pages + last 90 days of triggered incidents
    (or drill tickets)"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "On-call alert policy export listing safety/quality pages + last 90 days of triggered
          incidents (or drill tickets)"
manualVerification: "For INC-R1 (INC-R1: Page-worthy alerts for safety and quality signals, not only
  infra): inspect current evidence for [On-call alert policy export listing safety/quality pages +
  last 90 days of triggered incidents (or drill tickets)] and confirm the pass condition holds — At
  least two non-infra signals (e.g. refusal-rate spike, eval-score drop, toxicity/jailbreak hit
  rate) page an on-call; each has a documented threshold and owner; policy reviewed…"
falsePositiveGuidance: "INC-R1 (Incident Readiness): re-verify against a current artifact for this
  specific Check (INC-R1), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: INC-R1: Page-worthy alerts for safety and quality signals, not
    only infra (INC-R1)"
  - "Retain evidence artifacts required by this Check, starting with: On-call alert policy export
    listing safety/quality pages + last 90 days of triggered incidents (or…"
  - "Schedule recurring manual verification for INC-R1 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until INC-R1 passes"
references:
  - title: "Google SRE — Managing Incidents"
    url: "https://sre.google/sre-book/managing-incidents/"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "INC-M1"
  - "INC-M2"
  - "INC-M3"
  - "INC-M4"
  - "INC-R3"
tags:
  - "incident-readiness"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
