  real notification sample] and confirm the pass condition holds — Criteria map event types (safety
  incident, widespread quality fail, data exposure) to notify / no-notify; last drill or incident
  ≤12 months followed the criteria with timestamps"
falsePositiveGuidance: "INC-R3 (Incident Readiness): re-verify against a current artifact for this
