id: "INC-R3"
category: "incident-readiness"
title: "INC-R3: Customer notification criteria for AI-related events"
description: "Customer notification criteria for AI-related events"
whyItMatters: "INC-R3 (Incident Readiness, recommended): Customer notification criteria for
  AI-related events Failing this leaves a production gap against: Criteria map event types (safety
  incident, widespread quality fail, data exposure) to notify / no-notify; last drill or incident
  ≤12 months followed the criter…"
severity: "high"
