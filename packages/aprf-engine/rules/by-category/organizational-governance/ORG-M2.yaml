id: "ORG-M2"
category: "organizational-governance"
title: "Each production AI system must have named owners for critical APRF domains"
description: "Each production AI system shall have named owners for critical APRF domains"
whyItMatters: "ORG-M2 (Organizational Governance, mandatory): Each production AI system shall have
  named owners for critical APRF domains Failing this leaves a production gap against: 0 production
  systems missing required domain owners in inventory query"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "0 production systems missing required domain owners in inventory query"
evidenceRequired:
  - "System inventory with owner fields for critical domains"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-codeowners-present"
      params: {}
    - id: "manual-attest"
      params:
        hint: "System inventory with owner fields for critical domains"
manualVerification: "For ORG-M2 (Each production AI system must have named owners for critical APRF
  domains): inspect current evidence for [System inventory with owner fields for critical domains]
  and confirm the pass condition holds — 0 production systems missing required domain owners in
  inventory query"
falsePositiveGuidance: "ORG-M2 (Organizational Governance): when automation and attestation
  disagree, prefer the stricter outcome until reconciled. Waive only with owner, expiry, and which
  signal covers the gap."
recommendedFixes:
  - "Implement and operationalize: Each production AI system must have named owners for critical
    APRF domains (ORG-M2)"
  - "Retain evidence artifacts required by this Check, starting with: System inventory with owner
    fields for critical domains"
  - "Wire or verify detectors declared on ORG-M2 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until ORG-M2 passes"
references:
  - title: "ISO/IEC 42001 — AI management systems"
    url: "https://www.iso.org/standard/81230.html"
  - title: "NIST AI RMF — Govern"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "ORG-M1"
  - "ORG-M3"
  - "ORG-M4"
  - "ORG-R1"
  - "ORG-R3"
tags:
  - "organizational-governance"
  - "mandatory"
  - "hybrid"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
