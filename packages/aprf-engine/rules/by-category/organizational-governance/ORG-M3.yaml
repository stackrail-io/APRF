id: "ORG-M3"
category: "organizational-governance"
title: "Risk acceptance for known control gaps must be recorded with owner and expiry"
description: "Risk acceptance for known control gaps shall be recorded with owner and expiry"
whyItMatters: "ORG-M3 (Organizational Governance, mandatory): Risk acceptance for known control gaps
  shall be recorded with owner and expiry Failing this leaves a production gap against: 100% of open
  control-gap waivers have owner + expiry date; 0 expired waivers without escalation record"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of open control-gap waivers have owner + expiry date; 0 expired waivers without
  escalation record"
evidenceRequired:
  - "Risk-acceptance register samples"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Risk-acceptance register samples"
manualVerification: "For ORG-M3 (Risk acceptance for known control gaps must be recorded with owner
  and expiry): inspect current evidence for [Risk-acceptance register samples] and confirm the pass
  condition holds — 100% of open control-gap waivers have owner + expiry date; 0 expired waivers
  without escalation record"
falsePositiveGuidance: "ORG-M3 (Organizational Governance): re-verify against a current artifact for
  this specific Check (ORG-M3), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: Risk acceptance for known control gaps must be recorded with
    owner and expiry (ORG-M3)"
  - "Retain evidence artifacts required by this Check, starting with: Risk-acceptance register
    samples"
  - "Schedule recurring manual verification for ORG-M3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until ORG-M3 passes"
references:
  - title: "ISO/IEC 42001 — AI management systems"
    url: "https://www.iso.org/standard/81230.html"
  - title: "NIST AI RMF — Govern"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "ORG-M1"
  - "ORG-M2"
  - "ORG-M4"
  - "ORG-R1"
  - "ORG-R3"
tags:
  - "organizational-governance"
  - "mandatory"
  - "manual"
applicability:
  technologies: []
  minCriticality: 3
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
