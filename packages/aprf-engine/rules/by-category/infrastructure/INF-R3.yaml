id: "INF-R3"
category: "infrastructure"
title: "INF-R3: Infrastructure-as-code with policy checks (CIS-aligned)"
description: "Infrastructure-as-code with policy checks (CIS-aligned)"
whyItMatters: "INF-R3 (Infrastructure, recommended): Infrastructure-as-code with policy checks
  (CIS-aligned) Failing this leaves a production gap against: Production AI infra is declared in
  IaC; CIS (or equivalent) policy checks run on every apply/PR; critical findings for production
  stacks are 0 or have dated ex…"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Production AI infra is declared in IaC; CIS (or equivalent) policy checks run on
  every apply/PR; critical findings for production stacks are 0 or have dated exceptions ≤90 days"
evidenceRequired:
  - "IaC modules for AI infra + CIS-aligned policy scan config + latest scan report for production
    stacks"
detection:
  capability: "manual"
  detectors: []
manualVerification: "For INF-R3 (INF: Infrastructure-as-code with policy checks (CIS-aligned)):
  inspect current evidence for [IaC modules for AI infra + CIS-aligned policy scan config + latest
  scan report for production stacks] and confirm the pass condition holds — Production AI infra is
  declared in IaC; CIS (or equivalent) policy checks run on every apply/PR; critical findings for
  production stacks are 0 or have dated exceptions ≤90 days"
falsePositiveGuidance: "INF-R3 (Infrastructure): re-verify against a current artifact for this
  specific Check (INF-R3), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: INF-R3: Infrastructure-as-code with policy checks (CIS-aligned)
    (INF-R3)"
  - "Retain evidence artifacts required by this Check, starting with: IaC modules for AI infra +
    CIS-aligned policy scan config + latest scan report for production stacks"
  - "Schedule recurring manual verification for INF-R3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until INF-R3 passes"
