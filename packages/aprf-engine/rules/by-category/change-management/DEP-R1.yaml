id: "DEP-R1"
category: "change-management"
title: "DEP-R1: Canary or progressive delivery for high-traffic AI changes"
description: "Canary or progressive delivery for high-traffic AI changes"
whyItMatters: "DEP-R1 (Change Management & Release, recommended): Canary or progressive delivery for
  high-traffic AI changes Failing this leaves a production gap against: High-traffic AI changes use
  canary or progressive rollout with automated rollback criteria; last such release ≤90 days
  includes canary metrics link"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "High-traffic AI changes use canary or progressive rollout with automated rollback
  criteria; last such release ≤90 days includes canary metrics link"
evidenceRequired:
  - "Progressive delivery/canary config for high-traffic AI changes + last canary promotion log"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Progressive delivery/canary config for high-traffic AI changes + last canary promotion log"
manualVerification: "For DEP-R1 (DEP-R1: Canary or progressive delivery for high-traffic AI
  changes): inspect current evidence for [Progressive delivery/canary config for high-traffic AI
  changes + last canary promotion log] and confirm the pass condition holds — High-traffic AI
  changes use canary or progressive rollout with automated rollback criteria; last such release ≤90
  days includes canary metrics link"
falsePositiveGuidance: "DEP-R1 (Change Management & Release): re-verify against a current artifact
  for this specific Check (DEP-R1), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: DEP-R1: Canary or progressive delivery for high-traffic AI
    changes (DEP-R1)"
  - "Retain evidence artifacts required by this Check, starting with: Progressive delivery/canary
    config for high-traffic AI changes + last canary promotion log"
  - "Schedule recurring manual verification for DEP-R1 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until DEP-R1 passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
