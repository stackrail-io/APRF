id: "CHG-M2"
category: "change-management"
title: "Rollback procedure must be documented and operable by on-call"
description: "Rollback procedure shall be documented and operable by on-call"
whyItMatters: "CHG-M2 (Change Management & Release, mandatory): Rollback procedure shall be
  documented and operable by on-call Failing this leaves a production gap against: Runbook lists
  exact commands/UI steps and owners; ≥1 on-call engineer completed a walkthrough or drill in the
  last 90 days with recorded time-to-execute"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "Runbook lists exact commands/UI steps and owners; ≥1 on-call engineer completed a
  walkthrough or drill in the last 90 days with recorded time-to-execute"
evidenceRequired:
  - "Rollback runbook + on-call acknowledgment or drill checklist"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-rollback-runbook"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Rollback runbook + on-call acknowledgment or drill checklist"
manualVerification: "For CHG-M2 (Rollback procedure must be documented and operable by on-call):
  inspect current evidence for [Rollback runbook + on-call acknowledgment or drill checklist] and
  confirm the pass condition holds — Runbook lists exact commands/UI steps and owners; ≥1 on-call
  engineer completed a walkthrough or drill in the last 90 days with recorded time-to-execute"
falsePositiveGuidance: "CHG-M2 (Change Management & Release): when automation and attestation
  disagree, prefer the stricter outcome until reconciled. Waive only with owner, expiry, and which
  signal covers the gap."
recommendedFixes:
  - "Implement and operationalize: Rollback procedure must be documented and operable by on-call
    (CHG-M2)"
  - "Retain evidence artifacts required by this Check, starting with: Rollback runbook + on-call
    acknowledgment or drill checklist"
  - "Wire or verify detectors declared on CHG-M2 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until CHG-M2 passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "DEP-M1"
  - "DEP-M2"
  - "DEP-M3"
  - "CHG-M1"
  - "CHG-M3"
tags:
  - "change-management"
  - "mandatory"
  - "hybrid"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "azure-devops"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
