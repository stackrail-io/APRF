id: "DEP-M3"
category: "change-management"
title: "Infrastructure and AI config must be defined as code or equivalent declarative config"
description: "Infrastructure and AI config shall be defined as code or equivalent declarative config"
whyItMatters: "DEP-M3 (Change Management & Release, mandatory): Infrastructure and AI config shall
  be defined as code or equivalent declarative config Failing this leaves a production gap against:
  Drift check shows 0 unmanaged production AI config resources outside declarative sources; sample
  of live pins matches declared versions at 100%"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "Drift check shows 0 unmanaged production AI config resources outside declarative
  sources; sample of live pins matches declared versions at 100%"
evidenceRequired:
  - "IaC/config repo paths for AI gateway, model pins, tool catalogs, and prompts"
detection:
  capability: "automated"
  detectors:
    - id: "repo-ai-config-as-code"
      params: {}
    - id: "manual-attest"
      params:
        hint: "IaC/config repo paths for AI gateway, model pins, tool catalogs, and prompts"
manualVerification: "For DEP-M3 (Infrastructure and AI config must be defined as code or equivalent
  declarative config): inspect current evidence for [IaC/config repo paths for AI gateway, model
  pins, tool catalogs, and prompts] and confirm the pass condition holds — Drift check shows 0
  unmanaged production AI config resources outside declarative sources; sample of live pins matches
  declared versions at 100%"
falsePositiveGuidance: "DEP-M3 (Change Management & Release): confirm the detector target matches
  the production path for this Check before waiving. Named exceptions need an owner and expiry ≤90
  days."
recommendedFixes:
  - "Implement and operationalize: Infrastructure and AI config must be defined as code or
    equivalent declarative config (DEP-M3)"
  - "Retain evidence artifacts required by this Check, starting with: IaC/config repo paths for AI
    gateway, model pins, tool catalogs, and prompts"
  - "Wire or verify detectors declared on DEP-M3 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until DEP-M3 passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "DEP-M1"
  - "DEP-M2"
  - "CHG-M1"
  - "CHG-M2"
  - "CHG-M3"
tags:
  - "change-management"
  - "mandatory"
  - "automated"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "azure-devops"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
