id: "CHG-M3"
category: "change-management"
title: "Rollback must be tested in a drill or real event on a defined cadence"
description: "Rollback shall be tested in a drill or real event on a defined cadence"
whyItMatters: "CHG-M3 (Change Management & Release, mandatory): Rollback shall be tested in a drill
  or real event on a defined cadence Failing this leaves a production gap against: ≥1 successful
  rollback (drill or real) in the last 90 days with measured time-to-restore ≤ documented RTO"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "≥1 successful rollback (drill or real) in the last 90 days with measured
  time-to-restore ≤ documented RTO"
evidenceRequired:
  - "Drill or incident record with timestamps and outcome"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Drill or incident record with timestamps and outcome"
manualVerification: "For CHG-M3 (Rollback must be tested in a drill or real event on a defined
  cadence): inspect current evidence for [Drill or incident record with timestamps and outcome] and
  confirm the pass condition holds — ≥1 successful rollback (drill or real) in the last 90 days with
  measured time-to-restore ≤ documented RTO"
falsePositiveGuidance: "CHG-M3 (Change Management & Release): re-verify against a current artifact
  for this specific Check (CHG-M3), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: Rollback must be tested in a drill or real event on a defined
    cadence (CHG-M3)"
  - "Retain evidence artifacts required by this Check, starting with: Drill or incident record with
    timestamps and outcome"
  - "Schedule recurring manual verification for CHG-M3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until CHG-M3 passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "DEP-M1"
  - "DEP-M2"
  - "DEP-M3"
  - "CHG-M1"
  - "CHG-M2"
tags:
  - "change-management"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "azure-devops"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
