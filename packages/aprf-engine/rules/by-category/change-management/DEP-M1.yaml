id: "DEP-M1"
category: "change-management"
title: "A promotion path must exist from non-prod to prod for prompts, models, and tools"
description: "A promotion path shall exist from non-prod to prod for prompts, models, and tools"
whyItMatters: "DEP-M1 (Change Management & Release, mandatory): A promotion path shall exist from
  non-prod to prod for prompts, models, and tools Failing this leaves a production gap against: 100%
  of production prompt/model/tool releases in the last 30 days flowed through the documented
  promotion path; 0 production hot-edits without a linked change…"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of production prompt/model/tool releases in the last 30 days flowed through the
  documented promotion path; 0 production hot-edits without a linked change record"
evidenceRequired:
  - "Pipeline/runbook documenting non-prod→prod promotion for prompts, models, and tools"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Pipeline/runbook documenting non-prod→prod promotion for prompts, models, and tools"
manualVerification: "For DEP-M1 (A promotion path must exist from non-prod to prod for prompts,
  models, and tools): inspect current evidence for [Pipeline/runbook documenting non-prod→prod
  promotion for prompts, models, and tools] and confirm the pass condition holds — 100% of
  production prompt/model/tool releases in the last 30 days flowed through the documented promotion
  path; 0 production hot-edits without a linked change record"
falsePositiveGuidance: "DEP-M1 (Change Management & Release): re-verify against a current artifact
  for this specific Check (DEP-M1), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: A promotion path must exist from non-prod to prod for prompts,
    models, and tools (DEP-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Pipeline/runbook documenting
    non-prod→prod promotion for prompts, models, and tools"
  - "Schedule recurring manual verification for DEP-M1 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until DEP-M1 passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "DEP-M2"
  - "DEP-M3"
  - "CHG-M1"
  - "CHG-M2"
  - "CHG-M3"
tags:
  - "change-management"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "azure-devops"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
