id: "CHG-M4"
category: "change-management"
title: "Automated rollback must trigger on quality SLO burn for AI releases"
description: "Automated rollback shall trigger on quality SLO burn for AI releases"
whyItMatters: "CHG-M4 (Change Management & Release, mandatory): Automated rollback shall trigger on
  quality SLO burn for AI releases Failing this leaves a production gap against: PASS if quality SLO
  burn is wired to automated rollback (or page+runbook with measured MTTA) and a test/drill occurred
  ≤90 days"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "PASS if quality SLO burn is wired to automated rollback (or page+runbook with
  measured MTTA) and a test/drill occurred ≤90 days"
evidenceRequired:
  - "Rollback automation config + sample trigger/test evidence tied to quality SLOs"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Rollback automation config + sample trigger/test evidence tied to quality SLOs"
manualVerification: "For CHG-M4 (Automated rollback must trigger on quality SLO burn for AI
  releases): inspect current evidence for [Rollback automation config + sample trigger/test evidence
  tied to quality SLOs] and confirm the pass condition holds — PASS if quality SLO burn is wired to
  automated rollback (or page+runbook with measured MTTA) and a test/drill occurred ≤90 days"
falsePositiveGuidance: "CHG-M4 (Change Management & Release): re-verify against a current artifact
  for this specific Check (CHG-M4), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: Automated rollback must trigger on quality SLO burn for AI
    releases (CHG-M4)"
  - "Retain evidence artifacts required by this Check, starting with: Rollback automation config +
    sample trigger/test evidence tied to quality SLOs"
  - "Schedule recurring manual verification for CHG-M4 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until CHG-M4 passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "DEP-M1"
  - "DEP-M2"
  - "DEP-M3"
  - "CHG-M1"
  - "CHG-M2"
tags:
  - "change-management"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "azure-devops"
    - "cicd"
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
