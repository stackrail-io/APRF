  - "DEP-M2"
  - "DEP-M3"
  - "CHG-M1"
  - "CHG-M2"
tags:
  - "change-management"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "azure-devops"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
