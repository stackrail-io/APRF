id: "CHG-R2"
category: "change-management"
title: "CHG-R2: Feature flags for new agent behaviors"
description: "Feature flags for new agent behaviors"
whyItMatters: "CHG-R2 (Change Management & Release, recommended): Feature flags for new agent
  behaviors Failing this leaves a production gap against: New agent behaviors ship behind flags;
  flag state changes are audited; kill/disable path tested ≤90 days ago"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "New agent behaviors ship behind flags; flag state changes are audited; kill/disable
  path tested ≤90 days ago"
evidenceRequired:
  - "Feature-flag config covering new agent behaviors + sample flag change audit trail"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Feature-flag config covering new agent behaviors + sample flag change audit trail"
manualVerification: "For CHG-R2 (CHG-R2: Feature flags for new agent behaviors): inspect current
  evidence for [Feature-flag config covering new agent behaviors + sample flag change audit trail]
  and confirm the pass condition holds — New agent behaviors ship behind flags; flag state changes
  are audited; kill/disable path tested ≤90 days ago"
falsePositiveGuidance: "CHG-R2 (Change Management & Release): re-verify against a current artifact
  for this specific Check (CHG-R2), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: CHG-R2: Feature flags for new agent behaviors (CHG-R2)"
  - "Retain evidence artifacts required by this Check, starting with: Feature-flag config covering
    new agent behaviors + sample flag change audit trail"
  - "Schedule recurring manual verification for CHG-R2 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until CHG-R2 passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
