id: "DEP-M2"
category: "change-management"
title: "Production changes must be recorded (who/what/when) and linked to reviews"
description: "Production changes shall be recorded (who/what/when) and linked to reviews"
whyItMatters: "DEP-M2 (Change Management & Release, mandatory): Production changes shall be recorded
  (who/what/when) and linked to reviews Failing this leaves a production gap against: 100% of
  production AI artifact changes in the last 30 days have who/what/when fields and a review link
  (PR, ticket, or approval ID)"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of production AI artifact changes in the last 30 days have who/what/when fields
  and a review link (PR, ticket, or approval ID)"
evidenceRequired:
  - "Change log or ticket export for AI artifact releases"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Change log or ticket export for AI artifact releases"
manualVerification: "For DEP-M2 (Be recorded (who/what/when) and linked to reviews): inspect current
  evidence for [Change log or ticket export for AI artifact releases] and confirm the pass condition
  holds — 100% of production AI artifact changes in the last 30 days have who/what/when fields and a
  review link (PR, ticket, or approval ID)"
falsePositiveGuidance: "DEP-M2 (Change Management & Release): re-verify against a current artifact
  for this specific Check (DEP-M2), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: Production changes must be recorded (who/what/when) and linked to
    reviews (DEP-M2)"
  - "Retain evidence artifacts required by this Check, starting with: Change log or ticket export
    for AI artifact releases"
  - "Schedule recurring manual verification for DEP-M2 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until DEP-M2 passes"
references:
  - title: "Google SRE Workbook — Configuration Management"
    url: "https://sre.google/workbook/"
  - title: "AWS Well-Architected — Operational Excellence"
    url: "https://aws.amazon.com/architecture/well-architected/"
  - title: "Google SRE — Emergency Response"
    url: "https://sre.google/sre-book/emergency-response/"
  - title: "AWS Well-Architected — Reliability"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "DEP-M1"
  - "DEP-M3"
  - "CHG-M1"
  - "CHG-M2"
  - "CHG-M3"
tags:
  - "change-management"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "azure-devops"
    - "cicd"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
