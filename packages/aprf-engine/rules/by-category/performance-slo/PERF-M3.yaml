id: "PERF-M3"
category: "performance-slo"
title: "Alerting must exist when SLOs burn beyond defined thresholds"
description: "Alerting shall exist when SLOs burn beyond defined thresholds"
whyItMatters: "PERF-M3 (Performance & SLO Engineering, mandatory): Alerting shall exist when SLOs
  burn beyond defined thresholds Failing this leaves a production gap against: Alert policies exist
  for each critical journey SLO; alert test or documented fire demonstrates notification path works"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "Alert policies exist for each critical journey SLO; alert test or documented fire
  demonstrates notification path works"
evidenceRequired:
  - "Burn-rate or SLO alert policies"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Burn-rate or SLO alert policies"
manualVerification: "For PERF-M3 (Alerting must exist when SLOs burn beyond defined thresholds):
  inspect current evidence for [Burn-rate or SLO alert policies] and confirm the pass condition
  holds — Alert policies exist for each critical journey SLO; alert test or documented fire
  demonstrates notification path works"
falsePositiveGuidance: "PERF-M3 (Performance & SLO Engineering): re-verify against a current
  artifact for this specific Check (PERF-M3), not a sibling control. Document named exceptions with
  owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Alerting must exist when SLOs burn beyond defined thresholds
    (PERF-M3)"
  - "Retain evidence artifacts required by this Check, starting with: Burn-rate or SLO alert
    policies"
  - "Schedule recurring manual verification for PERF-M3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until PERF-M3 passes"
references:
  - title: "Google SRE — Service Level Objectives"
    url: "https://sre.google/sre-book/service-level-objectives/"
  - title: "AWS Well-Architected — Performance Efficiency"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "PERF-M1"
  - "PERF-M2"
  - "PERF-R1"
  - "PERF-R2"
  - "PERF-R3"
tags:
  - "performance-slo"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "cicd"
    - "kubernetes"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
