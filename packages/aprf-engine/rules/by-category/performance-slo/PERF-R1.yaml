id: "PERF-R1"
category: "performance-slo"
title: "PERF-R1: Error budgets formally gate release velocity for AI features"
description: "Error budgets formally gate release velocity for AI features"
whyItMatters: "PERF-R1 (Performance & SLO Engineering, recommended): Error budgets formally gate
  release velocity for AI features Failing this leaves a production gap against: When error budget
  for a critical AI journey is exhausted, release velocity is blocked or requires explicit risk
  acceptance; ≥1 gated event or drill in 90 days"
severity: "high"
weight: 3
gate: "recommended"
