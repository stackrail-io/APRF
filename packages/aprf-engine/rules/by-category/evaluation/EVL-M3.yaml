id: "EVL-M3"
category: "evaluation"
title: "Production must have online signals for task success/failure and safety refusals"
description: "Production shall have online signals for task success/failure and safety refusals"
whyItMatters: "EVL-M3 (Evaluation, mandatory): Production shall have online signals for task
  success/failure and safety refusals Failing this leaves a production gap against: Online metrics
  exist and are updating for task success/failure and safety refusals; alert or review cadence
  defined; freshness ≤ 24 hours on the dashboard"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "Online metrics exist and are updating for task success/failure and safety refusals;
  alert or review cadence defined; freshness ≤ 24 hours on the dashboard"
evidenceRequired:
  - "Dashboard/metrics for task success and safety refusal rates"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Dashboard/metrics for task success and safety refusal rates"
manualVerification: "For EVL-M3 (Production must have online signals for task success/failure and
  safety refusals): inspect current evidence for [Dashboard/metrics for task success and safety
  refusal rates] and confirm the pass condition holds — Online metrics exist and are updating for
  task success/failure and safety refusals; alert or review cadence defined; freshness ≤ 24 hours on
  the dashboard"
falsePositiveGuidance: "EVL-M3 (Evaluation): re-verify against a current artifact for this specific
  Check (EVL-M3), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Production must have online signals for task success/failure and
    safety refusals (EVL-M3)"
  - "Retain evidence artifacts required by this Check, starting with: Dashboard/metrics for task
    success and safety refusal rates"
  - "Schedule recurring manual verification for EVL-M3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until EVL-M3 passes"
references:
  - title: "NIST AI RMF — Measure"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "Google SRE — Monitoring Distributed Systems (measurement culture)"
    url: "https://sre.google/sre-book/monitoring-distributed-systems/"
