id: "EVL-M4"
category: "evaluation"
title: "Shadow deployment with eval comparison must precede full cutover for high-risk AI changes"
description: "Shadow deployment with eval comparison shall precede full cutover for high-risk AI changes"
whyItMatters: "EVL-M4 (Evaluation, mandatory): Shadow deployment with eval comparison shall precede
  full cutover for high-risk AI changes Failing this leaves a production gap against: PASS if the
  last high-risk AI cutover retained a shadow/canary comparison that met promotion criteria before
  100% traffic"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "PASS if the last high-risk AI cutover retained a shadow/canary comparison that met
  promotion criteria before 100% traffic"
evidenceRequired:
  - "Shadow/canary eval config + comparison report for the last high-risk cutover"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Shadow/canary eval config + comparison report for the last high-risk cutover"
manualVerification: "For EVL-M4 (Shadow deployment with eval comparison must precede full cutover
  for high-risk AI changes): inspect current evidence for [Shadow/canary eval config + comparison
  report for the last high-risk cutover] and confirm the pass condition holds — PASS if the last
  high-risk AI cutover retained a shadow/canary comparison that met promotion criteria before 100%
  traffic"
falsePositiveGuidance: "EVL-M4 (Evaluation): re-verify against a current artifact for this specific
  Check (EVL-M4), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Shadow deployment with eval comparison must precede full cutover
    for high-risk AI changes (EVL-M4)"
  - "Retain evidence artifacts required by this Check, starting with: Shadow/canary eval config +
    comparison report for the last high-risk cutover"
  - "Schedule recurring manual verification for EVL-M4 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until EVL-M4 passes"
references:
  - title: "NIST AI RMF — Measure"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "Google SRE — Monitoring Distributed Systems (measurement culture)"
    url: "https://sre.google/sre-book/monitoring-distributed-systems/"
relatedRules:
  - "EVL-M1"
  - "EVL-M2"
  - "EVL-M3"
  - "EVL-R1"
  - "EVL-R2"
tags:
  - "evaluation"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "cicd"
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
