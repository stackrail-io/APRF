id: "MOD-R3"
category: "model-governance"
title: "MOD-R3: License and provenance review for open-weight and fine-tuned models"
description: "License and provenance review for open-weight and fine-tuned models"
whyItMatters: "MOD-R3 (Model Governance, recommended): License and provenance review for open-weight
  and fine-tuned models Failing this leaves a production gap against: 100% of open-weight/fine-tuned
  production models have a license+provenance review ≤12 months old; blocked licenses have
  documented exceptions with expiry"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "100% of open-weight/fine-tuned production models have a license+provenance review
  ≤12 months old; blocked licenses have documented exceptions with expiry"
evidenceRequired:
  - "License/provenance review checklist + completed reviews for each open-weight or fine-tuned
    production model"
detection:
  capability: "manual"
  detectors: []
manualVerification: "For MOD-R3 (MOD-R3: License and provenance review for open-weight and
  fine-tuned models): inspect current evidence for [License/provenance review checklist + completed
  reviews for each open-weight or fine-tuned production model] and confirm the pass condition holds
  — 100% of open-weight/fine-tuned production models have a license+provenance review ≤12 months
  old; blocked licenses have documented exceptions with expiry"
falsePositiveGuidance: "MOD-R3 (Model Governance): re-verify against a current artifact for this
  specific Check (MOD-R3), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: MOD-R3: License and provenance review for open-weight and
    fine-tuned models (MOD-R3)"
  - "Retain evidence artifacts required by this Check, starting with: License/provenance review
    checklist + completed reviews for each open-weight or fine-tuned producti…"
  - "Schedule recurring manual verification for MOD-R3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until MOD-R3 passes"
references:
  - title: "NIST AI RMF — Map"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "AWS Well-Architected — Operational Excellence (change management parallels)"
    url: "https://aws.amazon.com/architecture/well-architected/"
