id: "MOD-M1"
category: "model-governance"
title: "Production must use pinned model identifiers; aliases like “latest” are forbidden on
  critical paths"
description: "Production shall use pinned model identifiers; aliases like “latest” are forbidden on
  critical paths"
whyItMatters: "MOD-M1 (Model Governance, mandatory): Production shall use pinned model identifiers;
  aliases like “latest” are forbidden on critical paths Failing this leaves a production gap
  against: 0 “latest”/floating aliases on critical production paths in config lint; 100% of critical
  paths reference immutable model IDs"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "0 “latest”/floating aliases on critical production paths in config lint; 100% of
  critical paths reference immutable model IDs"
evidenceRequired:
  - "Production model pin config + lint/CI rule rejecting “latest” aliases"
detection:
  capability: "automated"
  detectors:
    - id: "repo-model-pin-config"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Production model pin config + lint/CI rule rejecting “latest” aliases"
manualVerification: "For MOD-M1 (Production must use pinned model identifiers; aliases like “latest”
  are forbidden on critical paths): inspect current evidence for [Production model pin config +
  lint/CI rule rejecting “latest” aliases] and confirm the pass condition holds — 0
  “latest”/floating aliases on critical production paths in config lint; 100% of critical paths
  reference immutable model IDs"
falsePositiveGuidance: "MOD-M1 (Model Governance): confirm the detector target matches the
  production path for this Check before waiving. Named exceptions need an owner and expiry ≤90
  days."
recommendedFixes:
  - "Implement and operationalize: Production must use pinned model identifiers; aliases like
    “latest” are forbidden on critical paths (MOD-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Production model pin config +
    lint/CI rule rejecting “latest” aliases"
  - "Wire or verify detectors declared on MOD-M1 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until MOD-M1 passes"
references:
  - title: "NIST AI RMF — Map"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "AWS Well-Architected — Operational Excellence (change management parallels)"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "MOD-M2"
  - "MOD-M3"
  - "MOD-R1"
  - "MOD-R2"
  - "MOD-R3"
tags:
  - "model-governance"
  - "mandatory"
  - "automated"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
