id: "MOD-R2"
category: "model-governance"
title: "MOD-R2: Capability allowlists (e.g., code execution, vision) per workload"
description: "Capability allowlists (e.g., code execution, vision) per workload"
whyItMatters: "MOD-R2 (Model Governance, recommended): Capability allowlists (e.g., code execution,
  vision) per workload Failing this leaves a production gap against: Each production workload has an
  explicit capability allowlist; a denied capability attempt is recorded in test or prod within 90
  days"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Each production workload has an explicit capability allowlist; a denied capability
  attempt is recorded in test or prod within 90 days"
evidenceRequired:
  - "Per-workload capability allowlist config (code execution, vision, browsing, etc.) + deny logs"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Per-workload capability allowlist config (code execution, vision, browsing, etc.) + deny
          logs"
manualVerification: "For MOD-R2 (MOD: Capability allowlists (e.g., code execution, vision) per
  workload): inspect current evidence for [Per-workload capability allowlist config (code execution,
  vision, browsing, etc.) + deny logs] and confirm the pass condition holds — Each production
  workload has an explicit capability allowlist; a denied capability attempt is recorded in test or
  prod within 90 days"
falsePositiveGuidance: "MOD-R2 (Model Governance): re-verify against a current artifact for this
  specific Check (MOD-R2), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: MOD-R2: Capability allowlists (e.g., code execution, vision) per
    workload (MOD-R2)"
  - "Retain evidence artifacts required by this Check, starting with: Per-workload capability
    allowlist config (code execution, vision, browsing, etc.) + deny logs"
  - "Schedule recurring manual verification for MOD-R2 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until MOD-R2 passes"
references:
  - title: "NIST AI RMF — Map"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "AWS Well-Architected — Operational Excellence (change management parallels)"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "MOD-M1"
  - "MOD-M2"
  - "MOD-M3"
  - "MOD-R1"
  - "MOD-R3"
tags:
  - "model-governance"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
