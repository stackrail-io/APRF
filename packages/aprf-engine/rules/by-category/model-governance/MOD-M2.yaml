id: "MOD-M2"
category: "model-governance"
title: "Model inventory must exist with owners, data residency, and intended use"
description: "Model inventory shall exist with owners, data residency, and intended use"
whyItMatters: "MOD-M2 (Model Governance, mandatory): Model inventory shall exist with owners, data
  residency, and intended use Failing this leaves a production gap against: 100% of production
  models have owner, residency, and intended-use fields; query returns 0 incomplete rows"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of production models have owner, residency, and intended-use fields; query
  returns 0 incomplete rows"
evidenceRequired:
  - "Model inventory registry export"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Model inventory registry export"
manualVerification: "For MOD-M2 (Model inventory must exist with owners, data residency, and
  intended use): inspect current evidence for [Model inventory registry export] and confirm the pass
  condition holds — 100% of production models have owner, residency, and intended-use fields; query
  returns 0 incomplete rows"
falsePositiveGuidance: "MOD-M2 (Model Governance): re-verify against a current artifact for this
  specific Check (MOD-M2), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Model inventory must exist with owners, data residency, and
    intended use (MOD-M2)"
  - "Retain evidence artifacts required by this Check, starting with: Model inventory registry
    export"
  - "Schedule recurring manual verification for MOD-M2 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until MOD-M2 passes"
references:
  - title: "NIST AI RMF — Map"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "AWS Well-Architected — Operational Excellence (change management parallels)"
    url: "https://aws.amazon.com/architecture/well-architected/"
relatedRules:
  - "MOD-M1"
  - "MOD-M3"
  - "MOD-R1"
  - "MOD-R2"
  - "MOD-R3"
tags:
  - "model-governance"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "aws"
    - "gcp"
    - "azure"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
