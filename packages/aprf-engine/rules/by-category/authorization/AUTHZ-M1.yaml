id: "AUTHZ-M1"
category: "authorization"
title: "Authorization must be enforced server-side for AI features, tools, and retrieval"
description: "Authorization shall be enforced server-side for AI features, tools, and retrieval"
whyItMatters: "AUTHZ-M1 (Authorization, mandatory): Authorization shall be enforced server-side for
  AI features, tools, and retrieval Failing this leaves a production gap against: 100% of privileged
  AI feature, tool, and retrieval entry points enforce authorization server-side; 0 successful
  requests from authenticated callers lacking required permission or scope in the authz suite"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of privileged AI feature, tool, and retrieval entry points enforce
  authorization server-side; 0 successful requests from authenticated callers lacking required
  permission or scope in the authz suite"
evidenceRequired:
  - "Server-side authz middleware/policy for AI feature, tool, and retrieval entry points"
  - "Authz suite results showing authenticated-but-unauthorized callers denied on those entry
    points"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Server-side authz middleware/policy + unauthorized-caller suite for AI
          feature/tool/retrieval entry points"
manualVerification: "For AUTHZ-M1 (Authorization must be enforced server-side for AI features,
  tools, and retrieval): inspect current evidence for [Server-side authz middleware/policy for AI
  feature, tool, and retrieval entry points; Authz suite results showing
  authenticated-but-unauthorized callers denied on those entry points] and confirm the pass
  condition holds — 100% of privileged AI feature, tool, and retrieval entry points enforce
  authorization server-side; 0 successful requests from authenticated callers lacking required
  permission or scope in the authz suite"
falsePositiveGuidance: "AUTHZ-M1 (Authorization): confirm the detector target matches the production
  path for this Check before waiving. Named exceptions need an owner and expiry ≤90 days. Do not
  score AUTHN-M1 (unauthenticated rejection) as satisfying this Check — require authenticated but
  unauthorized callers."
recommendedFixes:
  - "Implement and operationalize: Authorization must be enforced server-side for AI features,
    tools, and retrieval (AUTHZ-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Server-side authz
    middleware/policy for AI feature, tool, and retrieval entry points"
  - "Add or extend an authz suite that denies authenticated callers lacking required permission or
    scope on AI feature, tool, and retrieval entry points"
  - "Block release (or open a time-boxed waiver with owner and expiry) until AUTHZ-M1 passes"
references:
  - title: "OWASP Access Control Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "AUTHZ-M2"
  - "AUTHZ-M3"
  - "AUTHZ-M4"
  - "AUTHZ-R1"
  - "AUTHZ-R2"
  - "AUTHN-M1"
tags:
  - "authorization"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "mcp"
    - "a2a"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
