id: "AUTHZ-M1"
category: "authorization"
title: "Authorization must be enforced server-side for AI features, tools, and retrieval"
description: "Authorization shall be enforced server-side for AI features, tools, and retrieval"
whyItMatters: "AUTHZ-M1 (Authorization, mandatory): Authorization shall be enforced server-side for
  AI features, tools, and retrieval Failing this leaves a production gap against: Automated tests
  cover 100% of production AI feature, tool, and retrieval entry points; unauthenticated or
  unauthorized callers are denied at 100% in the suite"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "Automated tests cover 100% of production AI feature, tool, and retrieval entry
  points; unauthenticated or unauthorized callers are denied at 100% in the suite"
evidenceRequired:
  - "Authz middleware/policy tests for AI feature, tool, and retrieval entry points"
detection:
  capability: "automated"
  detectors:
    - id: "iam-least-privilege"
      params:
        hint: "APEP apep.iam.policy_document — flag wildcard Action"
    - id: "iam-no-wildcard-resource"
      params:
        hint: "APEP apep.iam.policy_document — flag wildcard Resource"
    - id: "manual-attest"
      params:
        hint: "Authz middleware/policy tests for AI feature, tool, and retrieval entry points"
manualVerification: "For AUTHZ-M1 (Authorization must be enforced server-side for AI features,
  tools, and retrieval): inspect current evidence for [Authz middleware/policy tests for AI feature,
  tool, and retrieval entry points] and confirm the pass condition holds — Automated tests cover
  100% of production AI feature, tool, and retrieval entry points; unauthenticated or unauthorized
  callers are denied at 100% in the suite"
falsePositiveGuidance: "AUTHZ-M1 (Authorization): confirm the detector target matches the production
  path for this Check before waiving. Named exceptions need an owner and expiry ≤90 days."
recommendedFixes:
  - "Implement and operationalize: Authorization must be enforced server-side for AI features,
    tools, and retrieval (AUTHZ-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Authz middleware/policy tests
    for AI feature, tool, and retrieval entry points"
  - "Wire or verify detectors declared on AUTHZ-M1 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until AUTHZ-M1 passes"
references:
  - title: "OWASP Access Control Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
