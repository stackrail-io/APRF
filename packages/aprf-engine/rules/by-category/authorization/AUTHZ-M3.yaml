id: "AUTHZ-M3"
category: "authorization"
title: "Least-privilege roles must be defined for agents and automation identities"
description: "Least-privilege roles shall be defined for agents and automation identities"
whyItMatters: "AUTHZ-M3 (Authorization, mandatory): Least-privilege roles shall be defined for
  agents and automation identities Failing this leaves a production gap against: 100% of production
  agent/automation identities appear in the role matrix with non-admin default roles; quarterly (or
  ≤90-day) access review recorded with 0 une…"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of production agent/automation identities appear in the role matrix with
  non-admin default roles; quarterly (or ≤90-day) access review recorded with 0 unexplained
  privilege escalations"
evidenceRequired:
  - "Role matrix for every production agent/automation identity + IAM/policy export"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Role matrix for every production agent/automation identity + IAM/policy export"
manualVerification: "For AUTHZ-M3 (Least-privilege roles must be defined for agents and automation
  identities): inspect current evidence for [Role matrix for every production agent/automation
  identity + IAM/policy export] and confirm the pass condition holds — 100% of production
  agent/automation identities appear in the role matrix with non-admin default roles; quarterly (or
  ≤90-day) access review recorded with 0 unexplained privilege e…"
falsePositiveGuidance: "AUTHZ-M3 (Authorization): re-verify against a current artifact for this
  specific Check (AUTHZ-M3), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: Least-privilege roles must be defined for agents and automation
    identities (AUTHZ-M3)"
  - "Retain evidence artifacts required by this Check, starting with: Role matrix for every
    production agent/automation identity + IAM/policy export"
  - "Schedule recurring manual verification for AUTHZ-M3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until AUTHZ-M3 passes"
references:
  - title: "OWASP Access Control Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html"
  - title: "NIST AI RMF — Manage"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
relatedRules:
  - "AUTHZ-M1"
  - "AUTHZ-M2"
  - "AUTHZ-M4"
  - "AUTHZ-R1"
  - "AUTHZ-R2"
tags:
  - "authorization"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "openapi"
    - "mcp"
    - "a2a"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
