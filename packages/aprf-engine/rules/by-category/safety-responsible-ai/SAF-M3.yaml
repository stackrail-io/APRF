id: "SAF-M3"
category: "safety-responsible-ai"
title: "Users must be disclosed when interacting with AI where required by policy or law"
description: "Users shall be disclosed when interacting with AI where required by policy or law"
whyItMatters: "SAF-M3 (Safety & Responsible AI, mandatory): Users shall be disclosed when
  interacting with AI where required by policy or law Failing this leaves a production gap against:
  AI-interaction disclosure present on 100% of in-scope user surfaces per policy checklist; 0
  critical surfaces missing disclosure in the latest audit"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "AI-interaction disclosure present on 100% of in-scope user surfaces per policy
  checklist; 0 critical surfaces missing disclosure in the latest audit"
evidenceRequired:
  - "Disclosure UX inventory + screenshot/checklist audit of in-scope surfaces"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Disclosure UX inventory + screenshot/checklist audit of in-scope surfaces"
manualVerification: "For SAF-M3 (Users must be disclosed when interacting with AI where required by
  policy or law): inspect current evidence for [Disclosure UX inventory + screenshot/checklist audit
  of in-scope surfaces] and confirm the pass condition holds — AI-interaction disclosure present on
  100% of in-scope user surfaces per policy checklist; 0 critical surfaces missing disclosure in the
  latest audit"
falsePositiveGuidance: "SAF-M3 (Safety & Responsible AI): re-verify against a current artifact for
  this specific Check (SAF-M3), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: Users must be disclosed when interacting with AI where required
    by policy or law (SAF-M3)"
  - "Retain evidence artifacts required by this Check, starting with: Disclosure UX inventory +
    screenshot/checklist audit of in-scope surfaces"
  - "Schedule recurring manual verification for SAF-M3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until SAF-M3 passes"
references:
  - title: "NIST AI RMF — Trustworthiness characteristics"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 — AI management systems"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "SAF-M1"
  - "SAF-M2"
  - "SAF-M4"
  - "SAF-R2"
  - "SAF-R3"
tags:
  - "safety-responsible-ai"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "prompt-templates"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
