id: "SAF-R2"
category: "safety-responsible-ai"
title: "SAF-R2: Red-team exercises covering jailbreak-to-harm scenarios (distinct from security red team)"
description: "Red-team exercises covering jailbreak-to-harm scenarios (distinct from security red team)"
whyItMatters: "SAF-R2 (Safety & Responsible AI, recommended): Red-team exercises covering
  jailbreak-to-harm scenarios (distinct from security red team) Failing this leaves a production
  gap against: A jailbreak-to-harm red-team suite (distinct from the security injection suite)
  covers documented harm categories; latest run ≤90 days meets refusal/safety thresholds;
  findings feed the safety backlog with owners"

severity: "critical"
weight: 4
gate: "recommended"
passCondition: "A jailbreak-to-harm red-team suite (distinct from the security injection suite) covers
  documented harm categories; latest run ≤90 days meets refusal/safety thresholds; findings
  feed the safety backlog with owners"

evidenceRequired:
  - "Jailbreak-to-harm red-team suite (distinct from security injection suite) + latest scored run
    report"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Jailbreak-to-harm red-team suite (distinct from security injection suite) + latest scored run
          report"
manualVerification: "For SAF-R2 (SAF: Red-team exercises covering jailbreak-to-harm scenarios
  (distinct from security red team)): inspect current evidence for [Jailbreak-to-harm red-team
  suite (distinct from security injection suite) + latest scored run report] and confirm the pass
  condition holds — A jailbreak-to-harm red-team suite (distinct from the security injection
  suite) covers documented harm categories; latest run ≤90 days meets refusal/safety
  thresholds; findings feed the safety backlog with owners"

falsePositiveGuidance: "SAF-R2 (Safety & Responsible AI): re-verify against a current artifact for
  this specific Check (SAF-R2), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: SAF-R2: Red-team exercises covering jailbreak-to-harm scenarios
    (distinct from security red team) (SAF-R2)"
  - "Retain evidence artifacts required by this Check, starting with: Jailbreak-to-harm red-team
    suite (distinct from security injection suite) + latest scored run report"
  - "Schedule recurring manual verification for SAF-R2 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until SAF-R2 passes"
references:
  - title: "NIST AI RMF — Trustworthiness characteristics"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 — AI management systems"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "SAF-M1"
  - "SAF-M2"
  - "SAF-M3"
  - "SAF-M4"
  - "SAF-R3"
tags:
  - "safety-responsible-ai"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "prompt-templates"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
