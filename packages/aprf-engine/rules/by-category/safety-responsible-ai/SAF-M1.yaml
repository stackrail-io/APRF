id: "SAF-M1"
category: "safety-responsible-ai"
title: "A documented harm taxonomy and refusal/escalation policy must exist for the product domain"
description: "A documented harm taxonomy and refusal/escalation policy shall exist for the product domain"
whyItMatters: "SAF-M1 (Safety & Responsible AI, mandatory): A documented harm taxonomy and
  refusal/escalation policy shall exist for the product domain Failing this leaves a production gap
  against: Policy document has version, owner, and review date ≤ 12 months; maps ≥ domain-minimum
  harm categories with explicit refuse vs escalate actions for each"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "Policy document has version, owner, and review date ≤ 12 months; maps ≥
  domain-minimum harm categories with explicit refuse vs escalate actions for each"
evidenceRequired:
  - "Approved harm taxonomy + refusal/escalation policy (versioned, owned)"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-harm-policy"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Approved harm taxonomy + refusal/escalation policy (versioned, owned)"
manualVerification: "For SAF-M1 (A documented harm taxonomy and refusal/escalation policy must exist
  for the product domain): inspect current evidence for [Approved harm taxonomy + refusal/escalation
  policy (versioned, owned)] and confirm the pass condition holds — Policy document has version,
  owner, and review date ≤ 12 months; maps ≥ domain-minimum harm categories with explicit refuse vs
  escalate actions for each"
falsePositiveGuidance: "SAF-M1 (Safety & Responsible AI): when automation and attestation disagree,
  prefer the stricter outcome until reconciled. Waive only with owner, expiry, and which signal
  covers the gap."
recommendedFixes:
  - "Implement and operationalize: A documented harm taxonomy and refusal/escalation policy must
    exist for the product domain (SAF-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Approved harm taxonomy +
    refusal/escalation policy (versioned, owned)"
  - "Wire or verify detectors declared on SAF-M1 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until SAF-M1 passes"
references:
  - title: "NIST AI RMF — Trustworthiness characteristics"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 — AI management systems"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "SAF-M2"
  - "SAF-M3"
  - "SAF-M4"
  - "SAF-R2"
  - "SAF-R3"
tags:
  - "safety-responsible-ai"
  - "mandatory"
  - "hybrid"
applicability:
  technologies:
    - "prompt-templates"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
