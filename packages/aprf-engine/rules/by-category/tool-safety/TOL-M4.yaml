id: "TOL-M4"
category: "tool-safety"
title: "Tool arguments must be schema-validated and sanitized before execution"
description: "Tool arguments shall be schema-validated and sanitized before execution"
whyItMatters: "TOL-M4 (Tool Safety, mandatory): Tool arguments shall be schema-validated and
  sanitized before execution Failing this leaves a production gap against: 100% of production tools
  have a declared argument schema; invalid/malicious argument fixtures are rejected at 100% before
  side effects"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of production tools have a declared argument schema; invalid/malicious argument
  fixtures are rejected at 100% before side effects"
evidenceRequired:
  - "JSON Schema (or equivalent) per tool + contract tests for invalid payloads"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "JSON Schema (or equivalent) per tool + contract tests for invalid payloads"
manualVerification: "For TOL-M4 (Tool arguments must be schema-validated and sanitized before
  execution): inspect current evidence for [JSON Schema (or equivalent) per tool + contract tests
  for invalid payloads] and confirm the pass condition holds — 100% of production tools have a
  declared argument schema; invalid/malicious argument fixtures are rejected at 100% before side
  effects"
falsePositiveGuidance: "TOL-M4 (Tool Safety): re-verify against a current artifact for this specific
  Check (TOL-M4), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: Tool arguments must be schema-validated and sanitized before
    execution (TOL-M4)"
  - "Retain evidence artifacts required by this Check, starting with: JSON Schema (or equivalent)
    per tool + contract tests for invalid payloads"
  - "Schedule recurring manual verification for TOL-M4 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until TOL-M4 passes"
references:
  - title: "Model Context Protocol security considerations"
    url: "https://modelcontextprotocol.io/"
  - title: "OWASP LLM — Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "TOL-M1"
  - "TOL-M2"
  - "TOL-M3"
  - "TOL-M5"
  - "TOL-R1"
tags:
  - "tool-safety"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "mcp"
    - "a2a"
    - "openapi"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
