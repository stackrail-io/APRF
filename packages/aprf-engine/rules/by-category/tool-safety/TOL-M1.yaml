id: "TOL-M1"
category: "tool-safety"
title: "Every tool invocation must be authorized server-side independent of model output"
description: "Every tool invocation shall be authorized server-side independent of model output"
whyItMatters: "TOL-M1 (Tool Safety, mandatory): Every tool invocation shall be authorized
  server-side independent of model output Failing this leaves a production gap against: Automated
  tests show tool calls without a valid authz decision are denied at 100%; model-proposed tool
  name/args alone never bypass the gateway"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "Automated tests show tool calls without a valid authz decision are denied at 100%;
  model-proposed tool name/args alone never bypass the gateway"
evidenceRequired:
  - "Tool gateway authz tests + deny logs"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Tool gateway authz tests + deny logs"

manualVerification: "For TOL-M1 (Every tool invocation must be authorized server-side independent of
  model output): inspect current evidence for [Tool gateway authz tests + deny logs] and confirm the
  pass condition holds — Automated tests show tool calls without a valid authz decision are denied
  at 100%; model-proposed tool name/args alone never bypass the gateway"
falsePositiveGuidance: "TOL-M1 (Tool Safety): confirm the detector target matches the production
  path for this Check before waiving. Named exceptions need an owner and expiry ≤90 days."
recommendedFixes:
  - "Implement and operationalize: Every tool invocation must be authorized server-side independent
    of model output (TOL-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Tool gateway authz tests +
    deny logs"
  - "Schedule recurring manual verification for TOL-M1 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until TOL-M1 passes"
references:
  - title: "Model Context Protocol security considerations"
    url: "https://modelcontextprotocol.io/"
  - title: "OWASP LLM — Excessive Agency"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "TOL-M2"
  - "TOL-M3"
  - "TOL-M4"
  - "TOL-M5"
  - "TOL-R1"
tags:
  - "tool-safety"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "mcp"
    - "a2a"
    - "openapi"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
