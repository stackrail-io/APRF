id: "SEC2-R1"
category: "secrets"
title: "SEC2-R1: Pre-commit and CI secret scanning including prompt/fixture files"
description: "Pre-commit and CI secret scanning including prompt/fixture files"
whyItMatters: "SEC2-R1 (Secrets, recommended): Pre-commit and CI secret scanning including
  prompt/fixture files Failing this leaves a production gap against: Secret scanning covers
  application code, prompts, and fixtures; blocking on high-confidence secrets; last green
  main-branch scan ≤7 days (or last PR merge evid…"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Secret scanning covers application code, prompts, and fixtures; blocking on
  high-confidence secrets; last green main-branch scan ≤7 days (or last PR merge evidence)"
evidenceRequired:
  - "Pre-commit + CI secret-scan config including prompt/fixture globs + latest scan report with
    findings disposition"
detection:
  capability: "automated"
  detectors:
    - id: "repo-secret-scan-config"
      params: {}
    - id: "repo-pre-commit-config"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Pre-commit + CI secret-scan config including prompt/fixture globs + latest scan report with
          findings disposition"
manualVerification: "For SEC2-R1 (SEC2-R1: Pre-commit and CI secret scanning including
  prompt/fixture files): inspect current evidence for [Pre-commit + CI secret-scan config including
  prompt/fixture globs + latest scan report with findings disposition] and confirm the pass
  condition holds — Secret scanning covers application code, prompts, and fixtures; blocking on
  high-confidence secrets; last green main-branch scan ≤7 days (or last PR merge evidence)"
falsePositiveGuidance: "SEC2-R1 (Secrets): confirm the detector target matches the production path
  for this Check before waiving. Named exceptions need an owner and expiry ≤90 days."
recommendedFixes:
  - "Implement and operationalize: SEC2-R1: Pre-commit and CI secret scanning including
    prompt/fixture files (SEC2-R1)"
  - "Retain evidence artifacts required by this Check, starting with: Pre-commit + CI secret-scan
    config including prompt/fixture globs + latest scan report with finding…"
  - "Wire or verify detectors declared on SEC2-R1 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until SEC2-R1 passes"
references:
