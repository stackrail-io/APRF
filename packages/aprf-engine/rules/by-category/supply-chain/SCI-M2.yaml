id: "SCI-M2"
category: "supply-chain"
title: "MCP servers and high-impact tools must be inventoried, version-pinned, and reviewed before
  production use"
description: "MCP servers and high-impact tools shall be inventoried, version-pinned, and reviewed
  before production use"
whyItMatters: "SCI-M2 (Supply Chain Integrity, mandatory): MCP servers and high-impact tools shall
  be inventoried, version-pinned, and reviewed before production use Failing this leaves a
  production gap against: 100% of production MCP servers and high-impact tools have pin + owner +
  review date ≤ 180 days; 0 unpinned “latest” entries in production"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "100% of production MCP servers and high-impact tools have pin + owner + review date
  ≤ 180 days; 0 unpinned “latest” entries in production"
evidenceRequired:
  - "MCP/tool inventory with version pins, owners, and review dates"
detection:
  capability: "hybrid"
  detectors:
    - id: "mcp-package-pinned"
      params: {}
    - id: "cicd-actions-sha-pinned"
      params: {}
    - id: "manual-attest"
      params:
        hint: "MCP/tool inventory with version pins, owners, and review dates"
manualVerification: "For SCI-M2 (MCP servers and high-impact tools must be inventoried,
  version-pinned, and reviewed before production use): inspect current evidence for [MCP/tool
  inventory with version pins, owners, and review dates] and confirm the pass condition holds — 100%
  of production MCP servers and high-impact tools have pin + owner + review date ≤ 180 days; 0
  unpinned “latest” entries in production"
falsePositiveGuidance: "SCI-M2 (Supply Chain Integrity): when automation and attestation disagree,
  prefer the stricter outcome until reconciled. Waive only with owner, expiry, and which signal
  covers the gap."
recommendedFixes:
  - "Implement and operationalize: MCP servers and high-impact tools must be inventoried,
    version-pinned, and reviewed before production use (SCI-M2)"
  - "Retain evidence artifacts required by this Check, starting with: MCP/tool inventory with
    version pins, owners, and review dates"
  - "Wire or verify detectors declared on SCI-M2 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until SCI-M2 passes"
references:
  - title: "SLSA — Supply-chain Levels for Software Artifacts"
    url: "https://slsa.dev/"
  - title: "CNCF Software Supply Chain Best Practices"
    url: "https://www.cncf.io/"
  - title: "OWASP LLM — Supply Chain Vulnerabilities"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "SCI-M1"
  - "SCI-M3"
  - "SCI-M4"
  - "SCI-R1"
  - "SCI-R2"
tags:
  - "supply-chain"
  - "mandatory"
  - "hybrid"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "cicd"
    - "docker"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
