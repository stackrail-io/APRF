id: "SCI-M4"
category: "supply-chain"
title: "Admission controls must block unsigned or unapproved AI artifacts"
description: "Admission controls shall block unsigned or unapproved AI artifacts"
whyItMatters: "SCI-M4 (Supply Chain Integrity, mandatory): Admission controls shall block unsigned
  or unapproved AI artifacts Failing this leaves a production gap against: PASS if admission is
  enforced in production deploy paths and the latest probe shows unsigned artifacts are blocked"
severity: "critical"
weight: 4
gate: "mandatory"
passCondition: "PASS if admission is enforced in production deploy paths and the latest probe shows
  unsigned artifacts are blocked"
evidenceRequired:
  - "Admission policy config + deny logs for unsigned/unapproved artifacts"
detection:
  capability: "automated"
  detectors:
    - id: "cicd-no-pull-request-target"
      params: {}
    - id: "cicd-no-self-hosted-runner"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Admission policy config + deny logs for unsigned/unapproved artifacts"
manualVerification: "For SCI-M4 (Admission controls must block unsigned or unapproved AI artifacts):
  inspect current evidence for [Admission policy config + deny logs for unsigned/unapproved
  artifacts] and confirm the pass condition holds — PASS if admission is enforced in production
  deploy paths and the latest probe shows unsigned artifacts are blocked"
falsePositiveGuidance: "SCI-M4 (Supply Chain Integrity): confirm the detector target matches the
  production path for this Check before waiving. Named exceptions need an owner and expiry ≤90
  days."
recommendedFixes:
  - "Implement and operationalize: Admission controls must block unsigned or unapproved AI artifacts
    (SCI-M4)"
  - "Retain evidence artifacts required by this Check, starting with: Admission policy config + deny
    logs for unsigned/unapproved artifacts"
  - "Wire or verify detectors declared on SCI-M4 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until SCI-M4 passes"
references:
  - title: "SLSA — Supply-chain Levels for Software Artifacts"
    url: "https://slsa.dev/"
  - title: "CNCF Software Supply Chain Best Practices"
    url: "https://www.cncf.io/"
  - title: "OWASP LLM — Supply Chain Vulnerabilities"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "SCI-M1"
  - "SCI-M2"
  - "SCI-M3"
  - "SCI-R1"
  - "SCI-R2"
tags:
  - "supply-chain"
  - "mandatory"
  - "automated"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "cicd"
    - "docker"
  minCriticality: 3
  requiredFromLevel: 5
status: "active"
introducedIn: "0.10.0"
