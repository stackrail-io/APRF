id: "SCI-R1"
category: "supply-chain"
title: "SCI-R1: Signed model/container artifacts with verify-on-deploy (SLSA-aligned)"
description: "Signed model/container artifacts with verify-on-deploy (SLSA-aligned)"
whyItMatters: "SCI-R1 (Supply Chain Integrity, recommended): Signed model/container artifacts with
  verify-on-deploy (SLSA-aligned) Failing this leaves a production gap against: Last production
  model/container deploy shows signature verification success; unsigned artifact is rejected in a
  recorded test or canary within 90 days"
severity: "critical"
weight: 4
gate: "recommended"
passCondition: "Last production model/container deploy shows signature verification success;
  unsigned artifact is rejected in a recorded test or canary within 90 days"
evidenceRequired:
  - "Admission/verify-on-deploy policy for signed model and container artifacts + last deploy
    verification log"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Admission/verify-on-deploy policy for signed model and container artifacts + last deploy
          verification log"
manualVerification: "For SCI-R1 (SCI: Signed model/container artifacts with verify-on-deploy
  (SLSA-aligned)): inspect current evidence for [Admission/verify-on-deploy policy for signed model
  and container artifacts + last deploy verification log] and confirm the pass condition holds —
  Last production model/container deploy shows signature verification success; unsigned artifact is
  rejected in a recorded test or canary within 90 days"
falsePositiveGuidance: "SCI-R1 (Supply Chain Integrity): re-verify against a current artifact for
  this specific Check (SCI-R1), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: SCI-R1: Signed model/container artifacts with verify-on-deploy
    (SLSA-aligned) (SCI-R1)"
  - "Retain evidence artifacts required by this Check, starting with: Admission/verify-on-deploy
    policy for signed model and container artifacts + last deploy verificati…"
  - "Schedule recurring manual verification for SCI-R1 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until SCI-R1 passes"
references:
  - title: "SLSA — Supply-chain Levels for Software Artifacts"
    url: "https://slsa.dev/"
  - title: "CNCF Software Supply Chain Best Practices"
    url: "https://www.cncf.io/"
  - title: "OWASP LLM — Supply Chain Vulnerabilities"
    url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
relatedRules:
  - "SCI-M1"
  - "SCI-M2"
  - "SCI-M3"
  - "SCI-M4"
  - "SCI-R2"
tags:
  - "supply-chain"
  - "recommended"
  - "manual"
applicability:
  technologies:
    - "github"
    - "github-actions"
    - "cicd"
    - "docker"
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
