id: "OBS-R1"
category: "observability"
title: "OBS-R1: Replay tooling for failed traces in a secure environment"
description: "Replay tooling for failed traces in a secure environment"
whyItMatters: "OBS-R1 (Observability, recommended): Replay tooling for failed traces in a secure
  environment Failing this leaves a production gap against: On-call can replay a failed AI trace in
  a restricted environment within the documented RTO; last drill or real replay ≤90 days old"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "On-call can replay a failed AI trace in a restricted environment within the
  documented RTO; last drill or real replay ≤90 days old"
evidenceRequired:
  - "Secure replay tooling config + sample replay session for a failed production trace (redacted)"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Secure replay tooling config + sample replay session for a failed production trace
          (redacted)"
manualVerification: "For OBS-R1 (OBS-R1: Replay tooling for failed traces in a secure environment):
  inspect current evidence for [Secure replay tooling config + sample replay session for a failed
  production trace (redacted)] and confirm the pass condition holds — On-call can replay a failed AI
  trace in a restricted environment within the documented RTO; last drill or real replay ≤90 days
  old"
falsePositiveGuidance: "OBS-R1 (Observability): re-verify against a current artifact for this
  specific Check (OBS-R1), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: OBS-R1: Replay tooling for failed traces in a secure environment
    (OBS-R1)"
  - "Retain evidence artifacts required by this Check, starting with: Secure replay tooling config +
    sample replay session for a failed production trace (redacted)"
  - "Schedule recurring manual verification for OBS-R1 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until OBS-R1 passes"
references:
  - title: "Google SRE Workbook — Observability"
    url: "https://sre.google/workbook/observability/"
  - title: "OpenTelemetry"
    url: "https://opentelemetry.io/"
