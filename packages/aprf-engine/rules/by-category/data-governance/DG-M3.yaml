id: "DG-M3"
category: "data-governance"
title: "Feedback or memory promotion paths that affect future answers must be governed"
description: "Feedback or memory promotion paths that affect future answers shall be governed"
whyItMatters: "DG-M3 (Data Governance & Quality, mandatory): Feedback or memory promotion paths that
  affect future answers shall be governed Failing this leaves a production gap against: 100% of
  promotion paths require policy check or human approval; tests show ungated promotion to durable
  memory/training is denied"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of promotion paths require policy check or human approval; tests show ungated
  promotion to durable memory/training is denied"
evidenceRequired:
  - "Promotion policy + write-path controls for feedback→memory/training"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Promotion policy + write-path controls for feedback→memory/training"
manualVerification: "For DG-M3 (Feedback or memory promotion paths that affect future answers must
  be governed): inspect current evidence for [Promotion policy + write-path controls for
  feedback→memory/training] and confirm the pass condition holds — 100% of promotion paths require
  policy check or human approval; tests show ungated promotion to durable memory/training is denied"
falsePositiveGuidance: "DG-M3 (Data Governance & Quality): re-verify against a current artifact for
  this specific Check (DG-M3), not a sibling control. Document named exceptions with owner and
  expiry."
recommendedFixes:
  - "Implement and operationalize: Feedback or memory promotion paths that affect future answers
    must be governed (DG-M3)"
  - "Retain evidence artifacts required by this Check, starting with: Promotion policy + write-path
    controls for feedback→memory/training"
  - "Schedule recurring manual verification for DG-M3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until DG-M3 passes"
references:
  - title: "NIST AI RMF — Map and Measure (data)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ML systems engineering — data quality practices"
    url: "https://ml-ops.org/"
relatedRules:
  - "DG-M1"
  - "DG-M2"
  - "DG-R1"
  - "DG-R2"
  - "DG-R3"
tags:
  - "data-governance"
  - "mandatory"
  - "manual"
applicability:
  technologies:
    - "vector-databases"
    - "rag-pipelines"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
