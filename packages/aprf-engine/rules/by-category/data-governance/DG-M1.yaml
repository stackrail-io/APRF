id: "DG-M1"
category: "data-governance"
title: "Production retrieval corpora and indexes must have owners, versioning, and refresh cadence"
description: "Production retrieval corpora and indexes shall have owners, versioning, and refresh cadence"
whyItMatters: "DG-M1 (Data Governance & Quality, mandatory): Production retrieval corpora and
  indexes shall have owners, versioning, and refresh cadence Failing this leaves a production gap
  against: 100% of production indexes have owner + version ID + refresh cadence; 0 indexes missing
  any field; stale beyond cadence flagged or rebuilt"
severity: "high"
weight: 3
gate: "mandatory"
passCondition: "100% of production indexes have owner + version ID + refresh cadence; 0 indexes
  missing any field; stale beyond cadence flagged or rebuilt"
evidenceRequired:
  - "Corpus/index inventory with owner, version ID, and refresh schedule"
detection:
  capability: "hybrid"
  detectors:
    - id: "repo-rag-corpus-config"
      params: {}
    - id: "manual-attest"
      params:
        hint: "Corpus/index inventory with owner, version ID, and refresh schedule"
manualVerification: "For DG-M1 (Production retrieval corpora and indexes must have owners,
  versioning, and refresh cadence): inspect current evidence for [Corpus/index inventory with owner,
  version ID, and refresh schedule] and confirm the pass condition holds — 100% of production
  indexes have owner + version ID + refresh cadence; 0 indexes missing any field; stale beyond
  cadence flagged or rebuilt"
falsePositiveGuidance: "DG-M1 (Data Governance & Quality): when automation and attestation disagree,
  prefer the stricter outcome until reconciled. Waive only with owner, expiry, and which signal
  covers the gap."
recommendedFixes:
  - "Implement and operationalize: Production retrieval corpora and indexes must have owners,
    versioning, and refresh cadence (DG-M1)"
  - "Retain evidence artifacts required by this Check, starting with: Corpus/index inventory with
    owner, version ID, and refresh schedule"
  - "Wire or verify detectors declared on DG-M1 so automation matches the pass condition"
  - "Block release (or open a time-boxed waiver with owner and expiry) until DG-M1 passes"
references:
  - title: "NIST AI RMF — Map and Measure (data)"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ML systems engineering — data quality practices"
    url: "https://ml-ops.org/"
relatedRules:
  - "DG-M2"
  - "DG-M3"
  - "DG-R1"
  - "DG-R2"
  - "DG-R3"
tags:
  - "data-governance"
  - "mandatory"
  - "hybrid"
applicability:
  technologies:
    - "vector-databases"
    - "rag-pipelines"
  minCriticality: 2
  requiredFromLevel: 3
status: "active"
introducedIn: "0.10.0"
