id: "CMP-R3"
category: "compliance"
title: "CMP-R3: Independent assessment for Level 5 systems"
description: "Independent assessment for Level 5 systems"
whyItMatters: "CMP-R3 (Compliance, recommended): Independent assessment for Level 5 systems Failing
  this leaves a production gap against: Last assessment ≤12 months old lists sampled check IDs,
  findings, and remediation owners; covers every system rated Level 5"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Last assessment ≤12 months old lists sampled check IDs, findings, and remediation
  owners; covers every system rated Level 5"
evidenceRequired:
  - "Independent assessment or internal-audit report sampling Level-5 AI systems against APRF gates"
detection:
  capability: "manual"
  detectors: []
manualVerification: "For CMP-R3 (CMP-R3: Independent assessment for Level 5 systems): inspect
  current evidence for [Independent assessment or internal-audit report sampling Level-5 AI systems
  against APRF gates] and confirm the pass condition holds — Last assessment ≤12 months old lists
  sampled check IDs, findings, and remediation owners; covers every system rated Level 5"
falsePositiveGuidance: "CMP-R3 (Compliance): re-verify against a current artifact for this specific
  Check (CMP-R3), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: CMP-R3: Independent assessment for Level 5 systems (CMP-R3)"
  - "Retain evidence artifacts required by this Check, starting with: Independent assessment or
    internal-audit report sampling Level-5 AI systems against APRF gates"
  - "Schedule recurring manual verification for CMP-R3 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until CMP-R3 passes"
references:
  - title: "NIST AI RMF"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 (AI management systems) — conceptual alignment"
    url: "https://www.iso.org/standard/81230.html"
