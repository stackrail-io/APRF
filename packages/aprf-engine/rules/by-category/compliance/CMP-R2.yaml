id: "CMP-R2"
category: "compliance"
title: "CMP-R2: Customer-facing trust documentation aligned to APRF pillars"
description: "Customer-facing trust documentation aligned to APRF pillars"
whyItMatters: "CMP-R2 (Compliance, recommended): Customer-facing trust documentation aligned to APRF
  pillars Failing this leaves a production gap against: Public trust doc covers identity,
  safety/eval, data handling, and incident contact at minimum; last-updated ≤12 months; pillar/Core
  mapping table is explicit"
severity: "high"
weight: 3
gate: "recommended"
passCondition: "Public trust doc covers identity, safety/eval, data handling, and incident contact
  at minimum; last-updated ≤12 months; pillar/Core mapping table is explicit"
evidenceRequired:
  - "Customer-facing trust/security doc mapped to APRF pillars (or Core Profile) + published URL and
    last-updated date"
detection:
  capability: "manual"
  detectors:
    - id: "manual-attest"
      params:
        hint: "Customer-facing trust/security doc mapped to APRF pillars (or Core Profile) + published URL
          and last-updated date"
manualVerification: "For CMP-R2 (CMP-R2: Customer-facing trust documentation aligned to APRF
  pillars): inspect current evidence for [Customer-facing trust/security doc mapped to APRF pillars
  (or Core Profile) + published URL and last-updated date] and confirm the pass condition holds —
  Public trust doc covers identity, safety/eval, data handling, and incident contact at minimum;
  last-updated ≤12 months; pillar/Core mapping table is explicit"
falsePositiveGuidance: "CMP-R2 (Compliance): re-verify against a current artifact for this specific
  Check (CMP-R2), not a sibling control. Document named exceptions with owner and expiry."
recommendedFixes:
  - "Implement and operationalize: CMP-R2: Customer-facing trust documentation aligned to APRF
    pillars (CMP-R2)"
  - "Retain evidence artifacts required by this Check, starting with: Customer-facing trust/security
    doc mapped to APRF pillars (or Core Profile) + published URL and las…"
  - "Schedule recurring manual verification for CMP-R2 with a named owner and retained report"
  - "Block release (or open a time-boxed waiver with owner and expiry) until CMP-R2 passes"
references:
  - title: "NIST AI RMF"
    url: "https://www.nist.gov/itl/ai-risk-management-framework"
  - title: "ISO/IEC 42001 (AI management systems) — conceptual alignment"
    url: "https://www.iso.org/standard/81230.html"
relatedRules:
  - "CMP-M1"
  - "CMP-M2"
  - "CMP-M3"
  - "CMP-R1"
  - "CMP-R3"
tags:
  - "compliance"
  - "recommended"
  - "manual"
applicability:
  technologies: []
  minCriticality: 2
  requiredFromLevel: 4
status: "active"
introducedIn: "0.10.0"
