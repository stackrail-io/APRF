      adversary technique mapping.

  ORG-R4:
    securityIntent: Record accepted control gaps with an owner and an expiry rather than leaving them implicit.
    threats:
      - Repudiation
      - Insider Misuse
    protects:
      - Audit Trail
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Time-bounded, owned risk acceptance prevents indefinite silent gaps and forces
      each exception back onto the agenda. This is governance accountability with no
      adversary technique mapping.

  ORG-R5:
    securityIntent: Independently sample APRF evidence to confirm that claimed controls are real.
    threats:
      - Repudiation
      - Insider Misuse
    protects:
      - Audit Trail
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Evidence that is never sampled tends to drift from what the system actually
