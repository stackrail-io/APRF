  ORG-R1:
    securityIntent: Keep AI risk posture visible to the leadership that can fund and mandate remediation.
    threats:
      - Shadow Agents
    protects:
      - Audit Trail
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Periodic leadership review is what allocates the funding and authority needed
      to close control gaps. This is organizational governance with no adversary
      technique mapping.

  ORG-R2:
    securityIntent: Assign named owners to the APRF domains that matter for each production AI system.
    threats:
      - Shadow Agents
      - Repudiation
    protects:
      - Audit Trail
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Controls without named owners decay because no one is accountable for their
