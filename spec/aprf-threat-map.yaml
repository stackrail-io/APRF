  # --------------------------------------------------------- performance-slo --
  PERF-M1:
    securityIntent: Define the availability and latency commitment for critical AI user journeys.
    threats:
      - Denial of Service
    protects:
      - Availability
      - Users
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      SLOs define the baseline against which degradation, abuse impact, and
      incident severity are measured. This is a reliability control with no
      adversary technique mapping.

  PERF-M2:
    securityIntent: Expose latency, error, and AI quality metrics so degradation is measurable.
    threats:
      - Denial of Service
      - Misinformation
    protects:
      - Availability
      - Users
      - Logs
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Metrics that are not emitted cannot be alerted on or investigated later.
      Instrumentation is the prerequisite for PERF-M3; no adversary technique maps
      directly.

  PERF-M3:
    securityIntent: Alert when SLO burn indicates the system is degrading beyond agreed limits.
    threats:
      - Denial of Service
      - Denial of Wallet
    protects:
      - Availability
      - Cost
    mitre:
      atlas:
        - AML.T0029
      attack: []
    mappingRationale: >-
      Sustained SLO burn is often the first visible symptom of resource-exhaustion
      abuse against an AI endpoint. Alerting turns that into an actionable signal;
      it is detective and does not itself restore capacity.

  PERF-R1:
    securityIntent: Use error budgets to slow release velocity when AI reliability is degrading.
    threats:
      - Denial of Service
    protects:
      - Availability
      - Users
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Error budgets make the trade-off between shipping speed and reliability
      explicit instead of implicit. This is a delivery governance control with no
      adversary technique mapping.

  PERF-R2:
    securityIntent: Validate that the system withstands deliberately expensive prompts and agent loops.
    threats:
      - Denial of Service
      - Denial of Wallet
      - Excessive Agency
    protects:
      - Availability
      - Cost
      - Runtime
    mitre:
      atlas:
        - AML.T0029
        - AML.T0034.001
        - AML.T0034.002
        - AML.T0046
      attack:
        - T1499
    mappingRationale: >-
      Long-context and recursive agent workloads consume far more capacity per
      request than typical traffic, which makes them efficient denial-of-service
      and cost-harvesting vectors. Capacity testing against these shapes is what
      establishes the limits that COST-M1 and AGN-M2 then enforce.

  PERF-R3:
    securityIntent: Measure streaming-specific latency so perceived responsiveness is not invisible to SLOs.
    threats:
      - Denial of Service
    protects:
      - Availability
      - Users
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Aggregate request latency hides time-to-first-token and inter-token stalls
      that dominate the streaming user experience. This is a reliability
      measurement control with no adversary technique mapping.

  PERF-R4:
    securityIntent: Present AI operational metrics in near real time so degradation is seen as it happens.
    threats:
      - Denial of Service
    protects:
      - Availability
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Delayed dashboards extend time to detection during a live degradation. Near
      real-time presentation shortens that gap; no adversary technique maps.

  # ---------------------------------------------------- platform-engineering --
  DX-M1:
    securityIntent: Make the controlled route to production the easiest route, so teams do not build around it.
    threats:
      - Configuration Drift
      - Shadow Agents
      - Insider Misuse
    protects:
      - Runtime
      - Infrastructure
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      When the compliant path is slower than the improvised one, teams route around
