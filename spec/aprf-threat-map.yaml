  # ------------------------------------------------------ prompt-engineering --
  PRM-M1:
    securityIntent: Make the exact prompt serving production identifiable, attributable, and immutable.
    threats:
      - Configuration Drift
      - Repudiation
      - Prompt Injection
    protects:
      - Prompts
      - Audit Trail
      - Runtime
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Unversioned prompts make it impossible to establish what instructions were in
      force during an incident or to prove a change was reviewed. Versioning is the
      precondition for rollback, evaluation attachment, and forensic
      reconstruction.

  PRM-M2:
    securityIntent: Ensure prompt changes are reviewed and backed by evaluation evidence before release.
    threats:
      - Harmful Content Generation
      - Prompt Injection
      - Misinformation
      - Insider Misuse
    protects:
      - Prompts
      - Users
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Prompts carry security-relevant instructions, so an unreviewed edit can
      silently delete a safety constraint with no code change and no deployment
      signal. Review plus attached evaluation makes that change visible and
      measurable before it reaches users.

  PRM-M3:
    securityIntent: Allow rollback to a prior prompt version without redeploying unrelated services.
    threats:
      - Harmful Content Generation
      - Denial of Service
      - Configuration Drift
    protects:
      - Prompts
      - Users
      - Availability
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Prompt rollback coupled to a full service deploy is too slow to be usable
      during a live safety incident. Independent rollback keeps time to containment
      within minutes; no adversary technique maps.

  PRM-R1:
    securityIntent: Keep secrets and personal data out of prompt source and templates.
    threats:
      - Secret Leakage
      - System Prompt Leakage
      - Sensitive Information Disclosure
      - Prompt Injection
    protects:
      - Secrets
      - Prompts
      - Data
    mitre:
      atlas:
        - AML.T0055
        - AML.T0056
        - AML.T0069.002
      attack:
        - T1552
        - T1552.001
    mappingRationale: >-
      Anything hardcoded in a prompt is recoverable through system prompt
      extraction and is usually committed to source control as well. Parameterizing
      templates means a successful extraction yields a template rather than live
      credentials or personal data.

  PRM-R2:
    securityIntent: Catch injection-prone and unsafe prompt constructs before they reach production.
    threats:
      - Prompt Injection
      - Secret Leakage
      - System Prompt Leakage
    protects:
      - Prompts
      - Context
      - Secrets
    mitre:
      atlas:
        - AML.T0051
        - AML.T0055
      attack: []
    mappingRationale: >-
      Static analysis catches recurring anti-patterns such as unescaped
      interpolation of untrusted content and embedded credentials. It is a cheap
      preventive check that shrinks the injection surface introduced during prompt
      authoring.

  PRM-R3:
    securityIntent: Measure the real impact of high-traffic prompt changes before full rollout.
    threats:
      - Harmful Content Generation
      - Misinformation
    protects:
      - Prompts
      - Users
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      A prompt change that improves curated evaluations can still degrade live
      traffic that the suite does not represent. A/B and shadow evaluation catch
      that before full exposure; no adversary technique maps.

  # -------------------------------------------------- reliability-continuity --
  REL-M1:
    securityIntent: Prevent a slow or failing dependency from exhausting capacity or amplifying cost.
    threats:
      - Denial of Service
      - Denial of Wallet
      - Excessive Agency
    protects:
      - Availability
      - Cost
      - Runtime
    mitre:
      atlas:
        - AML.T0029
        - AML.T0034.001
      attack: []
    mappingRationale: >-
      Without timeouts, a slow provider consumes connections and workers until the
      whole service fails; without retry bounds, one failure multiplies into many
      billable calls. Both limits cap the amplification available to an attacker who
      can induce failures, as well as to ordinary defects.

  REL-M2:
    securityIntent: Keep critical user journeys functional when the AI path is unavailable.
    threats:
      - Denial of Service
    protects:
      - Availability
      - Users
    mitre:
      atlas:
        - AML.T0029
      attack: []
    mappingRationale: >-
      A defined degraded mode keeps the journey working when the model path is
      down, whether from a provider outage or a denial-of-service attempt. It
      reduces the impact of the disruption rather than preventing it.

  REL-M3:
    securityIntent: Prevent tool-using workflows from reporting success when steps have silently failed.
    threats:
      - Hallucinated Actions
      - Misinformation
      - Excessive Agency
    protects:
      - External Systems
      - Data
      - Users
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Agents routinely narrate success for tool calls that actually errored,
      leaving downstream state inconsistent and users misinformed. Verifying real
      tool outcomes closes that false-success path; the failure mode is correctness
      rather than an adversary technique.

  REL-M4:
    securityIntent: Ensure the artifacts required to restore AI service survive a destructive event.
    threats:
      - Denial of Service
      - Data and Model Poisoning
      - Supply Chain Compromise
    protects:
      - Availability
      - Models
      - Prompts
      - Data
    mitre:
      atlas:
        - AML.T0076
      attack:
        - T1485
        - T1486
    mappingRationale: >-
      Prompts, model pins, tool catalogs, and indexes commonly fall outside
      conventional backup scope, which leaves the AI service unrecoverable even
      when the database is restored. Backing them up provides the recovery path
      after model corruption, data destruction, or ransomware.

  REL-M5:
    securityIntent: Set explicit recovery time and recovery point objectives for business-critical AI services.
    threats:
      - Denial of Service
    protects:
      - Availability
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      RTO and RPO targets are what make backup and failover design decisions
      testable rather than aspirational. This is continuity planning with no
      adversary technique mapping.

  REL-R1:
    securityIntent: Stop a failing AI provider from cascading into total service failure.
    threats:
      - Denial of Service
    protects:
      - Availability
      - Runtime
    mitre:
      atlas:
        - AML.T0029
      attack: []
    mappingRationale: >-
      Circuit breakers cut off a failing dependency before it consumes the caller's
      resources, and bulkheads stop one workload from exhausting shared client
      capacity. Together they limit the reach of both outages and
      resource-exhaustion abuse.

  REL-R2:
    securityIntent: Remove single-provider dependency for critical AI journeys without lowering the quality bar.
    threats:
      - Denial of Service
    protects:
      - Availability
      - Users
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Provider-level failover eliminates a single point of failure, but only counts
      if the fallback path is evaluated to the same standard as the primary.
      Fallback routing must also respect residency constraints or it becomes a
      compliance exposure in its own right.

  REL-R3:
    securityIntent: Document how critical AI-dependent business processes continue when AI is unavailable.
    threats:
      - Denial of Service
    protects:
      - Availability
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Processes that quietly became AI-dependent have no manual fallback until
      someone writes one down. Documented continuity options address that; no
      adversary technique maps.

  REL-R4:
    securityIntent: Rehearse continuity, including full provider loss, before it is tested by a real outage.
    threats:
      - Denial of Service
    protects:
      - Availability
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Failover paths that are never exercised routinely fail on first real use.
      Drills validate them; this is readiness assurance with no adversary technique
      mapping.

  REL-R5:
    securityIntent: Deliberately exercise AI dependency failure modes in production-like conditions.
    threats:
      - Denial of Service
    protects:
      - Availability
      - Runtime
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Chaos experiments reveal timeout, retry, and fallback defects that only
      appear under real failure. This is resilience assurance with no adversary
      technique mapping.

  REL-R6:
    securityIntent: Keep standby inference capacity ready where self-hosted models are business-critical.
    threats:
      - Denial of Service
    protects:
      - Availability
      - Infrastructure
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Self-hosted accelerator capacity cannot be provisioned quickly during an
      incident, so cold recovery can take hours. Warm standby shortens that; no
      adversary technique maps.

  REL-R7:
    securityIntent: Back multi-provider continuity with contractual commitments, not just technical routing.
    threats:
      - Denial of Service
      - Supply Chain Compromise
    protects:
      - Availability
      - Models
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Technical failover does not help when the alternate provider will not supply
      capacity, or when a vendor withdraws a model line entirely. Contractual
      options address provider withdrawal and capacity denial; no adversary
      technique maps.

  # ---------------------------------------------------- safety-responsible-ai --
  SAF-M1:
    securityIntent: Define what constitutes unsafe output and behaviour for this specific product domain.
    threats:
      - Harmful Content Generation
      - Misinformation
      - Bias and Discrimination
    protects:
      - Users
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Generic safety filters miss domain-specific harms such as unlicensed medical,
      legal, or financial guidance. A domain policy defines the harm boundary that
      the automated gates in SAF-M2 then enforce; the policy itself maps to no
      adversary technique.

  SAF-M2:
    securityIntent: Block releases that fail the organization's stated safety bar.
    threats:
      - Harmful Content Generation
      - Jailbreak
      - Misinformation
      - Bias and Discrimination
    protects:
      - Users
      - Models
      - Safety
    mitre:
      atlas:
        - AML.T0054
        - AML.T0048
        - AML.T0048.003
      attack: []
    mappingRationale: >-
      Safety gates stop a release that has lost jailbreak resistance or begun
      producing harmful content from reaching users at all. They reduce the
      likelihood of external and user harm originating from the deployed system.

  SAF-M3:
    securityIntent: Ensure users know when they are interacting with an AI system.
    threats:
      - Misinformation
      - Identity Spoofing
    protects:
      - Users
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Users who believe they are speaking with a human calibrate trust differently
      and may disclose more than they intend. Disclosure is a transparency
      obligation, so the driver is regulatory rather than adversarial.

  SAF-M4:
    securityIntent: Measure disparate outcomes on high-stakes automated decision paths.
    threats:
      - Bias and Discrimination
      - Harmful Content Generation
    protects:
      - Users
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      High-stakes automated decisions can produce systematically disparate outcomes
      that aggregate accuracy metrics conceal entirely. Disparity evaluation makes
      that visible; it is a responsible-AI obligation with no adversary technique
      mapping.

  SAF-R1:
    securityIntent: Apply human judgement to safety edge cases that automated evaluation classifies poorly.
    threats:
      - Harmful Content Generation
      - Bias and Discrimination
      - Misinformation
    protects:
      - Users
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      Edge cases are exactly where automated safety classifiers are least reliable.
      Sampled human review covers that gap; no adversary technique maps.

  SAF-R2:
    securityIntent: Test whether safety controls hold end to end, from jailbreak attempt through to real-world harm.
    threats:
      - Jailbreak
      - Harmful Content Generation
      - Prompt Injection
    protects:
      - Users
      - Models
      - Safety
    mitre:
      atlas:
        - AML.T0054
        - AML.T0051
        - AML.T0048.003
      attack: []
    mappingRationale: >-
      Safety red teaming asks whether a bypassed guardrail actually produces harm,
      which component-level filter tests never answer. It exercises the
      jailbreak-to-user-harm chain that automated suites systematically
      under-represent.

  # ---------------------------------------------------------------- secrets --
  SEC2-M1:
    securityIntent: Keep production secrets out of prompts, source control, and notebooks.
    threats:
      - Secret Leakage
      - Privilege Escalation
      - Identity Spoofing
      - Data Exfiltration
    protects:
      - Secrets
      - Identity
      - APIs
      - Infrastructure
    mitre:
      atlas:
        - AML.T0055
        - AML.T0083
        - AML.T0037
      attack:
        - T1552
        - T1552.001
        - T1078
    mappingRationale: >-
      Credentials embedded in prompts and agent configuration are recoverable
      through prompt extraction and repository search, and they are almost never
      rotated. Centralizing them in a secrets manager removes the unsecured-credential
      path that these techniques depend on.

  SEC2-M2:
    securityIntent: Prevent secrets from being persisted into logs and traces.
    threats:
      - Secret Leakage
      - Sensitive Information Disclosure
      - Privilege Escalation
    protects:
      - Secrets
      - Logs
      - Audit Trail
    mitre:
      atlas:
        - AML.T0055
        - AML.T0037
      attack:
        - T1552
        - T1552.001
    mappingRationale: >-
      AI traces capture tool arguments and headers where credentials commonly
      appear, then copy them into log stores with much broader access. Redaction at
      ingest prevents observability from becoming the easiest credential target in
      the environment.

  SEC2-M3:
    securityIntent: Ensure AI credentials are narrowly scoped, rotatable, and never shipped to clients.
    threats:
      - Secret Leakage
      - Denial of Wallet
      - Privilege Escalation
      - Identity Spoofing
    protects:
      - Secrets
      - Identity
      - APIs
      - Cost
    mitre:
      atlas:
        - AML.T0055
        - AML.T0040
        - AML.T0034
      attack:
        - T1552
        - T1078
    mappingRationale: >-
      Provider keys embedded in mobile or browser clients are trivially extracted
      and then used for free inference billed to the owner. Scoping and rotation
      limit both the reach and the lifetime of any key that does escape.

  SEC2-R1:
    securityIntent: Detect committed secrets before they reach a shared repository.
    threats:
      - Secret Leakage
      - Supply Chain Compromise
    protects:
      - Secrets
      - Identity
    mitre:
      atlas:
        - AML.T0055
      attack:
        - T1552
        - T1552.001
    mappingRationale: >-
      Prompt templates, evaluation fixtures, and notebooks are common secret-leak
      locations that default scanner configurations often exclude. Extending
      scanning to those paths closes the gap before a credential becomes permanent
      repository history.

  SEC2-R2:
    securityIntent: Constrain where a leaked runtime credential can actually be used from.
    threats:
      - Secret Leakage
      - Data Exfiltration
      - Privilege Escalation
    protects:
      - Secrets
      - Network
      - Data
    mitre:
      atlas:
        - AML.T0025
        - AML.T0055
      attack:
        - T1041
        - T1567
    mappingRationale: >-
      Network and identity conditions on credential use mean a stolen token is not
      usable from attacker-controlled infrastructure. This devalues any credential
      that escapes the other secrets controls.

  SEC2-R3:
    securityIntent: Prevent secrets and sensitive data from being baked into models or published corpora.
    threats:
      - Secret Leakage
      - Sensitive Information Disclosure
      - Data and Model Poisoning
    protects:
      - Secrets
      - Data
      - Models
    mitre:
      atlas:
        - AML.T0055
        - AML.T0057
        - AML.T0020
      attack: []
    mappingRationale: >-
      Secrets present in fine-tuning data can be memorized and later emitted by the
      model, at which point rotation is the only remedy and the model must be
      retrained. Scanning before training or publication is the last point at which
      that outcome can still be prevented.

  # ----------------------------------------------------------- supply-chain --
  SCI-M1:
    securityIntent: Ensure production AI artifacts come from a verified source and have not been tampered with.
    threats:
      - Supply Chain Compromise
      - Data and Model Poisoning
      - Unsafe Code Execution
    protects:
      - Models
      - Infrastructure
      - Runtime
    mitre:
      atlas:
        - AML.T0010
        - AML.T0058
        - AML.T0018.002
        - AML.T0076
        - AML.T0109
      attack:
        - T1195
        - T1195.002
    mappingRationale: >-
      Model weights are executable artifacts that can carry embedded malware or
      behavioural backdoors which evaluation will not surface. Verified provenance
      and integrity is the only reliable control against substituted, poisoned, or
      rug-pulled artifacts.

  SCI-M2:
    securityIntent: Ensure every external tool, MCP server, and plugin in production is known, pinned, and reviewed.
    threats:
      - Supply Chain Compromise
      - Tool Abuse
      - Unauthorized Tool Use
      - Prompt Injection
    protects:
      - Tools
      - External Systems
      - Runtime
      - Data
    mitre:
      atlas:
        - AML.T0010.005
        - AML.T0104
        - AML.T0110
        - AML.T0011.002
        - AML.T0099
        - AML.T0109
      attack:
        - T1195
    mappingRationale: >-
      MCP servers and agent plugins execute with the agent's privileges and can
      silently redefine their own tool descriptions after installation. Inventory,
      version pinning, and pre-production review counter poisoned and rug-pulled
      tools, which are the primary agentic supply-chain techniques.

  SCI-M3:
    securityIntent: Block deployment of AI artifacts carrying known exploitable vulnerabilities.
    threats:
      - Supply Chain Compromise
      - Unsafe Code Execution
      - Privilege Escalation
    protects:
      - Infrastructure
      - Runtime
      - Models
    mitre:
      atlas:
        - AML.T0010
        - AML.T0049
      attack:
        - T1195
        - T1190
        - T1068
    mappingRationale: >-
      AI runtimes pull large, fast-moving dependency trees that include
      deserialization-prone model loaders and inference servers. Scanning gates
      keep known-vulnerable components out of production and shrink the exploitable
      surface.

  SCI-M4:
    securityIntent: Enforce at the deployment boundary that only approved, signed AI artifacts can run.
    threats:
      - Supply Chain Compromise
      - Data and Model Poisoning
      - Insider Misuse
    protects:
      - Models
      - Infrastructure
      - Runtime
    mitre:
      atlas:
        - AML.T0010
        - AML.T0058
        - AML.T0076
      attack:
        - T1195
        - T1195.002
    mappingRationale: >-
      Provenance checks and scanning only reduce risk if the deploy path actually
      refuses artifacts that fail them. Admission enforcement is what makes the
      preceding supply-chain controls non-optional rather than advisory.

  SCI-R1:
    securityIntent: Verify artifact signatures against build provenance at deploy time.
    threats:
      - Supply Chain Compromise
      - Data and Model Poisoning
    protects:
      - Models
      - Infrastructure
    mitre:
      atlas:
        - AML.T0010
        - AML.T0058
      attack:
        - T1195.002
    mappingRationale: >-
      Signature verification tied to build provenance detects artifacts substituted
      after the build step, including in the registry itself. It raises the
      assurance from "came from our registry" to "was produced by our pipeline".

  SCI-R2:
    securityIntent: Record the composition of each production model pin so affected deployments can be found quickly.
    threats:
      - Supply Chain Compromise
      - Data and Model Poisoning
    protects:
      - Models
      - Audit Trail
    mitre:
      atlas:
        - AML.T0010
      attack:
        - T1195
    mappingRationale: >-
      An MBOM records base model, adapters, and datasets, so a newly disclosed
      poisoned component can be traced to every affected deployment. Its value is
      response speed during a supply-chain incident rather than prevention.

  # ------------------------------------------------------------- tool-safety --
  TOL-M1:
    securityIntent: Ensure tool execution authority comes from server-side policy, never from model output.
    threats:
      - Prompt Injection
      - Unauthorized Tool Use
      - Privilege Escalation
      - Excessive Agency
      - Tool Abuse
    protects:
      - Tools
      - External Systems
      - Data
      - Identity
      - Runtime
    mitre:
      atlas:
        - AML.T0053
        - AML.T0051
        - AML.T0051.001
        - AML.T0086
        - AML.T0101
      attack:
        - T1078
    mappingRationale: >-
      Prompt injection becomes real-world impact at the exact moment a tool call is
      executed on the model's say-so. Independent server-side authorization at that
      boundary is the single most effective break in the injection-to-impact chain.

  TOL-M2:
    securityIntent: Restrict each agent to a fixed, approved set of tools it cannot expand at runtime.
    threats:
      - Unauthorized Tool Use
      - Tool Abuse
      - Excessive Agency
      - Supply Chain Compromise
    protects:
      - Tools
      - External Systems
      - Runtime
    mitre:
      atlas:
        - AML.T0053
        - AML.T0010.005
        - AML.T0110
      attack: []
    mappingRationale: >-
      An agent that can discover or synthesize new tools at runtime has an
      unbounded capability surface that no review has seen. A per-workload
      allowlist keeps capability fixed and reviewable, and stops a poisoned or
      newly advertised tool from being adopted mid-run.

  TOL-M3:
    securityIntent: Require an additional gate before high-impact tools are permitted to execute.
    threats:
      - Excessive Agency
      - Tool Abuse
      - Hallucinated Actions
      - Prompt Injection
    protects:
      - Tools
      - External Systems
      - Data
      - Safety
    mitre:
      atlas:
        - AML.T0101
        - AML.T0053
        - AML.T0086
        - AML.T0048
      attack:
        - T1485
    mappingRationale: >-
      Destructive and irreversible tools warrant a stronger control than the
      routine authorization applied to every call. Approval, dual control, or a
      policy engine ensures a single manipulated invocation cannot cause
      unrecoverable damage or bulk exfiltration.

  TOL-M4:
    securityIntent: Prevent unvalidated model-generated arguments from reaching an executor.
    threats:
      - Unsafe Code Execution
      - Prompt Injection
      - Tool Abuse
      - Privilege Escalation
    protects:
      - Tools
      - External Systems
      - Runtime
      - Infrastructure
    mitre:
      atlas:
        - AML.T0102
        - AML.T0050
        - AML.T0051
        - AML.T0072
      attack:
        - T1059
    mappingRationale: >-
      Model-generated arguments are untrusted input, and passing them unchecked to
      shells, queries, or APIs reproduces classic injection flaws with a new source.
      Schema validation and sanitization stop generated malicious commands from
      reaching an interpreter.

  TOL-M5:
    securityIntent: Ensure tool catalog definitions are authentic and unchanged since they were reviewed.
    threats:
      - Supply Chain Compromise
      - Prompt Injection
      - Tool Abuse
      - Unauthorized Tool Use
    protects:
      - Tools
      - External Systems
      - Runtime
    mitre:
      atlas:
        - AML.T0110
        - AML.T0104
        - AML.T0010.005
        - AML.T0011.002
        - AML.T0109
      attack:
        - T1195
    mappingRationale: >-
      Tool descriptions are read directly into the model's context, which makes a
      modified catalog both a supply-chain compromise and a prompt-injection
      vector. Signing and reviewing catalogs detects silent redefinition of a tool
      after it was approved.

  TOL-R1:
    securityIntent: Let destructive tool behaviour be validated without producing irreversible effects.
    threats:
      - Excessive Agency
      - Hallucinated Actions
      - Tool Abuse
    protects:
      - External Systems
      - Data
      - Safety
    mitre:
      atlas:
        - AML.T0101
      attack: []
    mappingRationale: >-
      Dry-run and simulation modes let an agent's destructive paths be exercised
      where mistakes are recoverable. This reduces the chance that a defect or
      manipulated invocation first manifests against production data.

  TOL-R2:
    securityIntent: Bound how much damage a single agent or tool can do within a given window.
    threats:
      - Tool Abuse
      - Excessive Agency
      - Data Exfiltration
      - Denial of Wallet
      - Denial of Service
    protects:
      - Tools
      - External Systems
      - Data
      - Cost
      - Availability
    mitre:
      atlas:
        - AML.T0034.002
        - AML.T0086
        - AML.T0101
      attack: []
    mappingRationale: >-
      Rate and blast-radius budgets cap the volume of actions available to a
      hijacked agent before a human can intervene. They limit bulk exfiltration and
      mass destructive operations even when each individual authorization check
      legitimately passes.
