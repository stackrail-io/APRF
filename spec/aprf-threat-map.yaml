  ORG-R3:
    securityIntent: Feed incidents and evaluation failures into a tracked improvement backlog.
    threats:
      - Repudiation
    protects:
      - Audit Trail
      - Safety
    mitre:
      atlas: []
      attack: []
    mappingRationale: >-
      A backlog fed by real failures is what converts lessons into control changes
