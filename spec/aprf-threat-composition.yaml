# APRF Threat Composition (APRF-RFC-0014 / APRF-RFC-0015)
# Informative exposure only — never participates in the mandatory Check gate.
id: aprf-threat-composition
name: APRF Threat Composition
version: "0.2.0"
aprfVersion: "0.11.0"
disclaimer: >-
  Threats never participate in gate computation. Checks never participate in
  signal composition. The only coupling is that threats may cite Checks as
  mitigations. Confirmation eligibility is owned by the signal registry kinds.

threats:
  THR-shadow-agents:
    title: Shadow Agents
    severityHint: critical
    description: >
      Production agents not represented in an approved inventory, without an
      accountable owner, or observed at runtime outside the declared set.
    displayThreats:
      - Shadow Agents
      - Excessive Agency
      - Unauthorized Tool Use
    indicators:
      - allOf:
          - signal: agent.inventory.missing
          - signal: agent.runtime.unenumerated
      - allOf:
          - signal: agent.charter.absent
          - signal: agent.owner.unassigned
      - allOf:
          - signal: agent.charter.absent
          - signal: agent.owner.missing_on_active
      - signal: agent.shadow.attested
      - allOf:
          - signal: agent.inventory.missing
          - signal: agent.shadow.heuristic
    mitigations:
      - checkId: AGN-M1
        role: primary
      - checkId: AGN-M2
        role: supporting
      - checkId: AGN-M3
        role: supporting

  THR-excessive-tool-privileges:
    title: Excessive tool privileges
    severityHint: high
    description: >
      An agent can invoke tools or reach data beyond its charter through
      over-broad allowlists or unchartered transitive hops.
    displayThreats:
      - Excessive Agency
      - Unauthorized Tool Use
      - Tool Abuse
    indicators:
      - signal: mcp.confused_deputy.path
    mitigations:
      - checkId: TOL-M2
        role: primary
      - checkId: TOL-M6
        role: primary
      - checkId: TOL-M3
        role: supporting
      - checkId: AUTHZ-M3
        role: supporting

  THR-confused-deputy-mcp:
    title: Confused deputy through MCP
    severityHint: critical
    description: >
      An agent inherits internal API or database access through an MCP server
      or tool chain without a direct database integration.
    displayThreats:
      - Privilege Escalation
      - Unauthorized Tool Use
      - Data Exfiltration
    indicators:
      - signal: mcp.confused_deputy.path
    mitigations:
      - checkId: TOL-M6
        role: primary
      - checkId: TOL-M1
        role: supporting
      - checkId: AGN-M1
        role: supporting
      - checkId: INF-M3
        role: supporting

  THR-injection-tool-exec:
    title: Prompt injection to unauthorized tool execution
    severityHint: critical
    description: >
      Untrusted content causes an agent to invoke tools the user or charter
      did not authorize.
    displayThreats:
      - Prompt Injection
      - Unauthorized Tool Use
      - Excessive Agency
    indicators:
      - signal: harness.bypass.attempt_succeeded
      - signal: harness.out_of_band.invoke
    mitigations:
      - checkId: SEC-M1
        role: primary
      - checkId: TOL-M1
        role: primary
      - checkId: CTX-M2
        role: supporting
      - checkId: AGN-M5
        role: supporting

  THR-delegated-privilege-escalation:
    title: Compromised agent delegating privileges
    severityHint: critical
    description: >
      A peer handoff or child agent receives a broader capability set than the
      caller was granted.
    displayThreats:
      - Privilege Escalation
      - Agent Hijacking
      - Unauthorized Tool Use
    indicators:
      - signal: agent.graph.edge_delegated
    mitigations:
      - checkId: AGN-M4
        role: primary
      - checkId: TOL-M6
        role: supporting
      - checkId: AUTHZ-M3
        role: supporting

  THR-memory-poisoning:
    title: Memory poisoning of future decisions
    severityHint: high
    description: >
      Writable or shared memory accepts untrusted content that later retrieval
      treats as trusted fact.
    displayThreats:
      - Memory Poisoning
      - Prompt Injection
      - Data and Model Poisoning
    indicators:
      - signal: memory.poison.write_accepted
    mitigations:
      - checkId: MEM-M3
        role: primary
      - checkId: MEM-R1
        role: primary
      - checkId: MEM-M1
        role: supporting
      - checkId: SEC-M1
        role: supporting

  THR-cross-tenant-memory:
    title: Cross-tenant memory leakage
    severityHint: critical
    description: >
      Memory retrieval or writes cross tenant (or required user) isolation
      boundaries.
    displayThreats:
      - Unauthorized Memory Access
      - Sensitive Information Disclosure
      - Data Exfiltration
    indicators:
      - signal: agent.graph.memory_hop
    mitigations:
      - checkId: MEM-M1
        role: primary
      - checkId: PRI-M1
        role: supporting

  THR-harness-bypass:
    title: Harness bypass
    severityHint: critical
    description: >
      Tools or MCP side effects execute outside the declared harness, with
      disabled middleware, or via unauthorized dynamic registration.
    displayThreats:
      - Unauthorized Tool Use
      - Excessive Agency
      - Tool Abuse
    indicators:
      - signal: harness.bypass.attempt_succeeded
      - signal: harness.out_of_band.invoke
    mitigations:
      - checkId: AGN-M5
        role: primary
      - checkId: HUM-M3
        role: supporting
      - checkId: TOL-M1
        role: supporting

  THR-agent-resource-exhaustion:
    title: Agent execution loop resource exhaustion
    severityHint: high
    description: >
      Unbounded agent loops, retries, or tool calls exhaust compute, tokens, or
      spend.
    displayThreats:
      - Denial of Wallet
      - Denial of Service
      - Excessive Agency
    indicators:
      - signal: agent.loop.continue_after_abort
    mitigations:
      - checkId: AGN-M2
        role: primary
      - checkId: COST-M3
        role: primary
      - checkId: AGN-M3
        role: supporting

  THR-tool-exfiltration:
    title: Unauthorized data exfiltration through tools
    severityHint: critical
    description: >
      Tool or MCP hops send data to destinations outside the charter or
      approved egress set.
    displayThreats:
      - Data Exfiltration
      - Unauthorized Tool Use
      - Sensitive Information Disclosure
    indicators:
      - signal: mcp.confused_deputy.path
    mitigations:
      - checkId: TOL-M6
        role: primary
      - checkId: INF-M3
        role: primary
      - checkId: SEC-M1
        role: supporting
      - checkId: OBS-M3
        role: supporting

  THR-approval-bypass:
    title: Approval workflow bypass
    severityHint: critical
    description: >
      High-impact actions complete via replayed tokens, self-approval, or
      alternate ungated paths.
    displayThreats:
      - Privilege Escalation
      - Excessive Agency
      - Unauthorized Tool Use
    indicators:
      - signal: approval.replay.succeeded
    mitigations:
      - checkId: HUM-M5
        role: primary
      - checkId: HUM-M3
        role: primary
      - checkId: HUM-M1
        role: supporting

  THR-malicious-tool-result:
    title: Malicious tool result influencing downstream agents
    severityHint: high
    description: >
      Untrusted tool or MCP output is treated as instruction or trusted fact by
      a downstream agent.
    displayThreats:
      - Prompt Injection
      - Agent Hijacking
      - Tool Abuse
    indicators:
      - signal: tool.result.treated_as_instruction
    mitigations:
      - checkId: CTX-M2
        role: primary
      - checkId: EVL-M5
        role: supporting
      - checkId: AGN-M4
        role: supporting
      - checkId: TOL-M4
        role: supporting

  THR-untrusted-a2a:
    title: Untrusted agent-to-agent communication
    severityHint: critical
    description: >
      Multi-agent handoffs accept anonymous, network-presence-only, or
      over-scoped peers.
    displayThreats:
      - Identity Spoofing
      - Agent Hijacking
      - Privilege Escalation
    indicators:
      - signal: agent.graph.edge_delegated
    mitigations:
      - checkId: AGN-M4
        role: primary
      - checkId: AUTHN-M2
        role: supporting
